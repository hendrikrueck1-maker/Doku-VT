    };
    const chipOpts = {
      zustand: () => { const base = (Settings.v.zustandKeys || REQ_ZUSTAND).filter(Boolean); return base.concat(rs.zustand.filter(z => !base.includes(z))).map(z => [z, z]); },
      sicherheit: () => REQ_SICHER, zustaendig: () => REQ_ZUST, art: () => REQ_ART
    };
    const multi = { zustand: true, art: true };
    const renderChips = n => {
      form.querySelector(`[data-rchips="${n}"]`).innerHTML = this.chipRow(n, chipOpts[n](), rs[n], !!multi[n]);
      if (n === 'zustaendig') form.elements.zustAndere.classList.toggle('hidden', rs.zustaendig !== 'andere');
    };
    const renderInId = () => {
      const sel = form.querySelector('[data-inid]'), hint = form.querySelector('[data-inhint]');
      const contents = ex ? this.entriesR(showId).filter(x => x.id !== ex.id && x.f.inId === ex.id) : [];
      const cand = this.entriesR(showId).filter(x => (!ex || x.id !== ex.id) && !(x.f.inId && Repo.entry(x.f.inId))).sort(this.cmp(showId));
      const cur = f0.inId || '';
      sel.innerHTML = `<option value="">– liegt in nichts –</option>` + cand.map(x => `<option value="${Utils.esc(x.id)}" ${x.id === cur ? 'selected' : ''}>${Utils.esc((x.f.was || 'Ohne Namen') + (this.val(x, 'ort') ? ' · ' + this.val(x, 'ort') : ''))}</option>`).join('');
      if (cur && !cand.some(x => x.id === cur)) sel.insertAdjacentHTML('beforeend', `<option value="${Utils.esc(cur)}" selected>(Behälter nicht mehr vorhanden)</option>`);
      sel.disabled = contents.length > 0;
      hint.textContent = contents.length ? `Enthält selbst ${contents.length} Gegenstand${contents.length === 1 ? '' : 'e'} – ein Behälter kann nicht in etwas liegen.` : 'Nur eine Ebene: Ein Gegenstand, der selbst in etwas liegt, kann kein Behälter sein.';
    };
    const renderSugg = () => {
      const q = form.elements.was.value.trim().toLowerCase();
      const vs = this.vorlagen().map(x => ({ t: 'v', name: x.was, x })).filter(x => x.name);
      const ns = [...new Set(this.entriesR(showId).map(e => String(e.f.was || '').trim()).filter(Boolean))].filter(n => !vs.some(v => v.name.toLowerCase() === n.toLowerCase())).map(n => ({ t: 'n', name: n }));
      const all = vs.concat(ns).filter(x => (!q || x.name.toLowerCase().includes(q)) && x.name.toLowerCase() !== q).slice(0, 8);
      form.querySelector('[data-sugg]').innerHTML = all.map((x, i) => `<button type="button" data-sugg-i="${i}" class="${x.t === 'v' ? 'tpl' : 'used'}" title="${x.t === 'v' ? 'Vorlage' : 'schon im Stück'}">${x.t === 'v' ? I('box', 'sm') + ' ' : ''}${Utils.esc(x.name)}</button>`).join('');
      this._sugg = all;
    };
    const applyVorlage = x => {
      form.elements.was.value = x.was || '';
      if (Array.isArray(x.zustand)) x.zustand.forEach(z => { if (z && !rs.zustand.includes(z)) rs.zustand.push(z); });
      if (x.sicherheit) rs.sicherheit = x.sicherheit;
      if (x.bemerkung && !form.elements.bemerkung.value.trim()) form.elements.bemerkung.value = x.bemerkung;
      if (x.ortName && !rs.ortId) { const o = this.allOrts(showId).find(o => o.name.toLowerCase() === String(x.ortName).toLowerCase()); if (o) { rs.ortId = o.key; rs.ort = o.name; } }
      if (x.foto && !ctx.hasPhoto()) ctx.addPhoto({ photoId: null, b: x.foto, w: x.w || 1600, h: x.h || 1600, label: '' });
      ['zustand', 'sicherheit'].forEach(renderChips); renderOrts(); markDirty();
    };
    form.addEventListener('input', e => { if (e.target.name === 'was') renderSugg(); });
    form.addEventListener('click', async e => {
      const b = e.target.closest('[data-rort],[data-rper],[data-rchip],[data-sugg-i],[data-ract="addperson"]'); if (!b) return;
      if (b.dataset.suggI != null) {
        const x = (this._sugg || [])[+b.dataset.suggI]; if (!x) return;
        if (x.t === 'v') applyVorlage(x.x); else { form.elements.was.value = x.name; markDirty(); }
        renderSugg(); return;
      }
      if (b.dataset.rort) {
        if (b.dataset.rort === '__pick') {
          const r = await this.pickOrt(showId, { current: rs.ortId });
          if (r) { rs.ortId = r.key; rs.ort = r.name; markDirty(); renderOrts(); }
          return;
        }
        if (rs.ortId === b.dataset.rort) { rs.ortId = ''; rs.ort = ''; }
        else { const o = this.ortByKey(showId, b.dataset.rort); if (o) { rs.ortId = o.key; rs.ort = o.name; } }
        markDirty(); renderOrts(); return;
      }
      if (b.dataset.rper) { const k = b.dataset.rper, i = rs.personIds.indexOf(k); if (i >= 0) rs.personIds.splice(i, 1); else rs.personIds.push(k); markDirty(); renderPersons(); return; }
      if (b.dataset.rchip) {
        const n = b.dataset.rchip, v = b.dataset.v;
        if (multi[n]) { const i = rs[n].indexOf(v); if (i >= 0) rs[n].splice(i, 1); else rs[n].push(v); }
        else rs[n] = rs[n] === v ? '' : v;
        markDirty(); renderChips(n);
        if (n === 'zustaendig' && rs.zustaendig === 'andere') setTimeout(() => form.elements.zustAndere.focus(), 30);
        return;
      }
      if (b.dataset.ract === 'addperson') addPerson();
    });
    const addPerson = async () => {
      const inp = form.elements.newPerson, name = inp.value.trim(); if (!name) { inp.focus(); return; }
      const exist = this.persons(showId).find(p => this.personLabel(p).toLowerCase() === name.toLowerCase() || String(p.rolle).toLowerCase() === name.toLowerCase());
      let key = exist && exist.key;
      if (!key) {
        key = 'rp:' + Utils.uuid();
        try { await Repo.patchShow(showId, { [key]: { rolle: name, darsteller: '', ord: Math.max(0, ...this.persons(showId).map(p => +p.ord || 0)) + 10, del: false } }); }
        catch (err) { App.error(err); return; }
      }
      if (!rs.personIds.includes(key)) rs.personIds.push(key);
      inp.value = ''; markDirty(); renderPersons();
    };
    form.elements.newPerson.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); addPerson(); } });
    renderOrts(); renderPersons(); ['zustand', 'sicherheit', 'zustaendig', 'art'].forEach(renderChips); renderInId(); renderSugg();
    return rs;
  },
  readForm(form, rs, showId) {
    const g = n => (form.elements[n] ? form.elements[n].value : '');
    const f = { was: g('was'), stelle: g('stelle'), bemerkung: g('bemerkung'), menge: g('menge'), markierung: g('markierung'), pflege: g('pflege'), verbleib: g('verbleib'),
      ortId: rs.ortId || '', ort: rs.ort || '', personIds: rs.personIds.slice(), zustand: rs.zustand.slice(), sicherheit: rs.sicherheit || '',
      zustaendig: rs.zustaendig === 'andere' ? (g('zustAndere').trim() || 'andere') : (rs.zustaendig || ''), art: rs.art.slice(), inId: form.elements.inId && !form.elements.inId.disabled ? g('inId') : (form.elements.inId ? g('inId') : '') };
    const sf = this.sh(showId);
    f.zuWem = f.personIds.map(k => sf[k] && !sf[k].del ? this.personLabel(sf[k]) : '').filter(Boolean).join(', ');
    if (f.ortId) { const o = this.ortByKey(showId, f.ortId); if (o) f.ort = o.name; }
    return f;
  }
};

/* ---------- Requisite: Bearbeitungsblätter (nur im Bearbeitungsmodus erreichbar) ---------- */
Object.assign(Req, {
  /** Listenblatt mit Pfeil-Knöpfen. opts: {title, list(), row(it,i,n) → html, top() → html, onAct(act, key, btn)} */
  listSheet(opts) {
    const sh = Ui.sheet({ title: opts.title, full: true });
    sh.el.dataset.editor = '1'; sh.el.dataset.abt = 'R';
    const draw = () => {
      const list = opts.list();
      sh.body.innerHTML = `<div class="rpacts">${opts.top ? opts.top() : ''}</div>
        <div class="rlist">${list.map((it, i) => opts.row(it, i, list.length)).join('') || `<p class="muted">${Utils.esc(opts.empty || 'Noch nichts angelegt.')}</p>`}</div>${opts.bottom ? opts.bottom() : ''}`;
      Thumbs.observe(sh.body);
    };
    draw();
    const off = Repo.on(() => { if (sh.layer.closed) { off(); return; } if (!Utils.isEditable(document.activeElement)) draw(); });
    sh.body.addEventListener('click', async e => {
      const b = e.target.closest('[data-la]'); if (!b) return;
      try { await opts.onAct(b.dataset.la, b.dataset.key || '', b); } catch (err) { App.error(err); }
      if (!sh.layer.closed) draw();
    });
    return sh;
  },
  arrows(i, n, key) {
    const k = Utils.esc(key);
    return `<button type="button" class="btn icon" data-la="up" data-key="${k}" aria-label="Nach oben" ${i === 0 ? 'disabled' : ''}>${I('arrowL', 'sm').replace('<svg', '<svg style="transform:rotate(90deg)"')}</button>
      <button type="button" class="btn icon" data-la="down" data-key="${k}" aria-label="Nach unten" ${i === n - 1 ? 'disabled' : ''}>${I('arrowR', 'sm').replace('<svg', '<svg style="transform:rotate(90deg)"')}</button>`;
  },
  async move(list, key, dir, f, patchFn) {
    const i = list.findIndex(x => x.key === key), j = i + dir; if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    const p = this.reord(list, f); if (Object.keys(p).length) await patchFn(p);
  },

  /* ---------- Allgemein · Wichtig, Dauer, Übersichtsfoto ---------- */
  editGeneral(showId) {
    const s = Repo.show(showId); if (!s) return;
    let pic = null, foto = s.f.fotoR || '', dirty = false;
    const sh = Ui.sheet({ title: 'Einrichtung · Requisite', full: true,
      headLeft: `<button class="btn ghost" data-x="cancel" aria-label="Abbrechen">${I('close')}<span class="cl">Abbrechen</span></button>`,
      headRight: `<button class="btn edit" data-x="save">${I('check')} Speichern</button>`, onBack: () => Editor._confirmLeave(dirty) });
    sh.el.dataset.editor = '1'; sh.el.dataset.abt = 'R';
    sh.body.innerHTML = `<form class="form" onsubmit="return false">
      <div class="f"><label for="rg-allg">Allgemein · Wichtig</label><textarea id="rg-allg" rows="4" placeholder="z. B. ACHTUNG: Garderoben sind getauscht">${Utils.esc(s.f.einrichtungR || '')}</textarea></div>
      <div class="f"><label for="rg-dauer">Dauer</label><input id="rg-dauer" value="${Utils.esc(s.f.dauer || '')}" placeholder="z. B. 80 min, 1:45 ohne Pause, 2:40 mit Pause" autocomplete="off"></div>
      <div class="f"><label>Übersichtsfoto des Bühnenbilds</label><div class="rfotobox" data-foto></div></div>
      <button type="button" class="btn edit big block" data-x="save">${I('check')} Speichern</button></form>`;
    const drawFoto = () => {
      const box = sh.body.querySelector('[data-foto]');
      const src = pic ? Thumbs.local(pic.thumb) : null;
      box.innerHTML = `${foto ? `<button type="button" class="rfotot" data-x="view">${src ? `<img src="${src}" alt="" class="ok">` : Views.thumbImg(foto)}</button>` : ''}
        <div class="rpacts"><button type="button" class="btn" data-x="shoot">${I('camera')} ${foto ? 'Neu aufnehmen' : 'Foto aufnehmen'}</button>
        ${foto ? `<button type="button" class="btn danger" data-x="rmfoto">${I('trash', 'sm')} Foto entfernen</button>` : ''}</div>`;
      Thumbs.observe(box);
    };
    drawFoto();
    sh.body.addEventListener('input', () => { dirty = true; });
    sh.el.addEventListener('click', async e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      const x = b.dataset.x;
      if (x === 'cancel') history.back();
      else if (x === 'view') { if (pic) Lightbox.open([{ b: pic.b, buf: pic.full, thumbUrl: Thumbs.local(pic.thumb), kat: 'A', idx: 0, n: 1, draftAbt: 'R', draftF: { was: 'Übersicht' } }], 0); else this.photoLightbox(foto, 'Übersicht'); }
      else if (x === 'shoot') { const p = await this.takePhoto('Übersichtsfoto'); if (p) { pic = p; foto = p.b; dirty = true; drawFoto(); } }
      else if (x === 'rmfoto') { if (await Ui.confirm('Übersichtsfoto entfernen?', '', 'Entfernen', true)) { pic = null; foto = ''; dirty = true; drawFoto(); } }
      else if (x === 'save') {
        const patch = {}, al = sh.body.querySelector('#rg-allg').value.trim(), da = sh.body.querySelector('#rg-dauer').value.trim();
        if (al !== (s.f.einrichtungR || '')) patch.einrichtungR = al;
        if (da !== (s.f.dauer || '')) patch.dauer = da;
        if (foto !== (s.f.fotoR || '')) patch.fotoR = foto;
        try { await Repo.patchShowBlobs(showId, patch, pic && foto === pic.b ? [pic] : []); dirty = false; SetupView.open.R = true; sh.close(); Ui.toast('Gespeichert'); }
        catch (err) { App.error(err); }
      }
    });
  },

  /* ---------- Personen des Stücks ---------- */
  personFields(p = {}) { return [{ k: 'rolle', label: 'Rolle', value: p.rolle || '', ph: 'z. B. Mackie Messer' }, { k: 'darsteller', label: 'Darsteller/in', value: p.darsteller || '', ph: 'z. B. Julian' }]; },
  editPersons(showId) {
    const need = v => (v.rolle.trim() || v.darsteller.trim()) ? '' : 'Bitte Rolle oder Darsteller eintragen.';
    this.listSheet({
      title: 'Personen', empty: 'Noch keine Personen. Jeder Gegenstand kann einer oder mehreren Personen gehören.',
      list: () => this.persons(showId),
      top: () => `<button type="button" class="btn big primary" data-la="add">${I('plus')} Person</button>`,
      row: (p, i, n) => { const cnt = this.entriesR(showId).filter(e => (e.f.personIds || []).includes(p.key)).length;
        return `<div class="rrow"><span class="rrl">${I('user', 'sm')}<span><b>${Utils.esc(this.personLabel(p) || '–')}</b><small>${cnt} Gegenstand${cnt === 1 ? '' : 'e'}</small></span></span>
          ${this.arrows(i, n, p.key)}<button type="button" class="btn icon" data-la="edit" data-key="${Utils.esc(p.key)}" aria-label="Bearbeiten">${I('edit', 'sm')}</button>
          <button type="button" class="btn icon danger" data-la="del" data-key="${Utils.esc(p.key)}" aria-label="Entfernen">${I('trash', 'sm')}</button></div>`; },
      onAct: async (a, key) => {
        const f = this.sh(showId);
        if (a === 'add') { const v = await this.form('Neue Person', this.personFields(), { ok: 'Anlegen', check: need }); if (v) await Repo.patchShow(showId, { ['rp:' + Utils.uuid()]: { rolle: v.rolle.trim(), darsteller: v.darsteller.trim(), ord: Math.max(0, ...this.persons(showId).map(p => +p.ord || 0)) + 10, del: false } }); }
        else if (a === 'edit') { const p = f[key]; const v = await this.form('Person', this.personFields(p), { check: need }); if (v) await Repo.patchShow(showId, { [key]: Object.assign({}, p, { rolle: v.rolle.trim(), darsteller: v.darsteller.trim() }) }); }
        else if (a === 'up' || a === 'down') await this.move(this.persons(showId), key, a === 'up' ? -1 : 1, f, p => Repo.patchShow(showId, p));
        else if (a === 'del') {
          const n = this.entriesR(showId).filter(e => (e.f.personIds || []).includes(key)).length;
          if (await Ui.confirm(`„${this.personLabel(f[key])}“ entfernen?`, n ? `${n} Gegenstand${n === 1 ? ' gehört' : 'e gehören'} zu dieser Person – sie behalten den gespeicherten Namen.` : 'Die Person wird aus dem Stück entfernt.', 'Entfernen', true))
            await Repo.patchShow(showId, { [key]: Object.assign({}, f[key], { del: true }) });
        }
      }
    });
  },

  /* ---------- Orte des Stücks (und Haus-Orte) ---------- */
  ortFields(o = {}) {
    return [{ k: 'name', label: 'Name', value: o.name || '', ph: 'z. B. Hinter der Wand, A4' }, { k: 'gruppe', label: 'Gruppe', value: o.gruppe || '', ph: 'z. B. Raster, Bühnenbild' },
      { k: 'notiz', label: 'Notiz', value: o.notiz || '', type: 'area', rows: 2, ph: 'z. B. Gasse 1 ist nicht gestellt' }, { k: 'cap', label: 'Bildunterschrift zum Foto', value: o.cap || '', ph: 'z. B. von hinter dem Gitter Richtung Publikum' }];
  },
  ortUse(showId, key) {
    const es = this.entriesR(showId).filter(e => e.f.ortId === key).length, st = this.steps(showId).filter(s => s.ortId === key).length;
    return { es, st };
  },
  ortRow(o, i, n, { take = false } = {}) {
    const k = Utils.esc(o.key);
    return `<div class="rrow">${o.foto ? `<button type="button" class="rrth" data-la="view" data-key="${k}" aria-label="Foto ansehen">${Views.thumbImg(o.foto)}</button>` : `<span class="rrth none">${I('pin', 'sm')}</span>`}
      <span class="rrl"><span><b>${Utils.esc(o.name || '–')}</b><small>${Utils.esc([o.gruppe, o.notiz].filter(Boolean).join(' · '))}</small></span></span>
      ${take ? `<button type="button" class="btn" data-la="take" data-key="${k}">${I('copy', 'sm')}<span class="bl"> In dieses Stück</span></button>` : ''}
      <button type="button" class="btn icon" data-la="foto" data-key="${k}" aria-label="Foto aufnehmen">${I('camera', 'sm')}</button>
      ${this.arrows(i, n, o.key)}<button type="button" class="btn icon" data-la="edit" data-key="${k}" aria-label="Bearbeiten">${I('edit', 'sm')}</button>
      <button type="button" class="btn icon danger" data-la="del" data-key="${k}" aria-label="Entfernen">${I('trash', 'sm')}</button></div>`;
  },
  /** gemeinsame Aktionen für Stück-Orte und Haus-Orte */
  async ortAct(a, key, { showId, house }) {
    const f = house ? this.houseF() : this.sh(showId), patch = p => house ? Repo.patchHouse(p) : Repo.patchShow(showId, p);
    const list = house ? this.houseOrts() : this.showOrts(showId), o = f[key];
    const nextOrd = () => Math.max(0, ...list.map(x => +x.ord || 0)) + 10;
    const need = v => v.name.trim() ? '' : 'Bitte einen Namen eintragen.';
    if (a === 'add') { const v = await this.form(house ? 'Neuer Haus-Ort' : 'Neuer Ort', this.ortFields(), { ok: 'Anlegen', check: need }); if (v) await patch({ [(house ? 'ho:' : 'ro:') + Utils.uuid()]: { name: v.name.trim(), gruppe: v.gruppe.trim(), notiz: v.notiz.trim(), cap: v.cap.trim(), foto: '', ord: nextOrd(), del: false } }); }
    else if (a === 'edit') { const v = await this.form(house ? 'Haus-Ort' : 'Ort', this.ortFields(o), { check: need }); if (v) await patch({ [key]: Object.assign({}, o, { name: v.name.trim(), gruppe: v.gruppe.trim(), notiz: v.notiz.trim(), cap: v.cap.trim() }) }); }
    else if (a === 'up' || a === 'down') await this.move(list, key, a === 'up' ? -1 : 1, f, patch);
    else if (a === 'view') this.photoLightbox(o.foto, o.name, o.cap);
    else if (a === 'foto') {
      const p = await this.takePhoto(`Foto: ${o.name}`); if (!p) return;
      const v = { [key]: Object.assign({}, o, { foto: p.b }) };
      if (house) await Repo.patchHouse(v, [p]); else await Repo.patchShowBlobs(showId, v, [p]);
    } else if (a === 'take') {
      const nk = 'ro:' + Utils.uuid(), sl = this.showOrts(showId);
      await Repo.patchShow(showId, { [nk]: { name: o.name, gruppe: o.gruppe || '', notiz: o.notiz || '', foto: o.foto || '', cap: o.cap || '', ord: Math.max(0, ...sl.map(x => +x.ord || 0)) + 10, del: false } });
      Ui.toast(`„${o.name}“ ist jetzt ein Ort dieses Stücks – Notiz hier eintragen.`);
    } else if (a === 'del') {
      let msg = 'Der Ort wird aus der Liste entfernt.';
      if (!house && showId) { const u = this.ortUse(showId, key); if (u.es || u.st) msg = `${u.es ? `${u.es} Gegenstand${u.es === 1 ? ' liegt' : 'e liegen'} hier` : ''}${u.es && u.st ? ' und ' : ''}${u.st ? `${u.st} Schritt${u.st === 1 ? '' : 'e'} nutzen ihn` : ''} – die behalten den Namen und zeigen „Ort entfernt“.`; }
      if (house) { let n = 0; for (const e of Repo.entries.values()) if (!e.f.del && abtOf(e) === 'R' && e.f.ortId === key) n++; if (n) msg = `${n} Gegenstand${n === 1 ? ' liegt' : 'e liegen'} in Stücken hier – die behalten den Namen und zeigen „Ort entfernt“.`; }
      if (await Ui.confirm(`„${o.name}“ entfernen?`, msg, 'Entfernen', true)) await patch({ [key]: Object.assign({}, o, { del: true }) });
    }
  },
  editOrts(showId) {
    this.listSheet({
      title: 'Orte dieses Stücks', empty: 'Noch keine eigenen Orte. Die Haus-Orte (Requisitentisch, Gassen …) stehen immer zur Wahl.',
      list: () => this.showOrts(showId),
      top: () => `<button type="button" class="btn big primary" data-la="add">${I('plus')} Ort</button>
        <button type="button" class="btn big" data-la="raster">${I('grid')} Raster anlegen</button>
        <button type="button" class="btn big" data-la="nums">${I('list')} Nummerierte Orte</button>
        <button type="button" class="btn big" data-la="house">${I('layers')} Haus-Orte …</button>`,
      row: (o, i, n) => this.ortRow(o, i, n),
      onAct: async (a, key) => {
        if (a === 'raster') return this.rasterDialog(showId);
        if (a === 'nums') return this.numberedDialog(showId);
        if (a === 'house') return this.editHouse(showId);
        return this.ortAct(a, key, { showId });
      }
    });
  },
  /** Raster A–F × 1–4 → 24 Orte „A1“ … „F4“ in der Gruppe „Raster“ */
  async rasterDialog(showId) {
    const v = await this.form('Raster anlegen', [
      { k: 'c1', label: 'Spalten von (Buchstabe)', value: 'A' }, { k: 'c2', label: 'Spalten bis', value: 'F' },
      { k: 'r1', label: 'Reihen von (Zahl)', value: '1', type: 'num' }, { k: 'r2', label: 'Reihen bis', value: '4', type: 'num' },
      { k: 'gruppe', label: 'Gruppe', value: 'Raster' }], { ok: 'Orte anlegen', check: v => {
        const a = v.c1.trim().toUpperCase(), b = v.c2.trim().toUpperCase();
        if (!/^[A-Z]$/.test(a) || !/^[A-Z]$/.test(b)) return 'Spalten bitte als einzelne Buchstaben (A–Z).';

          ord: moved ? Math.max(0, ...this.steps(showId).filter(s => s.abschnitt === st.abschnitt && s.key !== key).map(s => +s.ord || 0)) + 10 : old.ord, del: false };

/* =====================================================================
   ReqView – Ansichten der Requisite (wenn nur Requisite angezeigt wird):
   Nach Ort · Ablauf · Personen, dazu der Filter „Sicherheit“.
   Karten sind normale .card-Elemente (data-act open/lb/chk) und laufen über App.onClick.
   ===================================================================== */
const ReqView = {
  open: {},                   // aufgeklappte Abschnitte im Ablauf (diese Sitzung)
  mode() { const m = Settings.v.reqView; return ['ort', 'ablauf', 'personen'].includes(m) ? m : 'ort'; },
  safetyCount(showId) {
    return Req.entriesR(showId).filter(e => e.f.sicherheit).length + Req.steps(showId).filter(s => Req.stepSafety(s)).length;
  },
  todayRun(showId) { const d = RunList.isoDate(); return RunList.runsOf(showId).find(r => r.f.datum === d) || null; },
  render(list, showId, st) {
    const items = [], seen = new Set();
    const push = e => { if (seen.has(e.id)) return; seen.add(e.id); if (Repo.photosOf(e.id, 'A').length) items.push({ entry: e, kat: 'A', abt: 'R', key: e.id + ':A' }); };
    const ctx = { showId, st, push, edit: st.edit, checklist: st.checklist };
    let html;
    if (st.reqSafe) html = this.safeHtml(ctx);
    else if (this.mode() === 'ablauf') html = this.ablaufHtml(ctx);
    else if (this.mode() === 'personen') html = this.personHtml(ctx);
    else html = this.ortHtml(ctx);
    App._items = items;
    list.innerHTML = html + `<div class="listfoot">Doku VT v${APP_VERSION}</div>`;
    list.querySelectorAll('details[data-ab]').forEach(d => d.addEventListener('toggle', () => { this.open[d.dataset.ab] = d.open; }));
    list.onclick = ev => this.onClick(ev, showId);
    Thumbs.observe(list);
  },
  card(e, ctx, opts = {}) { ctx.push(e); return Views.cardHtmlR(e, Object.assign({ sel: ctx.st.sel === e.id + ':' + (Repo.photosOf(e.id, 'A').length ? 'A' : 'N'), checklist: ctx.checklist }, opts)); },
  withContents(e, ctx, opts = {}) {
    let h = this.card(e, ctx, opts);
    const inner = Req.contentsOf(e).sort(Req.cmp(e.showId));
    if (inner.length) h += `<div class="rin-h">${I('box', 'sm')} darin:</div>` + inner.map(c => this.card(c, ctx, { indent: true, showOrt: false })).join('');
    return h;
  },
  empty(text, btn = '') { return `<div class="empty"><div class="ico">${I('box', 'lg')}</div><h3>${Utils.esc(text)}</h3>${btn}</div>`; },
  /* ---------- Nach Ort ---------- */
  ortHtml(ctx) {
    const { showId } = ctx, es = Req.entriesR(showId).sort(Req.cmp(showId));
    if (!es.length) return this.empty('Noch keine Gegenstände', ctx.edit ? '<p>Unten rechts „+ Gegenstand“: Foto, Name, Ort – fertig.</p>' : '<p>Zum Anlegen oben rechts in den Bearbeitungsmodus wechseln.</p>');
    let h = '';
    const verb = es.filter(e => (e.f.art || []).includes('verbrauch'));
    if (verb.length) h += `<div class="sect" data-abt="R"><span class="sw" data-k="A" style="background:var(--k)"></span>Verbrauch <span class="n">${verb.length}</span></div><div class="cards">${verb.map(e => this.card(e, ctx)).join('')}</div>`;
    const top = es.filter(e => !Req.containerOf(e));
    const groups = new Map(), order = Req.allOrts(showId).map(o => o.key);
    top.forEach(e => {
      const o = Req.ortOf(e), k = o ? (o.ort ? o.key : 'name:' + (o.name || '').toLowerCase()) : '';
      if (!groups.has(k)) groups.set(k, { o, list: [] }); groups.get(k).list.push(e);
    });
    const keys = [...groups.keys()].sort((a, b) => {
      const ia = a === '' ? 1e6 : order.indexOf(a) < 0 ? 5e5 : order.indexOf(a), ib = b === '' ? 1e6 : order.indexOf(b) < 0 ? 5e5 : order.indexOf(b);
      return ia - ib || a.localeCompare(b);
    });
    for (const k of keys) {
      const g = groups.get(k), o = g.o && g.o.ort;
      const name = k === '' ? 'Ohne Ort' : (o ? o.name : (g.o.name || '–') + (g.o.removed ? ' · Ort entfernt' : ''));
      h += `<div class="rorthead">${o && o.foto ? `<button type="button" class="rorthum" data-ract="ortfoto" data-b="${Utils.esc(o.foto)}" data-name="${Utils.esc(o.name)}" data-cap="${Utils.esc(o.cap || '')}" aria-label="Foto von ${Utils.esc(o.name)}">${Views.thumbImg(o.foto)}</button>` : `<span class="rorthum none">${I('pin')}</span>`}
        <div class="rorti"><h3>${Utils.esc(name)}</h3>${o && o.notiz ? `<p>${Utils.esc(o.notiz)}</p>` : ''}</div><span class="n">${g.list.length}</span></div>`;
      if (/requisitentisch/i.test(name)) {
        // Requisitentisch: nach Person gegliedert – so sind die Zettel heute aufgebaut
        const ps = Req.persons(showId), pidx = new Map(ps.map((p, i) => [p.key, i])), sub = new Map();
        g.list.forEach(e => { const ids = (e.f.personIds || []).filter(i => pidx.has(i)).sort((a, b) => pidx.get(a) - pidx.get(b)); const key = ids.join('+'); if (!sub.has(key)) sub.set(key, { ids, list: [] }); sub.get(key).list.push(e); });
        const sk = [...sub.keys()].sort((a, b) => { const A = sub.get(a).ids, B = sub.get(b).ids; return (A.length ? pidx.get(A[0]) : 999) - (B.length ? pidx.get(B[0]) : 999) || a.localeCompare(b); });
        for (const key of sk) {
          const s = sub.get(key), lbl = s.ids.length ? s.ids.map(i => Req.personLabel(Req.sh(showId)[i])).join(' + ') : 'Ohne Person';
          h += `<div class="rsub">${I('user', 'sm')} ${Utils.esc(lbl)}</div><div class="cards">${s.list.map(e => this.withContents(e, ctx, { showOrt: false })).join('')}</div>`;
        }
      } else h += `<div class="cards">${g.list.map(e => this.withContents(e, ctx, { showOrt: false })).join('')}</div>`;
    }
    return h;
  },
  /* ---------- Personen ---------- */
  personHtml(ctx) {
    const { showId } = ctx, ps = Req.persons(showId), es = Req.entriesR(showId).sort(Req.cmp(showId)), steps = Req.steps(showId);
    if (!ps.length) return this.empty('Noch keine Personen', ctx.edit ? '<p>Über „Einrichtung · Requisite → Personen“ anlegen – oder im Gegenstand unter „Zu wem“.</p>' : '');
    let h = '';
    for (const p of ps) {
      const mine = es.filter(e => (e.f.personIds || []).includes(p.key)), ids = new Set(mine.map(e => e.id));
      const st = steps.filter(s => ids.has(s.gegenstand));
      h += `<div class="rorthead"><span class="rorthum none">${I('user')}</span><div class="rorti"><h3>${Utils.esc(Req.personLabel(p))}</h3></div><span class="n">${mine.length}</span></div>`;
      h += mine.length ? `<div class="cards">${mine.map(e => this.card(e, ctx)).join('')}</div>` : '<p class="muted" style="margin:6px 4px 0">Keine Gegenstände.</p>';
      if (st.length) h += `<div class="rsteps">${st.map(s => this.stepRow(s, ctx, false)).join('')}</div>`;
    }
    return h;
  },
  /* ---------- Sicherheit ---------- */
  safeHtml(ctx) {
    const { showId } = ctx, es = Req.entriesR(showId).filter(e => e.f.sicherheit).sort(Req.cmp(showId)), steps = Req.steps(showId).filter(s => Req.stepSafety(s));
    if (!es.length && !steps.length) return this.empty('Nichts Sicherheitsrelevantes eingetragen');
    let h = '';
    for (const [k, n] of REQ_SICHER) {
      const e1 = es.filter(e => e.f.sicherheit === k), s1 = steps.filter(s => Req.stepSafety(s) === k);
      if (!e1.length && !s1.length) continue;
      h += `<div class="rsafeh">${I('alert')} ${Utils.esc(n)} <span class="n">${e1.length + s1.length}</span></div>`;
      if (e1.length) h += `<div class="cards">${e1.map(e => this.card(e, ctx)).join('')}</div>`;
      if (s1.length) h += `<div class="rsteps">${s1.map(s => this.stepRow(s, ctx, false)).join('')}</div>`;
    }
    return h;
  },
  /* ---------- Ablauf ---------- */
  stepRow(s, ctx, run) {
    const e = Req.stepEntry(s), o = s.ortId ? Req.ortByKey(ctx.showId, s.ortId) : null, saf = Req.stepSafety(s);
    const h = run && run.f['h:' + s.key], ok = !!(h && h.ok), when = Req.whenShort(s), k = Utils.esc(s.key);
    const ph = e && Repo.photosOf(e.id, 'A').length;
    const sub = [o ? `${I('pin', 'sm')} ${Utils.esc(o.name)}` : (s.ortId ? 'Ort entfernt' : ''), e ? `${I('box', 'sm')} ${Utils.esc(e.f.was || 'Ohne Namen')}` : '', saf ? Req.safeBadge(saf) : '',
      ok && h ? `<span class="mono">${RunList.fmtTime(h.at)} · ${Utils.esc(h.dev || '')}</span>` : ''].filter(Boolean).join(' ');
    return `<div class="rstep ${ok ? 'done' : ''}">
      ${run ? `<button type="button" class="rchk" role="checkbox" aria-checked="${ok}" data-ract="s-chk" data-step="${k}" aria-label="${ok ? 'Erledigt' : 'Abhaken'}"><span class="box">${ok ? I('check') : ''}</span></button>` : ''}
      <button type="button" class="rshit" data-ract="s-open" data-step="${k}">
        ${when ? `<span class="rsz">${Utils.esc(when)}</span>` : ''}<span class="rst">${Utils.esc(s.text)}${ok ? ' <span class="rok">erledigt</span>' : ''}${sub ? `<small>${sub}</small>` : ''}</span></button>
      ${ph ? `<button type="button" class="btn icon" data-ract="s-photo" data-step="${k}" aria-label="Foto ansehen">${I('image')}</button>` : ''}
      ${ctx.edit && run !== false && !s.ci ? `<span class="rsed">${this.mini('s-up', k, 'arrowL', 'Nach oben', 90)}${this.mini('s-down', k, 'arrowR', 'Nach unten', 90)}</span>` : ''}
    </div>`;
  },
  mini(act, key, ic, label, rot = 0) { return `<button type="button" class="btn icon" data-ract="${act}" data-step="${key}" data-ab="${key}" aria-label="${Utils.esc(label)}">${rot ? I(ic, 'sm').replace('<svg', `<svg style="transform:rotate(${rot}deg)"`) : I(ic, 'sm')}</button>`; },
  ablaufHtml(ctx) {
    const { showId } = ctx, abs = Req.abschnitte(showId), run = this.todayRun(showId);
    // eigene Punkte „Vor der Vorstellung“ (Checkliste) gehören an den Anfang des ersten Abschnitts „Vor der Vorstellung“
    const vorKey = (abs.find(a => a.typ === 'vor') || {}).key;
    const own = vorKey ? RunList.ownOf(showId).filter(x => x.abt === 'R').map(x => ({ key: x.key, text: x.text, abschnitt: vorKey, ci: true, zeit: null, ausloeser: [], gegenstand: '', ortId: '', sicherheit: '' })) : [];
    const steps = own.concat(Req.steps(showId));
    if (!abs.length) return this.empty('Noch kein Ablauf', ctx.edit ? `<button class="btn big primary" data-ract="init-ab">${I('plus')} Vor / Vorstellung / Nach anlegen</button>` : '');
    const doneOf = list => run ? list.filter(s => { const h = run.f['h:' + s.key]; return h && h.ok; }).length : 0;
    let first = null;
    if (run) for (const a of abs) { const l = steps.filter(s => s.abschnitt === a.key); if (l.length && doneOf(l) < l.length) { first = a.key; break; } }
    let h = '';
    if (steps.length) {
      if (run) { const d = doneOf(steps); h += `<div class="rrunbar"><b>${Utils.esc(run.f.titel || 'Heute')}</b><span class="mono">${d} von ${steps.length} erledigt</span><div class="pbar"><i style="width:${steps.length ? d / steps.length * 100 : 0}%"></i></div></div>`; }
      else h += `<button class="btn big primary block" data-ract="run-start" style="margin:4px 0 10px">${I('checklist')} Vorstellung heute beginnen</button>`;
    }
    if (ctx.edit) h += `<div class="rpacts"><button class="btn" data-ract="add-pause">${I('plus', 'sm')} Pause</button>${abs.some(a => a.typ === 'abbau') ? '' : `<button class="btn" data-ract="add-abbau">${I('plus', 'sm')} Abbau</button>`}</div>`;
    const ai = new Set(abs.map(a => a.key));
    const lose = steps.filter(s => !ai.has(s.abschnitt));
    abs.forEach((a, i) => {
      const l = steps.filter(s => s.abschnitt === a.key), d = doneOf(l);
      const isOpen = this.open[a.key] ?? (run ? (a.key === first || (!first && false)) : true);
      const k = Utils.esc(a.key);
      h += `<details class="rabs ${run && l.length && d === l.length ? 'alldone' : ''}" data-ab="${k}" data-typ="${Utils.esc(a.typ)}" ${isOpen ? 'open' : ''}>
        <summary><span class="chev">${I('arrowR', 'sm')}</span><h3>${Utils.esc(a.label)}</h3><span class="mono n">${run ? `${d}/${l.length}` : l.length}</span>
          ${ctx.edit ? `<span class="rsed">${this.mini('a-up', k, 'arrowL', 'Nach oben', 90).replace(i === 0 ? 'class="btn icon"' : '§', 'class="btn icon" disabled')}${this.mini('a-down', k, 'arrowR', 'Nach unten', 90).replace(i === abs.length - 1 ? 'class="btn icon"' : '§', 'class="btn icon" disabled')}${this.mini('a-edit', k, 'edit', 'Abschnitt bearbeiten')}${this.mini('a-del', k, 'trash', 'Abschnitt löschen')}</span>` : ''}</summary>
        ${a.notiz ? `<p class="rabn">${Utils.esc(a.notiz)}</p>` : ''}
        <div class="rsteps">${l.map(s => this.stepRow(s, ctx, run)).join('') || (a.notiz ? '' : '<p class="muted rabn">Keine Schritte.</p>')}</div>
        ${ctx.edit ? `<button class="btn" data-ract="s-add" data-ab="${k}" style="margin:6px 0 4px">${I('plus', 'sm')} Schritt</button>` : ''}
      </details>`;
    });
    if (lose.length) h += `<div class="rsub">Ohne Abschnitt</div><div class="rsteps">${lose.map(s => this.stepRow(s, ctx, run)).join('')}</div>`;
    return h;
  },
  async onClick(ev, showId) {
    const b = ev.target.closest('[data-ract]'); if (!b) return;
    ev.preventDefault(); ev.stopPropagation();
    const a = b.dataset.ract, edit = App.state.edit, key = b.dataset.step || b.dataset.ab || '';
    try {
      if (a === 'ortfoto') Req.photoLightbox(b.dataset.b, b.dataset.name, b.dataset.cap);
      else if (a === 'run-start') { const r = await RunList.create(showId); Ui.toast(`${r.f.titel} angelegt`); }
      else if (a === 's-chk') { const r = this.todayRun(showId); if (r) { if (navigator.vibrate) navigator.vibrate(10); await RunList.toggle(r.id, key); } }
      else if (a === 's-open') {
        if (edit) return key.startsWith('ci:') ? RunList.editItems(showId) : Req.editStep(showId, key);
        const s = Req.steps(showId).find(x => x.key === key), e = s && Req.stepEntry(s); if (!e) return;
        if (Repo.photosOf(e.id, 'A').length) this.photos(e); else App.openDetailSheet(e.id);
      } else if (a === 's-photo') { const s = Req.steps(showId).find(x => x.key === key), e = s && Req.stepEntry(s); if (e) this.photos(e); }
      else if (!edit) return;
      else if (a === 's-up' || a === 's-down') await Req.moveStep(showId, key, a === 's-up' ? -1 : 1);
      else if (a === 's-add') Req.editStep(showId, null, key);
      else if (a === 'a-up' || a === 'a-down') await Req.moveAbschnitt(showId, key, a === 'a-up' ? -1 : 1);
      else if (a === 'a-edit') await Req.editAbschnitt(showId, key);
      else if (a === 'a-del') await Req.deleteAbschnitt(showId, key);
      else if (a === 'add-pause') await Req.addPause(showId);
      else if (a === 'add-abbau') await Req.addAbbau(showId);
      else if (a === 'init-ab') await Req.ensureAbschnitte(showId);
    } catch (err) { App.error(err); }
  },
  photos(e) {
    const ph = Repo.photosOf(e.id, 'A');
    Lightbox.open(ph.map((p, i) => ({ b: p.b, entryId: e.id, kat: 'A', idx: i, n: ph.length, cap: p.f.cap || '' })), 0);
  }
};

/* =====================================================================
   SyncView – Abgleich: Status, Live-Verbindung (QR), Sync-Paket, Import
   ===================================================================== */
const SyncView = {
  open() {
    const sh = Ui.sheet({ title: 'Abgleich & Sicherung', center: true });
    const render = () => {
      const st = Sync.status();
      sh.body.innerHTML = `
        <div class="bigstatus" data-state="${st.state}"><span class="dot"></span><div><h3>${Utils.esc(st.state === 'ok' ? 'Synchron' : st.state === 'live' ? 'Live verbunden' : st.state === 'error' ? 'Letzter Abgleich mit Fehler' : 'Abgleich ausstehend')}</h3><p>${Utils.esc(st.text)}</p></div></div>
        ${Sync.peer && Sync.peer.open ? `<button class="pcard" data-act="disconnect"><span class="ic">${I('wifi')}</span><span class="lb2"><h4>Live-Verbindung trennen</h4><p>Mit ${Utils.esc(Sync.peer.peerName)} – Änderungen werden sofort übertragen.</p></span></button>` : ''}
        <button class="pcard" data-act="peer"><span class="ic">${I('qr')}</span><span class="lb2"><h4>Geräte verbinden (Live im WLAN)</h4><p>Beide Geräte im selben WLAN, kein Internet nötig. Je einmal einen QR-Code scannen – danach gleichen sie sich laufend ab.</p></span>${I('arrowR')}</button>
        <button class="pcard" data-act="send"><span class="ic">${I('share')}</span><span class="lb2"><h4>Sync-Paket senden</h4><p>Änderungen als Datei per AirDrop, Nearby Share, Dateien-App oder Fritzbox-Speicher weitergeben.</p></span>${I('arrowR')}</button>
        <button class="pcard" data-act="import"><span class="ic">${I('download')}</span><span class="lb2"><h4>Sync-Paket oder Backup einspielen</h4><p>Wird zusammengeführt – nichts wird überschrieben oder gelöscht, was neuer ist.</p></span>${I('arrowR')}</button>
        <button class="pcard" data-act="backup"><span class="ic">${I('database')}</span><span class="lb2"><h4>Komplett-Backup erstellen</h4><p>Alle Veranstaltungen inkl. Fotos als JSON-Datei sichern.</p></span>${I('arrowR')}</button>
        <button class="pcard" data-act="diag"><span class="ic">${I('info')}</span><span class="lb2"><h4>Diagnose</h4><p>Lokale Daten, offene Änderungen, Protokoll der letzten Abgleiche.</p></span>${I('arrowR')}</button>
        <input type="file" class="hidden" accept=".json,.ldsync,application/json,text/plain">`;
    };
    render();
    const off = Sync.on(() => { if (sh.layer.closed) off(); else render(); });
    sh.body.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const a = b.dataset.act;
      if (a === 'peer') PeerView.open();
      else if (a === 'disconnect') { Sync.peer && Sync.peer.close(); render(); }
      else if (a === 'diag') DiagView.open();
      else if (a === 'send') this.send();
      else if (a === 'backup') App.backup(null);
      else if (a === 'import') { const inp = sh.body.querySelector('input[type=file]'); inp.value = ''; inp.onchange = () => inp.files[0] && App.importFile(inp.files[0]); inp.click(); }
    });
  },
  async send() {
    const last = Sync.state.lastPackageAt;
    const mine = Settings.v.depts, allMine = mine.length === DEPT_ORDER.length;
    const changes = last ? Sync.collect({ since: last, depts: mine }) : null;
    const nCh = changes ? changes.shows.length + changes.entries.length + changes.photos.length : 0;
    const lbl = allMine ? '' : ` · ${Sync.deptLabel()}`;
    const v = await Ui.menu('Sync-Paket senden', [
      last && { label: `Nur Änderungen seit ${Utils.fmtDate(last)} (${nCh})${lbl}`, value: 'inc', icon: 'sync' },
      { label: `Komplett (alle Veranstaltungen)${lbl}`, value: 'full', icon: 'layers' },
      !allMine && { label: 'Komplett, alle Abteilungen', value: 'fullall', icon: 'database' }
    ]);
    if (!v) return;
    if (v === 'inc' && !nCh) { Ui.toast('Keine Änderungen seit dem letzten Paket.'); return; }
    const bz = Ui.busy('Paket wird erstellt …');
    try {
      const r = await FileAdapter.push({ full: v !== 'inc', allDepts: v === 'fullall', onReady: () => bz.close() }, (i, n) => bz.set(`Bilder werden verpackt … ${i}/${n}`));
      bz.close();
      if (r.res === 'abort') Ui.toast('Teilen abgebrochen – kein Paket gesendet.', 'warn');
      else Ui.toast(r.res === 'shared' ? `Sync-Paket geteilt (${Utils.fmtBytes(r.size)})` : `Sync-Paket gespeichert (${Utils.fmtBytes(r.size)}) – jetzt auf dem anderen Gerät einspielen.`);
    } catch (err) { bz.close(); Sync.log('Paket fehlgeschlagen: ' + err.message, 'error'); App.error(err); }
  }
};

/* ---------- Live-Verbindung per QR-Code ---------- */
const PeerView = {
  open() {
    if (!PeerAdapter.available()) { Ui.dialog({ title: 'Nicht verfügbar', message: 'Dieser Browser unterstützt keine direkten Geräteverbindungen (WebRTC). Bitte das Sync-Paket verwenden.' }); return; }
    let session = null, scanner = null, timer = null;
    const sh = Ui.sheet({ title: 'Geräte verbinden', center: true, onBack: () => { cleanup(false); return true; } });
    const cleanup = (keepSession = true) => {
      if (scanner) { scanner.stop(); scanner = null; }
      clearTimeout(timer);
      if (!keepSession && session && !session.open) session.close();
    };
    const step = html => { sh.body.innerHTML = html; };
    const choose = () => step(`
      <ol class="steps" style="margin-bottom:18px">
        <li>Beide Geräte ins selbe WLAN (z. B. Theater-Fritzbox – Internet ist nicht nötig).</li>
        <li>Auf Gerät A „Verbindung anbieten“, auf Gerät B „Code scannen“ wählen.</li>
        <li>B scannt den Code von A, dann scannt A den Antwort-Code von B. Fertig.</li></ol>
      <button class="pcard" data-act="offer"><span class="ic">${I('qr')}</span><span class="lb2"><h4>Verbindung anbieten</h4><p>Dieses Gerät zeigt einen QR-Code.</p></span>${I('arrowR')}</button>
      <button class="pcard" data-act="answer"><span class="ic">${I('scan')}</span><span class="lb2"><h4>Code scannen</h4><p>Das andere Gerät zeigt bereits einen Code.</p></span>${I('arrowR')}</button>
      <p class="muted" style="font-size:13px">Hinweis: Gast-WLANs mit „Geräte-Isolation“ verhindern direkte Verbindungen. Dann bitte das Sync-Paket nutzen.</p>`);
    const scanBox = (label) => `<p style="font-weight:600;margin:16px 0 8px">${label}</p><div class="scanbox"><video playsinline muted></video><div class="frame"></div></div>
      <p class="muted scanmode" style="font-size:12px;text-align:center"></p>
      <details class="more" style="margin-top:10px"><summary>${I('file', 'sm')} Ohne Kamera: Code als Text austauschen ${I('arrowR', 'sm chev')}</summary>
        <div class="inner" style="grid-template-columns:1fr"><textarea class="code" data-in placeholder="Code des anderen Geräts hier einfügen"></textarea>
        <button class="btn" data-act="pasteok">Code übernehmen</button></div></details>`;
    const qrBox = (code, label) => {
      let canvas = null;
      try { canvas = QR.toCanvas(code, 760, 'M'); } catch (e) { canvas = null; }
      return { html: `<p style="font-weight:600;margin:0 0 8px">${label}</p><div class="qrbox" data-qr></div>
        <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap">
          <button class="btn" data-act="sharecode">${I('share')} Code als Text teilen</button></div>`, canvas };
    };
    const startScan = async (onCode) => {
      if (scanner) { scanner.stop(); scanner = null; }
      const v = sh.body.querySelector('video');
      try {
        // Nach dem Scannen läuft die Kamera weiter ('hold'): Safari gibt die lokalen
        // Netzadressen nur frei, solange die Kamera aktiv ist. cleanup() beendet sie.
        scanner = await QrScan.start(v, async txt => {
          if (!/^LD1[zp]:/.test(txt)) return true;
          await onCode(txt); return 'hold';
        });
        const m = sh.body.querySelector('.scanmode'); if (m) m.textContent = scanner.native ? 'Scanner: System (BarcodeDetector)' : 'Scanner: integrierter Doku VT-Decoder';
      } catch (err) { const m = sh.body.querySelector('.scanmode'); if (m) m.textContent = err.message; sh.body.querySelector('details.more').open = true; }
      const ok = sh.body.querySelector('[data-act=pasteok]');
      if (ok) ok.onclick = async () => { const t = sh.body.querySelector('[data-in]').value.trim(); if (t) await onCode(t); };
    };
    const shareCode = code => {
      if (navigator.share) navigator.share({ text: code }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => Ui.toast('Code kopiert'), () => {});
    };
    const watch = s => {
      s.onstate = (st, info, frac) => {
        if (sh.layer.closed) return;
        if (st === 'open') { clearTimeout(timer); connected(); }
        else if (st === 'hello') setMsg(`Verbunden mit ${info}. Daten werden abgeglichen …`);
        else if (st === 'progress') { setMsg(info); const bar = sh.body.querySelector('.pbar i'); if (bar && frac != null) bar.style.width = (frac * 100) + '%'; }
        else if (st === 'done') done();
        else if (st === 'error') failed(info);
        else if (st === 'closed') { const m = sh.body.querySelector('[data-msg]'); if (m) m.textContent = 'Verbindung beendet.'; }
      };
    };
    const setMsg = t => { const m = sh.body.querySelector('[data-msg]'); if (m) m.textContent = t; };
    const connected = () => { cleanup(); step(`<div class="bigstatus" data-state="live"><span class="dot"></span><div><h3>Verbunden</h3><p data-msg>Daten werden abgeglichen …</p></div></div><div class="pbar"><i></i></div>`); };
    const done = () => step(`<div class="bigstatus" data-state="ok"><span class="dot"></span><div><h3>Abgleich abgeschlossen</h3><p data-msg>Beide Geräte haben jetzt denselben Stand. Die Verbindung bleibt offen: Änderungen werden sofort übertragen, solange Doku VT auf beiden Geräten geöffnet ist.</p></div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary big" data-close>Fertig</button><button class="btn big" data-act="disconnect">Trennen</button></div>`);
    const failed = async msg => {
      const s = session;
      if (s) { if (s.shownFail) return; s.shownFail = true; await s.collectStats(); }
      const hints = s ? s.analyse() : [], rep = s ? s.report(msg) : '';
      cleanup(false);
      if (sh.layer.closed) return;
      step(`<div class="bigstatus" data-state="error"><span class="dot"></span><div><h3>Keine Verbindung</h3><p>${Utils.esc(msg)}</p></div></div>
      ${hints.length ? `<div class="group"><h3>Was die Diagnose zeigt</h3>${hints.map(h => `<div class="item"><span class="lb">${Utils.esc(h)}</span></div>`).join('')}</div>` : ''}
      <ul class="muted" style="font-size:14px;padding-left:20px"><li>Beide Geräte im selben WLAN? (kein Gast-WLAN, kein Mobilfunk, kein VPN)</li><li>Kamerazugriff auf beiden Geräten erlauben.</li><li>Doku VT auf beiden Geräten im Vordergrund lassen.</li><li>Alternativ: Sync-Paket per AirDrop/Nearby Share.</li></ul>
      ${rep ? `<details class="more" style="margin-bottom:12px"><summary>${I('info', 'sm')} Technische Details ${I('arrowR', 'sm chev')}</summary>
        <div class="inner" style="grid-template-columns:1fr"><textarea class="code" readonly style="min-height:220px">${Utils.esc(rep)}</textarea>
        <button class="btn" data-act="sharerep">${I('share')} Diagnose teilen</button></div></details>` : ''}
      <button class="btn big block" data-act="restart">Erneut versuchen</button>`);
      const sb = sh.body.querySelector('[data-act=sharerep]'); if (sb) sb.onclick = () => shareCode(rep);
      if (hints.length) Sync.log('Live-Diagnose: ' + hints[0], 'error');
    };
    const waitConnect = () => { timer = setTimeout(() => { if (session && !session.open) failed('Zeitüberschreitung – die Geräte haben sich nicht gefunden.'); }, 40000); };

    const offer = async () => {
      session = new PeerSession(); watch(session);
      step(`<div class="bigstatus"><span class="dot"></span><div><h3>Verbindungscode wird erstellt …</h3><p>Kamera wird vorbereitet.</p></div></div>`);
      // Kamera zuerst starten: Safari gibt lokale Netzadressen erst bei aktiver Kamera frei
      step(`<div data-qrwrap></div>${scanBox('2. Antwort-Code des anderen Geräts scannen:')}`);
      const onAnswer = async txt => {
        try { await session.acceptAnswer(await PeerAdapter.decodeSignal(txt)); setMsgQr('Antwort erhalten – Verbindung wird aufgebaut …'); waitConnect(); }
        catch (err) { Ui.toast(err.message, 'err'); setTimeout(() => startScan(onAnswer), 0); }
      };
      // erst warten, bis die Kamera wirklich läuft (oder abgelehnt wurde) – sonst fehlen die Adressen
      await startScan(onAnswer);
      if (sh.layer.closed) return;
      try {
        const code = await session.createOffer();
        const q = qrBox(code, '1. Diesen Code mit dem anderen Gerät scannen („Code scannen“):');
        const w = sh.body.querySelector('[data-qrwrap]'); w.innerHTML = q.html;
        if (q.canvas) w.querySelector('[data-qr]').appendChild(q.canvas); else w.querySelector('[data-qr]').textContent = 'Code zu groß – bitte als Text teilen.';
        w.querySelector('[data-act=sharecode]').onclick = () => shareCode(code);
      } catch (err) { failed('Verbindung konnte nicht vorbereitet werden: ' + err.message); }
    };
    const setMsgQr = t => { const w = sh.body.querySelector('[data-qrwrap]'); if (w) w.innerHTML = `<div class="bigstatus" data-state="pending"><span class="dot"></span><div><h3>Bitte warten</h3><p data-msg>${Utils.esc(t)}</p></div></div>`; const sb = sh.body.querySelector('.scanbox'); if (sb) sb.remove(); };
    const answer = () => {
      session = new PeerSession(); watch(session);
      step(scanBox('Code des anbietenden Geräts scannen:'));
      const onCode = async txt => {
        try {
          const code = await session.acceptOffer(await PeerAdapter.decodeSignal(txt));
          const q = qrBox(code, 'Jetzt diesen Antwort-Code mit dem anderen Gerät scannen:');
          step(q.html + `<p class="muted" data-msg style="text-align:center;margin-top:12px">Warte auf Verbindung …</p>`);
          if (q.canvas) sh.body.querySelector('[data-qr]').appendChild(q.canvas);
          sh.body.querySelector('[data-act=sharecode]').onclick = () => shareCode(code);
          waitConnect();
        } catch (err) { Ui.toast(err.message, 'err'); session.close(); session = new PeerSession(); watch(session); startScan(onCode); }
      };
      startScan(onCode);
    };
    sh.body.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      if (b.dataset.act === 'offer') offer();
      else if (b.dataset.act === 'answer') answer();
      else if (b.dataset.act === 'restart') { if (session) session.close(); session = null; choose(); }
      else if (b.dataset.act === 'disconnect') { if (session) session.close(); sh.close(); }
    });
    choose();
  }
};

/* ---------- Diagnose ---------- */
const DiagView = {
  async open() {
    const sh = Ui.sheet({ title: 'Diagnose', center: true });
    const render = async () => {
      const cnt = m => { let live = 0, dead = 0; for (const r of m.values()) r.f.del ? dead++ : live++; return { live, dead }; };
      const s = cnt(Repo.shows), e = cnt(Repo.entries), p = cnt(Repo.photos);
      const blobs = (await Repo.blobIds()).size, missing = await Repo.missingBlobs();
      let est = null, persisted = null;
      try { est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; } catch (x) { est = null; }
      try { persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; } catch (x) { persisted = null; }
      const st = Sync.status();
      const cap = {
        'IndexedDB': !!globalThis.indexedDB, 'Kamera (getUserMedia)': Camera.supported(), 'Live-Abgleich (WebRTC)': PeerAdapter.available(),
        'QR-Scanner nativ (BarcodeDetector)': 'BarcodeDetector' in window, 'Kompression (CompressionStream)': !!globalThis.CompressionStream,
        'Dateien teilen (Web Share)': !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'x.txt', { type: 'text/plain' })] })),
        'Sicherer Kontext (https)': !!window.isSecureContext, 'Als App installiert': matchMedia('(display-mode: standalone)').matches || !!navigator.standalone
      };
      sh.body.innerHTML = `
        <div class="bigstatus" data-state="${st.state}"><span class="dot"></span><div><h3>${Utils.esc(st.label)}</h3><p>${Utils.esc(st.text)}</p></div></div>
        <div class="group"><h3>Dieses Gerät</h3><dl class="kv">
          <dt>Name</dt><dd>${Utils.esc(Sync.deviceName())}</dd><dt>Geräte-ID</dt><dd>${Sync.deviceId}</dd><dt>App-Version</dt><dd>${APP_VERSION}</dd>
          <dt>Dokumentiert</dt><dd>${Utils.esc(Sync.deptLabel())}</dd><dt>Paketformat</dt><dd>${FORMAT_VERSION}</dd>
          <dt>Speicher</dt><dd>${est ? `${Utils.fmtBytes(est.usage)} von ${Utils.fmtBytes(est.quota)} belegt` : 'unbekannt'}</dd>
          <dt>Dauerhaft</dt><dd>${persisted == null ? 'unbekannt' : persisted ? 'ja – Browser löscht die Daten nicht automatisch' : 'nein – bei Speichermangel könnte der Browser löschen'}</dd></dl></div>
        <div class="group"><h3>Lokale Daten</h3><dl class="kv">
          <dt>Veranstaltungen</dt><dd>${s.live} (+${s.dead} gelöscht)</dd><dt>Einträge</dt><dd>${e.live} (+${e.dead} gelöscht)</dd>
          <dt>Fotos</dt><dd>${p.live} (+${p.dead} gelöscht)</dd><dt>Bilddaten</dt><dd>${blobs}</dd>
          <dt>Vorstellungen</dt><dd>${cnt(Repo.runs).live} Durchgänge (+${cnt(Repo.runs).dead} gelöscht)</dd>
          ${Repo.house.size || Settings.v.depts.includes('R') ? `<dt>Haus-Daten</dt><dd>${Repo.house.size} Datensatz${Repo.house.size === 1 ? '' : 'e'}${Repo.house.get('requisite') ? ` · ${Req.houseOrts().length} Haus-Orte, ${Req.vorlagen().length} Vorlagen · Stand ${Utils.fmtDate(Repo.house.get('requisite').mod)}` : ''}</dd>` : ''}
          ${(() => { const big = Repo.liveShows().filter(x => Object.keys(x.f).length >= 1500); return big.length ? `<dt>Hinweis</dt><dd style="color:var(--edit)">${big.map(x => `„${Utils.esc(x.f.titel)}“: ${Object.keys(x.f).length} von höchstens ${Rec.MAX_FIELDS} Feldern`).join('<br>')}</dd>` : ''; })()}
          <dt>Fehlende Bilder</dt><dd>${missing.length}${missing.length ? ' – bitte vollständiges Paket/Live-Abgleich' : ''}</dd>
          <dt>Offene Änderungen</dt><dd>${Sync.pending()}</dd><dt>Letzter Abgleich</dt><dd>${Utils.fmtDate(Sync.state.lastSyncAt)}</dd>
          <dt>Letztes Paket</dt><dd>${Utils.fmtDate(Sync.state.lastPackageAt)}</dd></dl></div>
        <div class="group"><h3>Abgleich-Wege (Adapter)</h3>${[...Sync.adapters.values()].map(a => `<div class="item"><span class="lb">${Utils.esc(a.name)}</span><span class="${a.available() ? '' : 'muted'}">${a.available() ? 'verfügbar' : 'nicht verfügbar'}</span></div>`).join('')}</div>
        <div class="group"><h3>Browser-Fähigkeiten</h3>${Object.entries(cap).map(([k, v]) => `<div class="item"><span class="lb">${k}</span><span style="color:var(${v ? '--ok' : '--muted'})">${v ? 'ja' : 'nein'}</span></div>`).join('')}</div>
        <div class="group"><h3>Protokoll</h3><div class="log">${Sync.state.log.length ? Sync.state.log.map(l => `<div style="${l.kind === 'error' ? 'color:var(--danger)' : ''}">${Utils.fmtDate(l.t)} · ${Utils.esc(l.msg)}</div>`).join('') : '<div>Noch keine Einträge.</div>'}</div></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" data-act="persist">${I('lock')} Dauerhaften Speicher anfordern</button>
          <button class="btn" data-act="clean">${I('trash')} Speicher aufräumen</button>
          <button class="btn" data-act="clearerr">Fehlerstatus zurücksetzen</button></div>`;
    };
    await render();
    sh.body.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-act]'); if (!b) return;
      if (b.dataset.act === 'clean') {
        const orphans = (await Repo.orphanBlobs()).length;
        if (!orphans) { Ui.toast('Nichts aufzuräumen – alle Bilder werden noch gebraucht.'); return; }
        const inTrash = Repo.deletedShows().length;
        if (!await Ui.confirm('Speicher aufräumen?', `${orphans} nicht mehr benötigte Bilder werden endgültig entfernt.` + (inTrash ? `\nFotos von Veranstaltungen im Papierkorb (${inTrash}) bleiben erhalten.` : ''), 'Aufräumen', true)) return;
        const n = await Repo.cleanup(); Ui.toast(`${n} nicht mehr benötigte Bilder entfernt`); render();
      }
      if (b.dataset.act === 'persist') { const ok = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; Ui.toast(ok ? 'Speicher ist jetzt dauerhaft' : 'Der Browser hat dauerhaften Speicher (noch) nicht gewährt – als App installieren hilft meist.', ok ? '' : 'warn'); render(); }
      if (b.dataset.act === 'clearerr') { Sync.state.lastError = ''; await Sync.save(); render(); }
    });
  }
};

      else if (b.dataset.act === 'mkeys') {

        if (n != null) { await Settings.set({ mikroKeys: [...new Set(n.split(/[,;]+/).map(x => x.trim()).filter(Boolean))].slice(0, 30) }); render(); }
      }
      else if (b.dataset.act === 'fkeys') {
        const n = await Ui.prompt('Filter-Schnelltasten', (Settings.v.filterKeys || []).join(', '), 'z. B. nc, L201, L202, R132', 'Mit Komma oder Leerzeichen trennen. Die Reihenfolge bleibt so erhalten.');
        if (n != null) { await Settings.set({ filterKeys: [...new Set(n.split(/[\s,;]+/).map(x => x.trim()).filter(Boolean))].slice(0, 30) }); render(); }
      }
      else if (b.dataset.act === 'sync') SyncView.open();
      else if (b.dataset.act === 'diag') DiagView.open();
      else if (b.dataset.act === 'demo') { await Demo.create(); Ui.toast('Demo-Veranstaltung angelegt'); App.render(); }

        const t = await Ui.prompt('Zur Bestätigung LÖSCHEN eintippen', '', 'LÖSCHEN');
        if (t !== 'LÖSCHEN') { Ui.toast('Abgebrochen'); return; }
        const rs = Store.db.objectStoreNames.contains('runs') ? ['runs'] : [], runIds = [...Repo.runs.keys()], houseIds = [...Repo.house.keys()];
        await Store.tx(['shows', 'entries', 'photos', 'fulls', 'thumbs', ...rs, 'meta'], 'readwrite', s => { ['shows', 'entries', 'photos', 'fulls', 'thumbs', ...rs].forEach(n => s[n].clear()); s.meta.delete('syncState'); s.meta.delete('demoDone'); s.meta.delete('demoRDone'); runIds.forEach(id => s.meta.delete('run:' + id)); houseIds.forEach(id => s.meta.delete('house:' + id)); });
        location.hash = ''; location.reload();
      }
    });
    sh.body.addEventListener('change', async e => {
      const t = e.target;
      if (t.dataset.bool) await Settings.set({ [t.dataset.bool]: t.checked });
      if (t.dataset.dept) {
        const cur = new Set(Settings.v.depts); t.checked ? cur.add(t.dataset.dept) : cur.delete(t.dataset.dept);
        if (!cur.size) { t.checked = true; Ui.toast('Mindestens eine Abteilung muss aktiv bleiben.', 'warn'); return; }
        const addR = t.dataset.dept === 'R' && t.checked;
        await Settings.set({ depts: DEPT_ORDER.filter(d => cur.has(d)) });
        if (addR) {                      // Requisite eingeschaltet: Haus-Orte und Vorlagen (einmalig), Demo „Einfache Leute“
          try { const h = await Req.ensureHouse(), d = await Req.maybeDemo(); if (h || d) Ui.toast(d ? 'Requisite eingeschaltet – Haus-Orte, Vorlagen und die Demo „Einfache Leute“ sind angelegt.' : 'Requisite eingeschaltet – Haus-Orte und Vorlagen sind angelegt.'); }
          catch (err) { App.error(err); }
        }
        render();
        App.state.abt = 'all'; App.render(); App.updatePill();
      }
      if (t.dataset.range) { await Settings.set({ [t.dataset.range]: +t.value }); render(); }
    });
    sh.body.addEventListener('input', e => { const t = e.target; if (t.dataset.range) { Settings.v[t.dataset.range] = +t.value; Settings.apply(); } });
  }
};

/* =====================================================================
   Pwa – Manifest/Service Worker nur einbinden, wenn die Dateien existieren;
   version.json für Update-Hinweise.
   ===================================================================== */
const Pwa = {
  /* Aktiv seit 1.2.0: Service Worker (Offline-Start, Installation) und Update-Hinweis über version.json.
     Nur über http(s) – beim Öffnen per Doppelklick (file://) bleibt alles aus. */
  ENABLED: true, reg: null,
  async init() {
    if (!this.ENABLED || !/^https?:$/.test(location.protocol)) return;
    if ('serviceWorker' in navigator) {
      try {
        this.reg = await navigator.serviceWorker.register('sw.js');
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => { if (this.wantReload && !reloading) { reloading = true; location.reload(); } });
      } catch (e) { console.warn('Service Worker nicht registriert', e); }
    }
    this.checkVersion();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.checkVersion(); });
  },
  /** version.json vom Server (am Cache vorbei) mit APP_VERSION vergleichen */
  async checkVersion() {
    if (!navigator.onLine || this.offered) return;
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const v = await r.json();
      if (v && v.version && this.newer(v.version, APP_VERSION)) {
        this.offered = true;
        Ui.toast(`Neue Version ${v.version} verfügbar`, '', { action: { label: 'Aktualisieren', fn: () => this.update() }, ms: 12000 });
      }
    } catch (e) { /* offline – kein Problem */ }
  },
  newer(a, b) { const pa = a.split('.').map(Number), pb = b.split('.').map(Number); for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) > (pb[i] || 0); } return false; },
  async update() {
    if (document.querySelector('[data-editor]')) { Ui.toast('Bitte zuerst den offenen Eintrag speichern.', 'warn'); this.offered = false; return; }
    this.wantReload = true;
    try {
      if (this.reg) {
        await this.reg.update();
        const w = this.reg.waiting || this.reg.installing;
        if (w) { w.postMessage('SKIP_WAITING'); setTimeout(() => location.reload(), 4000); return; }
      }
    } catch (e) { /* weiter mit Neuladen */ }
    location.reload();
  }
};

/* =====================================================================
   App – Navigation, Zustand, Rendering
   ===================================================================== */
const App = {
  state: { route: 'home', showId: null, abt: 'all', kat: 'all', q: '', edit: false, checklist: false, sel: null, renderPending: false, reqSafe: false },
  async start() {
    const setVh = () => document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
    setVh(); window.addEventListener('resize', setVh);
    Ui.init(); Kb.init();
    try {
      await Store.open();
      await Settings.load();
      await Sync.init();
      await Repo.load();
    } catch (err) { Boot.started = true; this.fatal(err); return; }
    if (!Repo.shows.size && Settings.v.demoOnFirstStart && !(await Store.metaGet('demoDone', false))) {
      try { await Demo.create(); } catch (e) { console.warn('Demo nicht angelegt', e); }
    }
    if (Settings.v.depts.includes('R')) {          // Requisite: Haus-Standard und Demo „Einfache Leute“ (nur einmal)
      try { await Req.ensureHouse(); await Req.maybeDemo(); } catch (e) { console.warn('Requisite-Standard nicht angelegt', e); }
    }
    Repo.on(() => this.requestRender());
    Sync.on(() => this.updatePill());
    window.addEventListener('hashchange', () => this.route());
    window.addEventListener('focusout', () => setTimeout(() => { if (this.state.renderPending && !this.inputFocused()) this.render(); }, 50));
    // iPadOS/iOS: Nach dem Schließen der Tastatur bleiben feste Elemente (Rahmen, „+ Eintrag“, Kopfzeilen)
    // manchmal an der alten Stelle hängen. Ansicht einmal neu ausrichten, sobald kein Feld mehr aktiv ist.
    const realign = () => {
      if (Utils.isEditable(document.activeElement)) return;
      setVh();
      const x = window.scrollX, y = window.scrollY;
      window.scrollTo(x, y > 0 ? y - 1 : y + 1);
      requestAnimationFrame(() => { window.scrollTo(x, y); this.stickyTop(); });
    };
    window.addEventListener('focusout', () => setTimeout(realign, 300));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', Utils.debounce(realign, 250));
    document.addEventListener('keydown', e => this.keys(e));
    window.addEventListener('unhandledrejection', e => { console.error(e.reason); e.preventDefault(); Ui.toast('Fehler: ' + (e.reason && e.reason.message || e.reason), 'err'); });
    window.addEventListener('beforeunload', e => { if (document.querySelector('[data-editor]')) { e.preventDefault(); e.returnValue = ''; } });
    new ResizeObserver(() => this.stickyTop()).observe(document.getElementById('appbar'));
    this.route();
    Boot.started = true;            // ab hier meldet die App Fehler selbst (Toast/Dialog)
    Pwa.init();
  },
  fatal(err) {
    document.getElementById('main').innerHTML = `<div class="wrap"><div class="empty"><div class="ico">${I('database', 'lg')}</div><h3>Datenspeicher nicht verfügbar</h3>
      <p>${Utils.esc(err.message)}</p><p>Tipp: Kein privates Surfen verwenden und Doku VT über https bzw. als installierte App öffnen.</p></div></div>`;
  },
  error(err) {
    console.error(err);

  _persistAsked: false,

  inputFocused() { const a = document.activeElement; return Utils.isEditable(a) && !a.matches('[data-search]'); },
  /** Neu zeichnen – aber NIE während in einem Eingabefeld getippt wird */
  requestRender: Utils.debounce(function () { if (App.inputFocused()) App.state.renderPending = true; else App.render(); }, 120),
  route() {

    if (h[0] === 'show' && Repo.show(h[1])) {
      if (this.state.showId !== h[1]) Object.assign(this.state, { showId: h[1], q: '', sel: null, abt: 'all', kat: 'all', checklist: false });

  },

  stickyTop() { const h = document.getElementById('appbar').offsetHeight; document.documentElement.style.setProperty('--appbar', h + 'px'); const tb = document.querySelector('.toolbar'); if (tb) { tb.style.top = h + 'px'; document.documentElement.style.setProperty('--stickytop', (h + tb.offsetHeight) + 'px'); } },
  updatePill() {

  /* ---------- Abteilungen ---------- */
  /** Sichtbar = Abteilungen der Veranstaltung ∩ Abteilungen dieses Geräts */
  visibleDepts(showId) { const sd = Repo.showDepts(showId); return DEPT_ORDER.filter(d => sd.includes(d) && Settings.v.depts.includes(d)); },
  /** Abteilung, nach der sich Beschriftungen richten: gewählte, sonst die einzige sichtbare, sonst null („Alle“) */
  curAbt() {

  /** Umschalter für die Abteilungen einer Veranstaltung (Anlegen/Bearbeiten) */
  deptToggles(sel) {

          <button class="modesw" data-act="mode" role="switch" aria-checked="false" aria-pressed="false"><span class="lab l0">${I('lock', 'sm')} Ansicht</span><span class="trk"><span class="knob"></span></span><span class="lab l1">Bearbeiten ${I('edit', 'sm')}</span></button>

    this.stickyTop();
  },
  renderToolbar() {
    const st = this.state, main = document.getElementById('main');
    const tb = main.querySelector('.toolbar'); if (!tb) return;
    const vis = this.visibleDepts(st.showId);
    if (st.abt !== 'all' && !vis.includes(st.abt)) st.abt = 'all';

        ${vis.map(d => `<button class="deptbtn" data-dept="${d}" data-abt="${d}" aria-pressed="${st.abt === d}"${vis.length > 3 ? ` aria-label="${Utils.esc(DEPT[d].name)}"` : ''}>${vis.length > 3 ? `<span class="dl">${Utils.esc(DEPT[d].short)}</span><span class="ds">${DEPT[d].abbr}</span>` : Utils.esc(DEPT[d].short)} <span class="cnt" data-dcnt="${d}"></span></button>`).join('')}</div>`;
    } else { dr.classList.add('hidden'); dr.innerHTML = ''; }
    if (ca) tb.dataset.abt = ca; else delete tb.dataset.abt;
    // Zeile 1: Phasen mit Namen der Abteilung („Einrichtung“ bei Alle); Bühne ohne Phasen-Filter

    katbar.classList.toggle('hidden', !!noPhase);

    if (isR) {
      const m = ReqView.mode(), n = ReqView.safetyCount(st.showId);
      rb.innerHTML = `<div class="seg rseg" role="group" aria-label="Ansicht">${[['ort', 'Nach Ort', 'Ort'], ['ablauf', 'Ablauf', 'Ablauf'], ['personen', 'Personen', 'Personen']].map(([k, l, s]) =>
        `<button data-rview="${k}" aria-pressed="${!st.reqSafe && m === k}"><span class="rl">${l}</span><span class="rs">${s}</span></button>`).join('')}</div>
        <button class="btn rsafebtn" data-act="rsafe" aria-pressed="${!!st.reqSafe}" aria-label="Sicherheit: ${n} Einträge">${I('shield', 'sm')}<span class="cl">Sicherheit</span> <span class="cnt mono">${n}</span></button>`;
    }
    main.querySelector('[data-act=checklist]').setAttribute('aria-pressed', st.checklist);
    const mb = main.querySelector('[data-act=mode]');

    // Hinzufügen: eine Abteilung → wie bisher; mehrere → je Abteilung ein farbiger Knopf
    const fab = main.querySelector('[data-fab]');
    const multiAdd = st.edit && !ca && vis.length > 1;
    fab.classList.toggle('multi', multiAdd);
    main.querySelector('.split').classList.toggle('multi', multiAdd);
    const cam = `<button class="fab qcam" data-act="quick" aria-label="Schnell erfassen mit Kamera">${I('camera', 'lg')}</button>`;
    fab.innerHTML = !st.edit ? '' : multiAdd
      ? cam + vis.map(d => `<button class="fab dept" data-act="new" data-abt="${d}" aria-label="Neuer Eintrag ${Utils.esc(DEPT[d].name)}">${I('plus')} ${Utils.esc(DEPT[d].short)}</button>`).join('')
      : cam + (vis.length > 1 ? `<button class="fab dept" data-abt="${ca}" data-act="new" data-new-abt="${ca}">${I('plus')} ${Utils.esc(D.short)}</button>` : `<button class="fab" data-act="new">${I('plus')} ${isR ? 'Gegenstand' : 'Eintrag'}</button>`);
    // Fortschritt der Checkliste je Abteilung und Phase
    const pr = main.querySelector('[data-prog]');

  },
  renderList() {
    const st = this.state, main = document.getElementById('main');
    const list = main.querySelector('[data-list]'); if (!list) return;
    const vis = this.visibleDepts(st.showId), ca = this.curAbt();
    const setupBox = main.querySelector('[data-setup]');
    // Requisite, Ansicht „Ablauf“: dort wird der ganze Durchgang abgehakt – „Vor der Vorstellung“ oben entfällt
    SetupView.render(setupBox, st.showId, st.edit, st.abt === 'all' ? vis : vis.filter(d => d === st.abt), { noRun: ca === 'R' && !st.reqSafe && ReqView.mode() === 'ablauf' });
    const sort = 'kreis';                         // Sortierung immer: Abteilung → Phase → Hauptfeld aufsteigend
    const every = Views.sortedItems(st.showId, { kat: 'all', sort, q: st.q, depts: vis });
    const dc = { all: every.length }; vis.forEach(d => { dc[d] = 0; }); every.forEach(i => { dc[i.abt]++; });
    main.querySelectorAll('[data-dcnt]').forEach(el => { el.textContent = dc[el.dataset.dcnt] ?? 0; });
    if (ca === 'R') {                              // Requisite allein: eigene Ansichten
      main.querySelector('.split').classList.toggle('has-detail', !!st.sel && !!Repo.entry(st.sel.split(':')[0]) && this.sidePane());
      ReqView.render(list, st.showId, st);
      return;
    }
    const all = st.abt === 'all' ? every : every.filter(i => i.abt === st.abt);
    const cnt = { all: all.length, A: 0, E: 0 }; all.forEach(i => { if (cnt[i.kat] != null) cnt[i.kat]++; });
    main.querySelectorAll('[data-cnt]').forEach(el => { el.textContent = cnt[el.dataset.cnt]; });
    const items = st.kat === 'all' ? all : all.filter(i => i.kat === st.kat);
    const multi = !ca && vis.length > 1;
    const dupKeys = new Set(Repo.duplicatesOf(st.showId, vis).map(g => Repo.dupKey(g[0])));
    this._items = items;
    const split = main.querySelector('.split');
    split.classList.toggle('has-detail', !!st.sel && !!Repo.entry(st.sel.split(':')[0]) && this.sidePane());
    if (!items.length) {
      const anyEntries = Repo.entriesOf(st.showId).length;
      const ml = ca ? DEPT[ca].mainLabel : 'Hauptfeld';
      list.innerHTML = `<div class="empty"><div class="ico">${I(st.q ? 'search' : 'camera', 'lg')}</div>
        <h3>${st.q ? 'Nichts gefunden' : anyEntries ? 'Keine Einträge in dieser Auswahl' : 'Noch keine Einträge'}</h3>
        <p>${st.q ? `Kein Eintrag passt zu „${Utils.esc(st.q)}“.` : st.edit ? `Mit der Kamera-Taste unten rechts geht es am schnellsten: Foto → ${Utils.esc(ml)} eintippen → fertig.` : 'Zum Anlegen oben rechts in den Bearbeitungsmodus wechseln.'}</p>
        ${!st.q && !st.edit ? `<button class="btn edit big" data-act="mode">${I('edit')} Bearbeiten</button>` : ''}</div>`;
      return;
    }
    // Inkrementell zeichnen: je 60 Karten, weitere beim Scrollen
    const CH = 60; let shown = 0, lastSect = null; this._bhint = false;
    const grid = Settings.v.view === 'grid', big = Settings.v.view === 'big';
    const ccls = grid ? 'grid' : big ? 'big' : '';
    list.innerHTML = '';
    const appendChunk = () => {
      let html = '', open = shown > 0;
      const end = Math.min(items.length, shown + CH);
      for (let i = shown; i < end; i++) {
        const it = items[i], sec = Views.sectionOf(it, sort, multi);
        if (sec.key !== lastSect && (st.kat === 'all' || sort === 'gruppe' || multi || sec.abt === 'B')) {
          if (open) html += '</div>';
          const n = items.filter(x => Views.sectionOf(x, sort, multi).key === sec.key).length;
          html += `<div class="sect" ${sec.abt ? `data-abt="${sec.abt}"` : ''}>${sec.k ? `<span class="sw" data-k="${sec.k}" style="background:var(--k)${sec.k === 'N' ? ';opacity:.5' : ''}"></span>` : ''}${Utils.esc(sec.label)} <span class="n">${n}</span></div><div class="cards ${ccls}">`;
          open = true; lastSect = sec.key;
        } else if (!open) { html += `<div class="cards ${ccls}">`; open = true; }
        html += Views.cardHtml(it, { sel: st.sel === it.key, checklist: st.checklist, dupKeys, big });
      }
      if (open) html += '</div>';
      // Fortsetzung in den letzten Karten-Container einfügen, wenn kein neuer Abschnitt beginnt
      const tmp = document.createElement('div'); tmp.innerHTML = html;
      const lastCards = list.querySelector('.cards:last-of-type');
      if (shown > 0 && tmp.firstElementChild && tmp.firstElementChild.classList.contains('cards') && lastCards) {
        lastCards.append(...tmp.firstElementChild.children); tmp.firstElementChild.remove();
      }
      const sent = list.querySelector('.sentinel'); if (sent) sent.remove();
      list.append(...tmp.childNodes);
      shown = end;
      if (shown < items.length) {
        const s = document.createElement('div'); s.className = 'sentinel'; list.appendChild(s);

      } else {
        const f = document.createElement('div'); f.className = 'listfoot';
        f.textContent = `${items.length} Karte${items.length === 1 ? '' : 'n'}${dupKeys.size ? ` · ${dupKeys.size} doppelte Einträge – über „⋯“ zusammenführen` : ''} · Doku VT v${APP_VERSION}`;

  openDetailSheet(entryId) {

  async detailAction(ev, entryId, sheet) {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const e = Repo.entry(entryId); if (!e) return;

    if (a === 'dlb') this.openLightbox(entryId, b.dataset.k, +b.dataset.i);
    else if (a === 'dedit') { if (!this.state.edit) { this.state.edit = true; this.render(); } sheet && sheet.close(); setTimeout(() => Editor.open({ showId: e.showId, entryId }), sheet ? 60 : 0); }
    else if (a === 'dchk') { try { await Repo.toggleCheck(entryId, b.dataset.k); } catch (err) { this.error(err); } }
    else if (a === 'ddup') {
      const preset = { abt }; D.fields.forEach(fd => { preset[fd.k] = Utils.clone(e.f[fd.k]); }); if (abt !== 'R') preset[D.main] = '';
      sheet && sheet.close();

      setTimeout(() => { Editor.open({ showId: e.showId, preset }); Ui.toast(`Vorlage übernommen – bitte neuen Wert für „${D.mainLabel}“ eintragen`); }, sheet ? 60 : 0);
    } else if (a === 'ddel') {
      if (await Ui.confirm(abt === 'R' ? 'Gegenstand löschen?' : 'Eintrag löschen?', abt === 'R' ? `„${e.f.was || 'Ohne Namen'}“ mit allen Fotos löschen?` : `${D.mainLabel} ${mainVal(e) || '(ohne Nummer)'} mit allen Fotos löschen?`, 'Löschen', true)) {
        try { await Repo.deleteEntry(entryId); this.state.sel = null; sheet && sheet.close(); Ui.toast('Eintrag gelöscht'); } catch (err) { this.error(err); }
      }
    }
  },
  openLightbox(entryId, kat, idx) {
    // Galerie über alle sichtbaren Karten – Wischen springt zum nächsten Eintrag weiter
    const items = []; let start = 0;
    for (const it of this._items || []) {
      if (it.kat === 'N') continue;
      const ph = Repo.photosOf(it.entry.id, it.kat);
      ph.forEach((p, i) => { if (it.entry.id === entryId && it.kat === kat && i === idx) start = items.length; items.push({ b: p.b, entryId: it.entry.id, kat: it.kat, idx: i, n: ph.length, cap: p.f.cap || '' }); });
    }
    if (!items.some(x => x.entryId === entryId)) { items.length = 0; const ph = Repo.photosOf(entryId, kat); ph.forEach((p, i) => items.push({ b: p.b, entryId, kat, idx: i, n: ph.length, cap: p.f.cap || '' })); start = idx; }
    Lightbox.open(items, start);
  },

  async backup(showIds) {

  async importFile(file) {
    const bz = Ui.busy('Datei wird eingelesen und zusammengeführt …');
    try {
      const r = await Sync.importPackage(file, (i, n) => bz.set(`Fotos werden übernommen … ${i}/${n}`)); bz.close();
      if (r.type === 'legacy') {
        const L = r.legacy, again = !r.neu && !r.bilder;
        if (L.showIds.length === 1 && location.hash !== '#/show/' + L.showIds[0]) {   // erst zur Veranstaltung wechseln, dann Meldung
          location.hash = '#/show/' + L.showIds[0];
          await new Promise(res => setTimeout(res, 350));
        }
        const delL = L.showIds.filter(id => Repo.shows.has(id) && Repo.shows.get(id).f.del);
        if (delL.length && await this.offerRestore(delL)) return;
        Ui.dialog({ title: again ? 'Lichtdoku-Datei war schon importiert' : 'Lichtdoku-Datei importiert',
          message: `„${L.titles.join('“, „')}“\n${L.entries} Kreise · ${L.photos} Fotos (in Originalqualität)` +
            (again ? '\n\nEs wurde nichts doppelt angelegt.' : `\n\n${r.neu} neu, ${r.geaendert} aktualisiert.`) +
            (L.bad ? `\n\nAchtung: ${L.bad} Bild(er) waren beschädigt und konnten nicht gelesen werden.` : '') });
        return;
      }
      if (r.restorable && r.restorable.length && await this.offerRestore(r.restorable)) return;
      Ui.dialog({ title: r.type === 'sync' ? 'Sync-Paket eingespielt' : 'Backup importiert', message: `${r.neu} neue und ${r.geaendert} zusammengeführte Datensätze, ${r.bilder} Bilder übernommen.${r.missing ? `\n\nHinweis: ${r.missing} Fotos haben auf diesem Gerät noch keine Bilddaten – bitte ein komplettes Paket einspielen oder live abgleichen.` : ''}\n\nBestehende Daten wurden nicht überschrieben, sondern feldweise nach Zeitstempel zusammengeführt.` });
    } catch (err) { bz.close(); Sync.log('Import fehlgeschlagen: ' + err.message, 'error'); this.error(err); }
  },
  /** Gelöschte Veranstaltungen aus einem Backup wiederherstellen? → true, wenn wiederhergestellt */

  /* ---------- Ereignis-Delegation ---------- */
  async onClick(e) {
    const b = e.target.closest('[data-act],[data-kat],[data-sort],[data-view],[data-dept],[data-rview]'); if (!b) return;
    const st = this.state;
    if (b.dataset.rview) { st.reqSafe = false; await Settings.set({ reqView: b.dataset.rview }); this.renderToolbar(); this.renderList(); return; }
    if (b.dataset.act === 'rsafe') { st.reqSafe = !st.reqSafe; this.renderToolbar(); this.renderList(); return; }
    if (b.dataset.dept && !b.dataset.act) { st.abt = b.dataset.dept; st.kat = 'all'; st.sel = null; this.renderToolbar(); this.renderList(); this.renderDetail(); this.stickyTop(); return; }
    if (b.dataset.kat) { st.kat = b.dataset.kat; this.renderToolbar(); this.renderList(); return; }
    if (b.dataset.sort) { await Settings.set({ sort: b.dataset.sort }); this.renderToolbar(); this.renderList(); return; }
    if (b.dataset.view) { await Settings.set({ view: b.dataset.view }); this.renderToolbar(); this.renderList(); return; }
    const a = b.dataset.act;
    const card = b.closest('.card');
    if (card && (a === 'open' || a === 'lb' || a === 'chk')) {
      const [entryId, kat] = card.dataset.key.split(':');
      if (a === 'chk') { e.stopPropagation(); try { await Repo.toggleCheck(entryId, b.dataset.k || (kat === 'N' ? 'A' : kat)); } catch (err) { this.error(err); } return; }
      const thumb = e.target.closest('[data-act=lb]');
      if (thumb && !st.edit) { this.state.sel = card.dataset.key; this.openLightbox(entryId, kat, +thumb.dataset.i); return; }
      if (st.edit) { Editor.open({ showId: st.showId, entryId }); return; }
      st.sel = card.dataset.key;
      if (this.sidePane()) { this.renderList(); this.renderDetail(); }
      else { document.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel')); card.classList.add('sel'); this.openDetailSheet(entryId); }
      return;
    }
    if (b.closest('[data-detail]')) { const id = st.sel && st.sel.split(':')[0]; if (id) this.detailAction(e, id, null); return; }
    switch (a) {
      case 'home': this.go('#/'); break;
      case 'open': this.go('#/show/' + b.dataset.id); break;
      case 'newshow': this.newShow(); break;
      case 'showmenu': this.showMenu(b.dataset.id); break;
      case 'settings': SettingsView.open(); break;
      case 'sync': SyncView.open(); break;
      case 'rename': this.editShow(st.showId); break;
      case 'pdf': this.pdf(st.showId); break;
      case 'runs': RunList.open(st.showId); break;
      case 'mode': st.edit = !st.edit; this.render(); Ui.toast(st.edit ? 'Bearbeitungsmodus – Änderungen möglich' : 'Ansichtsmodus – geschützt vor versehentlichen Änderungen'); break;
      case 'checklist': st.checklist = !st.checklist; this.renderToolbar(); this.renderList(); this.renderDetail(); break;
      case 'resetchk': this.resetChecks(st.showId); break;
      case 'clearq': { const s = document.querySelector('[data-search]'); s.value = ''; st.q = ''; b.classList.add('hidden'); this.renderList(); s.focus(); break; }
      case 'new': this.newEntry(b.dataset.abt); break;
      case 'quick': {
        const abt = await this.askAbt('Schnell erfassen – Abteilung'); if (!abt) break;
        Editor.open({ showId: st.showId, abt, quick: st.kat === 'E' && DEPT[abt].photoKats.includes('E') ? 'E' : 'A' }); break;
      }
      case 'trash': this.openTrash(); break;
      case 'import': { const inp = document.querySelector('[data-file]'); inp.value = ''; inp.onchange = () => inp.files[0] && this.importFile(inp.files[0]); inp.click(); break; }
    }
  }
};
document.getElementById('app').addEventListener('click', e => App.onClick(e));
window.addEventListener('resize', Utils.debounce(() => { if (App.state.route === 'show' && !App.inputFocused()) { App.renderList(); App.renderDetail(); } }, 250));
App.start();
</script>
