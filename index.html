<!DOCTYPE html>
<html lang="de" data-theme="dark">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Doku VT</title>
<meta name="description" content="Technikdokumentation (Licht, Ton, Bühne, Requisite) für den Theaterbetrieb – offline, mit Fotos, PDF-Export und Geräte-Abgleich.">
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Doku VT">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cpath d='M18 14h10v28h18v8H18z' fill='%23ffcc33'/%3E%3Ccircle cx='44' cy='22' r='7' fill='%234a9eff'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   DOKU VT – Design-System
   Leitidee „Stellwerk“: ruhig, dunkel, werkzeughaft. Hauptfeld (Kreis/Kanal/Zug) zuerst.
   Ab 2.0.0: Die ABTEILUNG bestimmt den Farbton (Licht Rot, Ton Blau, Bühne Grau),
   die PHASE die Darstellung: Aufbau = kräftige, dunkle Abstufung, umrandet, Karte neutral;
   2. Phase (Einleuchten/Soundcheck/Einrichten) = helle, blasse Abstufung, gefüllt, Karte hell hinterlegt.
   Großbild-Kopf: Aufbau dunkel mit heller Schrift, 2. Phase hell mit dunkler Schrift (ab 2.4.4).
   Dazu immer ein Text-Tag („LICHT · AUFBAU“) – auch im Rotlicht-Modus eindeutig.
   Mechanik: [data-abt] setzt --da/--de/--dei/--dai, [data-k] wählt daraus --k/--ks/--ki.
   ===================================================================== */
:root{
  --bg:#0b0d10; --bg2:#101318; --surf:#151920; --surf2:#1b2029; --surf3:#232a35;
  --line:#2a313d; --line2:#3a4352;
  --text:#e9ecf1; --text2:#b5bdc9; --muted:#8a94a3;
  /* Abteilungen: a = Aufbau (dunkel), e = 2. Phase (hell), ei = Schrift auf hell, ai = Schrift auf dunkel */
  /* ab 2.4.4 deutlich weiter auseinander: Aufbau kräftig und dunkel, 2. Phase hell und blass
     (Kontrast Aufbau ↔ 2. Phase ≈ 4:1 statt 2:1; Aufbau bleibt ≥ 3:1 zur Kartenfläche) */
  --L-a:#c62c22; --L-e:#ffc2b4; --L-ei:#2b0603;
  --T-a:#2a62cc; --T-e:#a9e2ff; --T-ei:#06213f;
  --B-a:#646d79; --B-e:#dfe4ea; --B-ei:#15191f;
  --R-a:#2b7a3a; --R-e:#c3efc9; --R-ei:#062a10;   /* Requisite (ab 2.5.0): Grün, A ↔ E ≈ 4,2 : 1 */
  --ai:#ffffff;
  --e-tint:9%;          /* Hauch der 2. Phase auf der ganzen Karte */
  /* neutral, wenn keine Abteilung gewählt ist (z. B. Leiste bei „Alle“) */
  --da:var(--text2); --de:var(--text2); --dei:var(--bg); --dai:var(--bg);
  --neutral:#7c8696; --neutral-soft:rgba(124,134,150,.14);
  --edit:#ff8a2a; --edit-soft:rgba(255,138,42,.14);
  --ok:#3fd88a; --ok-soft:rgba(63,216,138,.14);
  /* Gefahr: Karminrosa, klar vom Licht-Rot abgesetzt; Löschen immer mit Symbol + Text */
  --danger:#ff5c93; --danger-soft:rgba(255,92,147,.14);
  --pink:#ff4fd8; --pink-soft:rgba(255,79,216,.16);
  --focus:#9cc9ff;
  --photo-filter:none;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --tap:48px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --gut:16px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono","DejaVu Sans Mono",Consolas,monospace;
  --vh:1vh;
  color-scheme:dark;
}
html[data-theme="light"]{
  --bg:#eef0f3; --bg2:#e6e9ee; --surf:#ffffff; --surf2:#f4f6f9; --surf3:#e9edf2;
  --line:#d5dbe3; --line2:#c2cad5;
  --text:#11161d; --text2:#3a4553; --muted:#5d6878;
  --L-a:#a51f15; --L-e:#ff9d8c; --L-ei:#2b0603;
  --T-a:#1a52b3; --T-e:#7fd0ff; --T-ei:#06213f;
  --B-a:#4f5762; --B-e:#c9d0d8; --B-ei:#15191f;
  --R-a:#1d6a2c; --R-e:#a6e8b2; --R-ei:#062a10;
  --e-tint:16%;
  --neutral:#6b7686; --neutral-soft:rgba(107,118,134,.12);
  --edit:#d9620b; --edit-soft:rgba(217,98,11,.10);
  --ok:#14945a; --ok-soft:rgba(20,148,90,.10);
  --danger:#c2185b; --danger-soft:rgba(194,24,91,.10);
  --pink:#c026a8; --pink-soft:rgba(192,38,168,.12);
  --focus:#1764d8;
  --shadow:0 10px 30px rgba(20,30,50,.18);
  color-scheme:light;
}
/* Rotlicht: nur Rottöne, Kategorien zusätzlich über Muster/Tag unterscheidbar */
html[data-theme="red"]{
  --bg:#000; --bg2:#070000; --surf:#0e0202; --surf2:#160404; --surf3:#200707;
  --line:#3a0e0e; --line2:#561616;
  --text:#ff5a4a; --text2:#e8463a; --muted:#c63c30;
  /* alle Abteilungen rot; Unterscheidung über Tag (Abteilungsname) und Schraffur (Aufbau) / Füllung (2. Phase) */
  --L-a:#ff4a3d; --L-e:#ff4a3d; --L-ei:#000; --T-a:#ff4a3d; --T-e:#ff4a3d; --T-ei:#000; --B-a:#ff4a3d; --B-e:#ff4a3d; --B-ei:#000;
  --R-a:#ff4a3d; --R-e:#ff4a3d; --R-ei:#000;
  --ai:#000;
  --neutral:#7a1c16; --neutral-soft:rgba(122,28,22,.2);
  --pink:#ff7a6a; --pink-soft:rgba(255,122,106,.16);
  --edit:#ff6a55; --edit-soft:rgba(255,106,85,.12);
  --ok:#ff4a3d; --ok-soft:rgba(255,74,61,.12);
  --danger:#ff7a6a; --danger-soft:rgba(255,122,106,.14);
  --focus:#ff7a6a;
  --photo-filter:grayscale(1) sepia(1) hue-rotate(-40deg) saturate(4) brightness(.62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:pan-x pan-y}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-y:none}
body{min-height:calc(var(--vh)*100);min-height:100dvh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
img{display:block;max-width:100%}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px}
svg.i.lg{width:28px;height:28px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* Abteilung → Farbton */
[data-abt="L"]{--da:var(--L-a);--de:var(--L-e);--dei:var(--L-ei);--dai:var(--ai)}
[data-abt="T"]{--da:var(--T-a);--de:var(--T-e);--dei:var(--T-ei);--dai:var(--ai)}
[data-abt="B"]{--da:var(--B-a);--de:var(--B-e);--dei:var(--B-ei);--dai:var(--ai)}
[data-abt="R"]{--da:var(--R-a);--de:var(--R-e);--dei:var(--R-ei);--dai:var(--ai)}
/* Phase → Abstufung (--k Farbe, --ks Hauch, --ki Schrift auf --k) */
[data-k="A"]{--k:var(--da);--ks:color-mix(in srgb,var(--da) 14%,transparent);--ki:var(--dai)}
[data-k="E"]{--k:var(--de);--ks:color-mix(in srgb,var(--de) 16%,transparent);--ki:var(--dei)}
[data-k="N"]{--k:var(--da);--ks:transparent;--ki:var(--dai)}
.hatch{background:repeating-linear-gradient(45deg,var(--k) 0 4px,transparent 4px 8px)!important}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* ---------- App-Rahmen ---------- */
#app{display:flex;flex-direction:column;min-height:calc(var(--vh)*100);min-height:100dvh}
.appbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:calc(var(--sat) + 6px) calc(var(--sar) + 12px) 6px calc(var(--sal) + 12px)}
.appbar-row{display:flex;align-items:center;gap:8px;min-height:var(--tap)}
.appbar h1{font-size:19px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.appbar h1 button.title-btn{all:unset;cursor:pointer;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:8px;padding:2px 4px;margin-left:-4px}
.appbar h1 .sub{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
html.editing .appbar{box-shadow:inset 0 -3px 0 var(--edit)}
/* Bearbeitungsmodus: Rahmen um den ganzen Bildschirm */
html.editing body::after{content:"";position:fixed;inset:0;border:4px solid var(--edit);pointer-events:none;z-index:60}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--surf2);display:grid;place-items:center;border:1px solid var(--line)}
.ver{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;border:1px solid var(--line);background:var(--surf);
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0;vertical-align:middle;margin-left:8px;flex:none}
.appver{text-align:center;color:var(--muted);font-size:12px;font-family:var(--mono);padding:28px 0 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);min-width:var(--tap);padding:0 16px;
  border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surf2);color:var(--text);font-weight:600;font-size:15px;
  transition:background .15s,border-color .15s,transform .1s;user-select:none;-webkit-user-select:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.icon{padding:0;width:var(--tap)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surf2)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.edit{background:var(--edit);color:#1a0a00;border-color:var(--edit)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
/* Knopf in Phasenfarbe (data-k + geerbtes data-abt) */
.btn.kfill{background:var(--k);color:var(--ki);border-color:var(--k)}
.btn.kline{border:2px solid var(--k)}
.btn.block{width:100%}
.btn.big{min-height:56px;font-size:17px;border-radius:var(--r)}
html[data-theme="red"] .btn.primary{background:var(--text);color:#000}

/* Sync-Status-Pille */
.syncpill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);
  background:var(--surf);font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap;min-width:44px;justify-content:center}
.syncpill .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.syncpill[data-state="ok"] .dot{background:var(--ok)}
.syncpill[data-state="pending"] .dot{background:var(--edit)}
.syncpill[data-state="live"] .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);animation:pulse 2s infinite}
.syncpill[data-state="error"] .dot{background:var(--danger)}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
@media (max-width:520px){.syncpill .lbl{display:none}.syncpill{padding:0 13px}}

main{flex:1;display:flex;flex-direction:column;min-height:0}
.wrap{width:100%;max-width:1100px;margin:0 auto;padding:16px calc(var(--sar) + var(--gut)) calc(var(--sab) + 110px) calc(var(--sal) + var(--gut))}

/* ---------- Startseite: Veranstaltungen ---------- */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 18px}
.home-head h2{margin:0;font-size:28px;letter-spacing:-.02em}
.home-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.shows{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.showcard{position:relative;display:flex;flex-direction:column;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  text-align:left;padding:0;transition:border-color .15s,transform .15s}
.showcard:hover{border-color:var(--line2)}
.showcard .open{all:unset;cursor:pointer;display:flex;flex-direction:column;flex:1}
.showcard .open:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;border-radius:var(--r-lg)}
.showcard .mosaic{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:16/8;background:var(--bg2)}
.showcard .mosaic .m{background:var(--surf2);overflow:hidden}
.showcard .mosaic .m:first-child{grid-row:span 2}
.showcard .mosaic img{width:100%;height:100%;object-fit:cover;filter:var(--photo-filter)}
.showcard .body{padding:14px 16px 16px}
.showcard h3{margin:0 0 4px;font-size:19px;letter-spacing:-.01em;padding-right:44px}
.showcard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px}
.showcard .menu{position:absolute;right:8px;bottom:12px}
.prog{display:flex;gap:6px;margin-top:10px}
.prog .bar{flex:1;height:6px;border-radius:3px;background:var(--surf3);overflow:hidden}
.prog .bar i{display:block;height:100%;border-radius:3px}
.prog .bar.a i{background:var(--da)} .prog .bar.e i{background:var(--de)}
.prog .pl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:44px}
.progs{display:grid;gap:6px;margin-top:10px}.progs .prog{margin-top:0;align-items:center}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h3{color:var(--text);margin:14px 0 6px;font-size:20px}
.empty .ico{width:72px;height:72px;margin:0 auto;border-radius:20px;background:var(--surf);border:1px solid var(--line);display:grid;place-items:center}

/* ---------- Show-Ansicht ---------- */
.toolbar{position:sticky;z-index:30;background:var(--bg);padding:10px calc(var(--sar) + var(--gut)) 10px calc(var(--sal) + var(--gut));
  border-bottom:1px solid var(--line);box-shadow:0 8px 16px -12px rgba(0,0,0,.6)}
.toolbar .row{display:flex;gap:8px;align-items:center;flex-wrap:nowrap;min-width:0}
.toolbar .katbtn{flex:0 1 auto;min-width:0;white-space:nowrap}
.toolbar .seg{flex:none}
.modesw{flex:0 1 auto;min-width:0}
.modesw .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toolbar .row + .row{margin-top:8px}
.search{position:relative;flex:1 1 220px;min-width:160px}
.search input{width:100%;height:var(--tap);border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surf);padding:0 42px 0 42px;font-size:16px;outline:none}
.search input:focus{border-color:var(--focus)}
.search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--muted);border-radius:8px}
.seg{display:inline-flex;background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;min-height:40px;padding:0 13px;border-radius:7px;font-weight:600;font-size:14px;color:var(--text2);display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surf3);color:var(--text)}
.seg .cnt{font-family:var(--mono);font-size:12px;opacity:.8}
/* Kategorie-Knöpfe, farbig umrandet */
.katbar{display:flex;gap:8px;flex-wrap:wrap}
.katbtn{--kc:var(--text2);--ki:var(--bg);min-height:46px;padding:0 16px;border-radius:var(--r-sm);border:2px solid var(--kc);background:transparent;color:var(--text);
  font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.katbtn[data-k]{--kc:var(--k);--kci:var(--ki)}
.katbtn{--kci:var(--bg)}
.katbtn[aria-pressed="true"]{background:var(--kc);color:var(--kci)}
/* Abteilungsleiste (nur bei mehr als einer sichtbaren Abteilung) */
.deptbar{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px;width:100%}
.deptbtn{--kc:var(--text2);--kci:var(--bg);min-height:46px;padding:0 6px;border-radius:var(--r-sm);border:2px solid var(--kc);background:transparent;color:var(--text);
  font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.deptbtn[data-abt]{--kc:var(--da);--kci:var(--dai)}
.deptbtn[aria-pressed="true"]{background:var(--kc);color:var(--kci)}
.deptbtn .cnt{font-family:var(--mono);font-size:12px;opacity:.8}
.deptbtn .ds{display:none}
@media (max-width:560px){.deptbar.many .deptbtn .dl{display:none}.deptbar.many .deptbtn .ds{display:inline}.deptbar.many .deptbtn{gap:3px;padding:0 2px}}
@media (max-width:400px){.deptbtn{font-size:14px;gap:4px}.deptbtn .cnt{font-size:11px}}
/* Abteilungs-Umschalter beim Anlegen/Bearbeiten einer Veranstaltung */
.depttgls{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.depttgl{min-height:64px;border-radius:var(--r);border:2px solid var(--da);background:transparent;color:var(--text);font-weight:800;font-size:17px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.depttgl[aria-pressed="true"]{background:var(--da);color:var(--dai)}
.depttgl .ck{width:22px;height:22px;border-radius:6px;border:2px solid currentColor;display:grid;place-items:center}
.katbtn .cnt{font-family:var(--mono);font-size:12px;opacity:.8}
.chkbtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#002b14}
@media (max-width:560px){.chkbtn .cl{display:none}.chkbtn{padding:0;width:var(--tap);min-width:var(--tap)}
  .toolbar .row{gap:6px}.katbar{gap:6px;flex-wrap:nowrap}.katbtn{padding:0 9px;font-size:14px;gap:5px;min-height:44px}}
/* Schalter Ansicht | Bearbeiten */
.modesw{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surf);color:var(--text);font-weight:700;font-size:14px;margin-left:auto}
.modesw .lab{display:inline-flex;align-items:center;gap:6px;color:var(--muted);transition:color .15s}
.modesw .trk{position:relative;width:56px;height:32px;border-radius:16px;background:var(--surf3);border:1px solid var(--line2);flex:none;transition:background .2s}
.modesw .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--text);transition:transform .2s}
.modesw[aria-checked="false"] .l0{color:var(--text)}
.modesw[aria-checked="true"] .l1{color:var(--edit)}
.modesw[aria-checked="true"] .trk{background:var(--edit);border-color:var(--edit)}
.modesw[aria-checked="true"] .knob{transform:translateX(24px);background:#fff}
.modesw[aria-checked="true"]{border-color:var(--edit)}
@media (max-width:620px){
  .toolbar .seg button{min-width:40px;padding:0 8px}
  .modesw{gap:6px;padding:0 10px;font-size:13px}
  .modesw .lab svg{display:none}
  .modesw .trk{width:46px}.modesw[aria-checked="true"] .knob{transform:translateX(14px)}}
@media (max-width:360px){.toolbar .katbtn .cnt{display:none}}
.progress-strip{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--text2);flex-wrap:wrap}
.progress-strip .pb{display:flex;align-items:center;gap:8px;min-width:160px;flex:1 1 230px}
.toolbar .row.progress-strip{flex-wrap:wrap;row-gap:8px}
.progress-strip .pb .tag{min-width:0}
.progress-strip .pb .bar{flex:1;height:8px;background:var(--surf3);border-radius:4px;overflow:hidden}
.progress-strip .pb .bar i{display:block;height:100%}

.split{display:grid;grid-template-columns:1fr;flex:1;min-height:0}
.listpane{padding:12px calc(var(--sar) + var(--gut)) calc(var(--sab) + 120px) calc(var(--sal) + var(--gut));min-width:0}
.detailpane{display:none}
@media (min-width:900px){
  .split.has-detail{grid-template-columns:minmax(360px,420px) 1fr}
  .split.has-detail .detailpane{display:block;position:sticky;align-self:start;border-left:1px solid var(--line);overflow:auto;
    height:calc(var(--vh)*100 - var(--stickytop,140px));height:calc(100dvh - var(--stickytop,140px));top:var(--stickytop,140px)}
  .split.has-detail .listpane{padding-right:14px}
}
.sect{display:flex;align-items:center;gap:10px;margin:18px 2px 10px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sect:first-child{margin-top:4px}
.sect .sw{width:14px;height:14px;border-radius:4px}
.sect .n{font-family:var(--mono);font-weight:500;letter-spacing:0}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}

.cards{display:flex;flex-direction:column;gap:10px}
.cards.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.card{position:relative;display:flex;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  min-height:96px;text-align:left;width:100%;padding:0;transition:border-color .15s,background .15s}
.card .strip{width:10px;flex:none;background:var(--k)}
/* 2. Phase (Einleuchten/Soundcheck/Einrichten): ganze Karte hell hinterlegt und hell umrandet – Aufbau bleibt neutral */
.card[data-k="E"]{background:color-mix(in srgb,var(--de) var(--e-tint),var(--surf));border-color:color-mix(in srgb,var(--de) 55%,var(--line))}
/* Eintrag ohne Foto: gestrichelte Karte in der Abteilungsfarbe */
.card[data-k="N"]{border:2px dashed color-mix(in srgb,var(--da) 75%,transparent)}
.card[data-k="N"] .strip{background:repeating-linear-gradient(180deg,var(--da) 0 6px,transparent 6px 12px)}
/* Rotlicht: Aufbau schraffiert, 2. Phase gefüllt */
html[data-theme="red"] [data-k="A"] .strip{background:repeating-linear-gradient(45deg,var(--k) 0 4px,transparent 4px 8px)}
/* Rotlicht, große Bilder: Kopf ruhig und lesbar, Aufbau nur als schraffierte Linie unten */
html[data-theme="red"] .bighead[data-k="A"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(45deg,var(--k) 0 4px,transparent 4px 8px)}
html[data-theme="red"] .bighead[data-k="E"]{box-shadow:inset 0 -6px 0 var(--k)}
.card .hit{all:unset;cursor:pointer;display:flex;flex:1;min-width:0;gap:12px;padding:12px 12px 12px 12px}
.card .hit:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.card.sel{border-color:var(--k);background:color-mix(in srgb,var(--k) 7%,var(--surf))}
.card .thumbs{display:flex;gap:6px;flex:none}
.card .th{width:72px;height:72px;border-radius:9px;background:var(--surf2);overflow:hidden;position:relative;flex:none}
.card .th img{width:100%;height:100%;object-fit:cover;filter:var(--photo-filter);opacity:0;transition:opacity .2s}
.card .th img.ok{opacity:1}
.card .th .more{position:absolute;inset:auto 4px 4px auto;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 5px;font-family:var(--mono)}
.card .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.kreis{font-family:var(--mono);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.02em;word-break:break-word;color:var(--text)}
.kreis small{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin-right:6px;font-family:var(--font)}
.kreis.none{font-size:18px;color:var(--muted);font-weight:600}
/* Tag „ABTEILUNG · PHASE“: Aufbau umrandet, 2. Phase gefüllt, ohne Foto gestrichelt */
.tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  border:2px solid var(--k);background:transparent;color:var(--text);flex:none;white-space:nowrap}
.tag.A{--k:var(--da)} .tag.E{--k:var(--de);background:var(--de);color:var(--dei)} .tag.N{--k:var(--da);border-style:dashed}
@media (max-width:380px){.tag .td{display:none}.tag .ts{display:inline!important}}
.tag .ts{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:baseline;gap:5px;height:24px;padding:0 8px;border-radius:6px;background:var(--surf2);border:1px solid var(--line);font-size:13px;white-space:nowrap;max-width:100%;overflow:hidden}
.chip b{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip span{font-family:var(--mono);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.card .note{color:var(--text2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.card .chk{flex:none;width:64px;border:0;border-left:1px solid var(--line);background:var(--surf2);display:grid;place-items:center;color:var(--muted)}
.card .chk .box{width:34px;height:34px;border-radius:9px;border:2.5px solid currentColor;display:grid;place-items:center}
.card .chks{flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.card .chks .chk{flex:1;border-left:0;min-height:48px;gap:2px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card .chks .chk + .chk{border-top:1px solid var(--line)}
.card .chks .chk .box{width:28px;height:28px}
.card .chks .chk small{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.cards.grid .card .chks{flex-direction:row;border-left:0;border-top:1px solid var(--line)}
.cards.grid .card .chks .chk + .chk{border-top:0;border-left:1px solid var(--line)}
.card .chk[aria-checked="true"]{background:var(--ks);color:var(--k)}
.card .chk[aria-checked="true"] .box{background:var(--k);border-color:var(--k);color:var(--bg)}
/* Kreis-Spalte rechts: Nummer immer an derselben Stelle, unabhängig von Fotos und Text */
.card .kcol{flex:none;width:clamp(92px,24%,190px);display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:2px;padding-left:8px;border-left:1px dashed var(--line)}
.card .kcol small{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.card .kcol .kreis{font-size:clamp(20px,4.6vw,30px);overflow-wrap:anywhere}
.card .kcol .kreis.none{font-size:15px}
@media (max-width:520px){.cards:not(.grid):not(.big) .card .th:nth-child(2){display:none}.cards:not(.grid):not(.big) .card .th{width:64px;height:64px}}
.card.done .info,.card.done .kcol{opacity:.55}
.card .dup{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;color:var(--edit);background:var(--edit-soft);padding:2px 6px;border-radius:5px}
/* Großbild-Ansicht: alle Fotos groß; Kreis-Kopfzeile bleibt beim Scrollen oben stehen */
.cards.big{gap:34px}
/* Rahmen links/rechts/unten in Kategoriefarbe; oben schließt die Kopfzeile bündig ab */
.cards.big .card{overflow:visible;border:2px solid color-mix(in srgb,var(--k) 75%,transparent);border-top:0;border-radius:var(--r);flex-direction:column;background:var(--surf)}
.cards.big .card[data-k="E"]{background:color-mix(in srgb,var(--de) var(--e-tint),var(--surf))}
.cards.big .card .hit{width:100%;box-sizing:border-box;min-width:0}
.cards.big .card .thumbs{min-width:0;width:100%}
.cards.big .card .th{min-width:0;overflow:hidden}
.cards.big .card .th img{display:block;width:100%;height:100%;object-fit:cover}
.cards.big .card .strip{display:none}
.cards.big .card .kcol{display:none}
.cards.big .card .info .tag{display:none}
.cards.big .card .info:not(:has(.chips)):not(:has(.note)){display:none}
.bighead{position:sticky;top:calc(var(--stickytop, 120px) - 1px);z-index:5;display:flex;align-items:center;gap:12px;
  width:calc(100% + 4px);margin:0 -2px;box-sizing:border-box;
  min-height:58px;padding:6px 16px;border:0;border-radius:0;
  /* Aufbau: dunkler Kopf mit heller Schrift · 2. Phase: heller Kopf mit dunkler Schrift (ab 2.4.4) */
  background:color-mix(in srgb,var(--k) 86%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  color:var(--text);text-align:left;box-shadow:0 6px 14px -8px rgba(0,0,0,.7);border-radius:var(--r) var(--r) 0 0}
.bighead .tag{background:rgba(0,0,0,.22);color:inherit;border-color:transparent}
.bighead .bk{flex:1;min-width:0;font-family:var(--mono);font-weight:800;font-size:clamp(24px,6.5vw,34px);line-height:1.05;overflow-wrap:anywhere;display:flex;align-items:baseline;gap:8px}
.bighead .bk small{font-family:var(--font);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.bighead .bn{font-family:var(--mono);font-size:13px;font-weight:700;opacity:.75;white-space:nowrap}
.card[data-k] .bighead{color:var(--ki)}
html[data-theme="red"] .bighead,html[data-theme="red"] .card[data-k] .bighead{background:var(--surf3);color:var(--text);-webkit-backdrop-filter:none;backdrop-filter:none}
html[data-theme="red"] .bighead .tag{border-color:var(--line2);background:transparent}
.cards.big .card .hit{flex-wrap:wrap;padding:12px;gap:12px}
.cards.big .card .thumbs{flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.cards.big .card .th{width:100%;height:auto;aspect-ratio:1;border-radius:12px}
.cards.big .card .th .plbl{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px}
.cards.big .card .note{-webkit-line-clamp:unset;font-size:15px}
.cards.big .card .kcol .kreis{font-size:clamp(26px,6vw,40px)}
.cards.big .card .chk{width:76px}
/* Kachelansicht */
.cards.grid .card{flex-direction:column;min-height:0}
.cards.grid .card .strip{width:auto;height:6px}
.cards.grid .card .hit{flex-direction:column;padding:0;gap:0}
.cards.grid .card .thumbs{display:block;position:relative}
.cards.grid .card .th{width:100%;height:auto;aspect-ratio:1;border-radius:0}
.cards.grid .card .th:not(:first-child){display:none}
.cards.grid .card .info{padding:10px 10px 12px}
.cards.grid .card .kcol{order:-1;width:auto;align-items:flex-start;text-align:left;border-left:0;padding:10px 10px 0}
.cards.grid .card .thumbs{order:-2}
.cards.grid .card .kreis{font-size:24px}
.cards.grid .card .note{-webkit-line-clamp:1;font-size:13px}
.cards.grid .card .chk{width:auto;height:52px;border-left:0;border-top:1px solid var(--line)}
.sentinel{height:40px}
.bhint{display:flex;align-items:center;gap:8px;margin:18px 2px -6px;padding:8px 12px;border-radius:var(--r-sm);background:var(--surf);border:1px solid var(--line);color:var(--text2);font-size:13px;font-weight:600}
.listfoot{text-align:center;color:var(--muted);font-size:13px;padding:24px 0}

/* Einrichtung & Züge */
.setup{margin:4px 0 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surf);overflow:hidden}
.setup.has-allg{border:2px solid var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.setup .hint{color:var(--pink);display:inline-flex}
.setup + .setup{margin-top:10px}
.setup>summary [data-setup-edit] + [data-setup-edit]{margin-left:-2px}
.ablsec{display:grid;gap:6px}.ablsec.ed{gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surf)}
.ablh{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--da)}
ol.abl{margin:0;padding-left:26px;display:grid;gap:2px}
ol.abl li{color:var(--text);font-size:15px;padding:4px 0}
ol.abl li::marker{font-weight:800;color:var(--muted)}
ol.abl li .ar{display:flex;align-items:center;gap:8px;min-height:var(--tap)}
ol.abl li .at{white-space:pre-wrap;flex:1;min-width:0}
ol.abl li .btn.icon{flex:none;width:var(--tap);height:var(--tap)}
.ssubd>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:var(--tap);margin:0}
.ssubd>summary::-webkit-details-marker{display:none}
.ssubd>summary .chev{transition:transform .2s}
.ssubd[open]>summary .chev{transform:rotate(90deg)}
.ssubd>summary .n{font-family:var(--mono);color:var(--text2)}
.alink{display:inline-flex;align-items:center;gap:4px;margin-left:8px;min-height:32px;padding:0 8px;border-radius:8px;border:1px solid var(--line2);background:var(--surf2);color:var(--text2);font-size:13px;font-weight:600}
.astep .arow{display:flex;gap:8px;align-items:center}
.poseb{grid-column:1/-1;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.zcard .zn .tag{margin-left:4px}
/* Vorstellungs-Checkliste */
.runhead{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.runtools{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.runall{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-top:14px;font-size:16px}
.runsec{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surf);padding:10px 12px 12px;border-left:5px solid var(--da)}
.runsh{display:flex;align-items:center;gap:10px}.runsh h3{margin:0;font-size:16px;flex:1}
.rung{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 2px 4px}
.runrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.runchk{flex:1 1 260px;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surf2);text-align:left;margin-top:6px;flex-wrap:wrap}
.runchk .box{width:34px;height:34px;flex:none;border-radius:9px;border:2.5px solid var(--da);display:grid;place-items:center}
.runchk .rt{flex:1;min-width:0;font-size:16px;white-space:pre-wrap}
.runchk .rm{font-family:var(--mono);font-size:12px;color:var(--muted);flex:none}
.runrow.ok .runchk{background:color-mix(in srgb,var(--ok) 12%,var(--surf2));border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.runrow.ok .runchk .box{background:var(--ok);border-color:var(--ok);color:#002b14}
.runrow.ok .rt{color:var(--text2)}
.setup>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 10px 0 14px}
.setup>summary::-webkit-details-marker{display:none}
.setup>summary h3{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);flex:1}
.setup>summary .sum{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;margin-left:8px}
.setup>summary .chev{transition:transform .2s;color:var(--muted)}
.setup[open]>summary .chev{transform:rotate(90deg)}
.setup[open]>summary{border-bottom:1px solid var(--line)}
.setup .sbody{padding:12px 14px 14px;display:grid;gap:12px}
.ssub{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px}
.ssub:first-child{margin-top:0}
.setup.run{border:2px solid var(--line2)}
.setup.run .hint.run{color:var(--text2)}
.setup.run .runsec{margin-top:4px}
.ztab{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surf2)}
.zr{display:grid;grid-template-columns:minmax(96px,1fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.6fr);gap:4px 14px;padding:9px 12px;align-items:baseline;font-size:15px}
.zr + .zr{border-top:1px solid var(--line)}
.zr.zhead{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:7px;padding-bottom:7px;background:var(--surf3)}
.zr .zn{font-family:var(--mono);font-weight:800;font-size:17px;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.zr .zb{white-space:pre-wrap;color:var(--text2)}
@media (max-width:640px){
  .zr{grid-template-columns:1fr 1fr}
  .zr.zhead{display:none}
  .zr .zn{grid-column:1/-1}
  .zr .zb{grid-column:1/-1}
  .zr>span[data-l]::before{content:attr(data-l);display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
}
.setup .allg{white-space:pre-wrap;font-size:15px;color:var(--text);background:var(--surf2);border-radius:var(--r-sm);padding:10px 12px;border-left:4px solid var(--text2)}
.setup .allg.empty{color:var(--muted);border-left-color:var(--line2)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.zcard{background:var(--surf2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;min-height:72px}
.zcard .zn{font-family:var(--mono);font-weight:800;font-size:20px;display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;overflow-wrap:anywhere}
.zcard .zn small{font-family:var(--font);font-size:12px;font-weight:600;color:var(--muted)}
.zcard .zl{font-size:14px;color:var(--text2);margin-top:4px;white-space:pre-wrap}
.zcard .zl b{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.zcard.empty .zn{color:var(--muted)}
.zed{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);padding:12px;display:grid;gap:10px}
.zed .zh{display:flex;align-items:center;gap:10px}
.zed .zh .zname{font-family:var(--mono);font-weight:800;font-size:20px;flex:1}
.zed .zh input.zname{height:48px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surf2);padding:0 12px}
.zed .zrow{display:grid;grid-template-columns:1fr 2fr;gap:10px}
@media (max-width:600px){.zed .zrow{grid-template-columns:1fr}}

/* Detail */
.detail{padding:18px 22px calc(var(--sab) + 120px)}
.detail .dh{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.detail .dh .kreis{font-size:44px}
.detail .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.fieldbox{background:var(--surf);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;min-height:58px}
.fieldbox b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fieldbox span{display:block;font-family:var(--mono);font-size:18px;font-weight:700;word-break:break-word}
.fieldbox.wide{grid-column:1/-1}
.fieldbox.wide span{font-family:var(--font);font-weight:500;font-size:16px;white-space:pre-wrap}
.kat{margin-top:18px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.kat .kh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--ks);border-bottom:3px solid var(--k)}
.kat .kh h3{margin:0;font-size:15px;letter-spacing:.06em;text-transform:uppercase;flex:1}
.kat .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:10px;background:var(--surf)}
.kat .photos button{all:unset;cursor:zoom-in;position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surf2)}
.kat .photos button:focus-visible{outline:3px solid var(--focus)}
.kat .photos img{width:100%;height:100%;object-fit:cover;filter:var(--photo-filter);opacity:0;transition:opacity .2s}
.kat .photos img.ok{opacity:1}
.kat .photos .lbl{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.04em}
.kat .nophotos{padding:16px;color:var(--muted);background:var(--surf);font-size:14px}
.detail .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.detail-empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:40px}

/* FAB-Leiste */
.fabbar{position:fixed;z-index:35;right:calc(var(--sar) + 18px);bottom:calc(var(--sab) + 18px);display:flex;gap:12px;align-items:center}
.fab{height:64px;min-width:64px;border-radius:20px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 22px;
  font-weight:700;font-size:16px;box-shadow:var(--shadow);background:var(--text);color:var(--bg)}
/* Kamera-Knopf: eigene Klasse – „.cam“ ist die Vollbild-Kamera (position:fixed) und hat den Knopf früher nach oben links verschoben */
.fab.qcam{background:var(--surf3);color:var(--text);border:1px solid var(--line2);padding:0;width:64px}
.fab.dept{background:var(--da);color:var(--dai)}
.fabbar.multi .fab:not(.qcam){padding:0 18px}
@media (max-width:620px){.fabbar.multi{flex-direction:column-reverse;align-items:flex-end;gap:10px}
  .fabbar.multi .fab:not(.qcam){height:54px;min-width:112px;justify-content:flex-start}}
@media (max-width:560px){.setup>summary .sum{display:none}.setup>summary [data-setup-edit] .bl{display:none}.setup>summary [data-setup-edit]{width:var(--tap);padding:0}}
.split.multi .listpane{padding-bottom:calc(var(--sab) + 140px)}
@media (max-width:620px){.split.multi .listpane{padding-bottom:calc(var(--sab) + 300px)}}
.fab:active{transform:scale(.96)}

/* ---------- Overlays: Sheet, Dialog, Toast ---------- */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;
  animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.sheet{background:var(--bg2);width:100%;max-width:820px;max-height:calc(var(--vh)*100 - var(--sat) - 12px);max-height:calc(100dvh - var(--sat) - 12px);
  border-radius:var(--r-lg) var(--r-lg) 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .22s ease;border:1px solid var(--line);border-bottom:0}
.sheet.full{max-width:none;height:calc(var(--vh)*100);height:100dvh;max-height:none;border-radius:0;border:0}
@media (min-width:900px){.scrim.center{align-items:center}.scrim.center .sheet{border-radius:var(--r-lg);border-bottom:1px solid var(--line);max-height:88dvh}
  .sheet.full{max-width:980px;height:calc(100dvh - 40px);border-radius:var(--r-lg);border:1px solid var(--line)}
  .scrim.fullwrap{align-items:center}}
.sheet-h{display:flex;align-items:center;gap:8px;padding:calc(10px) 12px 10px 12px;border-bottom:1px solid var(--line);flex:none}
.sheet.full .sheet-h{padding-top:calc(var(--sat) + 8px);padding-left:calc(var(--sal) + 12px);padding-right:calc(var(--sar) + 12px)}
@media (min-width:900px){.sheet.full .sheet-h{padding-top:10px}}
.sheet-h h2{flex:1;margin:0;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px calc(var(--sar) + 18px) 16px calc(var(--sal) + 18px);overscroll-behavior:contain}
/* Tastatur offen (iPad/iPhone): Das Blatt behält seine Größe. Nur der Inhalt bekommt unten Platz in Tastaturhöhe,
   damit auch das letzte Feld über die Tastatur gescrollt werden kann (siehe Kb). */
html.kb-open .sheet-b{padding-bottom:calc(var(--kb, 0px) + 32px)}
.sheet-b textarea{overflow-y:hidden}
.sheet-f{flex:none;display:flex;gap:10px;padding:12px calc(var(--sar) + 16px) calc(var(--sab) + 12px) calc(var(--sal) + 16px);border-top:1px solid var(--line);background:var(--bg2)}
.dialog{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-lg);width:min(460px,calc(100% - 32px));margin:auto;padding:22px 20px 16px;box-shadow:var(--shadow);animation:pop .18s ease}
.scrim.dlg{align-items:center;z-index:450}
.dialog h2{margin:0 0 8px;font-size:20px}
.dialog p{margin:0 0 14px;color:var(--text2);white-space:pre-line}
.dialog .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.dialog .btns.row{flex-direction:row;justify-content:flex-end;flex-wrap:wrap}
.dialog .btns.row .btn{flex:1}
.dialog input.txt{width:100%;height:52px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surf);padding:0 14px;font-size:17px;outline:none}
.dialog input.txt:focus{border-color:var(--focus)}
.toasts{position:fixed;z-index:400;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 96px);display:flex;flex-direction:column;gap:8px;width:min(520px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--text);color:var(--bg);border-radius:var(--r);padding:12px 14px 12px 16px;font-weight:600;font-size:15px;box-shadow:var(--shadow);animation:up .2s ease}
.toast.err{background:var(--danger);color:#fff}
.toast.warn{background:var(--edit);color:#1a0a00}
.toast .t{flex:1}
.toast button{border:0;background:rgba(0,0,0,.15);color:inherit;font-weight:700;border-radius:8px;min-height:40px;padding:0 12px}
html[data-theme="red"] .toast{background:#2a0606;color:var(--text);border:1px solid var(--line2)}

/* Formular (Editor) */
.form{display:grid;gap:14px}
.f-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.f-row.ka{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.f-row.gf{grid-template-columns:1fr 1fr}
.f-row.ka .f.kreisf{grid-column:auto}
.f-row.ka .f:not(.kreisf) input{height:60px;font-size:18px}
.f .req{display:none;color:var(--pink);font-size:14px;font-weight:600;margin:6px 2px 0}
.f.invalid .req{display:block}.f.invalid input{border-color:var(--pink);box-shadow:0 0 0 3px var(--pink-soft)}
.f .fh{font-size:12px;color:var(--muted);margin:4px 2px 0}
.f .swrow{display:flex;align-items:center;gap:12px;min-height:52px}
.f-row.one{grid-template-columns:1fr}
.f select{-webkit-appearance:none;appearance:none;padding-right:40px!important;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.f .zugsel{font-family:var(--mono);font-size:20px;font-weight:800;height:60px}
.zuginfo{font-size:13px;margin:6px 2px 0;min-height:4px}
.f-row.gf + .qkeys{margin-top:-6px}
@media (max-width:600px){.f-row{grid-template-columns:1fr 1fr}.f-row.ka{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:8px}.f-row.ka .plusbtn{width:52px}}
.f label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 2px}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line2);background:var(--surf);border-radius:var(--r-sm);padding:0 14px;height:52px;font-size:17px;outline:none;transition:border-color .15s}
.f textarea{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.45}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--edit);box-shadow:0 0 0 3px var(--edit-soft)}
.f.kreisf input{font-family:var(--mono);font-size:26px;font-weight:800;height:60px;letter-spacing:-.01em}
.inwrap{position:relative;display:flex;gap:8px}
.inwrap input{flex:1}
.plusbtn{flex:none;width:60px;height:60px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surf2);font-size:26px;font-weight:700;font-family:var(--mono)}
.f.mono input{font-family:var(--mono);font-weight:700}
/* Feldnamen und Platzhalter immer in der normalen Schrift – in allen Abteilungen gleich */
.f.mono label{font-family:var(--font);letter-spacing:.08em}
.f input::placeholder,.f textarea::placeholder{font-family:var(--font);font-weight:400;letter-spacing:0}
/* Filter-Schnelltasten */
.qkeys{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.qkeys button{min-height:44px;min-width:56px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surf2);font-family:var(--mono);font-weight:700;font-size:15px}
.qkeys button[aria-pressed="true"]{background:var(--edit);border-color:var(--edit);color:#1a0a00}
.qkeys button.used{border-style:dashed}
.qkeys .qclr{font-family:var(--font);font-weight:600;color:var(--muted)}
details.more{border:1px solid var(--line);border-radius:var(--r);background:var(--surf)}
details.more summary{list-style:none;cursor:pointer;min-height:var(--tap);display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:600;color:var(--text2)}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{border-bottom:1px solid var(--line)}
details.more summary .chev{transition:transform .2s;margin-left:auto}
details.more[open] summary .chev{transform:rotate(90deg)}
details.more .inner{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){details.more .inner{grid-template-columns:1fr}}
.pk{border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:var(--surf)}
.pk .ph{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;background:var(--ks);border-bottom:3px solid var(--k)}
.pk .ph h3{margin:0;font-size:14px;letter-spacing:.08em;text-transform:uppercase;flex:1}
.pk .ph .n{font-family:var(--mono);font-size:13px;color:var(--text2)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;padding:12px}
.slot{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surf2);border:0;padding:0}
.slot img{width:100%;height:100%;object-fit:cover;filter:var(--photo-filter)}
.slot:not(.add){box-shadow:inset 0 0 0 4px var(--k)}
.slot:not(.add) img{padding:4px;border-radius:12px}
.slot .lbl{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.slot .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:700}
.slot.add{border:2px dashed var(--line2);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text2);font-weight:700;font-size:14px}
.slot.add:hover{border-color:var(--k);color:var(--k)}
.slot.add .hint{font-weight:500;font-size:12px;color:var(--muted)}
.slot.add .plus{width:46px;height:46px;border-radius:50%;background:var(--k);color:var(--ki);display:grid;place-items:center}
/* Editor-Kopf in Abteilungsfarbe */
.sheet[data-abt] > .sheet-h{border-bottom:3px solid var(--da)}
.sheet-h [data-x=cancel] svg,.sheet-h [data-act=cancel] svg{display:none}
@media (max-width:480px){.sheet-h [data-x=cancel] .cl,.sheet-h [data-act=cancel] .cl{display:none}.sheet-h [data-x=cancel] svg,.sheet-h [data-act=cancel] svg{display:block}
  .sheet-h [data-x=cancel],.sheet-h [data-act=cancel]{padding:0;width:var(--tap)}
  .sheet[data-abt] .sheet-h h2{font-size:15px}.sheet[data-abt] .sheet-h{gap:6px}.sheet[data-abt] .sheet-h .savebtn{padding:0 12px}}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.savebtn .spinner{width:18px;height:18px;border-color:rgba(0,0,0,.25);border-top-color:currentColor}

/* Listen (Einstellungen, Menüs) */
.group{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:18px}
.group h3{margin:0;padding:12px 16px 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.group h3 + .item{border-top:0}
button.item:hover{background:var(--surf2)}
.item .lb{flex:1;min-width:0}
.item .lb small{display:block;color:var(--muted);font-size:13px}
.item.danger{color:var(--danger)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;padding:12px 16px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono);word-break:break-all}
.log{font-family:var(--mono);font-size:12px;padding:8px 16px 14px;color:var(--text2);max-height:260px;overflow:auto}
.log div{padding:4px 0;border-bottom:1px dashed var(--line)}
.range{width:100%;accent-color:var(--text)}
.switch{position:relative;width:52px;height:32px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--surf3);border:1px solid var(--line2);transition:background .2s}
.switch span::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:var(--text);top:3px;left:3px;transition:transform .2s}
.switch input:checked + span{background:var(--ok)}
.switch input:checked + span::after{transform:translateX(20px);background:#fff}
.switch input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}

/* Kamera */
.cam{position:fixed;inset:0;z-index:200;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 68px) var(--sar) calc(var(--sab) + 8px) var(--sal)}
.cam .top{position:absolute;top:calc(var(--sat) + 8px);left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);display:flex;align-items:center;gap:8px;z-index:2}
.cam .top .ttl{flex:1;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam .vf{--kc:#c4352b;position:relative;width:min(100vw,calc(var(--vh)*100 - 340px));width:min(100vw,calc(100dvh - 340px));aspect-ratio:1;background:#111;overflow:hidden;border-radius:8px;
  border:6px solid var(--kc);transition:border-color .15s}
.cam .camname{font-size:12px;color:#ccc;text-align:center;min-height:16px;margin-top:6px}
.cam .camsys{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px}
.cam .camsys .tbtn{min-height:40px;font-size:13px}
.cam .camhint{font-size:12px;color:#bbb;text-align:center;padding:0 16px}
.cam .camhint:empty{display:none}
.cam .camlist{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:560px;padding:4px 12px}
.cam .camlist button{border:0;min-height:40px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:600}
.cam .camlist button[aria-pressed="true"]{background:#fff;color:#000}
.cam .vf video{width:100%;height:100%;object-fit:cover}
.cam .vf .grid3{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.22) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.22) 66.6%,transparent 66.8%),
  linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.22) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.22) 66.6%,transparent 66.8%)}
.cam .vf .hintlbl{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:8px;font-weight:700;font-size:13px}
.cam .vf .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.cam .vf .flash.go{animation:flash .25s ease}
@keyframes flash{30%{opacity:.6}}
.cam .ctrl{display:flex;align-items:center;justify-content:space-between;width:min(560px,100%);padding:18px 24px 6px;gap:12px}
.cam .shutter{width:84px;height:84px;border-radius:50%;border:5px solid #fff;background:#fff;box-shadow:inset 0 0 0 4px #000}
.cam .shutter:active{transform:scale(.94)}
.cam .cbtn{width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.cam .cbtn[aria-pressed="true"]{background:#ffcc33;color:#000}
.cam .strip{display:flex;gap:6px;height:56px;align-items:center;overflow-x:auto;max-width:100%;padding:0 12px}
.cam .strip img{width:48px;height:48px;border-radius:6px;object-fit:cover;border:3px solid #888;flex:none}
.cam .katsw{display:flex;gap:6px;margin-top:4px}
.cam .katsw button{border:0;min-height:44px;padding:0 16px;border-radius:999px;font-weight:700;background:rgba(255,255,255,.14);color:#fff}
.cam .katsw button[aria-pressed="true"]{background:var(--kc);color:var(--kci,#fff)}
.cam .msg{max-width:420px;text-align:center;padding:20px;color:#ddd}
.cam .tbtn{border:0;background:rgba(255,255,255,.16);color:#fff;min-height:48px;padding:0 16px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.cam .tbtn.done{background:#fff;color:#000}

/* Lightbox */
.lbx{position:fixed;inset:0;z-index:250;background:#000;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.lbx .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lbx .stage img{max-width:100%;max-height:100%;width:auto;height:auto;transform-origin:0 0;will-change:transform;filter:var(--photo-filter);pointer-events:none}
.lbx .bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 10px calc(var(--sal) + 10px);
  background:linear-gradient(rgba(0,0,0,.75),transparent);transition:opacity .2s}
.lbx .bar .pos{flex:1;text-align:center;font-family:var(--mono);font-weight:700}
.lbx .lbtn{width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.lbx .infos{position:absolute;left:0;right:0;bottom:0;padding:24px calc(var(--sar) + 18px) calc(var(--sab) + 18px) calc(var(--sal) + 18px);
  background:linear-gradient(transparent,rgba(0,0,0,.88) 34%);transition:opacity .2s}
.lbx .infos .row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lbx .infos .kreis{color:#fff;font-size:44px}
.lbx .tag{color:#fff} .lbx .tag.E{color:var(--dei)}
.lbx .infos .chips .chip{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);height:30px;font-size:15px}
.lbx .infos .chips .chip b{color:#bbb}
.lbx .infos .note{margin-top:8px;font-size:18px;line-height:1.4;white-space:pre-wrap;max-height:30vh;overflow:auto}
.lbx .infos{background:rgba(0,0,0,.92)!important;border-top:1px solid rgba(255,255,255,.12)}
.lbx .infos .note{max-height:22vh}
.lbx .infos{max-height:42%;overflow:auto;padding-bottom:calc(var(--sab) + 76px)}
.lbx .nextk{position:absolute;z-index:3;right:calc(var(--sar) + 14px);bottom:calc(var(--sab) + 14px);display:inline-flex;align-items:center;gap:8px;
  min-height:52px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:16px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lbx .nextk:active{background:rgba(255,255,255,.3)}
.lbx .nav{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:56px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center}
.lbx .nav.prev{left:calc(var(--sal) + 10px)} .lbx .nav.next{right:calc(var(--sar) + 10px)}
.lbx .nav{width:64px;height:64px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);z-index:2}
.lbx .nav svg{width:30px;height:30px}
.lbx .nav:disabled{opacity:.25}

/* Annotation */
.ann{position:fixed;inset:0;z-index:260;background:#000;display:flex;flex-direction:column;color:#fff}
.ann .abar{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 8px calc(var(--sal) + 10px);flex-wrap:wrap}
.ann .abar .sp{flex:1}
.ann .canvaswrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px}
.ann canvas{max-width:100%;max-height:100%;touch-action:none;background:#222}
.ann .tools{display:flex;gap:8px;justify-content:center;padding:8px 10px calc(var(--sab) + 12px);flex-wrap:wrap}
.ann .tools button{min-width:56px;min-height:52px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
.ann .tools button[aria-pressed="true"]{background:#fff;color:#000}
.ann .tools .col{width:52px;padding:0}
.ann .tools .col i{width:24px;height:24px;border-radius:50%;display:block;border:2px solid #fff}

/* Sync */

  fail(msg) { if (!this.started) this.show('<h3 style="margin:0 0 8px">Doku VT konnte nicht starten</h3><p>Bitte „Neu laden“ tippen. Hilft das nicht, diese Meldung (Bildschirmfoto) weitergeben:</p><pre style="white-space:pre-wrap;background:#1a1f27;padding:12px;border-radius:10px;font-size:13px">' + String(msg).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) + '</pre><p style="color:#9aa4b2;font-size:14px">Deine Daten sind davon nicht betroffen.</p>'); }
};
window.addEventListener('error', function (e) { Boot.fail((e.message || 'Fehler') + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : '')); });

/** Wert des Hauptfelds (Kreis / Kanal / Zug). Bühne: aktueller Name des Zugs aus der Zugliste. */

/** Hauptfeld vergleichen: erst reine Nummern (numerisch, „123+124“ nach 123), dann Namen nach Wort und Nummer
    (Ton: 1, 2, 11 … dann Aux 1, Aux 2 … dann Video 1 …), leere zuletzt */
function mainCmp(a, b) {

  if (!a !== !b) return a ? -1 : 1;
  const da = /^\d/.test(a), db = /^\d/.test(b);

  if (!da) { const pa = a.replace(/[\s\d].*$/, '').toLowerCase(), pb = b.replace(/[\s\d].*$/, '').toLowerCase(); if (pa !== pb) return pa.localeCompare(pb, 'de'); }
  return Utils.cmpKreis(a, b);
}

/** Felder für Info-Chips: zuerst die Chips der Abteilung, dann alle weiteren ausgefüllten (ohne Hauptfeld/Bemerkung) */

/* =====================================================================
   Utils – kleine Helfer ohne Zustand
   ===================================================================== */
const Utils = {
  uuid() {
    if (globalThis.crypto && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) { /* unsicherer Kontext */ } }
    const b = new Uint8Array(16);
    (globalThis.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => { b[i] = Math.random() * 256 | 0; });
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
    return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
  },
  esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  /** Kreis-Eingabe normalisieren: Leerzeichen, Komma, Semikolon → „+“ */
  normKreis(s) {
    return String(s ?? '').trim().replace(/\s*[,;]\s*|\s*\+\s*|\s+/g, '+').replace(/\++/g, '+').replace(/^\+|\+$/g, '');
  },
  kreisTokens(s) { return Utils.normKreis(s).toLowerCase().split('+').filter(Boolean); },
  /** Gleiche Kreis-Menge (Reihenfolge egal): „123+124“ == „124+123“ */
  kreisEq(a, b) {
    const ta = Utils.kreisTokens(a).sort().join('+'), tb = Utils.kreisTokens(b).sort().join('+');
    return ta !== '' && ta === tb;
  },
  /** Numerischer Sortierschlüssel: erste Zahl im Feld („123+124“ → 123) */
  numKey(s) {
    const m = String(s ?? '').match(/\d+(?:[.,]\d+)?/);
    return m ? parseFloat(m[0].replace(',', '.')) : Number.POSITIVE_INFINITY;
  },
  cmpKreis(a, b) {
    const na = Utils.numKey(a), nb = Utils.numKey(b);
    if (na !== nb) return na - nb;
    return String(a ?? '').localeCompare(String(b ?? ''), 'de', { numeric: true });
  },
  fmtDate(ts, withTime = true) {
    if (!ts) return '–';
    const d = new Date(ts);
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
      (withTime ? ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '');
  },
  fmtAgo(ts) {
    if (!ts) return 'nie';
    const s = Math.round((Date.now() - ts) / 1000);
    if (s < 60) return 'gerade eben';
    if (s < 3600) return `vor ${Math.round(s / 60)} Min.`;
    if (s < 86400) return `vor ${Math.round(s / 3600)} Std.`;
    return Utils.fmtDate(ts, false);
  },
  fmtBytes(n) {
    if (!isFinite(n)) return '–';
    const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return `${n.toFixed(i ? 1 : 0).replace('.', ',')} ${u[i]}`;
  },
  debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; },
  sleep: ms => new Promise(r => setTimeout(r, ms)),
  frame: () => new Promise(r => requestAnimationFrame(() => r())),
  clone: o => (o == null ? o : JSON.parse(JSON.stringify(o))),
  /** ArrayBuffer → Base64 (in Blöcken, damit große Fotos den Stack nicht sprengen) */
  bufToB64(buf) {
    const u = new Uint8Array(buf); let s = '';
    for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  },
  b64ToBuf(b64) {
    const s = atob(b64); const u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    return u.buffer;
  },
  b64url(b64) { return b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  unb64url(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return s; },
  async deflate(text) {
    const data = new TextEncoder().encode(text);
    if (!globalThis.CompressionStream) return { z: false, buf: data.buffer };
    const cs = new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return { z: true, buf: await new Response(cs).arrayBuffer() };
  },
  async inflate(buf, z) {
    if (!z) return new TextDecoder().decode(buf);
    if (!globalThis.DecompressionStream) throw new Error('Dieses Gerät kann komprimierte Codes nicht lesen.');
    const ds = new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new TextDecoder().decode(await new Response(ds).arrayBuffer());
  },
  safeName(s) { return String(s || 'Doku VT').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_').slice(0, 60) || 'Doku VT'; },
  stamp() { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; },
  /** Datei herunterladen (funktioniert auch in iOS-Safari ab 13) */
  download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  },
  /** Datei über das System-Teilen-Menü (AirDrop, Nearby Share …), sonst Download.
      Ergebnis: 'shared' | 'abort' | 'download' */
  async shareFile(blob, name, title) {
    const file = new File([blob], name, { type: blob.type || 'application/octet-stream' });
    if (navigator.canShare && navigator.share) {
      let ok = false;
      try { ok = navigator.canShare({ files: [file] }); } catch (e) { ok = false; }
      if (ok) {
        try { await navigator.share({ files: [file], title: title || name }); return 'shared'; }
        catch (e) {
          if (e && e.name === 'AbortError') return 'abort';
          console.warn('Teilen fehlgeschlagen, lade herunter', e);
        }
      }
    }
    Utils.download(blob, name);
    return 'download';
  },
  /** Fertige Datei anbieten: Dialog mit „Teilen“ / „Sichern“.
      Teilen wird direkt im Tipp-Handler gestartet – Safari erlaubt navigator.share
      nur unmittelbar nach einer Berührung. Nach einer längeren Berechnung (PDF, Backup)
      ist diese Erlaubnis abgelaufen; deshalb ein zweiter, frischer Tipp.
      Ergebnis: 'shared' | 'download' | 'abort' */
  offerFile(blob, name, title, info = '') {
    return new Promise(resolve => {
      const file = new File([blob], name, { type: blob.type || 'application/octet-stream' });
      let canShare = false;
      try { canShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { canShare = false; }
      const scrim = document.createElement('div'); scrim.className = 'scrim dlg';
      scrim.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="ofT">
        <h2 id="ofT">${Utils.esc(title)}</h2><p>${Utils.esc(name)}\n${Utils.fmtBytes(blob.size)}${info ? '\n' + Utils.esc(info) : ''}</p>
        <div class="btns">${canShare ? `<button class="btn big primary" data-o="share">${I('share')} Teilen (AirDrop, Mail, Dateien …)</button>` : ''}
          <button class="btn big ${canShare ? '' : 'primary'}" data-o="dl">${I('download')} ${Utils.isIOS() ? 'Öffnen / Sichern' : 'Herunterladen'}</button>
          <button class="btn big ghost" data-o="x">Schließen</button></div></div>`;
      let done = false;
      const finish = v => { if (done) return; done = true; L.close(); resolve(v); };
      scrim.addEventListener('click', e => {
        const b = e.target.closest('[data-o]');
        if (!b) { if (e.target === scrim) finish('abort'); return; }
        const o = b.dataset.o;
        if (o === 'x') finish('abort');
        else if (o === 'dl') { Utils.download(blob, name); finish('download'); }
        else if (o === 'share') {
          // synchron im Klick aufrufen (Nutzergeste bleibt gültig)
          let p;
          try { p = navigator.share({ files: [file], title }); } catch (err) { p = Promise.reject(err); }
          p.then(() => finish('shared'), err => {
            if (err && err.name === 'AbortError') return;          // Nutzer hat das Teilen-Menü geschlossen – Dialog bleibt offen
            Ui.toast('Teilen nicht möglich – bitte „' + (Utils.isIOS() ? 'Öffnen / Sichern' : 'Herunterladen') + '“ verwenden.', 'warn');
          });
        }
      });
      const L = Ui.layer(scrim, { onBack: () => { done = true; resolve('abort'); return true; } });
      setTimeout(() => { const p = scrim.querySelector('.btn.primary'); p && p.focus(); }, 30);
    });
  },
  isIOS() { return /iP(ad|hone|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); },
  isEditable(el) { return !!el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable); }
};

/** Monotone Uhr: jeder Zeitstempel ist größer als der vorige (wichtig für Merge) */
const Clock = {
  last: 0,
  now() { const t = Math.max(Date.now(), this.last + 1); this.last = t; return t; },
  observe(t) { if (t > this.last && t < Date.now() + 864e5) this.last = t; }
};
