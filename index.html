      const anyEntries = Repo.entriesOf(st.showId).length;
      list.innerHTML = `<div class="empty"><div class="ico">${I(st.q ? 'search' : 'camera', 'lg')}</div>
        <h3>${st.q ? 'Nichts gefunden' : anyEntries ? 'Keine Einträge in dieser Kategorie' : 'Noch keine Einträge'}</h3>
        <p>${st.q ? `Kein Eintrag passt zu „${Utils.esc(st.q)}“.` : st.edit ? 'Mit der Kamera-Taste unten rechts geht es am schnellsten: Foto → Kreis eintippen → fertig.' : 'Zum Anlegen oben rechts in den Bearbeitungsmodus wechseln.'}</p>
        ${!st.q && !st.edit ? `<button class="btn edit big" data-act="mode">${I('edit')} Bearbeiten</button>` : ''}</div>`;
      return;
    }
    // Inkrementell zeichnen: je 60 Karten, weitere beim Scrollen
    const CH = 60; let shown = 0, lastSect = null;
    const grid = Settings.v.view === 'grid';
    list.innerHTML = '';
    const appendChunk = () => {
      let html = '', open = shown > 0;
      const end = Math.min(items.length, shown + CH);
      for (let i = shown; i < end; i++) {
        const it = items[i], sec = Views.sectionOf(it, sort);
        if (sec.key !== lastSect && (st.kat === 'all' || sort === 'gruppe')) {
          if (open) html += '</div>';
          const n = items.filter(x => Views.sectionOf(x, sort).key === sec.key).length;
          html += `<div class="sect">${sec.k ? `<span class="sw" style="background:var(--${sec.k === 'A' ? 'blue' : sec.k === 'E' ? 'yellow' : 'neutral'})"></span>` : ''}${Utils.esc(sec.label)} <span class="n">${n}</span></div><div class="cards ${grid ? 'grid' : ''}">`;
          open = true; lastSect = sec.key;
        } else if (!open) { html += `<div class="cards ${grid ? 'grid' : ''}">`; open = true; }
        html += Views.cardHtml(it, { sel: st.sel === it.key, checklist: st.checklist, dupKeys });
      }
      if (open) html += '</div>';
      // Fortsetzung in den letzten Karten-Container einfügen, wenn kein neuer Abschnitt beginnt
      const tmp = document.createElement('div'); tmp.innerHTML = html;
      const lastCards = list.querySelector('.cards:last-of-type');
      if (shown > 0 && tmp.firstElementChild && tmp.firstElementChild.classList.contains('cards') && lastCards) {
        lastCards.append(...tmp.firstElementChild.children); tmp.firstElementChild.remove();
      }
      const sent = list.querySelector('.sentinel'); if (sent) sent.remove();
      list.append(...tmp.childNodes);
      shown = end;
      if (shown < items.length) {
        const s = document.createElement('div'); s.className = 'sentinel'; list.appendChild(s);
        const io = new IntersectionObserver(en => { if (en[0].isIntersecting) { io.disconnect(); appendChunk(); } }, { rootMargin: '800px' }); io.observe(s);
      } else {
        const f = document.createElement('div'); f.className = 'listfoot';
        f.textContent = `${items.length} Karte${items.length === 1 ? '' : 'n'}${dupKeys.size ? ` · ${dupKeys.size} doppelte Kreis-Nummer(n) – über „⋯“ zusammenführen` : ''}`;
        list.appendChild(f);
      }
      Thumbs.observe(list);
    };
    appendChunk();
  },
  renderDetail() {
    const st = this.state, pane = document.querySelector('[data-detail]'); if (!pane) return;
    const id = st.sel && st.sel.split(':')[0], e = id && Repo.entry(id);
    if (!e || window.innerWidth < 900) { pane.innerHTML = ''; return; }
    pane.innerHTML = Views.detailHtml(e, st.edit, st.checklist);
    Thumbs.observe(pane);
  },
  /** Eintrag öffnen: breit → rechte Spalte, schmal → eigenes Blatt */
  selectEntry(entryId, kat) {
    const e = Repo.entry(entryId); if (!e) return;
    const k = kat || Repo.catsOf(entryId)[0];
    this.state.sel = entryId + ':' + k;
    if (window.innerWidth >= 900) { this.renderList(); this.renderDetail(); return; }
    this.renderList();
  },
  openDetailSheet(entryId) {
    const e = Repo.entry(entryId); if (!e) return;
    const sh = Ui.sheet({ title: e.f.kreis ? 'Kreis ' + e.f.kreis : 'Eintrag', full: true });
    const draw = () => { const cur = Repo.entry(entryId); if (!cur) { sh.close(); return; } sh.body.innerHTML = Views.detailHtml(cur, this.state.edit, this.state.checklist); sh.body.firstElementChild.style.padding = '0 0 40px'; Thumbs.observe(sh.body); };
    draw();
    const off = Repo.on(() => { if (sh.layer.closed) { off(); return; } draw(); });
    sh.body.addEventListener('click', ev => this.detailAction(ev, entryId, sh));
  },
  async detailAction(ev, entryId, sheet) {
    const b = ev.target.closest('[data-act]'); if (!b) return;
    const e = Repo.entry(entryId); if (!e) return;
    const a = b.dataset.act;
    if (a === 'dlb') this.openLightbox(entryId, b.dataset.k, +b.dataset.i);
    else if (a === 'dedit') { if (!this.state.edit) { this.state.edit = true; this.render(); } sheet && sheet.close(); setTimeout(() => Editor.open({ showId: e.showId, entryId }), sheet ? 60 : 0); }
    else if (a === 'dchk') { try { await Repo.toggleCheck(entryId, b.dataset.k); } catch (err) { this.error(err); } }
    else if (a === 'ddup') {
      const preset = {}; TEXT_FIELDS.forEach(k => { preset[k] = e.f[k]; }); preset.kreis = '';
      sheet && sheet.close();
      if (!this.state.edit) { this.state.edit = true; this.render(); }
      setTimeout(() => { Editor.open({ showId: e.showId, preset }); Ui.toast('Vorlage übernommen – bitte neue Kreis-Nummer eintragen'); }, sheet ? 60 : 0);
    } else if (a === 'ddel') {
      if (await Ui.confirm('Eintrag löschen?', `Kreis ${e.f.kreis || '(ohne Nummer)'} mit allen Fotos löschen?`, 'Löschen', true)) {
        try { await Repo.deleteEntry(entryId); this.state.sel = null; sheet && sheet.close(); Ui.toast('Eintrag gelöscht'); } catch (err) { this.error(err); }
      }
    }
  },
  openLightbox(entryId, kat, idx) {
    // Galerie über alle sichtbaren Karten – Wischen springt zum nächsten Kreis weiter
    const items = []; let start = 0;
    for (const it of this._items || []) {
      if (it.kat === 'N') continue;
      const ph = Repo.photosOf(it.entry.id, it.kat);
      ph.forEach((p, i) => { if (it.entry.id === entryId && it.kat === kat && i === idx) start = items.length; items.push({ b: p.b, entryId: it.entry.id, kat: it.kat, idx: i, n: ph.length }); });
    }
    if (!items.length) { const ph = Repo.photosOf(entryId, kat); ph.forEach((p, i) => items.push({ b: p.b, entryId, kat, idx: i, n: ph.length })); start = idx; }
    Lightbox.open(items, start);
  },

  /* ---------- Aktionen ---------- */
  async newShow() {
    try {
      const s = await Repo.createShow('Neue Veranstaltung');
      this.state.edit = true; this.go('#/show/' + s.id);
      const t = await Ui.prompt('Titel der Veranstaltung', s.f.titel, 'z. B. Die Zauberflöte');
      if (t != null && t.trim()) await Repo.patchShow(s.id, { titel: t.trim() });
    } catch (err) { this.error(err); }
  },
  async showMenu(id) {
    const s = Repo.show(id); if (!s) return;
    const dups = Repo.duplicatesOf(id).length;
    const v = await Ui.menu(s.f.titel, [
      { label: 'Titel & Details bearbeiten', value: 'edit', icon: 'edit' },
      { label: 'PDF exportieren', value: 'pdf', icon: 'pdf' },
      { label: 'Backup dieser Veranstaltung', value: 'backup', icon: 'database' },
      { label: 'Duplizieren', value: 'dup', icon: 'copy' },
      { label: 'Checkliste zurücksetzen', value: 'reset', icon: 'undo' },
      dups && { label: `${dups} doppelte Kreis-Nummer(n) zusammenführen`, value: 'merge', icon: 'merge' },
      { label: 'Veranstaltung löschen', value: 'del', icon: 'trash', danger: true }
    ]);
    try {
      if (v === 'edit') await this.editShow(id);
      else if (v === 'pdf') this.pdf(id);
      else if (v === 'backup') this.backup([id]);
      else if (v === 'dup') { const n = await Repo.duplicateShow(id); Ui.toast(`„${n.f.titel}“ angelegt`); }
      else if (v === 'reset') this.resetChecks(id);
      else if (v === 'merge') { const n = await Repo.mergeDuplicates(id); Ui.toast(`${n} Einträge zusammengeführt`); }
      else if (v === 'del') {
        const st = Repo.stats(id);
        if (await Ui.confirm('Veranstaltung löschen?', `„${s.f.titel}“ mit ${st.entries} Einträgen und ${st.photos} Fotos wird gelöscht – auch auf Geräten, mit denen später abgeglichen wird. Tipp: vorher ein Backup erstellen.`, 'Löschen', true)) {
          await Repo.deleteShow(id); Ui.toast('Veranstaltung gelöscht'); if (this.state.showId === id) this.go('#/');
        }
      }
    } catch (err) { this.error(err); }
  },
  async editShow(id) {
    const s = Repo.show(id);
    const sh = Ui.sheet({ title: 'Veranstaltung', center: true });
    sh.body.innerHTML = `<form class="form" onsubmit="return false">
      <div class="f"><label for="sh-t">Titel</label><input id="sh-t" value="${Utils.esc(s.f.titel)}"></div>
      <div class="f"><label for="sh-s">Spielstätte</label><input id="sh-s" value="${Utils.esc(s.f.spielstaette || '')}" placeholder="z. B. Großes Haus, Werkstattbühne"></div>
      <div class="f"><label for="sh-n">Notiz</label><textarea id="sh-n" rows="3" placeholder="Allgemeines zur Produktion">${Utils.esc(s.f.notiz || '')}</textarea></div>
      <button class="btn primary big block" data-ok>Speichern</button></form>`;
    sh.body.querySelector('[data-ok]').onclick = async () => {
      try { await Repo.patchShow(id, { titel: sh.body.querySelector('#sh-t').value.trim() || 'Ohne Titel', spielstaette: sh.body.querySelector('#sh-s').value.trim(), notiz: sh.body.querySelector('#sh-n').value.trim() }); sh.close(); }
      catch (err) { this.error(err); }
    };
    setTimeout(() => sh.body.querySelector('#sh-t').focus(), 50);
  },
  async resetChecks(id) {
    const v = await Ui.menu('Checkliste zurücksetzen', [{ label: 'Alles zurücksetzen', value: 'all' }, { label: 'Nur Aufbau', value: 'A' }, { label: 'Nur Einleuchten', value: 'E' }]);
    if (!v) return;
    const n = await Repo.resetChecks(id, v === 'all' ? null : v); Ui.toast(n ? `${n} Einträge zurückgesetzt – bereit für den nächsten Aufbau` : 'Nichts abgehakt');
  },
  async pdf(id) {
    const s = Repo.show(id);
    const sh = Ui.sheet({ title: 'PDF exportieren', center: true });
    const o = { kat: 'all', cover: true, compact: false };
    const draw = () => {
      const seg = (name, val, label) => `<button class="btn ${o[name] === val ? 'primary' : ''}" data-o="${name}" data-v="${val}">${label}</button>`;
      sh.body.innerHTML = `<p class="muted" style="margin-top:0">„${Utils.esc(s.f.titel)}“ – eine Seite je Kreis und Kategorie, Fotos groß, Infoblock darunter.</p>
        <div class="group"><h3>Inhalt</h3><div style="display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap">${seg('kat', 'all', 'Alles')}${seg('kat', 'A', 'Nur Aufbau')}${seg('kat', 'E', 'Nur Einleuchten')}</div>
          <label class="item"><span class="lb">Deckblatt mit Inhaltsverzeichnis</span><span class="switch"><input type="checkbox" data-c="cover" ${o.cover ? 'checked' : ''}><span></span></span></label>
          <label class="item"><span class="lb">Kompakt<small>kleinere Datei zum Mailen (Fotos 900 px)</small></span><span class="switch"><input type="checkbox" data-c="compact" ${o.compact ? 'checked' : ''}><span></span></span></label></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary big" style="flex:1" data-go="share">${I('share')} Teilen</button><button class="btn big" style="flex:1" data-go="dl">${I('download')} Herunterladen</button></div>`;
    };
    draw();
    sh.body.addEventListener('click', async e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.o) { o[b.dataset.o] = b.dataset.v; draw(); return; }
      if (!b.dataset.go) return;
      const bz = Ui.busy('PDF wird erstellt …');
      try {
        const blob = await Pdf.build(id, o, (i, n) => bz.set(`PDF wird erstellt … Seite ${i} / ${n}`));
        bz.close();
        const name = `DokuVT_${Utils.safeName(s.f.titel)}${o.kat !== 'all' ? '_' + KAT[o.kat].name : ''}_${Utils.stamp()}.pdf`;
        if (b.dataset.go === 'dl') { Utils.download(blob, name); Ui.toast(`PDF gespeichert (${Utils.fmtBytes(blob.size)})`); }
        else { const r = await Utils.shareFile(blob, name, s.f.titel); Ui.toast(r === 'shared' ? 'PDF geteilt' : r === 'abort' ? 'Teilen abgebrochen' : `Teilen nicht verfügbar – PDF heruntergeladen (${Utils.fmtBytes(blob.size)})`, r === 'abort' ? 'warn' : ''); }
      } catch (err) { bz.close(); this.error(err); }
    });
    sh.body.addEventListener('change', e => { if (e.target.dataset.c) o[e.target.dataset.c] = e.target.checked; });
  },
  async backup(showIds) {
    const bz = Ui.busy('Backup wird erstellt …');
    try {
      const { blob, counts } = await Sync.buildPackage({ type: 'backup', since: 0, showIds }, (i, n) => bz.set(`Fotos werden gesichert … ${i}/${n}`));
      bz.close();
      const nm = showIds && showIds.length === 1 ? Utils.safeName(Repo.show(showIds[0]).f.titel) : 'Alle';
      const r = await Utils.shareFile(blob, `DokuVT_Backup_${nm}_${Utils.stamp()}.json`, 'Doku VT Backup');
      if (r !== 'abort') { await Sync.log(`Backup erstellt: ${counts.entries} Einträge, ${counts.blobs} Bilder`, 'ok'); Ui.toast(`Backup ${r === 'shared' ? 'geteilt' : 'gespeichert'} (${Utils.fmtBytes(blob.size)})`); }
      else Ui.toast('Backup abgebrochen', 'warn');
    } catch (err) { bz.close(); this.error(err); }
  },
  async importFile(file) {
    const bz = Ui.busy('Datei wird eingelesen und zusammengeführt …');
    try {
      const r = await Sync.importPackage(file); bz.close();
      Ui.dialog({ title: r.type === 'sync' ? 'Sync-Paket eingespielt' : 'Backup importiert', message: `${r.neu} neue und ${r.geaendert} zusammengeführte Datensätze, ${r.bilder} Bilder übernommen.${r.missing ? `\n\nHinweis: ${r.missing} Fotos haben auf diesem Gerät noch keine Bilddaten – bitte ein komplettes Paket einspielen oder live abgleichen.` : ''}\n\nBestehende Daten wurden nicht überschrieben, sondern feldweise nach Zeitstempel zusammengeführt.` });
    } catch (err) { bz.close(); Sync.log('Import fehlgeschlagen: ' + err.message, 'error'); this.error(err); }
  },
  keys(e) {
    if (Ui.topOpen || e.metaKey || e.ctrlKey || e.altKey || Utils.isEditable(document.activeElement)) return;
    if (this.state.route !== 'show') return;
    if (e.key === '/') { e.preventDefault(); const s = document.querySelector('[data-search]'); s && s.focus(); }
    else if (e.key === 'e' || e.key === 'E') { this.state.edit = !this.state.edit; this.render(); }
    else if ((e.key === 'n' || e.key === 'N') && this.state.edit) Editor.open({ showId: this.state.showId });
  },
  /* ---------- Ereignis-Delegation ---------- */
  async onClick(e) {
    const b = e.target.closest('[data-act],[data-kat],[data-sort],[data-view]'); if (!b) return;
    const st = this.state;
    if (b.dataset.kat) { st.kat = b.dataset.kat; this.renderToolbar(); this.renderList(); return; }
    if (b.dataset.sort) { await Settings.set({ sort: b.dataset.sort }); this.renderToolbar(); this.renderList(); return; }
    if (b.dataset.view) { await Settings.set({ view: b.dataset.view }); this.renderToolbar(); this.renderList(); return; }
    const a = b.dataset.act;
    const card = b.closest('.card');
    if (card && (a === 'open' || a === 'lb' || a === 'chk')) {
      const [entryId, kat] = card.dataset.key.split(':');
      if (a === 'chk') { e.stopPropagation(); try { await Repo.toggleCheck(entryId, kat === 'N' ? 'A' : kat); } catch (err) { this.error(err); } return; }
      const thumb = e.target.closest('[data-act=lb]');
      if (thumb && !st.edit) { this.state.sel = card.dataset.key; this.openLightbox(entryId, kat, +thumb.dataset.i); return; }
      if (st.edit) { Editor.open({ showId: st.showId, entryId }); return; }
      st.sel = card.dataset.key;
      if (window.innerWidth >= 900) { this.renderList(); this.renderDetail(); }
      else { document.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel')); card.classList.add('sel'); this.openDetailSheet(entryId); }
      return;
    }
    if (b.closest('[data-detail]')) { const id = st.sel && st.sel.split(':')[0]; if (id) this.detailAction(e, id, null); return; }
    switch (a) {
      case 'home': this.go('#/'); break;
      case 'open': this.go('#/show/' + b.dataset.id); break;
      case 'newshow': this.newShow(); break;
      case 'showmenu': this.showMenu(b.dataset.id); break;
      case 'settings': SettingsView.open(); break;
      case 'sync': SyncView.open(); break;
      case 'rename': this.editShow(st.showId); break;
      case 'pdf': this.pdf(st.showId); break;
      case 'mode': st.edit = !st.edit; this.render(); Ui.toast(st.edit ? 'Bearbeitungsmodus – Änderungen möglich' : 'Ansichtsmodus – geschützt vor versehentlichen Änderungen'); break;
      case 'checklist': st.checklist = !st.checklist; this.renderToolbar(); this.renderList(); this.renderDetail(); break;
      case 'resetchk': this.resetChecks(st.showId); break;
      case 'clearq': { const s = document.querySelector('[data-search]'); s.value = ''; st.q = ''; b.classList.add('hidden'); this.renderList(); s.focus(); break; }
      case 'new': Editor.open({ showId: st.showId }); break;
      case 'quick': Editor.open({ showId: st.showId, quick: st.kat === 'E' ? 'E' : 'A' }); break;
      case 'import': { const inp = document.querySelector('[data-file]'); inp.value = ''; inp.onchange = () => inp.files[0] && this.importFile(inp.files[0]); inp.click(); break; }
    }
  }
};
document.getElementById('app').addEventListener('click', e => App.onClick(e));
window.addEventListener('resize', Utils.debounce(() => { if (App.state.route === 'show' && !App.inputFocused()) { App.renderList(); App.renderDetail(); } }, 250));
App.start();
</script>
</body>
</html>
