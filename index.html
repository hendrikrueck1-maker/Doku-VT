/* =====================================================================
   Store – IndexedDB-Zugriff. Fotos liegen getrennt (fulls/thumbs) als
   ArrayBuffer (robuster als Blob in älteren Safari-Versionen).
   ===================================================================== */
class StoreError extends Error {
  constructor(msg, cause) { super(msg); this.name = 'StoreError'; this.cause = cause; this.quota = !!(cause && /quota/i.test(cause.name || cause.message || '')); }
}
const Store = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      if (!globalThis.indexedDB) { reject(new StoreError('Dieser Browser bietet keinen lokalen Datenspeicher (IndexedDB). Privater Modus?')); return; }
      let req;
      let settled = false;
      const done = fn => v => { settled = true; clearTimeout(slow); fn(v); };
      // antwortet der Speicher nicht, nach 5 s einen sichtbaren Hinweis zeigen (Start läuft weiter, sobald er frei ist)
      const slow = setTimeout(() => { if (!settled) Boot.wait(); }, 5000);
      try { req = indexedDB.open(DB_NAME); } catch (e) { done(reject)(new StoreError('Datenspeicher konnte nicht geöffnet werden.', e)); return; }
      req.onupgradeneeded = () => {           // nur beim allerersten Start (Datenbank existiert noch nicht)
        const db = req.result;
        // Metadaten (klein, werden komplett in den Speicher geladen)
        if (!db.objectStoreNames.contains('shows')) db.createObjectStore('shows', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('entries')) db.createObjectStore('entries', { keyPath: 'id' }).createIndex('showId', 'showId');
        if (!db.objectStoreNames.contains('photos')) db.createObjectStore('photos', { keyPath: 'id' }).createIndex('showId', 'showId');
        // Bilddaten (groß, werden nur bei Bedarf gelesen) – Schlüssel = Blob-ID
        if (!db.objectStoreNames.contains('fulls')) db.createObjectStore('fulls', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('thumbs')) db.createObjectStore('thumbs', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'k' });
      };
      req.onsuccess = () => {
        const db = req.result;
        // fehlt ein Grund-Speicher (sollte nie vorkommen): einmalig gezielt anlegen
        const missing = DB_STORES.filter(n => !db.objectStoreNames.contains(n));
        if (missing.length) {
          const v = db.version + 1; db.close();
          const r2 = indexedDB.open(DB_NAME, v);
          r2.onupgradeneeded = () => { const d = r2.result; missing.forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: n === 'meta' ? 'k' : 'id' }); }); };
          r2.onsuccess = () => { this.db = r2.result; this.db.onversionchange = () => this.db.close(); done(resolve)(this.db); };
          r2.onerror = () => done(reject)(new StoreError('Datenspeicher konnte nicht eingerichtet werden.', r2.error));
          r2.onblocked = () => Boot.wait();
          return;
        }
        this.db = db;
        this.db.onversionchange = () => { this.db.close(); Ui && Ui.toast('Doku VT wurde in einem anderen Tab aktualisiert – bitte neu laden.', 'warn'); };
        done(resolve)(this.db);
      };
      req.onerror = () => done(reject)(new StoreError('Datenspeicher konnte nicht geöffnet werden.', req.error));
      req.onblocked = () => Boot.wait();
    });
  },
  /** Transaktion: fn(stores) darf Requests absetzen; Promise erfüllt sich erst bei „complete“ (atomar). */
  tx(names, mode, fn) {
    return new Promise((resolve, reject) => {
      let t;
      try { t = this.db.transaction(names, mode); } catch (e) { reject(new StoreError('Speicherzugriff fehlgeschlagen.', e)); return; }
      const stores = {};
      (Array.isArray(names) ? names : [names]).forEach(n => { stores[n] = t.objectStore(n); });
      let result;
      t.oncomplete = () => resolve(result);
      t.onabort = () => {
        const e = t.error;
        if (e && /quota/i.test(e.name)) reject(new StoreError('Der Gerätespeicher ist voll. Es wurde NICHTS gespeichert. Bitte Platz schaffen (alte Veranstaltungen sichern & löschen, „Speicher aufräumen“) und erneut speichern.', e));
        else reject(new StoreError('Speichern abgebrochen: ' + (e ? e.message || e.name : 'unbekannter Fehler'), e));
      };
      // KEIN preventDefault (bis 2.4.2): Ein fehlgeschlagener Request muss die GANZE Transaktion abbrechen
      // (→ onabort → reject). Sonst würde der Rest still gespeichert und „atomar“ wäre gelogen.
      t.onerror = () => {};
      try { result = fn(stores, t); }
      catch (e) { try { t.abort(); } catch (_) { /* schon beendet */ } reject(e instanceof StoreError ? e : new StoreError('Speicherfehler: ' + e.message, e)); }
    });
  },
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async getAll(name) { let out = []; await this.tx(name, 'readonly', s => { s[name].getAll().onsuccess = e => { out = e.target.result; }; }); return out; },
  async get(name, key) { let out; await this.tx(name, 'readonly', s => { s[name].get(key).onsuccess = e => { out = e.target.result; }; }); return out; },
  async allKeys(name) { let out = []; await this.tx(name, 'readonly', s => { s[name].getAllKeys().onsuccess = e => { out = e.target.result; }; }); return out; },
  async metaGet(k, def) { const r = await this.get('meta', k); return r ? r.v : def; },
  async metaSet(k, v) { return this.tx('meta', 'readwrite', s => { s.meta.put({ k, v }); }); }
};

/* =====================================================================
   Rec – Datensatz mit Feld-Zeitstempeln (LWW-Register je Feld).
   Aufbau: { id, showId?, b?(Blob-ID bei Fotos), c(erstellt), mod, f:{feld:wert}, t:{feld:zeit} }
   Merge: pro Feld gewinnt der jüngere Zeitstempel; Löschen = Feld „del“.
   Dadurch geht beim Zusammenführen nie eine Änderung verloren, die neuer ist.
   ===================================================================== */
const Rec = {
  create(base, fields) {
    const ts = Clock.now();
    const r = Object.assign({ id: Utils.uuid(), c: ts, mod: ts, f: {}, t: {} }, base);
    for (const [k, v] of Object.entries(fields)) { r.f[k] = v; r.t[k] = ts; }
    return r;
  },
  /** Gibt eine geänderte Kopie zurück (oder null, wenn nichts geändert wurde) */
  patch(rec, patch) {
    const ts = Clock.now(); let changed = false;
    const r = Utils.clone(rec);
    for (const [k, v] of Object.entries(patch)) {
      // Zeitstempel nie älter als der bisherige Wert: Hat ein Gerät mit vorgehender Uhr das Feld geschrieben,
      // gilt die eigene, spätere Änderung trotzdem als jünger (sonst würde sie beim Abgleich zurückgedreht).
      if (JSON.stringify(r.f[k] ?? null) !== JSON.stringify(v ?? null)) { r.f[k] = v; r.t[k] = Math.max(ts, (r.t[k] || 0) + 1); changed = true; }
    }
    if (!changed) return null;
    r.mod = Math.max(ts, ...Object.values(r.t));
    return r;
  },
  /** Zwei Fassungen desselben Datensatzes zusammenführen */
  merge(local, remote) {
    if (!local) return { rec: Utils.clone(remote), changed: true };
    const r = Utils.clone(local); let changed = false;
    const keys = new Set([...Object.keys(local.t || {}), ...Object.keys(remote.t || {})]);
    for (const k of keys) {
      const tl = local.t[k] || 0, tr = remote.t[k] || 0;
      const vl = JSON.stringify(local.f[k] ?? null), vr = JSON.stringify(remote.f[k] ?? null);
      if (tr > tl || (tr === tl && tr > 0 && vr > vl)) {   // Gleichstand: deterministischer Vergleich
        if (vl !== vr || tr !== tl) { r.f[k] = remote.f[k]; r.t[k] = tr; changed = true; }
      }
      Clock.observe(tr);
    }
    r.c = Math.min(local.c || Infinity, remote.c || Infinity);
    r.mod = Math.max(0, ...Object.values(r.t));
    return { rec: r, changed };
  },
  /* Eingangsprüfung für fremde Datensätze (Import, Sync-Paket, Live). IDs landen in HTML-Attributen –
     deshalb nur Zeichen, die nie aus einem Attribut ausbrechen können. Alle von Doku VT und dem
     Lichtdoku-Import erzeugten IDs (UUID, lgs-/lge-/lgp-/lgb-…) passen auf dieses Muster. */
  ID: /^[A-Za-z0-9_.:-]{1,200}$/,
  BAD_KEYS: new Set(['__proto__', 'constructor', 'prototype']),
  MAX_FIELDS: 2000, MAX_STR: 100000,
  valid(r, type) {
    if (!r || typeof r !== 'object' || Array.isArray(r) || typeof r.id !== 'string' || !this.ID.test(r.id)) return false;
    if (!r.f || typeof r.f !== 'object' || Array.isArray(r.f) || !r.t || typeof r.t !== 'object' || Array.isArray(r.t)) return false;
    if ((type === 'entry' || type === 'run' || type === 'photo') && (typeof r.showId !== 'string' || !this.ID.test(r.showId))) return false;
    if (type === 'photo') {
      if (typeof r.b !== 'string' || !this.ID.test(r.b)) return false;
      const en = r.f.entryId; if (en != null && en !== '' && (typeof en !== 'string' || !this.ID.test(en))) return false;
    }
    const fk = Object.keys(r.f), tk = Object.keys(r.t);
    if (fk.length > this.MAX_FIELDS || tk.length > this.MAX_FIELDS) return false;
    for (const k of fk.concat(tk)) if (this.BAD_KEYS.has(k) || k.length > 120) return false;
    for (const v of Object.values(r.t)) if (typeof v !== 'number' || !isFinite(v) || v < 0) return false;
    for (const v of Object.values(r.f)) if (typeof v === 'string' && v.length > this.MAX_STR) return false;
    return true;
  },
  /** Kopie ohne verschachtelte „__proto__“-Schlüssel (JSON.parse legt sie als eigene Eigenschaft an) */
  sanitize(r) { return JSON.parse(JSON.stringify(r), (k, v) => (k === '__proto__' ? undefined : v)); }
};

/* =====================================================================
   Repo – Datenzugriff mit Cache im Arbeitsspeicher.
   Alle Metadaten (Shows/Einträge/Foto-Datensätze) liegen im RAM – auch bei
   200+ Einträgen/500+ Fotos nur wenige hundert KB. Bilddaten bleiben in IDB.
   ===================================================================== */
const Repo = {
  shows: new Map(), entries: new Map(), photos: new Map(), runs: new Map(),
  house: new Map(),       // Haus-Daten (ab 2.5.0): „requisite“ = Haus-Orte (ho:) und Gegenstand-Vorlagen (hg:), im Store meta unter „house:<id>“
  _byEntry: null,         // Index: entryId → [photo]
  listeners: new Set(),

  async load() {
    const hasRunStore = Store.db.objectStoreNames.contains('runs');      // nur Datenbanken aus 2.3.0/2.4.0
    const [s, e, p, m, u0] = await Promise.all([Store.getAll('shows'), Store.getAll('entries'), Store.getAll('photos'), Store.getAll('meta'), hasRunStore ? Store.getAll('runs') : []]);
    s.forEach(r => this.shows.set(r.id, r)); e.forEach(r => this.entries.set(r.id, r)); p.forEach(r => this.photos.set(r.id, r));
    const u = m.filter(x => typeof x.k === 'string' && x.k.startsWith('run:') && x.v && x.v.id).map(x => x.v);
    for (const r of [...u0, ...u]) { const cur = this.runs.get(r.id); this.runs.set(r.id, cur ? Rec.merge(cur, r).rec : r); }
    const hs = m.filter(x => typeof x.k === 'string' && x.k.startsWith('house:') && x.v && x.v.id).map(x => x.v);
    hs.forEach(r => this.house.set(r.id, r));
    [...s, ...e, ...p, ...u, ...hs].forEach(r => Clock.observe(r.mod || 0));
    this._byEntry = null;
  },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  /** Änderungsereignis: {local, records:{shows,entries,photos}, blobIds} */
  emit(ev) { this._byEntry = null; this.listeners.forEach(fn => { try { fn(ev); } catch (e) { console.error(e); } }); },
  _cache(name, recs) { const m = this[name]; recs.forEach(r => m.set(r.id, r)); },

  /* ---------- Abfragen ---------- */
  liveShows() { return [...this.shows.values()].filter(s => !s.f.del).sort((a, b) => b.mod - a.mod); },
  show(id) { const s = this.shows.get(id); return s && !s.f.del ? s : null; },
  entry(id) { const e = this.entries.get(id); return e && !e.f.del ? e : null; },
  entriesOf(showId) { return [...this.entries.values()].filter(e => e.showId === showId && !e.f.del); },
  _index() {
    if (this._byEntry) return this._byEntry;
    const m = new Map();
    for (const p of this.photos.values()) {
      if (p.f.del) continue;
      const k = p.f.entryId; if (!m.has(k)) m.set(k, []);
      m.get(k).push(p);
    }
    m.forEach(arr => arr.sort((a, b) => (a.f.ord - b.f.ord) || (a.c - b.c)));
    this._byEntry = m; return m;
  },
  photosOf(entryId, kat) { const arr = this._index().get(entryId) || []; return kat ? arr.filter(p => p.f.kat === kat) : arr; },
  /** Abteilungen einer Veranstaltung. Fehlt das Feld (bis 1.8.1): Licht + jede Abteilung mit Einträgen.
      Wird nur gelesen – geschrieben wird erst, wenn jemand die Auswahl bewusst ändert. */
  showDepts(showId) {
    const s = this.shows.get(showId); const v = s && s.f.abteilungen;
    if (Array.isArray(v)) { const ok = DEPT_ORDER.filter(d => v.includes(d)); if (ok.length) return ok; }
    const have = new Set(['L']); this.entriesOf(showId).forEach(e => have.add(abtOf(e)));
    return DEPT_ORDER.filter(d => have.has(d));
  },
  /** Kategorien, in denen ein Eintrag als Karte erscheint */
  catsOf(entryId) {
    const ps = this.photosOf(entryId); const c = [];
    if (ps.some(p => p.f.kat === 'A')) c.push('A');
    if (ps.some(p => p.f.kat === 'E')) c.push('E');
    return c.length ? c : ['N'];
  },
  /** Zähler für Fortschritt; depts = nur diese Abteilungen (null = alle) */
  stats(showId, depts = null) {
    const es = this.entriesOf(showId).filter(en => !depts || depts.includes(abtOf(en)));
    let photos = 0, a = 0, aDone = 0, e = 0, eDone = 0;
    for (const en of es) {
      const cats = this.catsOf(en.id); photos += this.photosOf(en.id).length;
      if (abtOf(en) === 'R') { a++; if (en.f.chkA) aDone++; continue; }   // Requisite: ein Haken („Eingerichtet“)
      if (DEPT[abtOf(en)].photoKats.length === 1) {               // Bühne: eine Karte, zwei Haken
        a++; if (en.f.chkA) aDone++; e++; if (en.f.chkE) eDone++; continue;
      }
      if (cats.includes('A') || cats.includes('N')) { a++; if (en.f.chkA) aDone++; }
      if (cats.includes('E')) { e++; if (en.f.chkE) eDone++; }
    }
    return { entries: es.length, photos, a, aDone, e, eDone };
  },
  /** Schlüssel für „gleicher Eintrag“: Abteilung + Menge des Hauptfelds (nur Abteilungen mit mergeMain) */
  dupKey(e) {
    const d = DEPT[abtOf(e)]; if (!d.mergeMain) return '';
    const k = Utils.kreisTokens(e.f[d.main]).sort().join('+');
    return k ? d.key + '|' + k : '';
  },
  /** depts: nur diese Abteilungen (die sichtbaren). Ausgeblendete Abteilungen werden nicht angefasst –
      ihre Änderungen gingen wegen des Abteilungsfilters im Sync-Paket sonst nie an andere Geräte. */
  duplicatesOf(showId, depts = null) {
    const groups = new Map();
    for (const e of this.entriesOf(showId)) {
      if (depts && !depts.includes(abtOf(e))) continue;
      const k = this.dupKey(e); if (!k) continue;
      if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e);
    }
    return [...groups.values()].filter(g => g.length > 1);
  },

  /* ---------- Schreiben (jeweils eine atomare Transaktion) ---------- */
  async _write({ shows = [], entries = [], photos = [], fulls = [], thumbs = [], runs = [], house = [] }, local = true) {
    // Eingangszeit auf DIESEM Gerät (ab 2.4.3, kein Feld in f/t → kein Merge-Zeitstempel). Sie entscheidet,
    // was ein „Nur Änderungen“-Paket weitergibt – auch Daten, die von einem anderen Gerät übernommen wurden.
    const rx = Date.now();
    const sets = [['shows', shows], ['entries', entries], ['photos', photos], ['runs', runs], ['house', house]];
    sets.forEach(([, list]) => list.forEach(r => { r.rx = rx; }));
    // Cache SOFORT setzen (ab 2.4.3): Wer danach Rec.patch/merge rechnet, sieht diesen Stand – zwei schnelle
    // Schreibvorgänge überschreiben sich nicht mehr gegenseitig (Lost Update). IndexedDB führt die
    // readwrite-Transaktionen in Anlegereihenfolge aus, damit stimmt auch die Reihenfolge in der Datenbank.
    const prev = [];
    sets.forEach(([n, list]) => list.forEach(r => { prev.push([n, r, this[n].get(r.id)]); this[n].set(r.id, r); }));
    this._byEntry = null;
    const names = ['shows', 'entries', 'photos', 'fulls', 'thumbs', 'meta'];
    try {
      await Store.tx(names, 'readwrite', s => {
        shows.forEach(r => s.shows.put(r)); entries.forEach(r => s.entries.put(r)); photos.forEach(r => s.photos.put(r)); runs.forEach(r => s.meta.put({ k: 'run:' + r.id, v: r }));
        house.forEach(r => s.meta.put({ k: 'house:' + r.id, v: r }));
        fulls.forEach(r => s.fulls.put(r)); thumbs.forEach(r => s.thumbs.put(r));
      });
    } catch (err) {
      // zurückrollen – rückwärts, und nur wo nicht inzwischen ein neuerer Stand liegt (der enthält diesen dann ohnehin)
      for (let i = prev.length - 1; i >= 0; i--) {
        const [n, r, old] = prev[i];
        if (this[n].get(r.id) === r) { if (old) this[n].set(r.id, old); else this[n].delete(r.id); }
      }
      this._byEntry = null;
      throw err;
    }
    if (local) Sync.noteLocalChange();
    this.emit({ local, records: { shows, entries, photos, runs, house }, blobIds: fulls.map(f => f.id) });
    App.ensurePersist();
  },
  async createShow(titel, abteilungen = null) {
    const f = { titel: titel || 'Neue Veranstaltung', spielstaette: '', notiz: '', del: false };
    if (abteilungen && abteilungen.length) f.abteilungen = DEPT_ORDER.filter(d => abteilungen.includes(d));
    // Vorstellungs-Checkliste: Punkte der Hausvorlage (bzw. Beispiele) für die gewählten Abteilungen
    const deps = f.abteilungen || ['L'];
    RunList.template().filter(x => deps.includes(x.abt)).forEach((x, i) => { f['ci:' + Utils.uuid()] = { abt: x.abt, text: x.text, ord: (i + 1) * 10, del: false }; });
    if (deps.includes('R')) Object.assign(f, Req.defaultAbschnitte());     // Vor der Vorstellung · Vorstellung · Nach der Vorstellung (keine Pause)
    const s = Rec.create({}, f);
    await this._write({ shows: [s] }); return s;
  },
  async patchShow(id, patch) { const r = Rec.patch(this.shows.get(id), patch); if (r) await this._write({ shows: [r] }); return r; },
  /** Veranstaltung ändern und dazu neue Bilddaten speichern (Ortsfoto, Übersichtsfoto) – eine Transaktion */
  async patchShowBlobs(id, patch, pics = []) {
    const r = Rec.patch(this.shows.get(id), patch);
    const fulls = pics.filter(p => p.full).map(p => ({ id: p.b, d: p.full })), thumbs = pics.filter(p => p.full).map(p => ({ id: p.b, d: p.thumb }));
    if (r || fulls.length) await this._write({ shows: r ? [r] : [], fulls, thumbs });
    return r;
  },
  /** Haus-Datensatz der Requisite ändern (Haus-Orte, Vorlagen); legt ihn bei Bedarf an */
  async patchHouse(patch, pics = [], id = 'requisite') {
    const cur = this.house.get(id);
    const r = cur ? Rec.patch(cur, patch) : Rec.create({ id }, patch);
    const fulls = pics.filter(p => p.full).map(p => ({ id: p.b, d: p.full })), thumbs = pics.filter(p => p.full).map(p => ({ id: p.b, d: p.thumb }));
    if (r || fulls.length) await this._write({ house: r ? [r] : [], fulls, thumbs });
    return r;
  },
  async deleteShow(id) {
    const out = { shows: [], entries: [], photos: [], runs: [] };
    // Lösch-Kennung (ab 2.4.3): kennzeichnet alles, was in DIESEM Vorgang gelöscht wird. „Wiederherstellen“ bringt
    // genau das zurück – nicht, was ein anderes Gerät inzwischen einzeln gelöscht hat.
    const grp = 'g-' + Utils.uuid();
    // del und delGrp mit GLEICHEM Zeitstempel: Löscht ein anderes Gerät später einzeln, wird t.del jünger als t.delGrp
    const mark = r => { const x = Rec.patch(r, { del: true, delGrp: grp }); if (x) { const m = Math.max(x.t.del, x.t.delGrp); x.t.del = x.t.delGrp = m; x.mod = Math.max(x.mod, m); } return x; };
    // zuerst die Veranstaltung: alles, was mit ihr gelöscht wird, hat einen Zeitstempel ≥ ihrem (Papierkorb ohne Kennung, bis 2.4.2)
    const s = mark(this.shows.get(id)); if (s) out.shows.push(s);
    for (const r of this.runs.values()) if (r.showId === id && !r.f.del) out.runs.push(mark(r));
    for (const e of this.entries.values()) if (e.showId === id && !e.f.del) out.entries.push(mark(e));
    for (const p of this.photos.values()) if (p.showId === id && !p.f.del) out.photos.push(mark(p));
    await this._write(out);
  },
  /* ---------- Papierkorb (ab 2.4.2) ----------
     Gelöschte Veranstaltungen bleiben als Datensatz mit „del“ erhalten (nötig, damit der Abgleich das
     Löschen weitergibt). Sie lassen sich wiederherstellen: Die Veranstaltung und alles, was mit ihr
     zusammen gelöscht wurde, bekommt „del: false“ mit neuem Zeitstempel – nach dem Abgleich ist sie
     auch auf den anderen Geräten wieder da. Früher einzeln gelöschte Einträge bleiben gelöscht. */
  deletedShows() { return [...this.shows.values()].filter(s => s.f.del).sort((a, b) => (b.t.del || 0) - (a.t.del || 0)); },
  /** Datensätze einer Veranstaltung, die zusammen mit ihr gelöscht wurden: Zeitstempel des Löschens ≥ dem der Veranstaltung
      (Durchgänge wurden bis 2.4.1 kurz davor gelöscht → 2 s Spielraum). Früher einzeln Gelöschtes liegt davor. */
  _deletedWith(id) {
    const s = this.shows.get(id); const t0 = (s && s.t.del) || 0;
    // Lösch-Kennung gilt nur, wenn sie zum aktuellen Löschen gehört (nicht zu einem früheren, schon wiederhergestellten)
    const g = s && s.f.delGrp && (s.t.delGrp || 0) >= t0 ? s.f.delGrp : null;
    const pick = (m, slack) => [...m.values()].filter(r => r.showId === id && r.f.del &&
      (g ? r.f.delGrp === g && (r.t.del || 0) <= (r.t.delGrp || 0) : (r.t.del || 0) >= t0 - slack));      // ohne Kennung (mit 2.4.2 gelöscht): Zeit-Heuristik wie bisher
    return { entries: pick(this.entries, 0), photos: pick(this.photos, 0), runs: pick(this.runs, 2000) };
  },
  trashInfo(id) { const w = this._deletedWith(id); return { entries: w.entries.length, photos: w.photos.length, at: (this.shows.get(id).t.del || 0) }; },
  async restoreShow(id) {
    const s = this.shows.get(id); if (!s || !s.f.del) return false;
    const w = this._deletedWith(id), un = r => Rec.patch(r, r.f.delGrp ? { del: false, delGrp: '' } : { del: false });
    await this._write({ shows: [un(s)], entries: w.entries.map(un), photos: w.photos.map(un), runs: w.runs.map(un) });
    return true;
  },
  /** Duplizieren: neue IDs, Fotos teilen sich die (unveränderlichen) Bilddaten */
  async duplicateShow(id) {
    const src = this.shows.get(id);
    const sf = { titel: src.f.titel + ' (Kopie)', spielstaette: src.f.spielstaette || '', notiz: src.f.notiz || '', einrichtung: src.f.einrichtung || '', abteilungen: this.showDepts(id), del: false };
    Object.keys(src.f).forEach(k => { if (k.startsWith('z:') && src.f[k] && !src.f[k].del) sf[k] = Utils.clone(src.f[k]); });   // Züge mitnehmen
    if (src.f.einrichtungT) sf.einrichtungT = src.f.einrichtungT;
    if (src.f.einrichtungB) sf.einrichtungB = src.f.einrichtungB;
    Object.keys(src.f).forEach(k => { const v = src.f[k]; if (k.startsWith('ci:') && v && !v.del) sf['ci:' + Utils.uuid()] = Utils.clone(v); });   // Checklisten-Punkte (ohne Durchgänge)
    // Bühnen-Ablauf mitnehmen; verknüpfte Einträge zeigen auf die Kopien
    const idMap = new Map(this.entriesOf(id).map(e => [e.id, Utils.uuid()]));
    Object.keys(src.f).forEach(k => { const v = src.f[k]; if (k.startsWith('b:') && v && !v.del) sf['b:' + Utils.uuid()] = Object.assign(Utils.clone(v), { entryId: idMap.get(v.entryId) || '' }); });
    const rmap = Req.copyShowFields(src.f, sf, idMap);           // Requisite: Personen, Orte, Abschnitte, Schritte (Verweise auf die Kopien)
    const s = Rec.create({}, sf);
    const entries = [], photos = [];
    for (const e of this.entriesOf(id)) {
      // nur vorhandene Felder kopieren (keine leeren Felder fremder Abteilungen anlegen)
      const f = Utils.clone(e.f); f.abt = abtOf(e); f.chkA = !!f.chkA; f.chkE = !!f.chkE; f.del = false;
      if (f.abt === 'R') Req.remapEntry(f, rmap, idMap);
      const ne = Rec.create({ id: idMap.get(e.id), showId: s.id }, f); entries.push(ne);
      for (const p of this.photosOf(e.id)) photos.push(Rec.create({ showId: s.id, b: p.b, w: p.w, h: p.h }, Object.assign({ entryId: ne.id, kat: p.f.kat, ord: p.f.ord, label: p.f.label || '', del: false }, p.f.cap ? { cap: p.f.cap } : {})));
    }
    await this._write({ shows: [s], entries, photos }); return s;
  },
  /* ---------- Einrichtung & Züge (je Veranstaltung) ----------
     Gemeinsame Zugliste: jeder Zug ist ein eigenes Feld „z:<id>“ =
       {name, typ:'licht'|'buehne', ebene, bereich, hoehe, bestueckung, last, bemerkung, ord, del}
     → beim Abgleich wird jeder Zug für sich zusammengeführt. OLZ 1/2 und BGZ 1/2 sind immer da.
     Fehlt „typ“ (bis 2.1.0), ist es ein Beleuchterzug. Reihenfolge (ord) = von vorne nach hinten.
     Gespeichert wird immer als Ergänzung des alten Werts (fremde Felder anderer Abteilungen bleiben). */
  ZUG_DEFAULT: [['olz1', 'OLZ 1'], ['olz2', 'OLZ 2'], ['bgz1', 'BGZ 1'], ['bgz2', 'BGZ 2']],
  zuegeOf(showId) {
    const s = this.shows.get(showId); const f = (s && s.f) || {};
    // kleiner Zwischenspeicher (Sortieren ruft das sehr oft auf); gilt bis zur nächsten Änderung der Veranstaltung
    if (this._zc && this._zc.id === showId && this._zc.mod === (s && s.mod) && this._zc.s === s) return this._zc.val;
    const val = this._zuege(f); this._zc = { id: showId, mod: s && s.mod, s, val }; return val;
  },
  _zuege(f) {
    const base = { hoehe: '', bestueckung: '', last: '', bemerkung: '', typ: 'licht', ebene: 'oben', bereich: 'haupt' };
    const out = this.ZUG_DEFAULT.map(([id, name], i) => Object.assign({ id, ord: i }, base, f['z:' + id] || {}, { name, fixed: true, typ: 'licht' }));
    Object.keys(f).filter(k => k.startsWith('z:') && !this.ZUG_DEFAULT.some(d => 'z:' + d[0] === k)).forEach(k => {
      const z = f[k]; if (z && !z.del) out.push(Object.assign({ ord: 100 }, base, z, { id: k.slice(2), fixed: false }));
    });
    out.forEach(z => { if (!EBENE_RANK.hasOwnProperty(z.ebene)) z.ebene = 'oben'; if (!BEREICH_RANK.hasOwnProperty(z.bereich)) z.bereich = 'haupt'; if (z.typ !== 'buehne') z.typ = 'licht'; });
    return out.sort((a, b) => (a.ord - b.ord) || String(a.name).localeCompare(String(b.name), 'de', { numeric: true }));
  },
  zugFilled(z) { return !!(z.hoehe || z.bestueckung || z.bemerkung || z.last); },
  /** Position eines Bühnen-Eintrags: Zug aus der Zugliste oder freie Position. zs = vorab geladene Zugliste (Sortieren). */
  bposOf(e, zs = null) {
    const f = e.f; zs = zs || this.zuegeOf(e.showId);
    const i = f.zugId ? zs.findIndex(z => z.id === f.zugId) : -1;
    if (i >= 0) { const z = zs[i]; return { name: z.name, ebene: z.ebene, bereich: z.bereich, idx: i, zug: z }; }
    const t = String(f.zug || '');
    // freie Position; bis 2.1.0 gab es nur Text → Ebene schätzen („Zug …“ hängt oben), nur beim Lesen
    const eb = EBENE_RANK.hasOwnProperty(f.ebene) ? f.ebene : (/\b(zug|olz|bgz|bzg|pz|prospekt|brücke)/i.test(t) ? 'oben' : 'boden');
    return { name: t, ebene: eb, bereich: BEREICH_RANK.hasOwnProperty(f.bereich) ? f.bereich : 'haupt', idx: 9999, removed: !!f.zugId };
  },
  /** Sortierschlüssel Bühne: Bereich (vorne → hinten), Ebene (unten → oben), Zugliste, Reihenfolge, Name */
  bcmp(a, b, zs) {
    const pa = this.bposOf(a, zs), pb = this.bposOf(b, zs);
    return (BEREICH_RANK[pa.bereich] - BEREICH_RANK[pb.bereich]) || (EBENE_RANK[pa.ebene] - EBENE_RANK[pb.ebene]) || (pa.idx - pb.idx)
      || (Utils.numKey(a.f.reihenfolge) - Utils.numKey(b.f.reihenfolge) || 0) || String(pa.name).localeCompare(String(pb.name), 'de', { numeric: true }) || (a.c - b.c);
  },
  /** Bühnen-Ablauf: Schritte je Abschnitt, sortiert */
  ablaufOf(showId) {
    const s = this.shows.get(showId); const f = (s && s.f) || {};
    const out = Object.keys(f).filter(k => k.startsWith('b:')).map(k => Object.assign({ abschnitt: 'grund', text: '', entryId: '', ord: 0 }, f[k], { id: k.slice(2) })).filter(x => !x.del);
    return out.sort((a, b) => (ABLAUF.findIndex(x => x[0] === a.abschnitt) - ABLAUF.findIndex(x => x[0] === b.abschnitt)) || (a.ord - b.ord));
  },
  /** Gibt es Einrichtungs-Angaben für die Abteilung? (Licht: Einrichtung/Beleuchterzüge, Ton: Text, Bühne: Ablauf/Bühnenzüge) */
  hasSetup(showId, abt = 'L') {
    const s = this.show(showId); if (!s) return false;
    if (abt === 'T') return !!s.f.einrichtungT;
    if (abt === 'B') return !!s.f.einrichtungB || this.ablaufOf(showId).length > 0 || this.zuegeOf(showId).some(z => z.typ === 'buehne');
    return !!(s.f.einrichtung || this.zuegeOf(showId).some(z => z.typ === 'licht' && (this.zugFilled(z) || !z.fixed)));
  },
  /** Zug anlegen bzw. ändern – immer als Ergänzung des bestehenden Werts (Felder anderer Abteilungen bleiben) */
  zugValue(showId, id, patch) {
    const s = this.shows.get(showId); const old = (s && s.f['z:' + id]) || {};
    return Object.assign({}, old, patch);
  },
  async deleteEntry(id) {
    const out = { entries: [], photos: [] };
    const e = Rec.patch(this.entries.get(id), { del: true }); if (e) out.entries.push(e);
    this.photosOf(id).forEach(p => out.photos.push(Rec.patch(p, { del: true })));
    await this._write(out);
  },
  async toggleCheck(id, kat) {
    const e = this.entries.get(id); const k = kat === 'E' ? 'chkE' : 'chkA';
    const r = Rec.patch(e, { [k]: !e.f[k] }); if (r) await this._write({ entries: [r] }); return r;
  },
  async resetChecks(showId, which, depts = null) {
    const out = [];
    for (const e of this.entriesOf(showId)) {
      if (depts && !depts.includes(abtOf(e))) continue;
      const p = {}; if (which !== 'E' && e.f.chkA) p.chkA = false; if (which !== 'A' && e.f.chkE) p.chkE = false;
      const r = Object.keys(p).length ? Rec.patch(e, p) : null; if (r) out.push(r);
    }
    if (out.length) await this._write({ entries: out });
    return out.length;
  },

  /**
   * Eintrag aus dem Editor speichern (neu oder bestehend) – inkl. Fotos, Reihenfolge,
   * gelöschter Fotos und automatischem Zusammenführen bei gleicher Kreis-Nummer.
   * draft = { id|null, showId, abt, f:{…}, photos:{A:[slot], E:[slot]} }
   * slot  = { photoId|null, b, w, h, full?:ArrayBuffer, thumb?:ArrayBuffer, label }
   * Es werden nur die Felder der Abteilung behandelt; ein leeres Feld, das es im
   * Datensatz noch nicht gibt, wird NICHT angelegt (sonst gälte der Eintrag als geändert).
   */
  async saveDraft(draft) {
    const showId = draft.showId;
    let target = draft.id ? this.entries.get(draft.id) : null;
    const abt = target ? abtOf(target) : (DEPT[draft.abt] ? draft.abt : 'L');
    const D = DEPT[abt], main = D.main;
    const f = {};
    for (const fd of D.fields) {
      if (!(fd.k in draft.f)) continue;
      if (fd.arr) { const v = draft.f[fd.k]; f[fd.k] = Array.isArray(v) ? v.map(x => String(x).trim()).filter(Boolean) : []; continue; }
      f[fd.k] = fd.bool ? !!draft.f[fd.k] : String(draft.f[fd.k] ?? '').trim();
    }
    // Der Editor schickt bei bestehenden Einträgen nur geänderte Felder (ab 2.4.3) – fehlt das Hauptfeld,
    // bleibt es unberührt (normKreis(undefined) würde es sonst leeren)
    if (main in f && D.fields.find(x => x.k === main).plus) f[main] = Utils.normKreis(f[main]);
    if (target) for (const k of Object.keys(f)) if ((f[k] === '' || f[k] === false || (Array.isArray(f[k]) && !f[k].length)) && target.f[k] == null) delete f[k];
    if (!target && abt === 'R') for (const k of Object.keys(f)) if (f[k] === '' || (Array.isArray(f[k]) && !f[k].length)) delete f[k];   // neue Gegenstände: leere Felder nicht anlegen
    const textKeys = Object.keys(f).filter(k => !deptField(abt, k).bool && !deptField(abt, k).arr);

    // Ziel bestimmen: gleiches Hauptfeld in derselben Show und Abteilung → zusammenführen
    let mergedInto = null, mergeNotes = [];
    if (D.mergeMain && f[main]) {
      const dup = this.entriesOf(showId).find(e => e.id !== draft.id && abtOf(e) === abt && Utils.kreisEq(e.f[main], f[main]));
      if (dup) mergedInto = dup;
    }
    const out = { entries: [], photos: [], fulls: [], thumbs: [] };
    let entryId;
    if (mergedInto) {
      // Felder übernehmen: leere Zielfelder füllen, abweichende Werte → neuer Wert gewinnt, Bemerkungen werden verbunden
      const patch = {};
      for (const k of textKeys) {
        const nv = f[k], ov = String(mergedInto.f[k] ?? '').trim();
        if (!nv || nv === ov) continue;
        if (k === 'bemerkung' && ov) { if (!ov.includes(nv)) patch[k] = ov + '\n— \n' + nv; }
        else if (k === main) continue;
        else { if (ov) mergeNotes.push(`${fieldLabel(abt, k)}: „${ov}“ → „${nv}“`); patch[k] = nv; }
      }
      Object.keys(f).filter(k => deptField(abt, k).bool && f[k] && !mergedInto.f[k]).forEach(k => { patch[k] = true; });
      const r = Rec.patch(mergedInto, patch); if (r) out.entries.push(r);
      entryId = mergedInto.id;
      if (target) { const t = Rec.patch(target, { del: true }); if (t) out.entries.push(t); }
    } else if (target) {
      const r = Rec.patch(target, f); if (r) out.entries.push(r);
      entryId = target.id;
    } else {
      const ne = Rec.create({ showId }, Object.assign({ abt, chkA: false, chkE: false, del: false }, f));
      out.entries.push(ne); entryId = ne.id;
    }

    // Fotos: Reihenfolge, Kategorie, neue Bilddaten
    const keep = new Set();
    let baseOrd = 0;
    if (mergedInto) baseOrd = Math.max(0, ...this.photosOf(mergedInto.id).map(p => p.f.ord)) + 1;
    for (const kat of ['A', 'E']) {
      (draft.photos[kat] || []).forEach((slot, i) => {
        const ord = baseOrd + i;
        if (slot.full) { out.fulls.push({ id: slot.b, d: slot.full }); out.thumbs.push({ id: slot.b, d: slot.thumb }); }
        const capP = abt === 'R' && (slot.cap || (slot.photoId && this.photos.get(slot.photoId) && this.photos.get(slot.photoId).f.cap != null)) ? { cap: slot.cap || '' } : {};
        if (slot.photoId && this.photos.get(slot.photoId)) {
          keep.add(slot.photoId);
          const r = Rec.patch(this.photos.get(slot.photoId), Object.assign({ entryId, kat, ord, label: slot.label || '' }, capP)); if (r) out.photos.push(r);
        } else {
          const p = Rec.create({ showId, b: slot.b, w: slot.w, h: slot.h }, Object.assign({ entryId, kat, ord, label: slot.label || '', del: false }, capP));
          out.photos.push(p); keep.add(p.id);
        }
      });
    }
    // Fotos, die im Editor entfernt/ersetzt wurden → Tombstone. Nur Fotos, die beim Öffnen des Editors zu sehen
    // waren (draft.initialPhotos) – ein Foto, das währenddessen per Live-Abgleich dazukam, bleibt erhalten.
    if (draft.id) this.photosOf(draft.id).forEach(p => {
      if (!keep.has(p.id) && (!draft.initialPhotos || draft.initialPhotos.has(p.id))) out.photos.push(Rec.patch(p, { del: true }));
    });
    await this._write(out);
    return { entryId, mergedInto: mergedInto ? mergedInto.id : null, mergeNotes };
  },
  /** Doppelte Kreise einer Show zusammenführen (z. B. nach Abgleich zweier Geräte) */
  async mergeDuplicates(showId, depts = null) {
    let n = 0;
    for (const group of this.duplicatesOf(showId, depts)) {
      group.sort((a, b) => a.c - b.c);
      const [keep, ...rest] = group;
      for (const other of rest) {
        const draft = { id: other.id, showId, abt: abtOf(other), f: Object.assign({}, other.f), photos: { A: [], E: [] } };
        this.photosOf(other.id).forEach(p => draft.photos[p.f.kat].push({ photoId: p.id, b: p.b, w: p.w, h: p.h, label: p.f.label }));
        const m = DEPT[abtOf(keep)].main; draft.f[m] = keep.f[m];
        await this.saveDraft(draft); n++;
      }
    }
    return n;
  },
  /** Bilddaten lesen */
  async thumb(b) { const r = await Store.get('thumbs', b); return r ? r.d : null; },
  async full(b) { const r = await Store.get('fulls', b); return r ? r.d : null; },
  async blobIds() { return new Set(await Store.allKeys('fulls')); },
  /** Bilddaten, die noch gebraucht werden: lebende Fotos und – ab 2.4.3 – alle Fotos von Veranstaltungen
      im Papierkorb (sonst endet „Wiederherstellen“ ohne Bilder) */
  usedBlobs() {
    const used = new Set();
    for (const p of this.photos.values()) {
      const s = this.shows.get(p.showId);
      if (!p.f.del || (s && s.f.del)) used.add(p.b);
    }
    // Requisite (ab 2.5.0): Übersichtsfotos, Fotos der Stück-Orte (auch im Papierkorb), Haus-Orte und Vorlagen
    Req.blobRefs([...this.shows.values()], [...this.house.values()], true).forEach(b => used.add(b));
    return used;
  },
  /** Anzahl der Bilddaten, die „Speicher aufräumen“ entfernen würde */
  async orphanBlobs() {
    const used = this.usedBlobs();
    const keys = await Store.allKeys('fulls'), tkeys = await Store.allKeys('thumbs');
    return [...new Set([...keys, ...tkeys])].filter(k => !used.has(k));
  },
  /** Verwaiste Bilddaten entfernen (nur Bilder, die weder ein lebendes Foto noch der Papierkorb nutzt) */
  async cleanup() {
    const used = this.usedBlobs();
    const keys = await Store.allKeys('fulls'); const tkeys = await Store.allKeys('thumbs');
    const del = [...new Set([...keys, ...tkeys])].filter(k => !used.has(k));
    if (del.length) await Store.tx(['fulls', 'thumbs'], 'readwrite', s => del.forEach(k => { s.fulls.delete(k); s.thumbs.delete(k); }));
    return del.length;
  },
  /**
   * Fremde Datensätze einspielen (Import, Sync-Paket, Live-Abgleich).
   * Es wird nie blind überschrieben – jedes Feld wird einzeln per Zeitstempel zusammengeführt.
   */
  async applyRemote(data, blobs = []) {
    const out = { shows: [], entries: [], photos: [], fulls: [], thumbs: [], runs: [], house: [] };
    const stat = { neu: 0, geaendert: 0, unveraendert: 0, bilder: 0, ungueltig: 0 };
    // Blob-Liste VOR dem Zusammenführen holen: zwischen Merge und _write darf kein await liegen,
    // sonst rechnet ein paralleler Aufruf aus demselben alten Stand (Lost Update)
    const have = blobs.length ? await this.blobIds() : null;
    for (const [name, type] of [['shows', 'show'], ['entries', 'entry'], ['photos', 'photo'], ['runs', 'run'], ['house', 'house']]) {
      const list = Array.isArray(data[name]) ? data[name] : [];
      for (const r0 of list) {
        if (!Rec.valid(r0, type)) { stat.ungueltig++; continue; }
        const r = Rec.sanitize(r0);
        const local = this[name].get(r.id);
        const { rec, changed } = Rec.merge(local, r);
        if (changed) { out[name].push(rec); local ? stat.geaendert++ : stat.neu++; } else stat.unveraendert++;
      }
    }
    if (blobs.length) {
      const isJpeg = d => { try { const u = new Uint8Array(d, 0, 2); return u[0] === 0xFF && u[1] === 0xD8; } catch (e) { return false; } };
      for (const bl of blobs) {
        if (!bl || typeof bl.id !== 'string' || !Rec.ID.test(bl.id) || have.has(bl.id) || !bl.full) continue;
        if (!isJpeg(bl.full)) { stat.ungueltig++; continue; }          // Bilddaten müssen ein JPEG sein (PDF bettet sie direkt ein)
        have.add(bl.id);
        out.fulls.push({ id: bl.id, d: bl.full }); out.thumbs.push({ id: bl.id, d: bl.thumb || bl.full }); stat.bilder++;
      }
    }
    if (out.shows.length + out.entries.length + out.photos.length + out.fulls.length + out.runs.length + out.house.length) await this._write(out, false);
    return stat;
  },
  /** Fotos, deren Bilddaten lokal fehlen (z. B. nach inkrementellem Paket) */
  async missingBlobs() {
    const have = await this.blobIds(); const miss = new Set();
    for (const p of this.photos.values()) if (!p.f.del && !have.has(p.b)) miss.add(p.b);
    if (Settings.v.depts.includes('R')) Req.blobRefs(this.liveShows(), [...this.house.values()]).forEach(b => { if (!have.has(b)) miss.add(b); });
    return [...miss];
  }
};

/* =====================================================================
   Photo – Zuschnitt 1:1, Kompression, Vorschaubild
   ===================================================================== */
const Photo = {
  THUMB_PX: 360,
  /** Datei/Blob → verarbeitetes Foto */
  async fromFile(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.decoding = 'async';
      img.src = url;
      try { await img.decode(); } catch (e) { await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('Bild konnte nicht gelesen werden (Format?)')); }); }
      return await this.fromDrawable(img, img.naturalWidth, img.naturalHeight);
    } finally { URL.revokeObjectURL(url); }
  },
  /** Zeichenbare Quelle (Image, Video, Canvas) mittig quadratisch zuschneiden */
  async fromDrawable(src, w, h) {
    if (!w || !h) throw new Error('Leeres Bild');
    const s = Math.min(w, h), sx = (w - s) / 2, sy = (h - s) / 2;
    const size = Math.min(s, Settings.v.maxPx);
    const c = document.createElement('canvas'); c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, sx, sy, s, s, 0, 0, size, size);
    try { return await this.fromCanvas(c); } finally { c.width = c.height = 0; }
  },
  /** Quadratischer Canvas → {b, w, h, full, thumb} */
  async fromCanvas(c) {
    const full = await this._jpeg(c, Settings.v.quality);
    const t = document.createElement('canvas'); t.width = t.height = this.THUMB_PX;
    const tctx = t.getContext('2d'); tctx.imageSmoothingQuality = 'high';
    tctx.drawImage(c, 0, 0, this.THUMB_PX, this.THUMB_PX);
    const thumb = await this._jpeg(t, 0.72);
    t.width = t.height = 0;
    return { b: Utils.uuid(), w: c.width, h: c.height, full, thumb };
  },
  _jpeg(canvas, q) {
    return new Promise((res, rej) => {
      canvas.toBlob(b => { if (!b) { rej(new Error('Kompression fehlgeschlagen (zu wenig Speicher?)')); return; } b.arrayBuffer().then(res, rej); }, 'image/jpeg', q);
    });
  },
  /** JPEG neu kodieren (für kompakte PDFs) */
  async recompress(buf, px, q) {
    const url = URL.createObjectURL(new Blob([buf], { type: 'image/jpeg' }));
    try {
      const img = new Image(); img.src = url; await img.decode();
      const size = Math.min(px, img.naturalWidth);
      const c = document.createElement('canvas'); c.width = Math.round(size); c.height = Math.round(size * img.naturalHeight / img.naturalWidth);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const out = await this._jpeg(c, q); const r = { d: out, w: c.width, h: c.height }; c.width = c.height = 0; return r;
    } finally { URL.revokeObjectURL(url); }
  }
};

/* =====================================================================
   Thumbs – Object-URL-Cache (LRU) + Lazy Loading per IntersectionObserver.
   Hält höchstens MAX URLs, ältere werden freigegeben (kein Speicherleck).
   ===================================================================== */
const Thumbs = {
  MAX: 500, map: new Map(), io: null,
  async url(b) {
    let e = this.map.get(b);
    if (e) { this.map.delete(b); this.map.set(b, e); return e.p; }    // als „zuletzt benutzt“ markieren
    e = { url: null, p: null };
    e.p = Repo.thumb(b).then(d => { if (!d) return null; e.url = URL.createObjectURL(new Blob([d], { type: 'image/jpeg' })); return e.url; });
    this.map.set(b, e);
    if (this.map.size > this.MAX) {
      const [k, old] = this.map.entries().next().value; this.map.delete(k);
      old.p.then(() => old.url && setTimeout(() => URL.revokeObjectURL(old.url), 4000));
    }
    return e.p;
  },
  /** Vorschaubild für ein <img data-b> laden, sobald es sichtbar wird */
  observe(root) {
    if (!this.io && 'IntersectionObserver' in window) {
      this.io = new IntersectionObserver(ents => ents.forEach(en => {
        if (en.isIntersecting) { this.io.unobserve(en.target); this.load(en.target); }
      }), { rootMargin: '600px 0px' });
    }
    root.querySelectorAll('img[data-b]:not([data-l])').forEach(img => {
      img.dataset.l = '1';
      if (this.io) this.io.observe(img); else this.load(img);
    });
  },
  async load(img) {
    const u = await this.url(img.dataset.b);
    if (!u || !img.isConnected) return;
    img.onload = () => img.classList.add('ok');
    img.src = u;
    if (img.complete && img.naturalWidth) img.classList.add('ok');
    if (img.dataset.hq) this.loadFull(img);
  },
  /* Volle Auflösung für die Großbild-Ansicht – eigener kleiner LRU-Cache (max. 40 Bilder) */
  fullMap: new Map(), FULL_MAX: 40,
  async loadFull(img) {
    const b = img.dataset.b; let e = this.fullMap.get(b);
    if (e) { this.fullMap.delete(b); this.fullMap.set(b, e); }
    else {
      e = { url: null }; this.fullMap.set(b, e);
      e.p = Repo.full(b).then(d => { if (d) e.url = URL.createObjectURL(new Blob([d], { type: 'image/jpeg' })); return e.url; });
      while (this.fullMap.size > this.FULL_MAX) {
        const [k, old] = this.fullMap.entries().next().value; this.fullMap.delete(k);
        old.p.then(() => old.url && setTimeout(() => URL.revokeObjectURL(old.url), 4000));
      }
    }
    const u = await e.p;
    if (u && img.isConnected) { const pre = new Image(); pre.onload = () => { if (img.isConnected) img.src = u; }; pre.src = u; }
  },
  /** Vorschaubild für eine im Editor neu aufgenommene, noch nicht gespeicherte Aufnahme */
  local(thumbBuf) { return URL.createObjectURL(new Blob([thumbBuf], { type: 'image/jpeg' })); }
};

/* =====================================================================
   Camera – Live-Vorschau 1:1 (getUserMedia), Serienaufnahme,
   Kategorie-Umschalter, Taschenlampe; Fallback: Datei-/System-Kamera.
   onShot(promise) wird SOFORT pro Auslösung aufgerufen; die Kompression
   läuft im Hintergrund, der Editor blockiert „Speichern“ bis sie fertig ist.
   ===================================================================== */
const Camera = {
  stream: null,
  supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && window.isSecureContext !== false; },
  /** Objektiv einer Kamera aus ihrer Bezeichnung bestimmen.
      iOS: „Back Ultra Wide Camera“, „Back Camera“, „Back Telephoto Camera“, dazu virtuelle
      „Back Dual/Triple Camera“ (wechseln selbst das Objektiv) und „Front Camera“.
      Android: „camera2 0, facing back“ … */
  lens(d) {
    const l = d.label || '';
    if (/front|user|facetime|vorder|selfie/i.test(l)) return { kind: 'front' };
    if (/ultra ?wide|ultraweit/i.test(l)) return { kind: 'lens', ord: 0, name: '0,5× Weitwinkel' };
    if (/tele/i.test(l)) return { kind: 'lens', ord: 2, name: 'Tele' };
    if (/dual|triple/i.test(l)) return { kind: 'virtual' };
    if (/back|rear|environment|rück/i.test(l)) return { kind: 'lens', ord: 1, name: '1× Normal' };
    return { kind: 'lens', ord: 3, name: '' };
  },
  /** Nur die Kameras auf der Rückseite, als einzelne Objektive (Selfie-Kamera und virtuelle Kombi-Kameras ausgeblendet) */
  async list() {
    let all = [];
    try { all = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput' && d.deviceId); } catch (e) { return []; }
    const backs = all.map(d => ({ d, ...this.lens(d) })).filter(x => x.kind === 'lens');
    backs.sort((a, b) => a.ord - b.ord);
    // gleich benannte (z. B. mehrere „facing back“ unter Android) durchnummerieren
    const seen = {};
    backs.forEach(x => { const n = x.name || 'Rückkamera'; seen[n] = (seen[n] || 0) + 1; x.name = n; });
    const cnt = {};
    backs.forEach(x => { if (seen[x.name] > 1) { cnt[x.name] = (cnt[x.name] || 0) + 1; x.name += ' ' + cnt[x.name]; } });
    return backs.map(x => ({ deviceId: x.d.deviceId, name: x.name }));
  },
  /** Kamera-App des Geräts öffnen (alle Objektive, Zoom, Blitz des Herstellers).
      Muss direkt im Tipp-Handler aufgerufen werden, sonst blockiert der Browser. */
  openSystem(opts) {
    return new Promise(resolve => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
      inp.style.cssText = 'position:fixed;left:-999px;top:0;opacity:0';
      document.body.appendChild(inp);
      let done = false;
      const finish = () => { if (done) return; done = true; window.removeEventListener('focus', onFocus); inp.remove(); resolve(); };
      inp.addEventListener('change', () => { [...inp.files].forEach(f => opts.onShot(Photo.fromFile(f), opts.kat || 'A')); finish(); });
      inp.addEventListener('cancel', finish);
      // ältere Browser kennen kein „cancel“: nach Rückkehr ohne Foto beenden
      const onFocus = () => setTimeout(() => { if (!inp.files || !inp.files.length) finish(); }, 1500);
      setTimeout(() => window.addEventListener('focus', onFocus), 500);
      inp.click();
    });
  },
  /** opts: {kat, startIndex, title, onShot(promise, kat), allowKatSwitch} → Promise(void) beim Schließen */
  open(opts) {
    if (Settings.v.camMode === 'system' && !opts.forceApp) return this.openSystem(opts);
    return new Promise(resolve => {
      const abt = DEPT[opts.abt] ? opts.abt : 'L', D = DEPT[abt];
      const canSwitch = opts.allowKatSwitch && D.photoKats.length > 1;     // Bühne: nur Aufbau, kein Umschalter
      let kat = D.photoKats.includes(opts.kat) ? opts.kat : 'A', count = 0, torch = false, devices = [], curId = Settings.v.cameraId || '';
      const el = document.createElement('div');
      el.className = 'cam'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Kamera'); el.dataset.abt = abt;
      el.innerHTML = `
        <div class="top">
          <button class="tbtn" data-a="close" aria-label="Kamera schließen">${I('close')}</button>
          <div class="ttl">${Utils.esc(opts.title || 'Foto aufnehmen')}</div>
          <button class="tbtn done" data-a="done">Fertig</button>
        </div>
        <div class="vf" data-k="${kat}"><video playsinline muted autoplay></video><div class="grid3"></div><div class="hintlbl"></div><div class="flash"></div></div>
        <div class="msg hidden"></div>
        <div class="camlist hidden" role="group" aria-label="Objektiv wählen"></div>
        <div class="camsys"><span class="camhint"></span><button class="tbtn" data-a="sys">${I('camera')} Geräte-Kamera · alle Objektive</button></div>
        ${canSwitch ? `<div class="katsw" role="group" aria-label="Phase">${D.photoKats.map(k =>
          `<button data-k="${k}" aria-pressed="${kat === k}" style="--kc:${katHex(abt, k)};--kci:${k === 'E' ? '#000' : '#fff'}">${Utils.esc(D.short + ' · ' + D.phases[k])}</button>`).join('')}</div>` : ''}
        <div class="ctrl">
          <button class="cbtn" data-a="file" aria-label="Foto aus Mediathek oder System-Kamera">${I('image')}</button>
          <button class="shutter" data-a="shot" aria-label="Auslösen"></button>
          <div style="display:flex;gap:10px">
            <button class="cbtn hidden" data-a="torch" aria-label="Taschenlampe" aria-pressed="false">${I('torch')}</button>
            <button class="cbtn" data-a="flip" aria-label="Nächstes Objektiv">${I('flip')}</button>
          </div>
        </div>
        <div class="strip" aria-label="Aufgenommene Fotos"></div>
        <input type="file" accept="image/*" multiple class="hidden">
        <input type="file" accept="image/*" capture="environment" class="hidden" data-sysin>`;
      const video = el.querySelector('video'), hint = el.querySelector('.hintlbl'), strip = el.querySelector('.strip');
      const msg = el.querySelector('.msg'), vf = el.querySelector('.vf'), fileIn = el.querySelector('input[type=file]');
      const camlist = el.querySelector('.camlist');
      const setHint = () => {
        const n = (opts.startIndex || 0) + count + 1;
        hint.textContent = abt === 'R' ? `${D.short} · Foto ${n}` : `${D.short} · ${D.phases[kat]} · Foto ${n}`;
        hint.style.background = katHex(abt, kat) + 'e0';
        hint.style.color = kat === 'E' ? '#000' : '#fff';
        vf.dataset.k = kat; vf.style.setProperty('--kc', katHex(abt, kat));
      };
      let zoom = null, zoomCur = 1;     // Android: eine logische Rückkamera, Objektivwechsel über Zoom
      const renderCams = () => {
        let html = '';
        if (devices.length > 1) html = devices.map(d => `<button data-cam="${Utils.esc(d.deviceId)}" aria-pressed="${d.deviceId === curId}">${Utils.esc(d.name)}</button>`).join('');
        else if (zoom) {
          const steps = [zoom.min, 1].filter(z => z >= zoom.min - 1e-6 && z <= zoom.max + 1e-6);
          if (steps.length > 1) html = steps.map(z => `<button data-zoom="${z}" aria-pressed="${Math.abs(z - zoomCur) < 0.01}">${String(Math.round(z * 10) / 10).replace('.', ',')}×</button>`).join('');
        }
        camlist.innerHTML = html;
        camlist.classList.toggle('hidden', !html);
        const lenses = devices.length > 1 || !!(zoom && html);
        el.querySelector('.camhint').textContent = lenses ? '' : 'Weitwinkel und Tele gibt dieses Gerät nicht an den Browser frei.';
        el.querySelector('[data-a=flip]').classList.toggle('hidden', devices.length < 2);
      };
      const stop = () => { if (this.stream) { this.stream.getTracks().forEach(t => t.stop()); this.stream = null; } video.srcObject = null; };
      const start = async () => {
        stop();
        if (!this.supported()) return fail('Live-Kamera ist hier nicht verfügbar (die Seite muss über https oder als installierte App laufen).');
        const base = { width: { ideal: 1920 }, height: { ideal: 1920 } };
        const tryGet = v => navigator.mediaDevices.getUserMedia({ audio: false, video: Object.assign({}, base, v) });
        try {
          try { this.stream = await tryGet(curId ? { deviceId: { exact: curId } } : { facingMode: { ideal: 'environment' } }); }
          catch (e) {
            if (!curId || e.name === 'NotAllowedError') throw e;
            curId = '';                                                     // gespeicherte Kamera gibt es nicht mehr → Rückkamera
            this.stream = await tryGet({ facingMode: { ideal: 'environment' } });
          }
          video.srcObject = this.stream; msg.classList.add('hidden'); vf.classList.remove('hidden');
          el.querySelector('.shutter').classList.remove('hidden');
          await video.play().catch(() => {});
          const tr = this.stream.getVideoTracks()[0];
          const st = tr && tr.getSettings ? tr.getSettings() : {};
          if (st.deviceId) curId = st.deviceId;
          const caps = tr && tr.getCapabilities ? tr.getCapabilities() : {};
          torch = false; el.querySelector('[data-a=torch]').setAttribute('aria-pressed', 'false');
          el.querySelector('[data-a=torch]').classList.toggle('hidden', !caps.torch);
          devices = await this.list();
          // läuft gerade eine Kamera, die nicht in der Auswahl steht (Selfie, virtuelle Kombi-Kamera),
          // einmalig auf das normale Objektiv wechseln
          if (devices.length && !devices.some(d => d.deviceId === curId) && !this._switched) {
            this._switched = true;
            curId = (devices.find(d => d.name.startsWith('1×')) || devices[0]).deviceId;
            return start();
          }
          // Zoom nur anbieten, wenn das Gerät darüber das Weitwinkel-Objektiv erreicht (Zoom < 1×).
          // Reiner Digitalzoom (Bildausschnitt vergrößern) bringt nichts und wird nicht angeboten.
          zoom = caps.zoom && caps.zoom.min < 0.95 ? caps.zoom : null;
          zoomCur = st.zoom || 1;
          renderCams();
          if (curId && curId !== Settings.v.cameraId) Settings.set({ cameraId: curId }).catch(() => {});
        } catch (e) {
          fail(e && e.name === 'NotAllowedError' ? 'Der Kamerazugriff wurde verweigert. Du kannst ihn in den Browser-Einstellungen erlauben – oder Fotos über die System-Kamera aufnehmen.' :
            'Die Kamera konnte nicht gestartet werden. Nutze die System-Kamera bzw. die Mediathek.');
        }
      };
      const fail = text => {
        vf.classList.add('hidden'); msg.classList.remove('hidden');
        msg.innerHTML = `<p>${Utils.esc(text)}</p><p><button class="tbtn done" data-a="file2">${I('camera')} System-Kamera / Mediathek</button></p>`;
        el.querySelector('.shutter').classList.add('hidden');
      };
      const addThumb = (p, k) => {
        const im = document.createElement('img'); im.alt = ''; im.dataset.k = k; im.style.borderColor = katHex(abt, k);
        strip.appendChild(im); strip.scrollLeft = strip.scrollWidth;
        p.then(r => { im.src = Thumbs.local(r.thumb); }).catch(() => im.remove());
      };
      const shoot = () => {
        if (!video.videoWidth) return;
        const w = video.videoWidth, h = video.videoHeight, s = Math.min(w, h);
        const c = document.createElement('canvas'); const size = Math.min(s, Settings.v.maxPx);
        c.width = c.height = size;
        c.getContext('2d').drawImage(video, (w - s) / 2, (h - s) / 2, s, s, 0, 0, size, size);
        const flash = el.querySelector('.flash'); flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
        if (navigator.vibrate) navigator.vibrate(15);
        const p = Photo.fromCanvas(c).finally(() => { c.width = c.height = 0; });
        opts.onShot(p, kat); addThumb(p, kat); count++; setHint();
        if (!Settings.v.burst) close();
      };
      const fromFiles = files => {
        [...files].forEach(f => { const p = Photo.fromFile(f); opts.onShot(p, kat); addThumb(p, kat); count++; });
        setHint(); if (!Settings.v.burst || !this.stream) close();
      };
      let layer;
      const close = () => { stop(); document.removeEventListener('visibilitychange', vis); layer && layer.close(); resolve(); };
      const vis = () => { if (document.hidden) stop(); else if (!this.stream && !vf.classList.contains('hidden')) start(); };
      el.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        const a = b.dataset.a;
        if (b.dataset.k) { kat = b.dataset.k; el.querySelectorAll('.katsw button').forEach(x => x.setAttribute('aria-pressed', x.dataset.k === kat)); setHint(); return; }
        if (b.dataset.cam) { if (b.dataset.cam !== curId) { curId = b.dataset.cam; start(); } return; }
        if (b.dataset.zoom) {
          const z = +b.dataset.zoom, tr = this.stream && this.stream.getVideoTracks()[0];
          if (tr) tr.applyConstraints({ advanced: [{ zoom: z }] }).then(() => { zoomCur = z; renderCams(); }).catch(() => Ui.toast('Zoom nicht verfügbar', 'warn'));
          return;
        }
        if (a === 'close' || a === 'done') close();
        else if (a === 'shot') shoot();
        else if (a === 'file' || a === 'file2') { fileIn.value = ''; fileIn.click(); }
        else if (a === 'sys') { sysIn.value = ''; sysIn.click(); }
        else if (a === 'flip') {
          if (devices.length > 1) { const i = devices.findIndex(d => d.deviceId === curId); curId = devices[(i + 1) % devices.length].deviceId; }
          start();
        }
        else if (a === 'torch') {
          torch = !torch; b.setAttribute('aria-pressed', torch);
          const tr = this.stream && this.stream.getVideoTracks()[0];
          tr && tr.applyConstraints({ advanced: [{ torch }] }).catch(() => Ui.toast('Taschenlampe nicht verfügbar', 'warn'));
        }
      });
      fileIn.addEventListener('change', () => fileIn.files.length && fromFiles(fileIn.files));
      const sysIn = el.querySelector('[data-sysin]');
      sysIn.addEventListener('change', () => { if (sysIn.files.length) { const keep = Settings.v.burst; fromFiles(sysIn.files); if (keep && this.stream) setHint(); } });
      el.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { if (e.target.tagName !== 'BUTTON') { e.preventDefault(); shoot(); } } });
      document.addEventListener('visibilitychange', vis);
      layer = Ui.layer(el, { onBack: () => { stop(); document.removeEventListener('visibilitychange', vis); resolve(); return true; } });
      this._switched = false;
      setHint(); start();
      el.querySelector('.shutter').focus();
    });
  }
};

/* =====================================================================
   Annotator – Pfeil / Kreis / Freihand auf ein Foto zeichnen.
   Ergebnis ist ein NEUES Foto (Bilddaten sind unveränderlich → sync-sicher).
   ===================================================================== */
const Annotator = {
  open(fullBuf) {
    return new Promise(async resolve => {
      const url = URL.createObjectURL(new Blob([fullBuf], { type: 'image/jpeg' }));
      const img = new Image(); img.src = url;
      try { await img.decode(); } catch (e) { URL.revokeObjectURL(url); Ui.toast('Bild konnte nicht geöffnet werden', 'err'); resolve(null); return; }
      const W = img.naturalWidth, H = img.naturalHeight;
      let tool = 'arrow', color = '#ff2d2d'; const strokes = []; let cur = null;
      const el = document.createElement('div'); el.className = 'ann'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Foto markieren');
      el.innerHTML = `<div class="abar"><button class="btn ghost" data-a="cancel" style="color:#fff">Abbrechen</button><div class="sp"></div>
          <button class="btn ghost" data-a="undo" style="color:#fff" aria-label="Rückgängig">${I('undo')}</button>
          <button class="btn primary" data-a="save" style="background:#fff;color:#000;border-color:#fff">Übernehmen</button></div>
        <div class="canvaswrap"><canvas width="${W}" height="${H}" aria-label="Zeichenfläche"></canvas></div>
        <div class="tools">
          <button data-t="arrow" aria-pressed="true">${I('arrow')} Pfeil</button>
          <button data-t="circle" aria-pressed="false">${I('circle')} Kreis</button>
          <button data-t="pen" aria-pressed="false">${I('pen')} Stift</button>
          <button class="col" data-c="#ff2d2d" aria-label="Rot" aria-pressed="true"><i style="background:#ff2d2d"></i></button>
          <button class="col" data-c="#ffd400" aria-label="Gelb" aria-pressed="false"><i style="background:#ffd400"></i></button>
          <button class="col" data-c="#ffffff" aria-label="Weiß" aria-pressed="false"><i style="background:#fff"></i></button>
          <button class="col" data-c="#22d3ee" aria-label="Türkis" aria-pressed="false"><i style="background:#22d3ee"></i></button>
        </div>`;
      const cv = el.querySelector('canvas'), ctx = cv.getContext('2d');
      const lw = Math.max(4, W / 110);
      const drawStroke = s => {
        ctx.save(); ctx.strokeStyle = s.color; ctx.fillStyle = s.color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = lw * 0.8;
        const [a, b] = [s.pts[0], s.pts[s.pts.length - 1]];
        if (s.tool === 'pen') { ctx.beginPath(); s.pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); }
        else if (s.tool === 'circle') {
          ctx.beginPath(); ctx.ellipse((a.x + b.x) / 2, (a.y + b.y) / 2, Math.abs(b.x - a.x) / 2 + 1, Math.abs(b.y - a.y) / 2 + 1, 0, 0, Math.PI * 2); ctx.stroke();
        } else {
          const ang = Math.atan2(b.y - a.y, b.x - a.x), hl = lw * 4.5;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x - Math.cos(ang) * hl * .6, b.y - Math.sin(ang) * hl * .6); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(b.x, b.y);
          ctx.lineTo(b.x - hl * Math.cos(ang - 0.45), b.y - hl * Math.sin(ang - 0.45));
          ctx.lineTo(b.x - hl * Math.cos(ang + 0.45), b.y - hl * Math.sin(ang + 0.45)); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      };
      const redraw = () => { ctx.drawImage(img, 0, 0); strokes.forEach(drawStroke); if (cur) drawStroke(cur); };
      const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
      cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); cur = { tool, color, pts: [pt(e)] }; });
      cv.addEventListener('pointermove', e => { if (!cur) return; const p = pt(e); if (tool === 'pen') cur.pts.push(p); else cur.pts[1] = p; redraw(); });
      const end = () => { if (cur && cur.pts.length > 1) strokes.push(cur); cur = null; redraw(); };
      cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
      let layer;
      const finish = r => { URL.revokeObjectURL(url); layer.close(); resolve(r); };
      el.addEventListener('click', async e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.t) { tool = b.dataset.t; el.querySelectorAll('[data-t]').forEach(x => x.setAttribute('aria-pressed', x === b)); }
        else if (b.dataset.c) { color = b.dataset.c; el.querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', x === b)); }
        else if (b.dataset.a === 'undo') { strokes.pop(); redraw(); }
        else if (b.dataset.a === 'cancel') finish(null);
        else if (b.dataset.a === 'save') {
          if (!strokes.length) { finish(null); return; }
          b.disabled = true;
          try { finish(await Photo.fromCanvas(cv)); } catch (err) { b.disabled = false; Ui.toast(err.message, 'err'); }
        }
      });
      layer = Ui.layer(el, { onBack: () => { URL.revokeObjectURL(url); resolve(null); return true; } });
      redraw();
    });
  }
};

/* =====================================================================
   Lightbox – Vollbild-Galerie: Pinch-Zoom, Doppeltipp, Wischen (links/rechts
   = blättern, hoch/runter = schließen), große Info-Einblendung.
   items: [{b, entryId, kat, idx, n}]
   ===================================================================== */
const Lightbox = {
  open(items, start = 0) {
    if (!items.length) return;
    let i = start, st = { s: 1, x: 0, y: 0 }, fullUrl = null;
    const el = document.createElement('div'); el.className = 'lbx'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Fotoansicht');
    el.tabIndex = -1;
    el.innerHTML = `<div class="stage"><img alt=""></div>
      <div class="bar"><button class="lbtn" data-a="close" aria-label="Schließen">${I('close')}</button><div class="pos" aria-live="polite"></div>
        <span style="width:52px"></span></div>
      <button class="nav prev" data-a="prev" aria-label="Vorheriges Foto">${I('arrowL')}</button>
      <button class="nav next" data-a="next" aria-label="Nächstes Foto">${I('arrowR')}</button>
      <div class="infos"></div>
      <button class="nextk" data-a="nextk" aria-label="Zum nächsten Eintrag">Nächster Eintrag ${I('arrowR', 'sm')}</button>`;
    const img = el.querySelector('img'), stage = el.querySelector('.stage'), infos = el.querySelector('.infos'), pos = el.querySelector('.pos');
    const apply = (anim) => {
      img.style.transition = anim ? 'transform .22s ease' : 'none';
      img.style.transform = `translate(${st.x}px,${st.y}px) scale(${st.s})`;
    };
    const reset = (anim) => { st = { s: 1, x: 0, y: 0 }; apply(anim); img.style.opacity = '1'; stage.style.opacity = 1; };
    /* Kreis-Schlüssel eines Fotos: gleicher Eintrag + gleiche Kategorie = gleiche Karte */
    const keyOf = it => (it.entryId || '') + ':' + it.kat;
    const nextKreisIdx = () => { const k = keyOf(items[i]); for (let j = i + 1; j < items.length; j++) if (keyOf(items[j]) !== k) return j; return -1; };
    let seq = 0;
    /** Foto anzeigen. dir = Blätterrichtung (−1/1) für das Hereingleiten, 0 = ohne Animation */
    const show = async (dir = 0) => {
      const my = ++seq, it = items[i];
      pos.textContent = `${i + 1} / ${items.length}`;
      el.querySelector('.nav.prev').disabled = i === 0; el.querySelector('.nav.next').disabled = i === items.length - 1;
      el.querySelectorAll('.nav').forEach(n => n.classList.toggle('hidden', items.length < 2));
      el.querySelector('.nextk').classList.toggle('hidden', nextKreisIdx() < 0);
      const e = it.draftF ? { f: Object.assign({ abt: it.draftAbt }, it.draftF), showId: it.entryId && Repo.entries.get(it.entryId) ? Repo.entries.get(it.entryId).showId : App.state.showId } : (Repo.entries.get(it.entryId) || { f: {} });
      const abt = abtOf(e), D = DEPT[abt], mv = mainVal(e);
      el.dataset.abt = abt;
      const chips = infoKeys(abt, true).filter(k => entryVal(e, k))
        .map(k => `<span class="chip"><b>${Utils.esc(fieldLabel(abt, k))}</b><span>${Utils.esc(entryVal(e, k))}</span></span>`).join('');
      infos.innerHTML = `<div class="row1">${tagHtml(abt, it.kat)}
          <span class="kreis"><small style="color:#bbb">${Utils.esc(D.mainLabel)}</small>${mv ? Utils.esc(mv) : '<span class="muted">ohne</span>'}</span>
          <span class="muted mono">Foto ${it.idx + 1}/${it.n}</span></div>
        ${it.cap ? `<div class="lcap">${Utils.esc(it.cap)}</div>` : ''}
        ${chips ? `<div class="chips" style="margin-top:8px">${chips}</div>` : ''}
        ${e.f.bemerkung ? `<div class="note">${Utils.esc(e.f.bemerkung)}</div>` : ''}`;
      fitStage();
      // Vorschaubild erst vollständig dekodieren, dann tauschen – kein Aufblitzen, kein halbes Bild
      const tu = it.thumbUrl || await Thumbs.url(it.b); if (my !== seq) return;
      if (tu) { const pre = new Image(); pre.src = tu; try { await pre.decode(); } catch (_) { /* egal */ } if (my !== seq) return; }
      st = { s: 1, x: 0, y: 0 }; stage.style.opacity = 1;
      img.style.transition = 'none'; img.style.opacity = dir ? '0' : '1';
      img.style.transform = `translate(${dir * 60}px,0) scale(1)`;
      if (tu) img.src = tu;
      if (dir) { void img.offsetWidth; img.style.transition = 'transform .2s ease-out, opacity .2s ease-out'; img.style.opacity = '1'; img.style.transform = 'translate(0px,0px) scale(1)'; }
      // Nachbarn vorladen, damit das Blättern sofort geht
      [items[i + 1], items[i - 1]].forEach(n => { if (n && !n.thumbUrl) Thumbs.url(n.b); });
      const d = it.buf || await Repo.full(it.b); if (my !== seq || !d) return;
      const u = URL.createObjectURL(new Blob([d], { type: 'image/jpeg' }));
      const pre = new Image(); pre.src = u;
      try { await pre.decode(); } catch (_) { /* egal */ }
      if (my !== seq) { URL.revokeObjectURL(u); return; }
      img.src = u; if (fullUrl) URL.revokeObjectURL(fullUrl); fullUrl = u;
    };
    /** Zu Foto n wechseln: altes Bild gleitet hinaus, neues herein */
    const goTo = n => {
      if (n < 0 || n >= items.length || n === i) { reset(true); return; }
      const d = n > i ? 1 : -1; i = n; seq++;
      img.style.transition = 'transform .14s ease-in, opacity .14s ease-in';
      img.style.opacity = '0'; img.style.transform = `translate(${-d * 60}px,0) scale(1)`;
      const mySeq = seq; setTimeout(() => { if (mySeq === seq) show(d); }, 130);
    };
    const go = d => goTo(i + d);
    let layer;
    const close = () => { if (fullUrl) URL.revokeObjectURL(fullUrl); layer.close(); };
    /* Informationen sind immer eingeblendet; das Foto wird zwischen Kopfleiste und Infoblock eingepasst */
    const fitStage = () => {
      const t = el.querySelector('.bar').offsetHeight, bt = infos.offsetHeight;
      stage.style.top = t + 'px'; stage.style.bottom = bt + 'px';
      // Pfeile an fester Stelle (unabhängig von der Länge der Infos): unteres Drittel über dem größtmöglichen Infoblock
      const navTop = t + (el.clientHeight * 0.58 - t) * 5 / 6;
      el.querySelectorAll('.nav').forEach(n => { n.style.top = navTop + 'px'; });
    };
    // ---- Gesten ----
    const ptrs = new Map(); let g = null, lastTap = 0;
    const base = () => ({ x: img.offsetLeft + stage.offsetLeft, y: img.offsetTop + stage.offsetTop });
    const zoomAt = (px, py, s2) => {
      s2 = Math.min(6, Math.max(1, s2)); const b = base();
      const ux = (px - b.x - st.x) / st.s, uy = (py - b.y - st.y) / st.s;
      st.x = px - b.x - ux * s2; st.y = py - b.y - uy * s2; st.s = s2;
      if (s2 === 1) { st.x = 0; st.y = 0; }
    };
    el.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      el.setPointerCapture && el.setPointerCapture(e.pointerId);
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (ptrs.size === 1) g = { mode: 'drag', sx: e.clientX, sy: e.clientY, ox: st.x, oy: st.y, moved: false, t: Date.now() };
      else if (ptrs.size === 2) {
        const [a, b] = [...ptrs.values()];
        g = { mode: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), s0: st.s, moved: true };
      }
    });
    el.addEventListener('pointermove', e => {
      if (!ptrs.has(e.pointerId) || !g) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (g.mode === 'pinch' && ptrs.size >= 2) {
        const [a, b] = [...ptrs.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, g.s0 * d / g.d0); apply(false);
      } else if (g.mode === 'drag') {
        const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
        if (Math.abs(dx) + Math.abs(dy) > 8) g.moved = true;
        if (st.s > 1) { st.x = g.ox + dx; st.y = g.oy + dy; apply(false); }
        else {
          if (!g.axis && g.moved) g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
          if (g.axis === 'x') { img.style.transition = 'none'; img.style.transform = `translate(${dx}px,0)`; }
          if (g.axis === 'y') { img.style.transition = 'none'; img.style.transform = `translate(0,${dy}px) scale(${1 - Math.min(.3, Math.abs(dy) / 1200)})`; stage.style.opacity = String(1 - Math.min(.6, Math.abs(dy) / 500)); }
        }
      }
    });
    const up = e => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.delete(e.pointerId);
      if (!g) return;
      if (g.mode === 'pinch') { if (ptrs.size === 0) { if (st.s < 1.05) reset(true); g = null; } else { const [p] = [...ptrs.values()]; g = { mode: 'drag', sx: p.x, sy: p.y, ox: st.x, oy: st.y, moved: true }; } return; }
      const dx = e.clientX - g.sx, dy = e.clientY - g.sy;
      if (!g.moved) {
        const now = Date.now();
        if (now - lastTap < 300) { zoomAt(e.clientX, e.clientY, st.s > 1 ? 1 : 2.5); apply(true); lastTap = 0; }
        else lastTap = now;
      } else if (st.s <= 1) {
        if (g.axis === 'x' && Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
        else if (g.axis === 'y' && Math.abs(dy) > 90) close();
        else reset(true);
      }
      g = null;
    };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, st.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); apply(false); }, { passive: false });
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      ({ close, prev: () => go(-1), next: () => go(1), nextk: () => { const j = nextKreisIdx(); if (j >= 0) goTo(j); } })[b.dataset.a]?.();
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
      else if (e.key === '+') { zoomAt(innerWidth / 2, innerHeight / 2, st.s * 1.4); apply(true); }
      else if (e.key === '-') { zoomAt(innerWidth / 2, innerHeight / 2, st.s / 1.4); apply(true); }
    });
    const onRs = () => { if (!el.isConnected) { removeEventListener('resize', onRs); return; } fitStage(); reset(false); };
    addEventListener('resize', onRs);
    layer = Ui.layer(el, { onBack: () => { if (fullUrl) URL.revokeObjectURL(fullUrl); return true; } });
    el.focus();
    show();
  }
};

/* =====================================================================
   QR – eigener Generator (Byte-Modus, Version 1–40, Fehlerkorrektur L/M)
   und eigener Decoder (Bild → Text) als Fallback, wenn der Browser keine
   BarcodeDetector-API hat (Safari auf iPad/iPhone!).
   Struktur des Generators angelehnt an die Referenzimplementierung von
   Project Nayuki (MIT), Decoder nach dem bekannten ZXing-Prinzip:
   Finder-Muster suchen → Perspektive entzerren → Format lesen →
   Maske entfernen → Reed-Solomon-Korrektur → Segmente lesen.
   ===================================================================== */
/*QR-BEGIN*/
const QR = (() => {

    // ---- Sammelseite: Einträge ohne Fotos untereinander ----

    const xrefPos = offset;

  /** Zeichenfläche (Content-Stream als Binär-String) – von build() und _writer() genutzt */
  _canvas() {
    let s = '';
    const self = this;
    const api = {
      rgb: (r, g, b, stroke) => { s += `${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} ${stroke ? 'RG' : 'rg'}\n`; return api; },
      rect: (x, y, w, h, mode = 'f') => { s += `${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${mode}\n`; return api; },
      line: (x1, y1, x2, y2, lw = 0.6) => { s += `${lw} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S\n`; return api; },
      text: (x, y, str, font = 'F1', size = 11) => { s += `BT /${font} ${size} Tf ${x.toFixed(2)} ${y.toFixed(2)} Td (${self.esc(self.win(str))}) Tj ET\n`; return api; },
      textR: (xr, y, str, font, size) => api.text(xr - self.width(str, font, size), y, str, font, size),
      img: (name, x, y, w, h) => { s += `q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /${name} Do Q\n`; return api; },
      get: () => s
    };
    return api;
  },
  /** Zeichenfläche, die nichts aufzeichnet (nur zum Ausmessen) */
  _nullC() { const api = new Proxy({}, { get: (t, k) => k === 'get' ? () => '' : () => api }); return api; },

  /** kleiner Schreiber für Textseiten (Protokolle): Seiten zeichnen, dann finish() → Blob */
  _writer(title) {
    const { W, H } = this, self = this;
    const parts = []; let offset = 0; const xref = []; let nextId = 5; const pageIds = [];
    const enc = s => { const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 255; return u; };
    const put = d => { const u = typeof d === 'string' ? enc(d) : new Uint8Array(d); parts.push(u); offset += u.length; };
    const obj = (id, body) => { xref[id] = offset; put(`${id} 0 obj\n`); put(body); put('\nendobj\n'); };
    put('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const C = () => {
      let s = '';
      const api = {
        rgb: (r, g, b, stroke) => { s += `${r.toFixed(3)} ${g.toFixed(3)} ${b.toFixed(3)} ${stroke ? 'RG' : 'rg'}\n`; return api; },
        rect: (x, y, w, h, mode = 'f') => { s += `${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re ${mode}\n`; return api; },
        line: (x1, y1, x2, y2, lw = 0.6) => { s += `${lw} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S\n`; return api; },
        text: (x, y, str, font = 'F1', size = 11) => { s += `BT /${font} ${size} Tf ${x.toFixed(2)} ${y.toFixed(2)} Td (${self.esc(self.win(str))}) Tj ET\n`; return api; },
        textR: (xr, y, str, font, size) => api.text(xr - self.width(str, font, size), y, str, font, size),
        get: () => s
      };
      return api;
    };
    return {
      C,
      page(content) { const cid = nextId++, pid = nextId++; obj(cid, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
        obj(pid, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Contents ${cid} 0 R /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> >>`); pageIds.push(pid); },
      finish() {
        obj(1, `<< /Type /Catalog /Pages 2 0 R /ViewerPreferences << /DisplayDocTitle true >> >>`);
        obj(2, `<< /Type /Pages /Kids [${pageIds.map(id => id + ' 0 R').join(' ')}] /Count ${pageIds.length} >>`);
        obj(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
        obj(4, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
        const infoId = nextId++, ps = v => '(' + self.esc(self.win(v)) + ')';
        obj(infoId, `<< /Title ${ps(title)} /Producer ${ps('Doku VT ' + APP_VERSION)} /Creator ${ps('Doku VT')} >>`);
        self.lastPages = pageIds.length;
        const xrefPos = offset;
        let x = `xref\n0 ${nextId}\n0000000000 65535 f \n`;
        for (let i = 1; i < nextId; i++) x += (xref[i] != null ? String(xref[i]).padStart(10, '0') + ' 00000 n ' : '0000000000 65535 f ') + '\n';
