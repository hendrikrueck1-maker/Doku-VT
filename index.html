        const ins = [...form.querySelectorAll('input:not([type=checkbox]),textarea')]; const i = ins.indexOf(e.target);
        if (ins[i + 1]) ins[i + 1].focus(); else e.target.blur();
      }
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
    });

    /* ---- Fotos ---- */
    const saveBtns = () => sh.el.querySelectorAll('[data-act=save]');
    const updateSave = () => {
      const busy = pending > 0 || saving;
      saveBtns().forEach(b => { b.disabled = busy; });
      saveBtn.querySelector('.sl').textContent = pending > 0 ? `Fotos werden verarbeitet (${pending})` : saving ? 'Speichert …' : 'Speichern';
      const ic = saveBtn.querySelector('svg, .spinner');
      if (busy !== ic.classList.contains('spinner')) ic.outerHTML = busy ? '<span class="spinner"></span>' : I('check');
    };
    const pname = k => isR ? 'Fotos' : D.phases[k];
    const slotEl = (s, k) => {
      if (s.el) return s.el;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'slot';
      b.innerHTML = `<img alt=""><span class="lbl"></span>${s.pending ? '<span class="busy"><span class="spinner"></span></span>' : ''}`;
      const img = b.querySelector('img');
      if (s.thumbUrl) img.src = s.thumbUrl; else if (s.b) Thumbs.url(s.b).then(u => { if (u) img.src = u; });
      b.addEventListener('click', () => slotMenu(s));
      s.el = b; return b;
    };
    const renderGrid = k => {
      const g = form.querySelector(`.pgrid[data-k="${k}"]`); if (!g) return;
      const list = slots[k];
      list.forEach((s, i) => {
        const el = slotEl(s, k);
        el.querySelector('.lbl').textContent = isR && s.cap ? `${i + 1} · ${s.cap}` : `${i + 1}`;
        el.setAttribute('aria-label', `${pname(k)} Foto ${i + 1} – Optionen`);
      });
      let add = g.querySelector('.slot.add');
      if (!add) {
        add = document.createElement('button'); add.type = 'button'; add.className = 'slot add';
        add.addEventListener('click', () => shoot(k));
      }
      const n = list.length;
      add.innerHTML = `<span class="plus">${I('plus')}</span>Foto ${n + 1}`;
      add.setAttribute('aria-label', `${pname(k)}: Foto ${n + 1} aufnehmen`);
      g.replaceChildren(...list.map(s => s.el), add);
      const sec = form.querySelector(`.pk[data-k="${k}"]`);
      sec.querySelector('h3').textContent = ''; sec.querySelector('.n').textContent = `${n} Foto${n === 1 ? '' : 's'}`;
    };
    const addPending = (promise, k, at = null) => {
      if (!D.photoKats.includes(k)) k = 'A';
      const s = { pending: true }; pending++; updateSave();
      if (at != null) slots[k].splice(at, 0, s); else slots[k].push(s);
      renderGrid(k); markDirty();
      promise.then(r => {
        Object.assign(s, r, { pending: false, thumbUrl: Thumbs.local(r.thumb) });
        if (s.el) { s.el.querySelector('img').src = s.thumbUrl; const bz = s.el.querySelector('.busy'); bz && bz.remove(); }
      }).catch(err => {
        const kk = slots.A.includes(s) ? 'A' : 'E';
        slots[kk].splice(slots[kk].indexOf(s), 1); renderGrid(kk);
        Ui.toast('Foto konnte nicht verarbeitet werden: ' + err.message, 'err');
      }).finally(() => { pending--; updateSave(); });
    };
    const camTitle = () => isR ? (kreisIn.value || 'Neuer Gegenstand') : kreisIn.value ? `${D.mainLabel} ${kreisIn.value}` : `Neuer Eintrag ${D.short}`;
    const shoot = k => Camera.open({
      abt: A, kat: k, startIndex: slots[k].length, title: camTitle(),
      allowKatSwitch: true, onShot: (p, kk) => addPending(p, kk)
    });
    const slotMenu = async s => {
      if (s.pending) return;
      const k = slots.A.includes(s) ? 'A' : 'E', list = slots[k], i = list.indexOf(s), other = k === 'A' ? 'E' : 'A';
      const v = await Ui.menu(`${pname(k)} · Foto ${i + 1}`, [
        { label: 'Ansehen', value: 'view', icon: 'eye' },
        { label: 'Markieren (Pfeil/Kreis)', value: 'ann', icon: 'pen' },
        { label: 'Ersetzen (neu aufnehmen)', value: 'rep', icon: 'replace' },
        i > 0 && { label: 'Nach vorn', value: 'left', icon: 'arrowL' },
        i < list.length - 1 && { label: 'Nach hinten', value: 'right', icon: 'arrowR' },
        D.photoKats.length > 1 && { label: `Zu „${pname(other)}“ verschieben`, value: 'move', icon: 'layers' },
        isR && { label: s.cap ? 'Bildunterschrift ändern' : 'Bildunterschrift', value: 'cap', icon: 'edit' },
        { label: 'Foto entfernen', value: 'del', icon: 'trash', danger: true }
      ]);
      if (!v) return;
      markDirty();
      if (v === 'view') Lightbox.open(list.map((x, j) => ({ b: x.b, buf: x.full, thumbUrl: x.thumbUrl, entryId: entryId, kat: k, idx: j, n: list.length, draftF: readForm(), draftAbt: A, cap: x.cap || '' })), i);
      else if (v === 'cap') { await Ui.afterBack(); const t = await Ui.prompt('Bildunterschrift', s.cap || '', 'z. B. von hinter dem Gitter Richtung Publikum'); if (t != null) { s.cap = t.trim(); renderGrid(k); } }
      else if (v === 'left' || v === 'right') { const j = v === 'left' ? i - 1 : i + 1; [list[i], list[j]] = [list[j], list[i]]; renderGrid(k); }
      else if (v === 'move') { list.splice(i, 1); slots[other].push(s); renderGrid(k); renderGrid(other); }
      else if (v === 'del') { list.splice(i, 1); renderGrid(k); }
      else if (v === 'rep') {
        let got = null;
        await Camera.open({ abt: A, kat: k, startIndex: i, title: `Foto ${i + 1} ersetzen`, onShot: p => { if (!got) { got = p; } }, allowKatSwitch: false });
        if (got) { list.splice(i, 1); addPending(got, k, i); }
      } else if (v === 'ann') {
        const buf = s.full || await Repo.full(s.b);
        if (!buf) { Ui.toast('Bilddaten fehlen auf diesem Gerät', 'err'); return; }
        const r = await Annotator.open(buf);
        if (r) { const idx = list.indexOf(s); list.splice(idx, 1); addPending(Promise.resolve(r), k, idx); }
      }
    };
    const readForm = () => {
      if (isR) return Req.readForm(form, rs, showId);
      const f = {};
      D.fields.forEach(fd => { const el = form.elements[fd.k]; if (el) f[fd.k] = fd.bool ? el.checked : el.value; });
      if (mainFd.picker && f.zugId) { f.ebene = ''; f.bereich = ''; }          // bei Zug aus der Liste gelten dessen Ebene/Bereich
      return f;
    };

    /* ---- Speichern ---- */
    const save = async (next = false) => {
      if (pending > 0 || saving) return;
      const f = readForm();
      const empty = !D.fields.some(fd => fd.bool ? false : fd.arr ? (f[fd.k] || []).length : String(f[fd.k] || '').trim()) && !slots.A.length && !slots.E.length;
      if (empty && !ex) { dirty = false; sh.close(); return; }
      if (isR && !String(f.was || '').trim() && !slots.A.length) {      // Requisite: Name ODER Foto genügt
        kreisIn.focus(); Ui.toast('Bitte einen Namen eintragen oder ein Foto aufnehmen.', 'warn'); return;
      }
      if (mainFd.req && !String(f[MAIN] || '').trim()) {              // Pflichtfeld (Bühne: Zug / Position)
        const fm = kreisIn.closest('.f'); fm.classList.add('invalid'); kreisIn.focus();
        Ui.toast(`${mainFd.label} fehlt – ohne lässt sich nicht speichern.`, 'warn'); return;
      }
      saving = true; updateSave();
      // Bestehender Eintrag: nur Felder schreiben, die HIER geändert wurden. Was ein anderes Gerät inzwischen
      // geändert hat (Live-Abgleich), bleibt stehen, statt mit dem Stand vom Öffnen überschrieben zu werden.
      const fAll = Object.assign({}, f);
      if (ex && initForm) {
        const norm = (fd, v) => fd.bool ? !!v : (fd.plus ? Utils.normKreis(v) : String(v ?? '').trim());
        for (const fd of D.fields) if (fd.k in f && fd.k in initForm && (fd.arr ? JSON.stringify(f[fd.k] || []) === JSON.stringify(initForm[fd.k] || []) : norm(fd, f[fd.k]) === norm(fd, initForm[fd.k]))) delete f[fd.k];
      }
      try {
        const draft = { id: ex ? ex.id : null, showId, abt: A, f, photos: { A: slots.A.map(clean), E: slots.E.map(clean) }, initialPhotos };
        const res = await Repo.saveDraft(draft);
        dirty = false;
        slots.A.concat(slots.E).forEach(s => s.thumbUrl && URL.revokeObjectURL(s.thumbUrl));
        sh.close();
        App.state.sel = null; App.selectEntry(res.entryId);
        const mv = mainFd.plus ? Utils.normKreis(fAll[MAIN]) : String(fAll[MAIN] || '').trim();
        if (isR) { Editor._afterSaveR(showId, res.entryId, fAll, !!ex, next); return; }
        if (res.mergedInto) Ui.toast(`${D.mainLabel} ${mv} gab es schon – Einträge wurden zusammengeführt.${res.mergeNotes.length ? ' ' + res.mergeNotes.join('; ') : ''}`, 'warn', { ms: 7000 });
        else Ui.toast(ex ? 'Gespeichert' : `${D.short}: ${D.mainLabel} ${mv || '(ohne Nummer)'} angelegt`);
      } catch (err) {
        saving = false; updateSave();
        App.error(err);
      }
    };
    const clean = s => ({ photoId: s.photoId || null, b: s.b, w: s.w, h: s.h, full: s.photoId ? undefined : s.full, thumb: s.photoId ? undefined : s.thumb, label: s.label || '', cap: s.cap || '' });

    sh.el.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const a = b.dataset.act;
      if (a === 'save') save();
      else if (a === 'savenext') save(true);
      else if (a === 'cancel') history.back();
      else if (a === 'cam') shoot(b.dataset.k);
      else if (a === 'plus') {
        const v = kreisIn.value, st = kreisIn.selectionStart ?? v.length, en = kreisIn.selectionEnd ?? v.length;
        kreisIn.value = v.slice(0, st) + '+' + v.slice(en); kreisIn.focus(); kreisIn.setSelectionRange(st + 1, st + 1); markDirty();
      } else if (a === 'del') {
        if (await Ui.confirm(isR ? 'Gegenstand löschen?' : 'Eintrag löschen?', `${isR ? `„${ex.f.was || 'Ohne Namen'}“` : `${D.mainLabel} ${ex.f[MAIN] || '(ohne Nummer)'}`} mit ${slots.A.length + slots.E.length} Fotos wird gelöscht. Beim Abgleich wird die Löschung auf andere Geräte übertragen.`, 'Löschen', true)) {
          try { await Repo.deleteEntry(ex.id); dirty = false; sh.close(); App.state.sel = null; Ui.toast('Eintrag gelöscht'); } catch (err) { App.error(err); }
        }
      }
    });
    if (isR) rs = Req.bindForm(form, f0, showId, ex, markDirty, {
      hasPhoto: () => slots.A.length > 0,
      addPhoto: s => { slots.A.push(s); renderGrid('A'); markDirty(); }
    });
    D.photoKats.forEach(renderGrid); updateSave();
    initForm = readForm();
    if (quick) {
      // Schnell-Erfassung: Kamera sofort, danach Hauptfeld eintippen
      Camera.open({ abt: A, kat: quick === 'E' ? 'E' : 'A', startIndex: 0, title: `Schnell erfassen · ${D.short}`, allowKatSwitch: true, onShot: (p, k) => addPending(p, k) })
        .then(() => {
          if (!slots.A.length && !slots.E.length) { dirty = false; sh.close(); return; }
          setTimeout(() => kreisIn.focus(), 60);
        });
    } else if (!ex && !mainFd.picker) setTimeout(() => kreisIn.focus(), 80);
  },
  /** Requisite nach dem Speichern: Rückmeldung, „Nächster am selben Ort“, Angebot der Waffen-Schritte */
  async _afterSaveR(showId, entryId, f, existed, next) {
    const name = String(f.was || '').trim() || 'Ohne Namen';
    const preset = { abt: 'R', ortId: f.ortId || '', ort: f.ort || '', personIds: (f.personIds || []).slice() };
    const openNext = () => Editor.open({ showId, abt: 'R', preset });
    await Ui.afterBack();
    if (f.sicherheit === 'waffe' && !Req.steps(showId).some(s => s.gegenstand === entryId)) {
      const ok = await Ui.dialog({ title: 'Schritte für die Waffe anlegen?', message: `Vor der Vorstellung: „${name} aus dem Waffenschrank holen“\nNach der Vorstellung: „${name} im Waffenschrank einschließen“`,
        buttons: [{ label: 'Nein', value: false }, { label: 'Anlegen', value: true, cls: 'primary' }], cancelValue: false });
      await Ui.afterBack();
      if (ok) { try { await Req.addWeaponSteps(showId, entryId, name); Ui.toast('Zwei Schritte im Ablauf angelegt'); } catch (err) { App.error(err); } }
    }
    if (next) { openNext(); Ui.toast(`„${name}“ gespeichert – nächster Gegenstand am selben Ort`); return; }
    if (existed) Ui.toast('Gespeichert');
    else Ui.toast(`„${name}“ angelegt`, '', { action: { label: '+ Nächster hier', fn: openNext } });
  },
  async _confirmLeave(changed) {
    if (!changed) return true;
    return Ui.confirm('Änderungen verwerfen?', 'Der Eintrag wurde noch nicht gespeichert.', 'Verwerfen', true);
  }
};

/* =====================================================================
   SetupView – Einrichtung je Abteilung über der Liste:
     Licht: „Einrichtung & Züge“ (allgemeine Einrichtung + Beleuchterzüge)
     Ton:   „Einrichtung Ton“ (Freitext: Pult, Show-Datei, Grundpegel …)
     Bühne: „Ablauf & Positionen“ – Ablauf in Abschnitten (Grundeinrichtung,
            Pausenumbau, Ende) und die gemeinsame Zugliste mit Ebene/Bereich.
   Daten im Show-Datensatz (feldweise zusammenführbar):
     einrichtung · einrichtungT · z:<id> (Zug) · b:<id> (Ablauf-Schritt)
   ===================================================================== */
const SetupView = {
  open: {},                        // aufgeklappt je Abteilung (gilt für die laufende Sitzung)
  render(box, showId, edit, depts = ['L'], { noRun = false } = {}) {
    if (!box) return;
    const s = Repo.show(showId); if (!s || !depts.length) { box.innerHTML = ''; return; }
    const multi = App.visibleDepts(showId).length > 1;
    box.innerHTML = (noRun ? '' : this.htmlRun(s, edit, depts)) + depts.map(d => this['html' + d](s, edit, multi)).join('');
    box.querySelectorAll('details.setup, details.ssubd').forEach(dt => dt.addEventListener('toggle', () => { this.open[dt.dataset.box || dt.dataset.abt] = dt.open; }));
    box.querySelectorAll('[data-setup-edit]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); this['edit' + b.dataset.setupEdit](showId); }));
    box.querySelectorAll('[data-rfoto]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); Req.photoLightbox(b.dataset.rfoto, b.dataset.name || '', b.dataset.cap || ''); }));
    box.querySelectorAll('[data-open-entry]').forEach(b => b.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation(); const id = b.dataset.openEntry;
      if (App.sidePane()) App.selectEntry(id); else App.openDetailSheet(id);
    }));
    // Vor der Vorstellung: direkt hier abhaken (auch im Ansichtsmodus)
    box.querySelectorAll('[data-run]').forEach(b => b.addEventListener('click', async e => {
      e.preventDefault(); e.stopPropagation();
      try {
        const r = b.dataset.run;
        if (r === 'start') { const run = await RunList.create(showId); this.open.run = true; Ui.toast(`${run.f.titel} angelegt`); }
        else if (r === 'open') RunList.open(showId);
        else if (r === 'items') RunList.editItems(showId);
        else { if (navigator.vibrate) navigator.vibrate(10); await RunList.toggle(b.dataset.runId, r); }
      } catch (err) { App.error(err); }
    }));
  },
  /** Rahmen eines Blocks. pink = Allgemeine Einrichtung ausgefüllt (Hinweis-Symbol) */
  frame(abt, title, sum, pink, edit, btns, body) {
    return `<details class="setup ${pink ? 'has-allg' : ''}" data-abt="${abt}" ${this.open[abt] ? 'open' : ''}>
      <summary>${pink ? `<span class="hint" title="Einrichtung beachten">${I('info')}</span>` : ''}<h3>${title}<span class="sum">${Utils.esc(sum)}</span></h3>
        ${edit ? btns.map(([k, l, ic]) => `<button class="btn" data-setup-edit="${k}" aria-label="${Utils.esc(l)} bearbeiten">${I(ic || 'edit', 'sm')}<span class="bl"> ${Utils.esc(l)}</span></button>`).join('') : ''}${I('arrowR', 'sm chev')}</summary>
      <div class="sbody">${body}</div></details>`;
  },
  /** Zwischenüberschrift innerhalb eines Blocks – in allen Abteilungen gleich */
  sub(t) { return `<div class="ssub">${t}</div>`; },
  textBox(v, edit, what) {
    return `<div class="allg ${v ? '' : 'empty'}">${v ? Utils.esc(v) : `Noch nichts eingetragen${edit ? ` – über „${what}“ eintragen.` : '.'}`}</div>`;
  },
  /** kompakte Tabelle für Züge/Positionen: cols = [[Kopf, Funktion(z) → Text, Klasse]] */
  ztab(list, cols) {
    if (!list.length) return '<div class="allg empty">Keine Einträge.</div>';
    return `<div class="ztab"><div class="zr zhead">${cols.map(c => `<span>${c[0]}</span>`).join('')}</div>
      ${list.map(z => `<div class="zr">${cols.map((c, i) => { const v = c[1](z) || ''; return i === 0 ? `<b class="zn">${v}</b>` : `<span class="${c[2] || ''}" data-l="${c[0]}">${v || '<span class="muted">—</span>'}</span>`; }).join('')}</div>`).join('')}</div>`;
  },
  /* ---------- Vor der Vorstellung (alle sichtbaren Abteilungen) ---------- */
  htmlRun(s, edit, depts) {
    // Requisite: hier nur „Vor der Vorstellung“ – der ganze Ablauf wird in der Ansicht „Ablauf“ abgehakt (gleicher Durchgang)
    const items = RunList.items(s.id, depts).filter(i => i.abt !== 'R' || !i.key.startsWith('rs:') || i.vor);
    if (!items.length && !edit) return '';
    const today = RunList.isoDate(), run = RunList.runsOf(s.id).find(r => r.f.datum === today);
    const pr = run ? RunList.progress(run, items) : null;
    // Ton und Bühne brauchen die Liste vor jeder Vorstellung → dort von selbst aufgeklappt
    const open = this.open.run ?? depts.some(d => d === 'T' || d === 'B' || d === 'R');
    const sum = !items.length ? 'noch keine Punkte' : pr ? `heute ${pr.done} von ${pr.all} erledigt` : `${items.length} Punkte · heute noch nicht begonnen`;
    let body = '';
    if (!items.length) body = `<div class="allg empty">Noch keine Punkte – über „Punkte“ anlegen.</div>`;
    else if (!run) body = `<button class="btn big primary block" data-run="start">${I('checklist')} Vorstellung heute beginnen</button>`;
    else {
      body = `<div class="pbar" style="margin:0"><i style="width:${pr.all ? pr.done / pr.all * 100 : 0}%"></i></div>` +
        DEPT_ORDER.filter(d => depts.includes(d)).map(d => {
          const its = items.filter(i => i.abt === d); if (!its.length) return '';
          const p = RunList.progress(run, its); let lastG = '';
          return `<section class="runsec" data-abt="${d}"><div class="runsh"><span class="tag A" data-k="A" data-abt="${d}">${Utils.esc(DEPT[d].short)}</span><h3>${Utils.esc(DEPT[d].name)}</h3><span class="mono">${p.done}/${p.all}</span></div>
            ${its.map(i => { const h = run.f['h:' + i.key], ok = h && h.ok;
              const g = i.group !== lastG ? `<div class="rung">${Utils.esc(i.group)}</div>` : ''; lastG = i.group;
              const e = i.entryId && Repo.entry(i.entryId);
              return g + `<div class="runrow ${ok ? 'ok' : ''}"><button class="runchk" role="checkbox" aria-checked="${!!ok}" data-run="${Utils.esc(i.key)}" data-run-id="${Utils.esc(run.id)}">
                  <span class="box">${ok ? I('check') : ''}</span><span class="rt">${Utils.esc(i.text)}</span>
                  <span class="rm">${h && ok ? `${RunList.fmtTime(h.at)} · ${Utils.esc(h.dev || '')}` : ''}</span></button>
                  ${e ? `<button class="btn icon" data-open-entry="${Utils.esc(e.id)}" aria-label="Eintrag ${Utils.esc(mainVal(e))} öffnen" title="${Utils.esc(mainVal(e))}">${I('image', 'sm')}</button>` : ''}</div>`; }).join('')}</section>`;
        }).join('');
    }
    return `<details class="setup run" data-box="run" ${open ? 'open' : ''}>
      <summary><span class="hint run">${I('checklist')}</span><h3>Vor der Vorstellung<span class="sum">${Utils.esc(sum)}</span></h3>
        ${edit ? `<button class="btn" data-run="items" aria-label="Punkte bearbeiten">${I('edit', 'sm')}<span class="bl"> Punkte</span></button>` : ''}${I('arrowR', 'sm chev')}</summary>
      <div class="sbody">${body}
        <div class="runtools" style="margin:0"><button class="btn" data-run="open">${I('list', 'sm')} Alle Durchgänge &amp; PDF-Protokoll</button></div></div></details>`;
  },
  /* ---------- Licht ---------- */
  htmlL(s, edit, multi) {
    const zs = Repo.zuegeOf(s.id).filter(z => z.typ === 'licht'), filled = zs.filter(z => Repo.zugFilled(z)).length;
    const sum = [s.f.einrichtung ? 'Allgemein' : '', `${filled}/${zs.length} Züge ausgefüllt`].filter(Boolean).join(' · ');
    const e = Utils.esc;
    return this.frame('L', `Einrichtung · Licht`, sum, !!s.f.einrichtung, edit, [['L', 'Bearbeiten']],
      this.sub('Allgemein') + this.textBox(s.f.einrichtung, edit, 'Bearbeiten') +
      this.sub('Beleuchterzüge') + this.ztab(zs, [['Zug', z => e(z.name)], ['Höhe / Marke', z => e(z.hoehe), 'mono'], ['Bestückung', z => e(z.bestueckung)], ['Bemerkung', z => e(z.bemerkung), 'zb']]));
  },
  /* ---------- Ton ---------- */
  htmlT(s, edit, multi) {
    return this.frame('T', `Einrichtung · Ton`, s.f.einrichtungT ? 'Allgemein' : 'leer', !!s.f.einrichtungT, edit, [['T', 'Bearbeiten']],
      this.sub('Allgemein · Pult · Show-Datei · Pegel · Funk') + this.textBox(s.f.einrichtungT, edit, 'Bearbeiten'));
  },
  /* ---------- Requisite ---------- */
  htmlR(s, edit, multi) {
    const e = Utils.esc, ps = Req.persons(s.id), os = Req.showOrts(s.id);
    const sum = [s.f.einrichtungR ? 'Wichtig' : '', s.f.dauer ? s.f.dauer : '', `${ps.length} Personen`, `${os.length} Orte`].filter(Boolean).join(' · ');
    const foto = s.f.fotoR ? `<button type="button" class="rfotot" data-rfoto="${e(s.f.fotoR)}" data-name="Übersicht" aria-label="Übersichtsfoto ansehen">${Views.thumbImg(s.f.fotoR)}</button>` : '';
    return this.frame('R', 'Einrichtung · Requisite', sum, !!s.f.einrichtungR, edit, [['R', 'Allgemein'], ['RP', 'Personen', 'user'], ['RO', 'Orte', 'pin']],
      this.sub('Allgemein · Wichtig') + this.textBox(s.f.einrichtungR, edit, 'Allgemein') +
      `<div class="rgen">${foto}<div><div class="ssub" style="margin:0 0 4px">Dauer</div><div style="font-size:17px;font-weight:700">${s.f.dauer ? e(s.f.dauer) : '<span class="muted">nicht eingetragen</span>'}</div></div></div>` +
      `<details class="ssubd" data-box="Rp" ${this.open.Rp ? 'open' : ''}><summary class="ssub">${I('arrowR', 'sm chev')} Personen <span class="n">${ps.length}</span></summary>
        ${ps.length ? `<div class="ztab">${ps.map(p => `<div class="zr rpr"><b class="zn">${e(p.rolle || '–')}</b><span data-l="Darsteller">${e(p.darsteller || '')}</span></div>`).join('')}</div>` : '<div class="allg empty">Noch keine Personen.</div>'}</details>` +
      `<details class="ssubd" data-box="Ro" ${this.open.Ro ? 'open' : ''}><summary class="ssub">${I('arrowR', 'sm chev')} Orte dieses Stücks <span class="n">${os.length}</span></summary>
        ${os.length ? `<div class="rortgrid">${os.map(o => `<div class="rortc">${o.foto ? `<button type="button" class="rfotot sm" data-rfoto="${e(o.foto)}" data-name="${e(o.name)}" data-cap="${e(o.cap || '')}">${Views.thumbImg(o.foto)}</button>` : ''}<span><b>${e(o.name)}</b><small>${e([o.gruppe, o.notiz].filter(Boolean).join(' · '))}</small></span></div>`).join('')}</div>`
          : '<div class="allg empty">Keine eigenen Orte – es gelten die Haus-Orte (Requisitentisch, Gassen …).</div>'}</details>`);
  },
  editR(showId) { Req.editGeneral(showId); },
  editRP(showId) { Req.editPersons(showId); },
  editRO(showId) { Req.editOrts(showId); },
  /* ---------- Bühne ---------- */
  /** Zugliste in Einrichte-Reihenfolge: vorne → hinten, darin unten → oben */
  posSorted(showId) {
    return Repo.zuegeOf(showId).slice().sort((a, b) => (BEREICH_RANK[a.bereich] - BEREICH_RANK[b.bereich]) || (EBENE_RANK[a.ebene] - EBENE_RANK[b.ebene]) || (a.ord - b.ord));
  },
  htmlB(s, edit, multi) {
    const steps = Repo.ablaufOf(s.id);
    // Positionen: Bühnenzüge/-positionen und nur ausgefüllte Beleuchterzüge (leere OLZ/BGZ wären hier nur Ballast)
    const zs = this.posSorted(s.id).filter(z => z.typ === 'buehne' || Repo.zugFilled(z));
    const sum = [s.f.einrichtungB ? 'Allgemein' : '', steps.length ? `${steps.length} Schritte` : 'kein Ablauf', `${zs.length} Positionen`].filter(Boolean).join(' · ');
    const e = Utils.esc;
    const link = st => { const en = st.entryId && Repo.entry(st.entryId); if (!en) return '';
      return `<button class="btn icon" data-open-entry="${Utils.esc(en.id)}" aria-label="Eintrag ${e(mainVal(en))} öffnen" title="${e([mainVal(en), en.f.element].filter(Boolean).join(' · '))}">${I('image', 'sm')}</button>`; };
    const abl = ABLAUF.map(([k, n]) => { const list = steps.filter(x => x.abschnitt === k); if (!list.length) return '';
      return `<div class="ablsec"><div class="ablh">${n}</div><ol class="abl">${list.map(st => `<li><div class="ar"><span class="at">${e(st.text)}</span>${link(st)}</div></li>`).join('')}</ol></div>`; }).join('');
    return this.frame('B', `Einrichtung · Bühne`, sum, !!s.f.einrichtungB || steps.length > 0, edit, [['B', 'Ablauf'], ['P', 'Positionen', 'layers']],
      this.sub('Allgemein') + this.textBox(s.f.einrichtungB, edit, 'Ablauf') +
      this.sub('Ablauf') + (abl || `<div class="allg empty">Noch kein Ablauf${edit ? ' – über „Ablauf“ Schritte für Grundeinrichtung, Pausenumbau und Ende anlegen.' : '.'}</div>`) +
      `<details class="ssubd" data-box="Bpos" ${this.open.Bpos ? 'open' : ''}><summary class="ssub">${I('arrowR', 'sm chev')} Positionen · vorne → hinten, unten → oben <span class="n">${zs.length}</span></summary>` +
      this.ztab(zs, [['Position', z => e(z.name) + (z.typ === 'licht' ? ' <span class="tag A" data-k="A" data-abt="L">Licht</span>' : '')], ['Ort', z => e(ortText(z))], ['Höhe / Marke', z => e(z.hoehe), 'mono'], ['Bemerkung', z => e([z.bemerkung, z.last ? 'Last ' + z.last : ''].filter(Boolean).join(' · ')), 'zb']]) + '</details>');
  },

  /* ---------- Bearbeiten: Licht (allgemeine Einrichtung + Beleuchterzüge) ---------- */
  editL(showId) {
    const s = Repo.show(showId); if (!s) return;
    let zs = Repo.zuegeOf(showId).filter(z => z.typ === 'licht').map(z => Object.assign({}, z)), removed = [], dirty = false;
    const sh = Ui.sheet({
      title: 'Einrichtung · Licht', full: true,
      headLeft: `<button class="btn ghost" data-x="cancel" aria-label="Abbrechen">${I('close')}<span class="cl">Abbrechen</span></button>`,
      headRight: `<button class="btn edit" data-x="save">${I('check')} Speichern</button>`,
      onBack: () => Editor._confirmLeave(dirty)
    });
    sh.el.dataset.editor = '1'; sh.el.dataset.abt = 'L';
    const zedHtml = (z, i) => `<div class="zed" data-i="${i}">
        <div class="zh">${z.fixed ? `<span class="zname">${Utils.esc(z.name)}</span>` : `<input class="zname" data-f="name" value="${Utils.esc(z.name)}" aria-label="Name des Zugs">`}
          ${z.fixed ? '' : `<button type="button" class="btn icon danger" data-x="rm" aria-label="Zug entfernen">${I('trash')}</button>`}</div>
        <div class="zrow"><div class="f mono"><label>Höhe / Marke</label><input data-f="hoehe" value="${Utils.esc(z.hoehe)}" placeholder="z. B. 8,50 m"></div>
          <div class="f"><label>Bestückung</label><input data-f="bestueckung" value="${Utils.esc(z.bestueckung)}" placeholder="z. B. 6× PC 2 kW, 2× Profiler"></div></div>
        <div class="f"><label>Bemerkung</label><textarea data-f="bemerkung" rows="2" placeholder="Was ist zu beachten?">${Utils.esc(z.bemerkung)}</textarea></div></div>`;
    let allg = null;
    const draw = () => {
      sh.body.innerHTML = `<form class="form" onsubmit="return false">
        <div class="f"><label for="se-allg">Allgemeine Einrichtung</label>

/* =====================================================================
   RunList – Vorstellungs-Checkliste (ab 2.3.0)
   Punkte:      Feld „ci:<id>“ im Veranstaltungs-Datensatz = {abt, text, ord, del}.
                Bei Bühne kommen die Schritte des Ablaufs (Grundeinrichtung,
                Pausenumbau, Ende) automatisch als Punkte dazu (Schlüssel „b:<id>“).
   Durchgänge:  Datensatz „run“ im Store „runs“ = {id, showId, f:{datum, titel, del,
                'h:<Punkt>': {ok, at, dev}}, t:{…}}. Jeder Haken ist ein eigenes Feld →
                auf mehreren Geräten abhaken und zusammenführen, ohne dass etwas verloren geht.
   Abhaken ist auch im Ansichtsmodus erlaubt; Punkte ändern und Durchgänge
   löschen nur im Bearbeitungsmodus.
   ===================================================================== */
const RunList = {
  EXAMPLES: [{ abt: 'L', text: 'Notbeleuchtung geprüft' }, { abt: 'T', text: 'Funkakkus voll' }, { abt: 'B', text: 'Sicherungsseile geprüft' }, { abt: 'R', text: 'Waffenschrank verschlossen' }],
  /** Hausvorlage des Geräts (Einstellungen), sonst Beispiele */
  template() { const t = Settings.v.ciTemplate; return Array.isArray(t) && t.length ? t : this.EXAMPLES; },
  ownOf(showId) {
    const s = Repo.shows.get(showId); const f = (s && s.f) || {};
    return Object.keys(f).filter(k => k.startsWith('ci:')).map(k => Object.assign({ ord: 0, text: '' }, f[k], { key: k, id: k.slice(3) }))
      .filter(x => !x.del && DEPT[x.abt]).sort((a, b) => (DEPT_ORDER.indexOf(a.abt) - DEPT_ORDER.indexOf(b.abt)) || (a.ord - b.ord));
  },
  /** alle Punkte (nur gewählte Abteilungen), in Anzeigereihenfolge */
  items(showId, depts = null) {
    const own = this.ownOf(showId), out = [];
    DEPT_ORDER.forEach(d => {
      if (depts && !depts.includes(d)) return;
      own.filter(x => x.abt === d).forEach(x => out.push({ key: x.key, abt: d, group: 'Vor der Vorstellung', text: x.text }));
      if (d === 'B') Repo.ablaufOf(showId).forEach(st => out.push({ key: 'b:' + st.id, abt: 'B', group: 'Ablauf · ' + (ABLAUF.find(a => a[0] === st.abschnitt) || ABLAUF[0])[1], text: st.text, entryId: st.entryId }));
      if (d === 'R') {                                   // Requisite: Schritte aller Abschnitte (Vor der Vorstellung, Teile, Pausen, Nach …)
        const abs = new Map(Req.abschnitte(showId).map(a => [a.key, a]));
        Req.steps(showId).forEach(st => { const a = abs.get(st.abschnitt), w = Req.whenShort(st);
          out.push({ key: st.key, abt: 'R', group: a ? a.label : 'Ohne Abschnitt', text: (w ? w + ' – ' : '') + st.text, entryId: Req.stepEntry(st) ? st.gegenstand : '', vor: !!(a && a.typ === 'vor') }); });
      }
    });
    return out;
  },
  abtOfItem(showId, key) {
    if (key.startsWith('b:')) return 'B';
    if (key.startsWith('rs:') || key.startsWith('ra:')) return 'R';
    const s = Repo.shows.get(showId); const v = s && s.f[key];
    return (v && DEPT[v.abt]) ? v.abt : 'L';
  },
  runsOf(showId) {
    return [...Repo.runs.values()].filter(r => r.showId === showId && !r.f.del)
      .sort((a, b) => String(b.f.datum || '').localeCompare(String(a.f.datum || '')) || (b.c - a.c));
  },
  isoDate(d = new Date()) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; },
  async create(showId) {
    const iso = this.isoDate();
    const n = this.runsOf(showId).filter(r => r.f.datum === iso).length;
    const r = Rec.create({ showId }, { datum: iso, titel: `Vorstellung ${Utils.fmtDate(Date.now(), false)}${n ? ` (${n + 1})` : ''}`, del: false });
    await Repo._write({ runs: [r] }); return r;
  },
  async toggle(runId, key) {
    const r = Repo.runs.get(runId); if (!r) return;
    const cur = r.f['h:' + key];
    const v = { ok: !(cur && cur.ok), at: Date.now(), dev: Sync.deviceName() };
    const p = Rec.patch(r, { ['h:' + key]: v }); if (p) await Repo._write({ runs: [p] });
  },
  async remove(runId) { const r = Repo.runs.get(runId); const p = r && Rec.patch(r, { del: true }); if (p) await Repo._write({ runs: [p] }); },
  progress(run, items) { const done = items.filter(i => { const h = run && run.f['h:' + i.key]; return h && h.ok; }).length; return { done, all: items.length }; },
  fmtTime(ts) { return ts ? new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : ''; },

  /* ---------- Ansicht ---------- */
  open(showId, runId = null) {
    const s = Repo.show(showId); if (!s) return;
    let cur = runId || (this.runsOf(showId)[0] || {}).id || null;
    const sh = Ui.sheet({ title: 'Vorstellungs-Checkliste', full: true });
    sh.el.classList.add('runsheet');
    const draw = () => {
      const vis = App.visibleDepts(showId), edit = App.state.edit;
      const runs = this.runsOf(showId), run = cur && Repo.runs.get(cur);
      if (run && run.f.del) cur = null;
      const items = this.items(showId, vis);
      const pr = this.progress(run, items);
      const head = `<div class="runhead">
          ${runs.length ? `<div class="f" style="flex:1;min-width:0"><label for="run-sel">Durchgang</label><select id="run-sel">${runs.map(r => { const p = this.progress(r, items);
            return `<option value="${Utils.esc(r.id)}" ${r.id === cur ? 'selected' : ''}>${Utils.esc(r.f.titel || r.f.datum)} · ${p.done}/${p.all}</option>`; }).join('')}</select></div>` : ''}
          <button class="btn big primary" data-r="new">${I('plus')} Neue Vorstellung</button></div>
        <div class="runtools">
          ${run ? `<button class="btn" data-r="pdf">${I('pdf', 'sm')} PDF-Protokoll</button>` : ''}
          ${edit ? `<button class="btn" data-r="items">${I('edit', 'sm')} Punkte bearbeiten</button>` : ''}
          ${edit && run ? `<button class="btn danger" data-r="del">${I('trash', 'sm')} Durchgang löschen</button>` : ''}</div>`;
      if (!items.length) {
        sh.body.innerHTML = head + `<div class="empty"><h3>Noch keine Punkte</h3><p>${edit ? 'Über „Punkte bearbeiten“ anlegen.' : 'Zum Anlegen in den Bearbeitungsmodus wechseln.'}</p></div>`; return;
      }
      if (!run) {
        sh.body.innerHTML = head + `<div class="empty"><h3>${items.length} Punkte bereit</h3><p>Für die heutige Vorstellung „Neue Vorstellung“ tippen. Jeder Haken wird mit Uhrzeit und Gerät gespeichert.</p></div>`; return;
      }
      const sect = d => {
        const its = items.filter(i => i.abt === d); if (!its.length) return '';
        const p = this.progress(run, its); let lastG = '';
        return `<section class="runsec" data-abt="${d}"><div class="runsh"><span class="tag A" data-abt="${d}">${Utils.esc(DEPT[d].short)}</span><h3>${Utils.esc(DEPT[d].name)}</h3>
            <span class="mono">${p.done}/${p.all}</span></div><div class="pbar"><i style="width:${p.all ? p.done / p.all * 100 : 0}%;background:var(--da)"></i></div>
          ${its.map(i => { const h = run.f['h:' + i.key], ok = h && h.ok;
            const g = i.group !== lastG ? `<div class="rung">${Utils.esc(i.group)}</div>` : ''; lastG = i.group;
            const e = i.entryId && Repo.entry(i.entryId);
            return g + `<div class="runrow ${ok ? 'ok' : ''}"><button class="runchk" role="checkbox" aria-checked="${!!ok}" data-key="${Utils.esc(i.key)}">
                <span class="box">${ok ? I('check') : ''}</span><span class="rt">${Utils.esc(i.text)}</span>
                <span class="rm">${h ? `${ok ? '' : 'zurückgenommen · '}${this.fmtTime(h.at)} · ${Utils.esc(h.dev || '')}` : ''}</span></button>
                ${e ? `<button class="alink" data-open-entry="${Utils.esc(e.id)}">${I('arrowR', 'sm')} ${Utils.esc(mainVal(e))}</button>` : ''}</div>`; }).join('')}</section>`;
      };
      sh.body.innerHTML = head + `<div class="runall"><b>${Utils.esc(run.f.titel || '')}</b><span class="mono">${pr.done} von ${pr.all} erledigt</span></div>
        <div class="pbar"><i style="width:${pr.all ? pr.done / pr.all * 100 : 0}%"></i></div>
        ${vis.map(sect).join('')}
        ${runs.length > 1 ? `<div class="group" style="margin-top:18px"><h3>Protokoll</h3>${runs.map(r => { const p = this.progress(r, items);
          return `<button class="item" data-pick="${Utils.esc(r.id)}"><span class="lb">${Utils.esc(r.f.titel || r.f.datum)}<small>${p.done} von ${p.all} erledigt</small></span>${r.id === cur ? I('check') : I('arrowR')}</button>`; }).join('')}</div>` : ''}`;
    };
    draw();
    const off = Repo.on(() => { if (sh.layer.closed) { off(); return; } draw(); });
    sh.body.addEventListener('change', e => { if (e.target.id === 'run-sel') { cur = e.target.value; draw(); } });
    sh.body.addEventListener('click', async e => {
      const b = e.target.closest('[data-r],[data-key],[data-pick],[data-open-entry]'); if (!b) return;
      try {
        if (b.dataset.openEntry) { const id = b.dataset.openEntry; App.openDetailSheet(id); return; }
        if (b.dataset.pick) { cur = b.dataset.pick; draw(); sh.body.scrollTop = 0; return; }
        if (b.dataset.key) { if (navigator.vibrate) navigator.vibrate(10); await this.toggle(cur, b.dataset.key); return; }
        const r = b.dataset.r;
        if (r === 'new') { const run = await this.create(showId); cur = run.id; draw(); Ui.toast(`${run.f.titel} angelegt`); }
        else if (r === 'pdf') this.exportPdf(showId, cur);
        else if (r === 'items') this.editItems(showId);
        else if (r === 'del') {
          const run = Repo.runs.get(cur);
          if (await Ui.confirm('Durchgang löschen?', `„${run.f.titel}“ mit allen Haken wird gelöscht – auch auf Geräten, mit denen später abgeglichen wird.`, 'Löschen', true)) { await this.remove(cur); cur = (this.runsOf(showId)[0] || {}).id || null; draw(); }
        }
      } catch (err) { App.error(err); }
    });
  },

  /* ---------- Punkte bearbeiten (eigene Punkte je Abteilung, Hausvorlage) ---------- */
  editItems(showId) {
    const s = Repo.show(showId); if (!s) return;
    const vis = App.visibleDepts(showId);
    let list = this.ownOf(showId).map(x => Object.assign({}, x)), removed = [], dirty = false;
    const sh = Ui.sheet({ title: 'Punkte der Checkliste', full: true,
      headLeft: `<button class="btn ghost" data-x="cancel" aria-label="Abbrechen">${I('close')}<span class="cl">Abbrechen</span></button>`,
      headRight: `<button class="btn edit" data-x="save">${I('check')} Speichern</button>`,
      onBack: () => Editor._confirmLeave(dirty) });
    sh.el.dataset.editor = '1';
    const arrow = (n, d) => I(d, 'sm').replace('<svg', '<svg style="transform:rotate(90deg)"');
    const draw = () => {
      sh.body.innerHTML = `<form class="form" onsubmit="return false">
        ${vis.map(d => { const its = list.filter(x => x.abt === d);
          return `<section class="ablsec ed" data-abt="${d}"><div class="ablh">${Utils.esc(DEPT[d].name)} – vor der Vorstellung</div>
            ${its.map((x, i) => `<div class="zed astep" data-gi="${list.indexOf(x)}"><div class="f"><label>Punkt ${i + 1}</label><textarea data-f="text" rows="1" placeholder="z. B. ${Utils.esc(this.EXAMPLES.find(y => y.abt === d).text)}">${Utils.esc(x.text)}</textarea></div>
              <div class="arow"><span style="flex:1"></span>
                <button type="button" class="btn icon" data-x="up" aria-label="Nach oben" ${i === 0 ? 'disabled' : ''}>${arrow(0, 'arrowL')}</button>
                <button type="button" class="btn icon" data-x="down" aria-label="Nach unten" ${i === its.length - 1 ? 'disabled' : ''}>${arrow(0, 'arrowR')}</button>
                <button type="button" class="btn icon danger" data-x="rm" aria-label="Punkt entfernen">${I('trash')}</button></div></div>`).join('')}
            <button type="button" class="btn" data-x="add" data-abt="${d}">${I('plus')} Punkt</button>
            ${d === 'B' ? `<div class="fh">Zusätzlich erscheinen die Schritte aus dem Bühnen-Ablauf (Grundeinrichtung, Pausenumbau, Ende) – zu bearbeiten unter „Ablauf“.</div>` : ''}</section>`; }).join('')}
        <button type="button" class="btn big" data-x="tpl">${I('copy')} Als Hausvorlage für neue Veranstaltungen speichern</button>
        <button type="button" class="btn edit big block" data-x="save">${I('check')} Punkte speichern</button></form>`;
    };
    const readBack = () => sh.body.querySelectorAll('.astep').forEach(el => { list[+el.dataset.gi].text = el.querySelector('textarea').value; });
    draw();
    sh.body.addEventListener('input', () => { dirty = true; });
    sh.el.addEventListener('click', async e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      const x = b.dataset.x;
      if (x === 'cancel') { history.back(); return; }
      readBack();
      if (x === 'add') {
        list.push({ id: Utils.uuid(), abt: b.dataset.abt, text: '', ord: 1e9, isNew: true }); dirty = true; draw();
        const el = [...sh.body.querySelectorAll('.astep')].find(n => list[+n.dataset.gi] === list[list.length - 1]);
        if (el) { el.scrollIntoView({ block: 'center' }); el.querySelector('textarea').focus(); }
      } else if (x === 'rm' || x === 'up' || x === 'down') {
        const it = list[+b.closest('.astep').dataset.gi], same = list.filter(y => y.abt === it.abt), i = same.indexOf(it);
        if (x === 'rm') { if (!it.isNew) removed.push(it.id); list.splice(list.indexOf(it), 1); }
        else { const j = x === 'up' ? i - 1 : i + 1; if (j < 0 || j >= same.length) return; const o = same[j], a1 = list.indexOf(it), a2 = list.indexOf(o); list[a1] = o; list[a2] = it; }
        dirty = true; draw();
      } else if (x === 'tpl') {
        const t = list.filter(y => y.text.trim()).map(y => ({ abt: y.abt, text: y.text.trim() }));
        await Settings.set({ ciTemplate: t }); Ui.toast(`Hausvorlage gespeichert (${t.length} Punkte)`);
      } else if (x === 'save') {
        const patch = {};
        DEPT_ORDER.forEach(d => list.filter(y => y.abt === d).forEach((y, i) => {
          const old = s.f['ci:' + y.id], text = y.text.trim();
          if (!text) { if (old) patch['ci:' + y.id] = Object.assign({}, old, { del: true }); return; }
          const v = Object.assign({}, old || {}, { abt: d, text, ord: (i + 1) * 10, del: false });
          if (!old || JSON.stringify(old) !== JSON.stringify(v)) patch['ci:' + y.id] = v;
        }));
        removed.forEach(id => { const old = s.f['ci:' + id]; if (old) patch['ci:' + id] = Object.assign({}, old, { del: true }); });
        try { if (Object.keys(patch).length) await Repo.patchShow(showId, patch); dirty = false; sh.close(); Ui.toast('Punkte gespeichert'); }
        catch (err) { App.error(err); }
      }
    });
  },

  async exportPdf(showId, runId) {
    const s = Repo.show(showId), run = Repo.runs.get(runId); if (!s || !run) return;
    const bz = Ui.busy('Protokoll wird erstellt …');
    try {
      const blob = Pdf.buildRun(showId, runId, App.visibleDepts(showId)); bz.close();
      const name = `${Utils.safeName(s.f.titel)}_Vorstellung_${run.f.datum || this.isoDate()}.pdf`;
      const r = await Utils.offerFile(blob, name, 'Protokoll ist fertig', `${Pdf.lastPages} Seite${Pdf.lastPages === 1 ? '' : 'n'}`);
      if (r === 'shared') Ui.toast('Protokoll geteilt'); else if (r === 'download') Ui.toast('Protokoll gespeichert');
    } catch (err) { bz.close(); App.error(err); }
  }
};

/* =====================================================================
   Req – Requisite (ab 2.5.0): Daten-Helfer, Auswahlblätter und Bearbeitung.
   Daten im Veranstaltungs-Datensatz (je Feld ein Objekt mit eigenem Zeitstempel, Löschen per del):
     rp:<id> Person {rolle, darsteller, ord}   ro:<id> Ort {name, notiz, foto, cap, gruppe, ord}
     ra:<id> Abschnitt {typ vor|teil|pause|nach|abbau, name, notiz, ord}
     rs:<id> Schritt {abschnitt, text, zeit, ausloeser, gegenstand, ortId, sicherheit, ord}
     dauer · fotoR (Blob-ID Übersichtsfoto) · einrichtungR („Allgemein · Wichtig“)
   Haus-Datensatz „requisite“ (Store meta, Schlüssel house:requisite):
     ho:<id> Haus-Ort {name, notiz, foto, cap, gruppe, ord}   hg:<id> Vorlage {was, ortName, zustand, sicherheit, bemerkung, foto, ord}
   Verweise: Gegenstand.ortId = „ro:…“ oder „ho:…“, personIds = [„rp:…“], inId = Eintrags-ID.
   ===================================================================== */
const Req = {
  KEY: /^(rp|ro|ra|rs|ho|hg):[A-Za-z0-9_.:-]{1,200}$/,
  sh(showId) { const s = Repo.shows.get(showId); return (s && s.f) || {}; },
  houseF() { const h = Repo.house.get('requisite'); return (h && h.f) || {}; },
  _list(f, pre, def) {
    return Object.keys(f).filter(k => k.startsWith(pre) && this.KEY.test(k) && f[k] && typeof f[k] === 'object' && !Array.isArray(f[k]) && !f[k].del)
      .map(k => Object.assign({}, def, f[k], { key: k, id: k.slice(pre.length) }))
      .sort((a, b) => ((+a.ord || 0) - (+b.ord || 0)) || String(a.key).localeCompare(String(b.key)));
  },
  ORT_DEF: { name: '', notiz: '', foto: '', cap: '', gruppe: '' },
  persons(showId) { return this._list(this.sh(showId), 'rp:', { rolle: '', darsteller: '' }); },
  personLabel(p) { if (!p) return ''; const r = String(p.rolle || '').trim(), d = String(p.darsteller || '').trim(); return r && d ? `${r} (${d})` : (r || d); },
  showOrts(showId) { return this._list(this.sh(showId), 'ro:', this.ORT_DEF).map(o => Object.assign(o, { src: 'show' })); },
  houseOrts() { return this._list(this.houseF(), 'ho:', this.ORT_DEF).map(o => Object.assign(o, { src: 'house' })); },
  vorlagen() { return this._list(this.houseF(), 'hg:', { was: '', ortName: '', zustand: [], sicherheit: '', bemerkung: '', foto: '' }); },
  allOrts(showId) { return this.showOrts(showId).concat(this.houseOrts()); },
  ortByKey(showId, key) {
    if (!key || typeof key !== 'string' || !this.KEY.test(key)) return null;
    const f = key.startsWith('ho:') ? this.houseF() : this.sh(showId);
    const v = f[key]; if (!v || typeof v !== 'object' || v.del) return null;
    return Object.assign({}, this.ORT_DEF, v, { key, src: key.startsWith('ho:') ? 'house' : 'show' });
  },
  /** Ort eines Gegenstands: aktueller Name aus der Ortsliste, sonst die gespeicherte Kopie (removed = Ort wurde gelöscht) */
  ortOf(e) {
    const k = e.f.ortId;
    const o = e.showId ? this.ortByKey(e.showId, k) : null;
    if (o) return { name: o.name, ort: o, key: k };
    if (!k && !e.f.ort) return null;
    let removed = false;
    if (k && e.showId && this.KEY.test(String(k))) { const f = String(k).startsWith('ho:') ? this.houseF() : this.sh(e.showId); removed = !!(f[k] && f[k].del); }
    return { name: e.f.ort || '', removed, key: k || '' };
  },
  personNames(e) {
    const ids = Array.isArray(e.f.personIds) ? e.f.personIds : [];
    if (!e.showId) return e.f.zuWem || '';
    const f = this.sh(e.showId);
    const names = ids.map(id => f[id] && !f[id].del ? this.personLabel(f[id]) : '').filter(Boolean);
    return names.length ? names.join(', ') : (ids.length || e.f.zuWem ? (e.f.zuWem || '') : '');
  },
  /** Anzeigewert eines Requisite-Felds */
  val(e, k) {
    const f = e.f || {};
    if (k === 'ort') { const o = this.ortOf(e); return o ? (o.name || '') + (o.removed ? ' · Ort entfernt' : '') : ''; }
    if (k === 'zuWem') return this.personNames(e);
    if (k === 'inId') { const c = this.containerOf(e); return c ? (c.f.was || 'Ohne Namen') : ''; }
    if (k === 'sicherheit') return f.sicherheit ? this.safeLabel(f.sicherheit) : '';
    if (k === 'zustaendig') return f.zustaendig ? this.zustLabel(f.zustaendig) : '';
    if (k === 'art') return Array.isArray(f.art) ? f.art.map(a => REQ_NAME(REQ_ART)[a] || a).join(', ') : '';
    if (k === 'personIds' || k === 'ortId') return '';
    return fieldVal('R', k, f[k]);
  },
  safeLabel(k) { return REQ_NAME(REQ_SICHER)[k] || String(k || ''); },
  zustLabel(k) { return REQ_NAME(REQ_ZUST)[k] || String(k || ''); },
  safeBadge(k, cls = '') { return k ? `<span class="rsafe ${cls}">${I('alert', 'sm')}<span>${Utils.esc(this.safeLabel(k))}</span></span>` : ''; },
  entriesR(showId) { return Repo.entriesOf(showId).filter(e => abtOf(e) === 'R'); },
  /** Behälter eines Gegenstands (nur eine Ebene: ein Behälter liegt selbst in nichts) */
  containerOf(e) {
    const id = e.f && e.f.inId; if (!id || id === e.id) return null;
    const c = Repo.entry(id);
    if (!c || c.showId !== e.showId || abtOf(c) !== 'R' || (c.f.inId && Repo.entry(c.f.inId))) return null;
    return c;
  },
  contentsOf(e) { return this.entriesR(e.showId).filter(x => x.id !== e.id && x.f.inId === e.id && this.containerOf(x)); },
  ortIndex(showId) { const m = new Map(); this.allOrts(showId).forEach((o, i) => m.set(o.key, i)); return m; },
  /** Sortierung der Gegenstände: Ort (Reihenfolge der Ortsliste), dann Name */
  cmp(showId) {
    const idx = this.ortIndex(showId);
    const oi = e => { const k = e.f.ortId; return idx.has(k) ? idx.get(k) : (k || e.f.ort ? 5000 : 9000); };
    return (a, b) => (oi(a) - oi(b)) || String(a.f.ort || '').localeCompare(String(b.f.ort || ''), 'de') || String(a.f.was || '￿').localeCompare(String(b.f.was || '￿'), 'de', { numeric: true }) || (a.c - b.c);
  },
  personCmp(showId) {
    const ps = this.persons(showId), idx = new Map(ps.map((p, i) => [p.key, i])), byOrt = this.cmp(showId);
    const pi = e => { const ids = Array.isArray(e.f.personIds) ? e.f.personIds : []; const v = ids.map(i => idx.has(i) ? idx.get(i) : 999); return v.length ? Math.min(...v) : 9999; };
    return (a, b) => (pi(a) - pi(b)) || byOrt(a, b);
  },
  /* ---------- Abschnitte und Schritte ---------- */
  abschnitte(showId) {
    const list = this._list(this.sh(showId), 'ra:', { typ: 'teil', name: '', notiz: '' });
    const teile = list.filter(a => a.typ === 'teil');
    list.forEach(a => {
      if (!REQ_ABTYP[a.typ]) a.typ = 'teil';
      a.auto = a.typ === 'teil' ? (teile.length > 1 ? `Teil ${teile.indexOf(a) + 1}` : 'Vorstellung') : REQ_ABTYP[a.typ];
      a.label = String(a.name || '').trim() || a.auto;
    });
    return list;
  },
  steps(showId) {
    const abs = this.abschnitte(showId), ai = new Map(abs.map((a, i) => [a.key, i]));
    const list = this._list(this.sh(showId), 'rs:', { text: '', abschnitt: '', zeit: null, ausloeser: [], gegenstand: '', ortId: '', sicherheit: '' });
    list.forEach(s => { if (!Array.isArray(s.ausloeser)) s.ausloeser = []; if (!s.zeit || typeof s.zeit !== 'object') s.zeit = null; });
    return list.sort((a, b) => ((ai.has(a.abschnitt) ? ai.get(a.abschnitt) : 999) - (ai.has(b.abschnitt) ? ai.get(b.abschnitt) : 999)) || ((+a.ord || 0) - (+b.ord || 0)));
  },
  /** Standard-Abschnitte für ein neues Stück: keine Pause (die meisten Stücke laufen ohne) */
  defaultAbschnitte() {
    const f = {};
    [['vor', 10], ['teil', 20], ['nach', 30]].forEach(([typ, ord]) => { f['ra:' + Utils.uuid()] = { typ, name: '', notiz: '', ord, del: false }; });
    return f;
  },
  hasAbschnitte(showId) { return this.abschnitte(showId).length > 0; },
  zeitShort(z) {
    if (!z || !z.art) return '';
    if (z.art === 'vor') return z.min === 'kurz' || !(+z.min) ? 'kurz vorher' : `${z.frist ? 'spät. ' : ''}−${+z.min}`;
    if (z.art === 'im') return +z.min ? `ca. ${+z.min}′` : 'im Stück';
    if (z.art === 'ende') return z.wann === 'im' ? 'im Applaus' : 'nach Applaus';
    return '';
  },
  zeitLong(z) {
    if (!z || !z.art) return '';
    if (z.art === 'vor') return z.min === 'kurz' || !(+z.min) ? 'kurz vor Beginn' : `${z.frist ? 'spätestens ' : ''}${+z.min} min vor Beginn`;
    if (z.art === 'im') return +z.min ? `ca. ${+z.min} min` : 'im Stück';
    if (z.art === 'ende') return z.wann === 'im' ? 'im Applaus' : 'nach dem Applaus';
    return '';
  },
  auslText(list, pdf = false) {
    return (Array.isArray(list) ? list : []).filter(a => a && REQ_NAME(REQ_AUSL)[a.typ]).map(a => {
      const n = Math.max(1, Math.min(99, +a.anzahl || 1)), x = pdf ? 'x ' : '× ';
      const nm = a.typ === 'stichwort' && a.wert ? `Stichwort „${a.wert}“` : REQ_NAME(REQ_AUSL)[a.typ];
      return (n > 1 ? n + x : '') + nm;
    }).join(pdf ? ' -> ' : ' → ');
  },
  whenShort(st) { return [this.zeitShort(st.zeit), this.auslText(st.ausloeser)].filter(Boolean).join(' · '); },
  whenLong(st) { return [this.zeitLong(st.zeit), this.auslText(st.ausloeser, true)].filter(Boolean).join(', '); },
  stepEntry(st) { const e = st.gegenstand && Repo.entry(st.gegenstand); return e && abtOf(e) === 'R' ? e : null; },
  stepSafety(st) { if (st.sicherheit) return st.sicherheit; const e = this.stepEntry(st); return e ? e.f.sicherheit || '' : ''; },
  /** Dauer in Minuten aus dem Freitext („80 min“, „1:45“, „2,40 Std.“) – für die Zeit-Schnelltasten */
  dauerMin(showId) {
    const t = String(this.sh(showId).dauer || '');
    let m = /(\d{1,2})\s*[:,.]\s*(\d{2})/.exec(t);
    if (m && +m[2] < 60) return +m[1] * 60 + +m[2];
    m = /(\d+)\s*(std|h)\b/i.exec(t); if (m) return +m[1] * 60;
    m = /(\d+)/.exec(t); if (m && +m[1] >= 10) return +m[1];
    return 120;
  },
  /* ---------- Bilddaten-Verweise (Aufräumen, Pakete, Live) ---------- */
  blobRefs(shows, houses) {
    const out = new Set(), add = b => { if (typeof b === 'string' && Rec.ID.test(b)) out.add(b); };
    for (const s of shows || []) {
      if (!s || !s.f) continue;
      add(s.f.fotoR);
      for (const k of Object.keys(s.f)) if (k.startsWith('ro:')) { const o = s.f[k]; if (o && typeof o === 'object' && !o.del) add(o.foto); }
    }
    for (const h of houses || []) {
      if (!h || !h.f) continue;
      for (const k of Object.keys(h.f)) if (k.startsWith('ho:') || k.startsWith('hg:')) { const o = h.f[k]; if (o && typeof o === 'object' && !o.del) add(o.foto); }
    }
    return [...out];
  },
  /* ---------- Duplizieren einer Veranstaltung ---------- */
  copyShowFields(src, sf, idMap) {
    const rm = { rp: new Map(), ro: new Map(), ra: new Map() };
    ['dauer', 'einrichtungR', 'fotoR'].forEach(k => { if (src[k]) sf[k] = src[k]; });
    for (const pre of ['rp', 'ro', 'ra']) Object.keys(src).forEach(k => {
      const v = src[k]; if (!k.startsWith(pre + ':') || !v || v.del) return;
      const nk = pre + ':' + Utils.uuid(); rm[pre].set(k, nk); sf[nk] = Utils.clone(v);
    });
    Object.keys(src).forEach(k => {
      const v = src[k]; if (!k.startsWith('rs:') || !v || v.del) return;
      const c = Utils.clone(v);
      c.abschnitt = rm.ra.get(v.abschnitt) || '';
      c.gegenstand = idMap.get(v.gegenstand) || '';
      if (v.ortId && rm.ro.has(v.ortId)) c.ortId = rm.ro.get(v.ortId);
      sf['rs:' + Utils.uuid()] = c;
    });
    return rm;
  },
  remapEntry(f, rm, idMap) {
    if (f.ortId && rm.ro.has(f.ortId)) f.ortId = rm.ro.get(f.ortId);
    if (Array.isArray(f.personIds)) f.personIds = f.personIds.map(p => rm.rp.get(p) || p);
    if (f.inId) f.inId = idMap.get(f.inId) || '';

  /* ---------- Haus-Standard (feste IDs: zwei Geräte erzeugen beim Zusammenführen keine Dubletten) ---------- */
  slug(s) { return String(s).toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); },
  STD_ORTS: [
    ['Hinterbühne', ['Requisitentisch', 'Requisitenfach beim Inspizientenpult', 'Inspizientenpult']],
    ['Requisite', ['Requisitenbüro', 'Requisitenschrank', 'Waffenschrank']],
    ['Garderoben', ['Damengarderobe', 'Herrengarderobe', 'Garderobe']],
    ['Unterbühne', ['Unterbühne']],
    ['Bühne', ['Bühne hinten', 'Bühne links', 'Bühne rechts', 'Bühne vorne']],
    ['Vorbühne', ['Vorbühne', 'Vorbühne Bühnentür rechts']],
    ['Seiten und Gassen', ['Seitenbühne links', 'Seitenbühne rechts', 'Nullgasse links', 'Nullgasse rechts', 'Gasse 1 links', 'Gasse 2 links', 'Gasse 3 links', 'Gasse 1 rechts', 'Gasse 2 rechts', 'Gasse 3 rechts', 'OFF links', 'OFF rechts', 'hinter Bühnentür']],
    ['Sonstiges', ['Kühlschrank Technikaufenthalt']]
  ],
  STD_VORLAGEN: [['Lesebrille'], ['Sonnenbrille'], ['Zigaretten (Fake)'], ['Feuerzeug'], ['Baseballschläger'], ['Luftrüssel'], ['Sektglas', 'glas'], ['Wasserflasche'], ['Gaffa-Tape'], ['Puffreis'],
    ['Gewehr', 'waffe'], ['Konfettikanone', 'pyro'], ['Crashglas', 'glas'], ['Taschenlampe', 'strom']],
  houseKey(name) { return 'ho:std-' + this.slug(name); },
  async ensureHouse() {
    if (Repo.house.has('requisite')) return false;
    const f = {}; let ord = 0;
    this.STD_ORTS.forEach(([gruppe, names]) => names.forEach(name => { f[this.houseKey(name)] = { name, notiz: '', foto: '', cap: '', gruppe, ord: (ord += 10), del: false }; }));
    ord = 0;
    this.STD_VORLAGEN.forEach(([was, sich]) => { f['hg:std-' + this.slug(was)] = { was, ortName: '', zustand: [], sicherheit: sich || '', bemerkung: '', foto: '', ord: (ord += 10), del: false }; });

  /** Waffen-Schritte: „… aus dem Waffenschrank holen“ (vor) und „… im Waffenschrank einschließen“ (nach) */
  async addWeaponSteps(showId, entryId, was) {
    const patch = {}, abs = this.abschnitte(showId);
    const get = (typ, ord) => { let a = abs.find(x => x.typ === typ); if (a) return a.key; const k = 'ra:' + Utils.uuid(); patch[k] = { typ, name: '', notiz: '', ord, del: false }; return k; };
    const vor = get('vor', Math.min(0, ...abs.map(a => +a.ord || 0)) - 10), nach = get('nach', Math.max(0, ...abs.map(a => +a.ord || 0)) + 10);
    const max = k => Math.max(0, ...this.steps(showId).filter(s => s.abschnitt === k).map(s => +s.ord || 0));
    const ws = this.ortByKey(showId, this.houseKey('Waffenschrank')) ? this.houseKey('Waffenschrank') : '';
    const name = was || 'Waffe';
    patch['rs:' + Utils.uuid()] = { abschnitt: vor, text: `${name} aus dem Waffenschrank holen`, zeit: null, ausloeser: [], gegenstand: entryId, ortId: ws, sicherheit: '', ord: max(vor) + 10, del: false };
    patch['rs:' + Utils.uuid()] = { abschnitt: nach, text: `${name} im Waffenschrank einschließen`, zeit: null, ausloeser: [], gegenstand: entryId, ortId: ws, sicherheit: '', ord: max(nach) + 10, del: false };
    await Repo.patchShow(showId, patch);
  },
  /** zuletzt benutzte Orte (Schnelltasten im Editor), aufgefüllt aus Stück- und Haus-Orten */
  recentOrts(showId, n = 6) {
    const out = [], seen = new Set();
    this.entriesR(showId).sort((a, b) => b.mod - a.mod).forEach(e => { const o = this.ortByKey(showId, e.f.ortId); if (o && !seen.has(o.key)) { seen.add(o.key); out.push(o); } });
    for (const o of this.allOrts(showId)) { if (out.length >= n) break; if (!seen.has(o.key)) { seen.add(o.key); out.push(o); } }
    return out.slice(0, n);
  },
  /** neue Ord-Werte (10, 20, …) für eine geordnete Liste → nur geänderte Objekte im Patch */
  reord(list, f, patch = {}) {
    list.forEach((it, i) => { const ord = (i + 1) * 10, old = f[it.key]; if (old && +old.ord !== ord) patch[it.key] = Object.assign({}, old, patch[it.key] || {}, { ord }); });
    return patch;
  },

  /** kleines Formular als Blatt → Promise(Werte | null). Löst erst auf, wenn die Zurück-Navigation verarbeitet ist. */
  form(title, fields, { ok = 'Übernehmen', html = '', check = null } = {}) {
    return new Promise(resolve => {
      let done = false;
      const sh = Ui.sheet({ title, center: true, onBack: () => { if (!done) { done = true; Ui.afterBack().then(() => resolve(null)); } return true; } });
      sh.el.dataset.editor = '1';
      sh.body.innerHTML = `<form class="form" onsubmit="return false">${fields.map(fd => this._fieldHtml(fd)).join('')}${html}
        <button type="button" class="btn primary big block" data-ok>${I('check')} ${Utils.esc(ok)}</button></form>`;
      const read = () => { const v = {}; fields.forEach(fd => { const el = sh.body.querySelector(`[name="${CSS.escape(fd.k)}"]`); if (el) v[fd.k] = el.value; }); return v; };
      const submit = () => {
        if (done) return; const v = read();
        if (check) { const msg = check(v); if (msg) { Ui.toast(msg, 'warn'); return; } }
        done = true; sh.close(); Ui.afterBack().then(() => resolve(v));
      };
      sh.body.addEventListener('click', e => {
        const q = e.target.closest('[data-quick]');
        if (q) { const t = sh.body.querySelector(`[name="${CSS.escape(q.dataset.quick)}"]`); if (t) { t.value = q.dataset.qv; t.dispatchEvent(new Event('input', { bubbles: true })); } return; }
        if (e.target.closest('[data-ok]')) submit();
      });
      sh.body.addEventListener('keydown', e => {
        if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
        e.preventDefault();
        const ins = [...sh.body.querySelectorAll('input,textarea,select')], i = ins.indexOf(e.target);
        if (ins[i + 1] && ins[i + 1].tagName !== 'SELECT') ins[i + 1].focus(); else submit();
      });
      setTimeout(() => { const f = sh.body.querySelector('input,textarea'); f && f.focus(); }, 60);
    });
  },
