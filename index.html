      c.rgb(0.45, 0.48, 0.53).text(M + 10, y, 'BEMERKUNG', 'F2', 7.5); y -= 16;
      bem.forEach(ln => { c.rgb(0.1, 0.11, 0.13).text(M + 10, y, ln, 'F1', 11); y -= 14; });
      if (exl.length) { y -= 4; exl.forEach(ln => { c.rgb(0.3, 0.33, 0.38).text(M + 10, y, ln, 'F1', 9.5); y -= 12; }); }

      // Fotos: 1–2 groß untereinander, 3–4 im 2×2-Raster
      const top = H - 116, bottom = boxY + boxH + 14, avH = top - bottom, avW = W - 2 * M;
      const n = pg.photos.length;
      const slots = [];
      if (n === 1) { const s = Math.min(avW, avH); slots.push([M + (avW - s) / 2, bottom + (avH - s) / 2, s]); }
      else if (n === 2) { const s = Math.min(avW, (avH - 10) / 2); const x = M + (avW - s) / 2; const y0 = bottom + (avH - (2 * s + 10)) / 2; slots.push([x, y0 + s + 10, s], [x, y0, s]); }
      else if (n > 2) {
        const s = Math.min((avW - 10) / 2, (avH - 10) / 2); const x0 = M + (avW - (2 * s + 10)) / 2, y0 = bottom + (avH - (2 * s + 10)) / 2;
        slots.push([x0, y0 + s + 10, s], [x0 + s + 10, y0 + s + 10, s], [x0, y0, s], [x0 + s + 10, y0, s]);
      } else {
        c.rgb(0.6, 0.62, 0.66).text(M, top - 30, 'Keine Fotos zu diesem Eintrag.', 'F1', 12);
      }
      for (let k = 0; k < n; k++) {
        const p = pg.photos[k];
        let d = await Repo.full(p.b);
        if (!d) { c.rgb(0.6, 0.62, 0.66).text(slots[k][0] + 8, slots[k][1] + slots[k][2] / 2, 'Bilddaten fehlen auf diesem Gerät', 'F1', 10); continue; }
        if (opts.compact) d = (await Photo.recompress(d, 900, 0.7)).d;
        const info = this.jpegInfo(d), iid = nextId++, name = 'Im' + iid;
        obj(iid, () => {
          put(`<< /Type /XObject /Subtype /Image /Width ${info.w} /Height ${info.h} /ColorSpace /${info.c === 1 ? 'DeviceGray' : 'DeviceRGB'} /BitsPerComponent 8 /Filter /DCTDecode /Length ${d.byteLength} >>\nstream\n`);
          put(d); put('\nendstream');
        });
        images[name] = iid;
        const [x, yy, s] = slots[k];
        const ih = s * info.h / info.w;
        c.img(name, x, yy + (s - ih) / 2, s, ih);
        c.rgb(0.75, 0.77, 0.8, true); c.rect(x, yy + (s - ih) / 2, s, ih, 'S');
        const lbl = `Foto ${pg.from + k + 1}${(pg.from + k) === 0 ? ' · Nah' : (pg.from + k) === 1 ? ' · Totale' : ''}`;
        c.rgb(0, 0, 0).rect(x + 6, yy + (s - ih) / 2 + ih - 20, this.width(lbl, 'F2', 8) + 10, 14);
        c.rgb(1, 1, 1).text(x + 11, yy + (s - ih) / 2 + ih - 16, lbl, 'F2', 8);
        d = null;
      }
      footer(c, pageNo, it.kat);
      writePage(c.get(), images);
      done++; onProgress && onProgress(done, pages.length);
      if (done % 4 === 0) await Utils.frame();     // Oberfläche reaktionsfähig halten
    }
    if (!pageIds.length) {        // leere Show: eine Hinweisseite
      const c = C(); c.rgb(0.07, 0.08, 0.1).text(M, H - 80, show.f.titel, 'F2', 22).rgb(0.4, 0.43, 0.48).text(M, H - 110, 'Diese Veranstaltung enthält noch keine Einträge.', 'F1', 12);
      writePage(c.get(), {});
    }
    // ---- Katalog, Seitenbaum, Schriften, Querverweise ----
    obj(1, `<< /Type /Catalog /Pages 2 0 R /ViewerPreferences << /DisplayDocTitle true >> >>`);
    obj(2, `<< /Type /Pages /Kids [${pageIds.map(id => id + ' 0 R').join(' ')}] /Count ${pageIds.length} >>`);
    obj(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    obj(4, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const infoId = nextId++;
    const pdfStr = s => '(' + this.esc(this.win(s)) + ')';
    obj(infoId, `<< /Title ${pdfStr(show.f.titel)} /Producer ${pdfStr('Doku VT ' + APP_VERSION)} /Creator ${pdfStr('Doku VT')} >>`);
    const xrefPos = offset;
    let x = `xref\n0 ${nextId}\n0000000000 65535 f \n`;
    for (let i = 1; i < nextId; i++) x += (xref[i] != null ? String(xref[i]).padStart(10, '0') + ' 00000 n ' : '0000000000 65535 f ') + '\n';
    put(x);
    put(`trailer\n<< /Size ${nextId} /Root 1 0 R /Info ${infoId} 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`);
    return new Blob(parts, { type: 'application/pdf' });
  }
};

/* =====================================================================
   Sync – Kern: Pakete bauen/einspielen, Status, Protokoll.
   Adapter-Schnittstelle (austauschbar):
     { id, name, available():bool, push(opts):Promise, pull(input):Promise<stat> }
   Alle Wege landen in Repo.applyRemote() → feldweises Zusammenführen.
   ===================================================================== */
const Sync = {
  deviceId: '', state: { lastSyncAt: 0, lastPackageAt: 0, lastError: '', log: [] },
  adapters: new Map(), peer: null, listeners: new Set(),
  async init() {
    this.deviceId = await Store.metaGet('deviceId', '');
    if (!this.deviceId) { this.deviceId = Utils.uuid(); await Store.metaSet('deviceId', this.deviceId); }
    Object.assign(this.state, await Store.metaGet('syncState', {}));
    [FileAdapter, PeerAdapter, ServerAdapter].forEach(a => this.adapters.set(a.id, a));
  },
  deviceName() {
    if (Settings.v.deviceName) return Settings.v.deviceName;
    const ua = navigator.userAgent;
    return /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' : /Pixel/.test(ua) ? 'Pixel' : /Android/.test(ua) ? 'Android' : 'Computer';
  },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  changed: Utils.debounce(function () { Sync.listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } }); }, 120),
  noteLocalChange() { this.changed(); },
  async save() { await Store.metaSet('syncState', this.state); this.changed(); },
  async log(msg, kind = 'info') {
    this.state.log.unshift({ t: Date.now(), msg, kind }); this.state.log = this.state.log.slice(0, 60);
    if (kind === 'error') this.state.lastError = msg;
    await this.save();
  },
  async markSynced(msg) { this.state.lastSyncAt = Date.now(); this.state.lastError = ''; await this.log(msg, 'ok'); },
  pending() {
    const since = this.state.lastSyncAt; let n = 0;
    for (const m of [Repo.shows, Repo.entries, Repo.photos]) for (const r of m.values()) if (r.mod > since) n++;
    return n;
  },
  status() {
    if (this.peer && this.peer.open) return { state: 'live', label: 'Live', text: `Live verbunden mit ${this.peer.peerName || 'Gerät'}` };
    if (this.state.lastError) return { state: 'error', label: 'Fehler', text: this.state.lastError };
    const n = this.pending();
    if (!this.state.lastSyncAt) return { state: 'pending', label: n ? `${n} offen` : 'Nie', text: 'Noch nie mit einem anderen Gerät abgeglichen' };
    if (n) return { state: 'pending', label: `${n} offen`, text: `${n} Änderungen seit dem letzten Abgleich (${Utils.fmtAgo(this.state.lastSyncAt)})` };
    return { state: 'ok', label: 'Synchron', text: `Abgeglichen ${Utils.fmtAgo(this.state.lastSyncAt)}` };
  },
  /** Datensätze sammeln: seit Zeitpunkt, optional nur bestimmte Shows (inkl. Tombstones!) */
  collect({ since = 0, showIds = null } = {}) {
    const inShow = r => !showIds || showIds.includes(r.showId || r.id);
    const pick = m => [...m.values()].filter(r => r.mod > since && inShow(r));
    return { shows: pick(Repo.shows), entries: pick(Repo.entries), photos: pick(Repo.photos) };
  },
  /** Paket als Blob – stückweise zusammengesetzt (kein Riesen-String im Speicher) */
  async buildPackage({ type = 'sync', since = 0, showIds = null, withBlobs = true } = {}, onProgress) {
    const recs = this.collect({ since, showIds });
    const head = { format: 'lichtdoku', type, formatVersion: FORMAT_VERSION, appVersion: APP_VERSION, deviceId: this.deviceId, deviceName: this.deviceName(), createdAt: Date.now(), since, showIds, ...recs, blobs: [] };
    const json = JSON.stringify(head);
    const parts = [json.slice(0, -2)];
    let n = 0;
    if (withBlobs) {
      const ids = [...new Set(recs.photos.filter(p => !p.f.del).map(p => p.b))];
      for (const id of ids) {
        const full = await Repo.full(id), thumb = await Repo.thumb(id);
        if (!full) continue;
        parts.push((n ? ',' : '') + JSON.stringify({ id, full: Utils.bufToB64(full), thumb: thumb ? Utils.bufToB64(thumb) : null }));
        n++; onProgress && onProgress(n, ids.length);
        if (n % 10 === 0) await Utils.frame();
      }
    }
    parts.push(']}');
    return { blob: new Blob(parts, { type: 'application/json' }), counts: { shows: recs.shows.length, entries: recs.entries.length, photos: recs.photos.length, blobs: n } };
  },
  async importPackage(file) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { throw new Error('Die Datei ist kein gültiges Doku VT-Paket (JSON nicht lesbar).'); }
    if (!data || data.format !== 'lichtdoku') throw new Error('Unbekanntes Dateiformat – erwartet wird ein Doku VT-Backup oder Sync-Paket.');
    if ((data.formatVersion || 1) > FORMAT_VERSION) throw new Error('Das Paket stammt aus einer neueren Doku VT-Version. Bitte zuerst die App aktualisieren.');
    const blobs = (data.blobs || []).map(b => ({ id: b.id, full: Utils.b64ToBuf(b.full), thumb: b.thumb ? Utils.b64ToBuf(b.thumb) : null }));
    const stat = await Repo.applyRemote(data, blobs);
    const missing = (await Repo.missingBlobs()).length;
    const from = data.deviceName ? ` von ${data.deviceName}` : '';
    if (data.type === 'sync') await this.markSynced(`Sync-Paket${from} eingespielt: ${stat.neu} neu, ${stat.geaendert} zusammengeführt, ${stat.bilder} Bilder`);
    else await this.log(`Backup${from} importiert: ${stat.neu} neu, ${stat.geaendert} zusammengeführt, ${stat.bilder} Bilder`, 'ok');
    return { ...stat, missing, type: data.type };
  }
};

/* ---------- Adapter 1: Sync-Paket-Datei (AirDrop, Nearby Share, Dateien-App, USB-Stick, NAS) ---------- */
const FileAdapter = {
  id: 'file', name: 'Sync-Paket (Datei)',
  available: () => true,
  async push({ full = false, showIds = null } = {}, onProgress) {
    const since = full ? 0 : Sync.state.lastPackageAt || 0;
    const { blob, counts } = await Sync.buildPackage({ type: 'sync', since, showIds }, onProgress);
    const name = `DokuVT_Sync_${Utils.safeName(Sync.deviceName())}_${Utils.stamp()}.ldsync.json`;
    const res = await Utils.shareFile(blob, name, 'Doku VT Sync-Paket');
    if (res !== 'abort') {
      Sync.state.lastPackageAt = Date.now();
      await Sync.markSynced(`Sync-Paket erstellt (${full ? 'komplett' : 'Änderungen'}): ${counts.entries} Einträge, ${counts.blobs} Bilder`);
    }
    return { res, counts, size: blob.size };
  },
  pull: file => Sync.importPackage(file)
};

/* ---------- Adapter 2: Gerät-zu-Gerät per WebRTC, Signalisierung über QR-Codes ----------
   Kein Server, kein Internet: beide Geräte im selben WLAN (Fritzbox). ICE nutzt nur
   lokale Host-Kandidaten. Danach bleibt der Datenkanal offen und überträgt jede
   Änderung sofort („Live“). Nachrichten werden in 16-KB-Stücke zerlegt.          */
const PeerAdapter = {
  id: 'peer', name: 'Live-Abgleich im WLAN',
  available: () => 'RTCPeerConnection' in window,
  async encodeSignal(obj) {
    const { z, buf } = await Utils.deflate(JSON.stringify(obj));
    return `LD1${z ? 'z' : 'p'}:${Utils.b64url(Utils.bufToB64(buf))}`;
  },
  async decodeSignal(text) {
    const m = /^LD1([zp]):([A-Za-z0-9_-]+)$/.exec(String(text).trim());
    if (!m) throw new Error('Das ist kein Doku VT-Verbindungscode.');
    return JSON.parse(await Utils.inflate(Utils.b64ToBuf(Utils.unb64url(m[2])), m[1] === 'z'));
  },
  push() { throw new Error('Der Live-Abgleich wird über „Abgleich → Geräte verbinden“ gestartet.'); },
  pull() { throw new Error('Der Live-Abgleich wird über „Abgleich → Geräte verbinden“ gestartet.'); }
};

class PeerSession {
  constructor() {
    this.pc = new RTCPeerConnection({ iceServers: [] });
    this.dc = null; this.open = false; this.peerName = ''; this.peerId = '';
    this.frag = new Map(); this.need = new Set(); this.gotMeta = false; this.unsub = null; this.onstate = () => {};
    this.stats = { recv: 0, sent: 0 };
    this.pc.onconnectionstatechange = () => {
      const s = this.pc.connectionState;
      if (s === 'failed') this._fail('Die direkte Verbindung kam nicht zustande. Sind beide Geräte im selben WLAN (nicht Gast-WLAN)?');
      if (s === 'disconnected' || s === 'closed') this._closed();
    };
  }
  _fail(msg) { Sync.log(msg, 'error'); this.onstate('error', msg); this.close(); }
  _closed() {
    if (this.closedOnce) return; this.closedOnce = true;
    this.open = false; if (this.unsub) this.unsub(); if (Sync.peer === this) Sync.peer = null;
    Sync.changed(); this.onstate('closed');
  }
  async _gather() {
    if (this.pc.iceGatheringState === 'complete') return;
    await new Promise(res => {
      const t = setTimeout(res, 3000);
      this.pc.addEventListener('icegatheringstatechange', () => { if (this.pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
    });
  }
  _bind(dc) {
    this.dc = dc; dc.bufferedAmountLowThreshold = 1 << 20;
    dc.onopen = () => {
      this.open = true; Sync.peer = this; Sync.changed(); this.onstate('open');
      this.send({ t: 'hello', id: Sync.deviceId, n: Sync.deviceName(), v: APP_VERSION });
    };
    dc.onclose = () => this._closed();
    dc.onmessage = ev => this._recv(ev.data);
  }
  async createOffer() {
    this._bind(this.pc.createDataChannel('lichtdoku', { ordered: true }));
    await this.pc.setLocalDescription(await this.pc.createOffer());
    await this._gather();
    return PeerAdapter.encodeSignal({ r: 'o', id: Sync.deviceId, n: Sync.deviceName(), sdp: this.pc.localDescription.sdp });
  }
  async acceptOffer(sig) {
    if (sig.r !== 'o') throw new Error('Das ist ein Antwort-Code – bitte den Code des anderen Geräts nach „Verbindung anbieten“ scannen.');
    this.pc.ondatachannel = ev => this._bind(ev.channel);
    await this.pc.setRemoteDescription({ type: 'offer', sdp: sig.sdp });
    await this.pc.setLocalDescription(await this.pc.createAnswer());
    await this._gather();
    this.peerName = sig.n;
    return PeerAdapter.encodeSignal({ r: 'a', id: Sync.deviceId, n: Sync.deviceName(), sdp: this.pc.localDescription.sdp });
  }
  async acceptAnswer(sig) {
    if (sig.r !== 'a') throw new Error('Das ist ein Angebots-Code – bitte den ANTWORT-Code des anderen Geräts scannen.');
    this.peerName = sig.n;
    await this.pc.setRemoteDescription({ type: 'answer', sdp: sig.sdp });
  }
  /* ---- Nachrichten (gestückelt, mit Gegendruck) ---- */
  async send(obj) {
    if (!this.dc || this.dc.readyState !== 'open') return;
    const s = JSON.stringify(obj), CH = 16000;
    const raw = async str => {
      if (this.dc.bufferedAmount > 4 << 20) await new Promise(r => { this.dc.onbufferedamountlow = () => { this.dc.onbufferedamountlow = null; r(); }; });
      if (this.dc.readyState === 'open') this.dc.send(str);
    };
    if (s.length <= CH) { await raw('M' + s); return; }
    const id = Math.random().toString(36).slice(2, 8), n = Math.ceil(s.length / CH);
    for (let i = 0; i < n; i++) await raw(`C${id}:${i}:${n}:` + s.slice(i * CH, (i + 1) * CH));
    this.stats.sent++;
  }
  _recv(data) {
    if (typeof data !== 'string') return;
    if (data[0] === 'M') { this._handle(JSON.parse(data.slice(1))); return; }
    const m = /^C([a-z0-9]+):(\d+):(\d+):/.exec(data); if (!m) return;
    const [, id, i, n] = m; let f = this.frag.get(id);
    if (!f) { f = { parts: new Array(+n), got: 0 }; this.frag.set(id, f); }
    f.parts[+i] = data.slice(m[0].length); f.got++;
    if (f.got === +n) { this.frag.delete(id); this._handle(JSON.parse(f.parts.join(''))); }
  }
  async _handle(msg) {
    this.stats.recv++;
    try {
      switch (msg.t) {
        case 'hello':
          this.peerName = msg.n; this.peerId = msg.id; Sync.changed(); this.onstate('hello', msg.n);
          await Sync.log(`Live-Verbindung mit ${msg.n} hergestellt`, 'ok');
          await this.send({ t: 'meta', ...Sync.collect({ since: 0 }) });
          this.unsub = Repo.on(ev => this._local(ev));
          break;
        case 'meta': {
          const st = await Repo.applyRemote(msg);
          this.gotMeta = true; this.onstate('progress', `Daten zusammengeführt: ${st.neu} neu, ${st.geaendert} geändert`);
          const miss = await Repo.missingBlobs(); miss.forEach(b => this.need.add(b));
          this.needTotal = miss.length;
          if (miss.length) await this.send({ t: 'need', ids: miss }); else await this._maybeDone();
          break;
        }
        case 'need':
          for (const id of msg.ids) {
            const full = await Repo.full(id), thumb = await Repo.thumb(id);
            await this.send({ t: 'blob', id, full: full ? Utils.bufToB64(full) : null, thumb: thumb ? Utils.bufToB64(thumb) : null });
          }
          break;
        case 'blob':
          if (msg.full) await Repo.applyRemote({}, [{ id: msg.id, full: Utils.b64ToBuf(msg.full), thumb: msg.thumb ? Utils.b64ToBuf(msg.thumb) : null }]);
          this.need.delete(msg.id);
          if (this.needTotal) this.onstate('progress', `Bilder: ${this.needTotal - this.need.size} / ${this.needTotal}`, (this.needTotal - this.need.size) / this.needTotal);
          await this._maybeDone();
          break;
        case 'delta': {
          await Repo.applyRemote(msg);
          const ids = (msg.photos || []).filter(p => !p.f.del).map(p => p.b);
          const have = await Repo.blobIds(); const miss = ids.filter(b => !have.has(b) && !this.need.has(b));
          miss.forEach(b => this.need.add(b));
          if (miss.length) await this.send({ t: 'need', ids: miss }); else await Sync.markSynced(`Live-Änderung von ${this.peerName} übernommen`);
          break;
        }
        case 'done': this.onstate('peerdone'); break;
      }
    } catch (e) {
      console.error(e); await Sync.log('Abgleichfehler: ' + e.message, 'error'); this.onstate('error', e.message);
    }
  }
  async _maybeDone() {
    if (this.gotMeta && this.need.size === 0 && !this.initialDone) {
      this.initialDone = true;
      await Sync.markSynced(`Abgleich mit ${this.peerName} abgeschlossen`);
      await this.send({ t: 'done' });
      this.onstate('done');
    } else if (this.initialDone && this.need.size === 0) await Sync.markSynced(`Live-Änderung von ${this.peerName} übernommen`);
  }
  /** Lokale Änderung sofort an das andere Gerät schicken */
  async _local(ev) {
    if (!ev.local || !this.open) return;
    await this.send({ t: 'delta', ...ev.records });
    for (const id of ev.blobIds || []) {
      const full = await Repo.full(id), thumb = await Repo.thumb(id);
      await this.send({ t: 'blob', id, full: Utils.bufToB64(full), thumb: thumb ? Utils.bufToB64(thumb) : null });
    }
    Sync.state.lastSyncAt = Date.now(); await Sync.save();
  }
  close() { try { this.dc && this.dc.close(); } catch (e) { /* egal */ } try { this.pc.close(); } catch (e) { /* egal */ } this._closed(); }
}

/* ---------- Adapter 3: lokaler Sync-Server (vorbereitet für eine spätere Version) ----------
   Gedacht für einen kleinen Server im Fritzbox-Netz (Raspberry Pi/NAS), der
   dieselben Pakete per HTTP annimmt (POST /api/sync) und die Änderungen anderer
   Geräte zurückgibt. Das Paketformat ist identisch mit dem Datei-Adapter.       */
const ServerAdapter = {
  id: 'server', name: 'Sync-Server im Theaternetz (geplant)',
  available: () => false,
  async push() { throw new Error('Der Server-Abgleich ist für eine spätere Version geplant.'); },
  async pull() { throw new Error('Der Server-Abgleich ist für eine spätere Version geplant.'); }
};

/* =====================================================================
   Ui – Ebenen (Overlays) mit Zurück-Geste, Dialoge, Toasts, Busy-Anzeige.
   Jede Ebene legt einen History-Eintrag an → Android-Zurück / Wischgeste
   und Esc schließen die oberste Ebene. Keine nativen alert()/confirm().
   ===================================================================== */
const Ui = {
  stack: [], seq: 0, ignorePop: 0,
  init() {
    window.addEventListener('popstate', () => {
      if (this.ignorePop > 0) { this.ignorePop--; return; }
      const top = this.stack[this.stack.length - 1];
      if (!top) return;
      const r = top.opts.onBack ? top.opts.onBack() : true;
      if (r === false) { history.pushState({ ld: top.id }, ''); return; }
      if (r && typeof r.then === 'function') {
        history.pushState({ ld: top.id }, '');
        r.then(ok => { if (ok) this._close(top); });
        return;
      }
      top.closed = true; top.el.remove(); this.stack.pop(); this._restoreFocus(top);
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && this.stack.length) { e.preventDefault(); history.back(); }
    });
  },
  layer(el, opts = {}) {
    const L = { id: ++this.seq, el, opts, closed: false, focus: document.activeElement };
    document.body.appendChild(el); this.stack.push(L);
    history.pushState({ ld: L.id }, '');
    return { el, close: () => this._close(L), get closed() { return L.closed; } };
  },
  _close(L) {
    if (L.closed) return; L.closed = true; L.el.remove();
    const i = this.stack.indexOf(L);
    if (i === this.stack.length - 1) { this.stack.pop(); this.ignorePop++; history.back(); }
    else if (i >= 0) this.stack.splice(i, 1);
    this._restoreFocus(L);
  },
  _restoreFocus(L) { if (L.focus && L.focus.isConnected && L.focus.focus) { try { L.focus.focus({ preventScroll: true }); } catch (e) { /* egal */ } } },
  get topOpen() { return this.stack.length > 0; },

  /** Dialog → Promise(Wert). buttons: [{label, value, cls}] ; input: {value, placeholder, inputmode} */
  dialog({ title, message = '', buttons = [{ label: 'OK', value: true, cls: 'primary' }], input = null, cancelValue = null, html = '', row = false }) {
    return new Promise(resolve => {
      const scrim = document.createElement('div'); scrim.className = 'scrim dlg';
      scrim.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgT">
        <h2 id="dlgT">${Utils.esc(title)}</h2>${message ? `<p>${Utils.esc(message)}</p>` : ''}${html}
        ${input ? `<input class="txt" type="text" value="${Utils.esc(input.value || '')}" placeholder="${Utils.esc(input.placeholder || '')}" ${input.inputmode ? `inputmode="${input.inputmode}"` : ''} enterkeyhint="done" autocomplete="off">` : ''}
        <div class="btns ${row || buttons.length === 2 ? 'row' : ''}">${buttons.map((b, i) => `<button class="btn big ${b.cls || ''}" data-i="${i}">${b.icon ? I(b.icon) : ''}${Utils.esc(b.label)}</button>`).join('')}</div></div>`;
      let done = false;
      const finish = v => { if (done) return; done = true; L.close(); resolve(v); };
      const inp = scrim.querySelector('input.txt');
      scrim.addEventListener('click', e => {
        const b = e.target.closest('button[data-i]');
        if (b) { const def = buttons[+b.dataset.i]; finish(input && def.value === true ? inp.value : def.value); }
        else if (e.target === scrim) finish(cancelValue);
      });
      if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); finish(inp.value); } });
      const L = this.layer(scrim, { onBack: () => { done = true; resolve(cancelValue); return true; } });
      setTimeout(() => { if (inp) { inp.focus(); inp.select(); } else { const p = scrim.querySelector('.btn.primary,.btn.danger.solid') || scrim.querySelector('.btn'); p && p.focus(); } }, 30);
    });
  },
  confirm(title, message, okLabel = 'OK', danger = false) {
    return this.dialog({ title, message, buttons: [{ label: 'Abbrechen', value: false }, { label: okLabel, value: true, cls: danger ? 'danger solid' : 'primary' }], cancelValue: false });
  },
  prompt(title, value, placeholder, message = '') {
    return this.dialog({ title, message, input: { value, placeholder }, buttons: [{ label: 'Abbrechen', value: null }, { label: 'Übernehmen', value: true, cls: 'primary' }] });
  },
  /** Aktionsmenü: items [{label, value, icon, danger, hint}] */
  menu(title, items) {
    return this.dialog({ title, buttons: items.filter(Boolean).map(it => ({ label: it.label, value: it.value, icon: it.icon, cls: it.danger ? 'danger' : '' })).concat([{ label: 'Abbrechen', value: null, cls: 'ghost' }]) });
  },
  toast(msg, kind = '', { action = null, ms = 3800 } = {}) {
    const box = document.getElementById('toasts');
    const t = document.createElement('div'); t.className = `toast ${kind}`;
    t.innerHTML = `<span class="t">${Utils.esc(msg)}</span>${action ? `<button>${Utils.esc(action.label)}</button>` : ''}`;
    if (action) t.querySelector('button').onclick = () => { t.remove(); action.fn(); };
    box.appendChild(t);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => t.remove(), action ? ms + 3000 : ms);
  },
  busy(text) {
    const el = document.createElement('div'); el.className = 'busyov'; el.setAttribute('role', 'status');
    el.innerHTML = `<div class="bx"><div class="spinner"></div><div class="tx">${Utils.esc(text)}</div></div>`;
    document.body.appendChild(el);
    return { set: t => { el.querySelector('.tx').textContent = t; }, close: () => el.remove() };
  },
  /** Bildschirmfüllendes Sheet (Editor, Einstellungen …). Gibt {el, body, foot, close} zurück. */
  sheet({ title, full = false, center = false, onBack, headRight = '', headLeft = null }) {
    const scrim = document.createElement('div'); scrim.className = `scrim ${center ? 'center' : ''} ${full ? 'fullwrap' : ''}`;
    scrim.innerHTML = `<div class="sheet ${full ? 'full' : ''}" role="dialog" aria-modal="true" aria-label="${Utils.esc(title)}">
      <div class="sheet-h">${headLeft ?? `<button class="btn icon ghost" data-close aria-label="Schließen">${I('close')}</button>`}<h2>${Utils.esc(title)}</h2>${headRight}</div>
      <div class="sheet-b"></div><div class="sheet-f hidden"></div></div>`;
    const sh = scrim.querySelector('.sheet');
    scrim.addEventListener('click', e => { if (e.target === scrim && !full) history.back(); if (e.target.closest('[data-close]')) history.back(); });
    const L = this.layer(scrim, { onBack });
    return { el: sh, scrim, body: sh.querySelector('.sheet-b'), foot: sh.querySelector('.sheet-f'), head: sh.querySelector('.sheet-h'), close: L.close, layer: L };
  }
};

/* =====================================================================
   Views – Startseite, Show-Liste, Detail
   ===================================================================== */
const Views = {
  /** Sortierte Kartenliste: je Eintrag eine Karte pro Kategorie mit Fotos */
  sortedItems(showId, { kat = 'all', sort = 'kreis', q = '' }) {
    const nq = q.trim().toLowerCase();
    const terms = nq ? nq.split(/\s+/) : [];
    const items = [];
    for (const e of Repo.entriesOf(showId)) {
      if (terms.length) {
        const hay = TEXT_FIELDS.map(k => e.f[k] || '').join(' \u0001 ').toLowerCase();
        if (!terms.every(t => hay.includes(t))) continue;
      }
      for (const k of Repo.catsOf(e.id)) {
        if (kat !== 'all' && k !== kat) continue;
        items.push({ entry: e, kat: k, key: e.id + ':' + k });
      }
    }
    const ko = { A: 0, E: 1, N: 2 };
    items.sort((a, b) => {
      if (sort === 'gruppe') {
        const ga = a.entry.f.gruppe || '', gb = b.entry.f.gruppe || '';
        if (!ga !== !gb) return ga ? -1 : 1;
        const c = Utils.cmpKreis(ga, gb); if (c) return c;
      }
      return (ko[a.kat] - ko[b.kat]) || Utils.cmpKreis(a.entry.f.kreis, b.entry.f.kreis) || (a.entry.c - b.entry.c);
    });
    return items;
  },
  sectionOf(item, sort) {
    if (sort === 'gruppe') return item.entry.f.gruppe ? { key: 'g' + item.entry.f.gruppe, label: 'Gruppe ' + item.entry.f.gruppe, k: null } : { key: 'g-', label: 'Ohne Gruppe', k: null };
    return { key: item.kat, label: KAT[item.kat].name, k: item.kat };
  },
  thumbImg(b, alt = '') {
    const cached = Thumbs.map.get(b);
    if (cached && cached.url) return `<img src="${cached.url}" class="ok" alt="${Utils.esc(alt)}" data-b="${b}" data-l="1" decoding="async">`;
    return `<img alt="${Utils.esc(alt)}" data-b="${b}" decoding="async">`;
  },
  chips(e, keys = ['gruppe', 'filter', 'adresse']) {
    return keys.filter(k => e.f[k]).map(k => `<span class="chip"><b>${FIELD_LABEL[k]}</b><span>${Utils.esc(e.f[k])}</span></span>`).join('');
  },
  cardHtml(it, { sel, checklist, dupKeys }) {
    const e = it.entry, ph = it.kat === 'N' ? [] : Repo.photosOf(e.id, it.kat);
    const chkKey = it.kat === 'E' ? 'chkE' : 'chkA', checked = !!e.f[chkKey];
    const thumbs = ph.slice(0, 2).map((p, i) => `<span class="th" data-act="lb" data-i="${i}">${this.thumbImg(p.b)}${i === 1 && ph.length > 2 ? `<span class="more">+${ph.length - 2}</span>` : ''}</span>`).join('');
    const dup = dupKeys.has(Utils.kreisTokens(e.f.kreis).sort().join('+'));
    return `<article class="card ${sel ? 'sel' : ''} ${checklist && checked ? 'done' : ''}" data-k="${it.kat}" data-key="${it.key}">
      <div class="strip"></div>
      <button class="hit" data-act="open" aria-label="${Utils.esc(`Kreis ${e.f.kreis || 'ohne Nummer'}, ${KAT[it.kat].name}`)}">
        ${thumbs ? `<span class="thumbs">${thumbs}</span>` : ''}
        <span class="info">
          <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="tag ${it.kat}">${it.kat === 'N' ? 'Ohne Foto' : KAT[it.kat].name}</span></span>
          <span class="kreis ${e.f.kreis ? '' : 'none'}">${e.f.kreis ? Utils.esc(e.f.kreis) : 'ohne Kreis'}</span>
          ${(e.f.gruppe || e.f.filter || e.f.adresse) ? `<span class="chips">${this.chips(e)}</span>` : ''}
          ${e.f.bemerkung ? `<span class="note">${Utils.esc(e.f.bemerkung)}</span>` : ''}
        </span>
      </button>
      ${dup ? '<span class="dup" title="Kreis doppelt">doppelt</span>' : ''}
      ${checklist ? `<button class="chk" role="checkbox" aria-checked="${checked}" data-act="chk" aria-label="${it.kat === 'E' ? 'Eingeleuchtet' : 'Aufgebaut'}"><span class="box">${checked ? I('check') : ''}</span></button>` : ''}
    </article>`;
  },
  detailHtml(e, editMode, checklist) {
    const f = e.f;
    const fieldBox = (k, wide) => `<div class="fieldbox ${wide ? 'wide' : ''}"><b>${FIELD_LABEL[k]}</b><span>${f[k] ? Utils.esc(f[k]) : '<span class="muted">—</span>'}</span></div>`;
    const extras = ['geraet', 'dmx', 'position', 'farbe'].filter(k => f[k]);
    const kat = k => {
      const ph = Repo.photosOf(e.id, k), chk = k === 'E' ? f.chkE : f.chkA;
      return `<section class="kat" data-k="${k}"><div class="kh"><span class="tag ${k}">${KAT[k].name}</span><h3>${ph.length} Foto${ph.length === 1 ? '' : 's'}</h3>
          ${checklist ? `<button class="btn ${chk ? (k === 'E' ? 'yellow' : 'blue') : ''}" data-act="dchk" data-k="${k}" aria-pressed="${!!chk}">${I('check')} ${k === 'E' ? 'Eingeleuchtet' : 'Aufgebaut'}</button>` : ''}</div>
        ${ph.length ? `<div class="photos">${ph.map((p, i) => `<button data-act="dlb" data-k="${k}" data-i="${i}" aria-label="Foto ${i + 1} vergrößern">${this.thumbImg(p.b)}<span class="lbl">${i + 1}${i === 0 ? ' · Nah' : i === 1 ? ' · Totale' : ''}</span></button>`).join('')}</div>`
          : `<div class="nophotos">Keine Fotos in dieser Kategorie.</div>`}</section>`;
    };
    return `<div class="detail">
      <div class="dh"><div style="flex:1;min-width:0"><div class="muted" style="font-size:12px;font-weight:700;letter-spacing:.1em">KREIS</div>
        <div class="kreis ${f.kreis ? '' : 'none'}">${f.kreis ? Utils.esc(f.kreis) : 'ohne Kreis'}</div></div>
        <button class="btn ${editMode ? 'edit' : ''}" data-act="dedit">${I('edit')} Bearbeiten</button></div>
      <div class="fields">${fieldBox('gruppe')}${fieldBox('filter')}${fieldBox('adresse')}${extras.map(k => fieldBox(k)).join('')}${fieldBox('bemerkung', true)}</div>
      ${kat('A')}${kat('E')}
      <div class="actions">
        <button class="btn" data-act="ddup">${I('copy')} Als Vorlage duplizieren</button>
        ${editMode ? `<button class="btn danger" data-act="ddel">${I('trash')} Löschen</button>` : ''}
      </div>
      <p class="muted" style="font-size:12px;margin-top:16px">Zuletzt geändert ${Utils.fmtDate(e.mod)}</p></div>`;
  }
};

/* =====================================================================
   Editor – Eintrag anlegen/bearbeiten. Wird EINMAL aufgebaut und danach nur
   gezielt verändert (keine Neuzeichnung → Tastatur bleibt, kein Flackern).
   ===================================================================== */
const Editor = {
  open({ showId, entryId = null, preset = null, quick = false }) {
    const ex = entryId ? Repo.entry(entryId) : null;
    const f0 = {}; TEXT_FIELDS.forEach(k => { f0[k] = (ex ? ex.f[k] : preset && preset[k]) || ''; });
    const slots = { A: [], E: [] };
    if (ex) Repo.photosOf(ex.id).forEach(p => slots[p.f.kat].push({ photoId: p.id, b: p.b, w: p.w, h: p.h, label: p.f.label }));
    let dirty = false, pending = 0, saving = false;
    const markDirty = () => { dirty = true; };
    const sh = Ui.sheet({
      title: ex ? `Kreis ${ex.f.kreis || '(ohne Nummer)'} bearbeiten` : 'Neuer Eintrag', full: true,
      headLeft: `<button class="btn ghost" data-act="cancel">Abbrechen</button>`,
      headRight: `<button class="btn edit savebtn" data-act="save">${I('check')}<span class="sl">Speichern</span></button>`,
      onBack: () => this._confirmLeave(dirty || pending)
    });
    sh.el.dataset.editor = '1';
    const extraOpen = ['geraet', 'dmx', 'position', 'farbe'].some(k => f0[k]);
    sh.body.innerHTML = `<form class="form" autocomplete="off" onsubmit="return false">
      <div class="f kreisf"><label for="ed-kreis">Kreis</label>
        <div class="inwrap"><input id="ed-kreis" name="kreis" inputmode="tel" enterkeyhint="next" placeholder="z. B. 123+124" value="${Utils.esc(f0.kreis)}" autocapitalize="off" spellcheck="false">
        <button type="button" class="plusbtn" data-act="plus" aria-label="Plus-Zeichen einfügen">+</button></div></div>
      <div class="f-row">
        <div class="f mono"><label for="ed-gruppe">Gruppe</label><input id="ed-gruppe" name="gruppe" inputmode="tel" enterkeyhint="next" value="${Utils.esc(f0.gruppe)}" spellcheck="false"></div>
        <div class="f mono"><label for="ed-filter">Filter</label><input id="ed-filter" name="filter" enterkeyhint="next" placeholder="z. B. L201, nc" value="${Utils.esc(f0.filter)}" autocapitalize="off" spellcheck="false"></div>
        <div class="f mono"><label for="ed-adresse">Adresse</label><input id="ed-adresse" name="adresse" enterkeyhint="next" placeholder="z. B. 12/301" value="${Utils.esc(f0.adresse)}" autocapitalize="off" spellcheck="false"></div>
      </div>
      <div class="f"><label for="ed-bem">Bemerkung</label><textarea id="ed-bem" name="bemerkung" rows="3" placeholder="Wo steckt es, was ist zu beachten?">${Utils.esc(f0.bemerkung)}</textarea></div>
      <details class="more" ${extraOpen ? 'open' : ''}><summary>${I('layers', 'sm')} Weitere Angaben <span class="muted" style="font-weight:400">Gerät, DMX, Position, Farbe</span>${I('arrowR', 'sm chev')}</summary>
        <div class="inner">
          <div class="f"><label for="ed-geraet">Gerät / Scheinwerfer</label><input id="ed-geraet" name="geraet" value="${Utils.esc(f0.geraet)}" placeholder="z. B. ETC Source Four 26°"></div>
          <div class="f mono"><label for="ed-dmx">DMX-Adresse / Universe</label><input id="ed-dmx" name="dmx" value="${Utils.esc(f0.dmx)}" placeholder="z. B. 2/145" spellcheck="false"></div>
          <div class="f"><label for="ed-pos">Position / Zug</label><input id="ed-pos" name="position" value="${Utils.esc(f0.position)}" placeholder="z. B. 3. Zug, Portal rechts"></div>
          <div class="f"><label for="ed-farbe">Farbe / Gobo</label><input id="ed-farbe" name="farbe" value="${Utils.esc(f0.farbe)}" placeholder="z. B. L201, Gobo Wald"></div>
        </div></details>
      ${['A', 'E'].map(k => `<section class="pk" data-k="${k}"><div class="ph"><span class="tag ${k}">${KAT[k].name}</span><h3></h3><span class="n"></span>
          <button type="button" class="btn ${k === 'A' ? 'blue' : 'yellow'}" data-act="cam" data-k="${k}">${I('camera')} Foto</button></div>
          <div class="pgrid" data-k="${k}"></div></section>`).join('')}
      ${ex ? `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
        <button type="button" class="btn danger" data-act="del">${I('trash')} Eintrag löschen</button></div>` : ''}
    </form>`;
    const form = sh.body.querySelector('form'), saveBtn = sh.el.querySelector('[data-act=save]');
    const kreisIn = form.querySelector('#ed-kreis');
    form.addEventListener('input', markDirty);
    kreisIn.addEventListener('blur', () => { const n = Utils.normKreis(kreisIn.value); if (n !== kreisIn.value) kreisIn.value = n; });
    // Eingabe-Navigation: „Weiter“ springt ins nächste Feld
    form.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
        e.preventDefault();
        const ins = [...form.querySelectorAll('input,textarea')]; const i = ins.indexOf(e.target);
        if (ins[i + 1]) ins[i + 1].focus(); else e.target.blur();
      }
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); }
    });

    /* ---- Fotos ---- */
    const updateSave = () => {
      saveBtn.disabled = pending > 0 || saving;
      saveBtn.querySelector('.sl').textContent = pending > 0 ? `Fotos werden verarbeitet (${pending})` : saving ? 'Speichert …' : 'Speichern';
      const ic = saveBtn.querySelector('svg, .spinner'), busy = pending > 0 || saving;
      if (busy !== ic.classList.contains('spinner')) ic.outerHTML = busy ? '<span class="spinner"></span>' : I('check');
    };
    const slotEl = (s, k) => {
      if (s.el) return s.el;
      const b = document.createElement('button'); b.type = 'button'; b.className = 'slot';
      b.innerHTML = `<img alt=""><span class="lbl"></span>${s.pending ? '<span class="busy"><span class="spinner"></span></span>' : ''}`;
      const img = b.querySelector('img');
      if (s.thumbUrl) img.src = s.thumbUrl; else if (s.b) Thumbs.url(s.b).then(u => { if (u) img.src = u; });
      b.addEventListener('click', () => slotMenu(s));
      s.el = b; return b;
    };
    const renderGrid = k => {
      const g = form.querySelector(`.pgrid[data-k="${k}"]`), list = slots[k];
      list.forEach((s, i) => {
        const el = slotEl(s, k);
        el.querySelector('.lbl').textContent = `${i + 1}${i === 0 ? ' · Nah' : i === 1 ? ' · Totale' : ''}`;
        el.setAttribute('aria-label', `${KAT[k].name} Foto ${i + 1} – Optionen`);
      });
      let add = g.querySelector('.slot.add');
      if (!add) {
        add = document.createElement('button'); add.type = 'button'; add.className = 'slot add';
        add.addEventListener('click', () => shoot(k));
      }
      const n = list.length;
      add.innerHTML = `<span class="plus">${I('plus')}</span>Foto ${n + 1}<span class="hint">${n === 0 ? 'Nahaufnahme' : n === 1 ? 'Totale' : 'weiteres'}</span>`;
      add.setAttribute('aria-label', `${KAT[k].name}: Foto ${n + 1} aufnehmen`);
      g.replaceChildren(...list.map(s => s.el), add);
      const sec = form.querySelector(`.pk[data-k="${k}"]`);
      sec.querySelector('h3').textContent = ''; sec.querySelector('.n').textContent = `${n} Foto${n === 1 ? '' : 's'}`;
    };
    const addPending = (promise, k, at = null) => {
      const s = { pending: true }; pending++; updateSave();
      if (at != null) slots[k].splice(at, 0, s); else slots[k].push(s);
      renderGrid(k); markDirty();
      promise.then(r => {
        Object.assign(s, r, { pending: false, thumbUrl: Thumbs.local(r.thumb) });
        if (s.el) { s.el.querySelector('img').src = s.thumbUrl; const bz = s.el.querySelector('.busy'); bz && bz.remove(); }
      }).catch(err => {
        const kk = slots.A.includes(s) ? 'A' : 'E';
        slots[kk].splice(slots[kk].indexOf(s), 1); renderGrid(kk);
        Ui.toast('Foto konnte nicht verarbeitet werden: ' + err.message, 'err');
      }).finally(() => { pending--; updateSave(); });
    };
    const shoot = k => Camera.open({
      kat: k, startIndex: slots[k].length, title: `${KAT[k].name} · ${kreisIn.value ? 'Kreis ' + kreisIn.value : 'neuer Eintrag'}`,
      allowKatSwitch: true, onShot: (p, kk) => addPending(p, kk)
    });
    const slotMenu = async s => {
      if (s.pending) return;
      const k = slots.A.includes(s) ? 'A' : 'E', list = slots[k], i = list.indexOf(s), other = k === 'A' ? 'E' : 'A';
      const v = await Ui.menu(`${KAT[k].name} · Foto ${i + 1}`, [
        { label: 'Ansehen', value: 'view', icon: 'eye' },
        { label: 'Markieren (Pfeil/Kreis)', value: 'ann', icon: 'pen' },
        { label: 'Ersetzen (neu aufnehmen)', value: 'rep', icon: 'replace' },
        i > 0 && { label: 'Nach vorn', value: 'left', icon: 'arrowL' },
        i < list.length - 1 && { label: 'Nach hinten', value: 'right', icon: 'arrowR' },
        { label: `Zu „${KAT[other].name}“ verschieben`, value: 'move', icon: 'layers' },
        { label: 'Foto entfernen', value: 'del', icon: 'trash', danger: true }
      ]);
      if (!v) return;
      markDirty();
      if (v === 'view') Lightbox.open(list.map((x, j) => ({ b: x.b, buf: x.full, thumbUrl: x.thumbUrl, entryId: entryId, kat: k, idx: j, n: list.length, draftF: readForm() })), i);
      else if (v === 'left' || v === 'right') { const j = v === 'left' ? i - 1 : i + 1; [list[i], list[j]] = [list[j], list[i]]; renderGrid(k); }
      else if (v === 'move') { list.splice(i, 1); slots[other].push(s); renderGrid(k); renderGrid(other); }
      else if (v === 'del') { list.splice(i, 1); renderGrid(k); }
      else if (v === 'rep') {
        let got = null;
        await Camera.open({ kat: k, startIndex: i, title: `Foto ${i + 1} ersetzen`, onShot: p => { if (!got) { got = p; } } , allowKatSwitch: false });
        if (got) { list.splice(i, 1); addPending(got, k, i); }
      } else if (v === 'ann') {
        const buf = s.full || await Repo.full(s.b);
        if (!buf) { Ui.toast('Bilddaten fehlen auf diesem Gerät', 'err'); return; }
        const r = await Annotator.open(buf);
        if (r) { const idx = list.indexOf(s); list.splice(idx, 1); addPending(Promise.resolve(r), k, idx); }
      }
    };
    const readForm = () => { const f = {}; TEXT_FIELDS.forEach(k => { const el = form.elements[k]; f[k] = el ? el.value : ''; }); return f; };

    /* ---- Speichern ---- */
    const save = async () => {
      if (pending > 0 || saving) return;
      saving = true; updateSave();
      try {
        const draft = { id: ex ? ex.id : null, showId, f: readForm(), photos: { A: slots.A.map(clean), E: slots.E.map(clean) } };
        const empty = !TEXT_FIELDS.some(k => draft.f[k].trim()) && !draft.photos.A.length && !draft.photos.E.length;
        if (empty && !ex) { dirty = false; sh.close(); return; }
        const res = await Repo.saveDraft(draft);
        dirty = false;
        slots.A.concat(slots.E).forEach(s => s.thumbUrl && URL.revokeObjectURL(s.thumbUrl));
        sh.close();
        App.state.sel = null; App.selectEntry(res.entryId);
        if (res.mergedInto) Ui.toast(`Kreis ${Utils.normKreis(draft.f.kreis)} gab es schon – Einträge wurden zusammengeführt.${res.mergeNotes.length ? ' ' + res.mergeNotes.join('; ') : ''}`, 'warn', { ms: 7000 });
        else Ui.toast(ex ? 'Gespeichert' : `Kreis ${Utils.normKreis(draft.f.kreis) || '(ohne Nummer)'} angelegt`);
      } catch (err) {
        saving = false; updateSave();
        App.error(err);
      }
    };
    const clean = s => ({ photoId: s.photoId || null, b: s.b, w: s.w, h: s.h, full: s.photoId ? undefined : s.full, thumb: s.photoId ? undefined : s.thumb, label: s.label || '' });

    sh.el.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const a = b.dataset.act;
      if (a === 'save') save();
      else if (a === 'cancel') history.back();
      else if (a === 'cam') shoot(b.dataset.k);
      else if (a === 'plus') {
        const v = kreisIn.value, st = kreisIn.selectionStart ?? v.length, en = kreisIn.selectionEnd ?? v.length;
        kreisIn.value = v.slice(0, st) + '+' + v.slice(en); kreisIn.focus(); kreisIn.setSelectionRange(st + 1, st + 1); markDirty();
      } else if (a === 'del') {
        if (await Ui.confirm('Eintrag löschen?', `Kreis ${ex.f.kreis || '(ohne Nummer)'} mit ${slots.A.length + slots.E.length} Fotos wird gelöscht. Beim Abgleich wird die Löschung auf andere Geräte übertragen.`, 'Löschen', true)) {
          try { await Repo.deleteEntry(ex.id); dirty = false; sh.close(); App.state.sel = null; Ui.toast('Eintrag gelöscht'); } catch (err) { App.error(err); }
        }
      }
    });
    renderGrid('A'); renderGrid('E'); updateSave();
    if (quick) {
      // Schnell-Erfassung: Kamera sofort, danach Kreis eintippen
      Camera.open({ kat: quick === 'E' ? 'E' : 'A', startIndex: 0, title: 'Schnell erfassen', allowKatSwitch: true, onShot: (p, k) => addPending(p, k) })
        .then(() => {
          if (!slots.A.length && !slots.E.length) { dirty = false; sh.close(); return; }
          setTimeout(() => kreisIn.focus(), 60);
        });
    } else if (!ex) setTimeout(() => kreisIn.focus(), 80);
  },
  async _confirmLeave(changed) {
    if (!changed) return true;
    return Ui.confirm('Änderungen verwerfen?', 'Der Eintrag wurde noch nicht gespeichert.', 'Verwerfen', true);
  }
};

/* =====================================================================
   SyncView – Abgleich: Status, Live-Verbindung (QR), Sync-Paket, Import
   ===================================================================== */
const SyncView = {
  open() {
    const sh = Ui.sheet({ title: 'Abgleich & Sicherung', center: true });
    const render = () => {
      const st = Sync.status();
      sh.body.innerHTML = `
        <div class="bigstatus" data-state="${st.state}"><span class="dot"></span><div><h3>${Utils.esc(st.state === 'ok' ? 'Synchron' : st.state === 'live' ? 'Live verbunden' : st.state === 'error' ? 'Letzter Abgleich mit Fehler' : 'Abgleich ausstehend')}</h3><p>${Utils.esc(st.text)}</p></div></div>
        ${Sync.peer && Sync.peer.open ? `<button class="pcard" data-act="disconnect"><span class="ic">${I('wifi')}</span><span class="lb2"><h4>Live-Verbindung trennen</h4><p>Mit ${Utils.esc(Sync.peer.peerName)} – Änderungen werden sofort übertragen.</p></span></button>` : ''}
        <button class="pcard" data-act="peer"><span class="ic">${I('qr')}</span><span class="lb2"><h4>Geräte verbinden (Live im WLAN)</h4><p>Beide Geräte im selben WLAN, kein Internet nötig. Je einmal einen QR-Code scannen – danach gleichen sie sich laufend ab.</p></span>${I('arrowR')}</button>
        <button class="pcard" data-act="send"><span class="ic">${I('share')}</span><span class="lb2"><h4>Sync-Paket senden</h4><p>Änderungen als Datei per AirDrop, Nearby Share, Dateien-App oder Fritzbox-Speicher weitergeben.</p></span>${I('arrowR')}</button>
        <button class="pcard" data-act="import"><span class="ic">${I('download')}</span><span class="lb2"><h4>Sync-Paket oder Backup einspielen</h4><p>Wird zusammengeführt – nichts wird überschrieben oder gelöscht, was neuer ist.</p></span>${I('arrowR')}</button>
        <button class="pcard" data-act="backup"><span class="ic">${I('database')}</span><span class="lb2"><h4>Komplett-Backup erstellen</h4><p>Alle Veranstaltungen inkl. Fotos als JSON-Datei sichern.</p></span>${I('arrowR')}</button>
        <button class="pcard" data-act="diag"><span class="ic">${I('info')}</span><span class="lb2"><h4>Diagnose</h4><p>Lokale Daten, offene Änderungen, Protokoll der letzten Abgleiche.</p></span>${I('arrowR')}</button>
        <input type="file" class="hidden" accept=".json,.ldsync,application/json,text/plain">`;
    };
    render();
    const off = Sync.on(() => { if (sh.layer.closed) off(); else render(); });
    sh.body.addEventListener('click', async e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const a = b.dataset.act;
      if (a === 'peer') PeerView.open();
      else if (a === 'disconnect') { Sync.peer && Sync.peer.close(); render(); }
      else if (a === 'diag') DiagView.open();
      else if (a === 'send') this.send();
      else if (a === 'backup') App.backup(null);
      else if (a === 'import') { const inp = sh.body.querySelector('input[type=file]'); inp.value = ''; inp.onchange = () => inp.files[0] && App.importFile(inp.files[0]); inp.click(); }
    });
  },
  async send() {
    const last = Sync.state.lastPackageAt;
    const changes = last ? Sync.collect({ since: last }) : null;
    const nCh = changes ? changes.shows.length + changes.entries.length + changes.photos.length : 0;
    const v = await Ui.menu('Sync-Paket senden', [
      last && { label: `Nur Änderungen seit ${Utils.fmtDate(last)} (${nCh})`, value: 'inc', icon: 'sync' },
      { label: 'Komplett (alle Veranstaltungen)', value: 'full', icon: 'layers' }
    ]);
    if (!v) return;
    if (v === 'inc' && !nCh) { Ui.toast('Keine Änderungen seit dem letzten Paket.'); return; }
    const bz = Ui.busy('Paket wird erstellt …');
    try {
      const r = await FileAdapter.push({ full: v === 'full' }, (i, n) => bz.set(`Bilder werden verpackt … ${i}/${n}`));
      bz.close();
      if (r.res === 'abort') Ui.toast('Teilen abgebrochen – kein Paket gesendet.', 'warn');
      else Ui.toast(r.res === 'shared' ? `Sync-Paket geteilt (${Utils.fmtBytes(r.size)})` : `Sync-Paket gespeichert (${Utils.fmtBytes(r.size)}) – jetzt auf dem anderen Gerät einspielen.`);
    } catch (err) { bz.close(); Sync.log('Paket fehlgeschlagen: ' + err.message, 'error'); App.error(err); }
  }
};

/* ---------- Live-Verbindung per QR-Code ---------- */
const PeerView = {
  open() {
    if (!PeerAdapter.available()) { Ui.dialog({ title: 'Nicht verfügbar', message: 'Dieser Browser unterstützt keine direkten Geräteverbindungen (WebRTC). Bitte das Sync-Paket verwenden.' }); return; }
    let session = null, scanner = null, timer = null;
    const sh = Ui.sheet({ title: 'Geräte verbinden', center: true, onBack: () => { cleanup(false); return true; } });
    const cleanup = (keepSession = true) => {
      if (scanner) { scanner.stop(); scanner = null; }
      clearTimeout(timer);
      if (!keepSession && session && !session.open) session.close();
    };
    const step = html => { sh.body.innerHTML = html; };
    const choose = () => step(`
      <ol class="steps" style="margin-bottom:18px">
        <li>Beide Geräte ins selbe WLAN (z. B. Theater-Fritzbox – Internet ist nicht nötig).</li>
        <li>Auf Gerät A „Verbindung anbieten“, auf Gerät B „Code scannen“ wählen.</li>
        <li>B scannt den Code von A, dann scannt A den Antwort-Code von B. Fertig.</li></ol>
      <button class="pcard" data-act="offer"><span class="ic">${I('qr')}</span><span class="lb2"><h4>Verbindung anbieten</h4><p>Dieses Gerät zeigt einen QR-Code.</p></span>${I('arrowR')}</button>
      <button class="pcard" data-act="answer"><span class="ic">${I('scan')}</span><span class="lb2"><h4>Code scannen</h4><p>Das andere Gerät zeigt bereits einen Code.</p></span>${I('arrowR')}</button>
      <p class="muted" style="font-size:13px">Hinweis: Gast-WLANs mit „Geräte-Isolation“ verhindern direkte Verbindungen. Dann bitte das Sync-Paket nutzen.</p>`);
    const scanBox = (label) => `<p style="font-weight:600;margin:16px 0 8px">${label}</p><div class="scanbox"><video playsinline muted></video><div class="frame"></div></div>
      <p class="muted scanmode" style="font-size:12px;text-align:center"></p>
      <details class="more" style="margin-top:10px"><summary>${I('file', 'sm')} Ohne Kamera: Code als Text austauschen ${I('arrowR', 'sm chev')}</summary>
        <div class="inner" style="grid-template-columns:1fr"><textarea class="code" data-in placeholder="Code des anderen Geräts hier einfügen"></textarea>
        <button class="btn" data-act="pasteok">Code übernehmen</button></div></details>`;
    const qrBox = (code, label) => {
      let canvas = null;
      try { canvas = QR.toCanvas(code, 760, 'M'); } catch (e) { canvas = null; }
      return { html: `<p style="font-weight:600;margin:0 0 8px">${label}</p><div class="qrbox" data-qr></div>
        <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap">
          <button class="btn" data-act="sharecode">${I('share')} Code als Text teilen</button></div>`, canvas };
    };
    const startScan = async (onCode) => {
      const v = sh.body.querySelector('video');
      try {
        scanner = await QrScan.start(v, async txt => {
          if (!/^LD1[zp]:/.test(txt)) return true;
          await onCode(txt); return false;
        });
        const m = sh.body.querySelector('.scanmode'); if (m) m.textContent = scanner.native ? 'Scanner: System (BarcodeDetector)' : 'Scanner: integrierter Doku VT-Decoder';
      } catch (err) { const m = sh.body.querySelector('.scanmode'); if (m) m.textContent = err.message; sh.body.querySelector('details.more').open = true; }
      const ok = sh.body.querySelector('[data-act=pasteok]');
      if (ok) ok.onclick = async () => { const t = sh.body.querySelector('[data-in]').value.trim(); if (t) { if (scanner) { scanner.stop(); scanner = null; } await onCode(t); } };
    };
    const shareCode = code => {
      if (navigator.share) navigator.share({ text: code }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => Ui.toast('Code kopiert'), () => {});
    };
    const watch = s => {
      s.onstate = (st, info, frac) => {
        if (sh.layer.closed) return;
        if (st === 'open') { clearTimeout(timer); connected(); }
        else if (st === 'hello') setMsg(`Verbunden mit ${info}. Daten werden abgeglichen …`);
        else if (st === 'progress') { setMsg(info); const bar = sh.body.querySelector('.pbar i'); if (bar && frac != null) bar.style.width = (frac * 100) + '%'; }
        else if (st === 'done') done();
        else if (st === 'error') failed(info);
        else if (st === 'closed') { const m = sh.body.querySelector('[data-msg]'); if (m) m.textContent = 'Verbindung beendet.'; }
      };
    };
    const setMsg = t => { const m = sh.body.querySelector('[data-msg]'); if (m) m.textContent = t; };
    const connected = () => { cleanup(); step(`<div class="bigstatus" data-state="live"><span class="dot"></span><div><h3>Verbunden</h3><p data-msg>Daten werden abgeglichen …</p></div></div><div class="pbar"><i></i></div>`); };
    const done = () => step(`<div class="bigstatus" data-state="ok"><span class="dot"></span><div><h3>Abgleich abgeschlossen</h3><p data-msg>Beide Geräte haben jetzt denselben Stand. Die Verbindung bleibt offen: Änderungen werden sofort übertragen, solange Doku VT auf beiden Geräten geöffnet ist.</p></div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary big" data-close>Fertig</button><button class="btn big" data-act="disconnect">Trennen</button></div>`);
    const failed = msg => { cleanup(false); step(`<div class="bigstatus" data-state="error"><span class="dot"></span><div><h3>Keine Verbindung</h3><p>${Utils.esc(msg)}</p></div></div>
      <ul class="muted" style="font-size:14px;padding-left:20px"><li>Beide Geräte im selben WLAN? (kein Gast-WLAN, kein Mobilfunk)</li><li>Doku VT auf beiden Geräten im Vordergrund lassen.</li><li>Alternativ: Sync-Paket per AirDrop/Nearby Share.</li></ul>
      <button class="btn big block" data-act="restart">Erneut versuchen</button>`); };
    const waitConnect = () => { timer = setTimeout(() => { if (session && !session.open) failed('Zeitüberschreitung – die Geräte haben sich nicht gefunden.'); }, 30000); };

    const offer = async () => {
      session = new PeerSession(); watch(session);
      step(`<div class="bigstatus"><span class="dot"></span><div><h3>Verbindungscode wird erstellt …</h3><p>Kamera wird vorbereitet.</p></div></div>`);
      // Kamera zuerst starten: Safari gibt lokale Netzadressen erst bei aktiver Kamera frei
      step(`<div data-qrwrap></div>${scanBox('2. Antwort-Code des anderen Geräts scannen:')}`);
      const onAnswer = async txt => {
        try { await session.acceptAnswer(await PeerAdapter.decodeSignal(txt)); setMsgQr('Antwort erhalten – Verbindung wird aufgebaut …'); waitConnect(); }
        catch (err) { Ui.toast(err.message, 'err'); setTimeout(() => startScan(onAnswer), 0); }
      };
      const scanP = startScan(onAnswer);
      await Utils.sleep(400);
      try {
        const code = await session.createOffer();
        const q = qrBox(code, '1. Diesen Code mit dem anderen Gerät scannen („Code scannen“):');
        const w = sh.body.querySelector('[data-qrwrap]'); w.innerHTML = q.html;
        if (q.canvas) w.querySelector('[data-qr]').appendChild(q.canvas); else w.querySelector('[data-qr]').textContent = 'Code zu groß – bitte als Text teilen.';
        w.querySelector('[data-act=sharecode]').onclick = () => shareCode(code);
      } catch (err) { failed('Verbindung konnte nicht vorbereitet werden: ' + err.message); }
      await scanP;
    };
    const setMsgQr = t => { const w = sh.body.querySelector('[data-qrwrap]'); if (w) w.innerHTML = `<div class="bigstatus" data-state="pending"><span class="dot"></span><div><h3>Bitte warten</h3><p data-msg>${Utils.esc(t)}</p></div></div>`; const sb = sh.body.querySelector('.scanbox'); if (sb) sb.remove(); };
    const answer = () => {
      session = new PeerSession(); watch(session);
      step(scanBox('Code des anbietenden Geräts scannen:'));
      const onCode = async txt => {
        try {
          const code = await session.acceptOffer(await PeerAdapter.decodeSignal(txt));
          const q = qrBox(code, 'Jetzt diesen Antwort-Code mit dem anderen Gerät scannen:');
          step(q.html + `<p class="muted" data-msg style="text-align:center;margin-top:12px">Warte auf Verbindung …</p>`);
          if (q.canvas) sh.body.querySelector('[data-qr]').appendChild(q.canvas);
          sh.body.querySelector('[data-act=sharecode]').onclick = () => shareCode(code);
          waitConnect();
        } catch (err) { Ui.toast(err.message, 'err'); session.close(); session = new PeerSession(); watch(session); startScan(onCode); }
      };
      startScan(onCode);
    };
    sh.body.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      if (b.dataset.act === 'offer') offer();
      else if (b.dataset.act === 'answer') answer();
      else if (b.dataset.act === 'restart') { if (session) session.close(); session = null; choose(); }
      else if (b.dataset.act === 'disconnect') { if (session) session.close(); sh.close(); }
    });
    choose();
  }
};

/* ---------- Diagnose ---------- */
const DiagView = {
  async open() {
    const sh = Ui.sheet({ title: 'Diagnose', center: true });
    const render = async () => {
      const cnt = m => { let live = 0, dead = 0; for (const r of m.values()) r.f.del ? dead++ : live++; return { live, dead }; };
      const s = cnt(Repo.shows), e = cnt(Repo.entries), p = cnt(Repo.photos);
      const blobs = (await Repo.blobIds()).size, missing = await Repo.missingBlobs();
      let est = null, persisted = null;
      try { est = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null; } catch (x) { est = null; }
      try { persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; } catch (x) { persisted = null; }
      const st = Sync.status();
      const cap = {
        'IndexedDB': !!globalThis.indexedDB, 'Kamera (getUserMedia)': Camera.supported(), 'Live-Abgleich (WebRTC)': PeerAdapter.available(),
        'QR-Scanner nativ (BarcodeDetector)': 'BarcodeDetector' in window, 'Kompression (CompressionStream)': !!globalThis.CompressionStream,
        'Dateien teilen (Web Share)': !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'x.txt', { type: 'text/plain' })] })),
        'Sicherer Kontext (https)': !!window.isSecureContext, 'Als App installiert': matchMedia('(display-mode: standalone)').matches || !!navigator.standalone
      };
      sh.body.innerHTML = `
        <div class="bigstatus" data-state="${st.state}"><span class="dot"></span><div><h3>${Utils.esc(st.label)}</h3><p>${Utils.esc(st.text)}</p></div></div>
        <div class="group"><h3>Dieses Gerät</h3><dl class="kv">
          <dt>Name</dt><dd>${Utils.esc(Sync.deviceName())}</dd><dt>Geräte-ID</dt><dd>${Sync.deviceId}</dd><dt>App-Version</dt><dd>${APP_VERSION}</dd>
          <dt>Speicher</dt><dd>${est ? `${Utils.fmtBytes(est.usage)} von ${Utils.fmtBytes(est.quota)} belegt` : 'unbekannt'}</dd>
          <dt>Dauerhaft</dt><dd>${persisted == null ? 'unbekannt' : persisted ? 'ja – Browser löscht die Daten nicht automatisch' : 'nein – bei Speichermangel könnte der Browser löschen'}</dd></dl></div>
        <div class="group"><h3>Lokale Daten</h3><dl class="kv">
          <dt>Veranstaltungen</dt><dd>${s.live} (+${s.dead} gelöscht)</dd><dt>Einträge</dt><dd>${e.live} (+${e.dead} gelöscht)</dd>
          <dt>Fotos</dt><dd>${p.live} (+${p.dead} gelöscht)</dd><dt>Bilddaten</dt><dd>${blobs}</dd>
          <dt>Fehlende Bilder</dt><dd>${missing.length}${missing.length ? ' – bitte vollständiges Paket/Live-Abgleich' : ''}</dd>
          <dt>Offene Änderungen</dt><dd>${Sync.pending()}</dd><dt>Letzter Abgleich</dt><dd>${Utils.fmtDate(Sync.state.lastSyncAt)}</dd>
          <dt>Letztes Paket</dt><dd>${Utils.fmtDate(Sync.state.lastPackageAt)}</dd></dl></div>
        <div class="group"><h3>Abgleich-Wege (Adapter)</h3>${[...Sync.adapters.values()].map(a => `<div class="item"><span class="lb">${Utils.esc(a.name)}</span><span class="${a.available() ? '' : 'muted'}">${a.available() ? 'verfügbar' : 'nicht verfügbar'}</span></div>`).join('')}</div>
        <div class="group"><h3>Browser-Fähigkeiten</h3>${Object.entries(cap).map(([k, v]) => `<div class="item"><span class="lb">${k}</span><span style="color:var(${v ? '--ok' : '--muted'})">${v ? 'ja' : 'nein'}</span></div>`).join('')}</div>
        <div class="group"><h3>Protokoll</h3><div class="log">${Sync.state.log.length ? Sync.state.log.map(l => `<div style="${l.kind === 'error' ? 'color:var(--danger)' : ''}">${Utils.fmtDate(l.t)} · ${Utils.esc(l.msg)}</div>`).join('') : '<div>Noch keine Einträge.</div>'}</div></div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" data-act="persist">${I('lock')} Dauerhaften Speicher anfordern</button>
          <button class="btn" data-act="clean">${I('trash')} Speicher aufräumen</button>
          <button class="btn" data-act="clearerr">Fehlerstatus zurücksetzen</button></div>`;
    };
    await render();
    sh.body.addEventListener('click', async ev => {
      const b = ev.target.closest('[data-act]'); if (!b) return;
      if (b.dataset.act === 'clean') { const n = await Repo.cleanup(); Ui.toast(`${n} nicht mehr benötigte Bilder entfernt`); render(); }
      if (b.dataset.act === 'persist') { const ok = navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; Ui.toast(ok ? 'Speicher ist jetzt dauerhaft' : 'Der Browser hat dauerhaften Speicher (noch) nicht gewährt – als App installieren hilft meist.', ok ? '' : 'warn'); render(); }
      if (b.dataset.act === 'clearerr') { Sync.state.lastError = ''; await Sync.save(); render(); }
    });
  }
};

      else if (b.dataset.num) { await Settings.set({ [b.dataset.num]: +b.dataset.val }); render(); }
      else if (b.dataset.act === 'name') { const n = await Ui.prompt('Gerätename', Settings.v.deviceName || Sync.deviceName(), 'z. B. iPad Beleuchtung'); if (n != null) { await Settings.set({ deviceName: n.trim() }); render(); } }

      else if (b.dataset.act === 'demo') { await Demo.create(); Ui.toast('Demo-Veranstaltung angelegt'); App.render(); }
      else if (b.dataset.act === 'wipe') {
        if (!await Ui.confirm('Wirklich ALLES löschen?', 'Alle Veranstaltungen, Einträge und Fotos auf diesem Gerät werden endgültig entfernt. Auf anderen Geräten bleiben die Daten erhalten. Vorher ein Backup erstellen!', 'Weiter', true)) return;
        const t = await Ui.prompt('Zur Bestätigung LÖSCHEN eintippen', '', 'LÖSCHEN');
        if (t !== 'LÖSCHEN') { Ui.toast('Abgebrochen'); return; }
        await Store.tx(['shows', 'entries', 'photos', 'fulls', 'thumbs', 'meta'], 'readwrite', s => { ['shows', 'entries', 'photos', 'fulls', 'thumbs'].forEach(n => s[n].clear()); s.meta.delete('syncState'); s.meta.delete('demoDone'); });
        location.hash = ''; location.reload();
      }
    });
    sh.body.addEventListener('change', async e => {
      const t = e.target;
      if (t.dataset.bool) await Settings.set({ [t.dataset.bool]: t.checked });
      if (t.dataset.range) { await Settings.set({ [t.dataset.range]: +t.value }); render(); }
    });
    sh.body.addEventListener('input', e => { const t = e.target; if (t.dataset.range) { Settings.v[t.dataset.range] = +t.value; Settings.apply(); } });
  }
};

const Demo = {

    const c = document.createElement('canvas'); c.width = c.height = 900; const g = c.getContext('2d');
    const gr = g.createRadialGradient(450, 380, 40, 450, 450, 700);
    gr.addColorStop(0, `hsl(${hue},45%,${kind === 'nah' ? 42 : 30}%)`); gr.addColorStop(1, '#07080a');
    g.fillStyle = gr; g.fillRect(0, 0, 900, 900);
    g.strokeStyle = 'rgba(255,255,255,.08)'; g.lineWidth = 2;
    for (let i = 0; i < 900; i += 60) { g.beginPath(); g.moveTo(0, i + 600 * (kind === 'tot' ? 0.3 : 0)); g.lineTo(900, i); g.stroke(); }
    if (kind === 'nah') {
      g.fillStyle = '#1b1d22'; g.fillRect(250, 250, 400, 300); g.fillStyle = '#c9ccd2';
      for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(340 + i * 110, 400, 34, 0, 7); g.fill(); g.fillStyle = '#333'; g.fillRect(328 + i * 110, 385, 8, 30); g.fillRect(352 + i * 110, 385, 8, 30); g.fillStyle = '#c9ccd2'; }
    } else {
      g.fillStyle = '#222630'; g.fillRect(0, 640, 900, 260);
      g.fillStyle = 'rgba(255,230,160,.18)'; g.beginPath(); g.moveTo(450, 0); g.lineTo(250, 640); g.lineTo(650, 640); g.fill();
      g.fillStyle = '#ffcc33'; g.beginPath(); g.arc(450, 600, 18, 0, 7); g.fill();
    }
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 760, 900, 140);
    g.fillStyle = '#fff'; g.font = 'bold 64px system-ui, sans-serif'; g.fillText(text, 36, 838);
    g.fillStyle = 'rgba(255,255,255,.75)'; g.font = '32px system-ui, sans-serif'; g.fillText(sub, 38, 880);
    const r = await Photo.fromCanvas(c); c.width = c.height = 0; return r;
  },
  async create() {
    const show = Rec.create({}, { titel: 'Demo: Der Haifisch', spielstaette: 'Großes Haus', notiz: 'Beispieldaten zum Ausprobieren – kann jederzeit gelöscht werden.', del: false });
    const data = [
      { f: { kreis: '361', bemerkung: 'Steckt in Podiumsklappe Li, Steckplatz 1' }, A: [['Kreis 361', 'Nahaufnahme · Stecker', 210, 'nah'], ['Kreis 361', 'Totale · Podium links', 210, 'tot']] },
      { f: { kreis: '123+124', geraet: 'Lichterkette', bemerkung: '123 Rot und Blau, 124 Grün und Gelb, rote Lampe muss ins Maul (Haikopf-Requisite)' }, A: [['Kreis 123+124', 'Haikopf', 350, 'nah'], ['Kreis 123+124', 'Position', 350, 'tot']] },
      { f: { kreis: '901', bemerkung: 'Tür mittlere Position vor Steg' }, A: [['Kreis 901', 'Tür vor Steg', 30, 'tot']] },
      { f: { kreis: '12+17+103+113+620', gruppe: '24', filter: 'nc', bemerkung: 'Einleuchten Spiegelkugel-Stimmung' }, E: [['Gruppe 24', 'Spiegelkugel', 48, 'tot'], ['Gruppe 24', 'Kugel Nah', 48, 'nah']] },
      { f: { kreis: '10127', geraet: 'Overheadprojektor', bemerkung: 'Verkabelt in die Unterbühne durch die Klappe, muss am Gerät ausgeschaltet sein' }, A: [['Kreis 10127', 'OHP Schalter', 160, 'nah']], E: [['Kreis 10127', 'Projektion', 160, 'tot']] },
      { f: { kreis: '45', gruppe: '3', filter: 'L201', adresse: '12/301', position: '1. Portalbrücke', bemerkung: 'Seitenlicht links, Torblende oben leicht schließen' } }
    ];
    const entries = [], photos = [], fulls = [], thumbs = [];
    for (const d of data) {
      const e = Rec.create({ showId: show.id }, Object.assign({ kreis: '', gruppe: '', filter: '', adresse: '', bemerkung: '', geraet: '', dmx: '', position: '', farbe: '', chkA: false, chkE: false, del: false }, d.f));
      entries.push(e);
      for (const k of ['A', 'E']) for (const [i, args] of (d[k] || []).entries()) {
        const p = await this.photo(...args);
        fulls.push({ id: p.b, d: p.full }); thumbs.push({ id: p.b, d: p.thumb });
        photos.push(Rec.create({ showId: show.id, b: p.b, w: p.w, h: p.h }, { entryId: e.id, kat: k, ord: i, label: '', del: false }));
      }
    }
    await Repo._write({ shows: [show], entries, photos, fulls, thumbs });
    await Store.metaSet('demoDone', true);
    return show;
  }
};

/* =====================================================================
   Pwa – Manifest/Service Worker nur einbinden, wenn die Dateien existieren;
   version.json für Update-Hinweise.
   ===================================================================== */
const Pwa = {
  /* Aktiv seit 1.2.0: Service Worker (Offline-Start, Installation) und Update-Hinweis über version.json.
     Nur über http(s) – beim Öffnen per Doppelklick (file://) bleibt alles aus. */
  ENABLED: true, reg: null,
  async init() {
    if (!this.ENABLED || !/^https?:$/.test(location.protocol)) return;
    if ('serviceWorker' in navigator) {
      try {
        this.reg = await navigator.serviceWorker.register('sw.js');
        let reloading = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => { if (this.wantReload && !reloading) { reloading = true; location.reload(); } });
      } catch (e) { console.warn('Service Worker nicht registriert', e); }
    }
    this.checkVersion();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.checkVersion(); });
  },
  /** version.json vom Server (am Cache vorbei) mit APP_VERSION vergleichen */
  async checkVersion() {
    if (!navigator.onLine || this.offered) return;
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const v = await r.json();
      if (v && v.version && this.newer(v.version, APP_VERSION)) {
        this.offered = true;
        Ui.toast(`Neue Version ${v.version} verfügbar`, '', { action: { label: 'Aktualisieren', fn: () => this.update() }, ms: 12000 });
      }
    } catch (e) { /* offline – kein Problem */ }
  },
  newer(a, b) { const pa = a.split('.').map(Number), pb = b.split('.').map(Number); for (let i = 0; i < 3; i++) { if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) > (pb[i] || 0); } return false; },
  async update() {
    if (document.querySelector('[data-editor]')) { Ui.toast('Bitte zuerst den offenen Eintrag speichern.', 'warn'); this.offered = false; return; }
    this.wantReload = true;
    try {
      if (this.reg) {
        await this.reg.update();
        const w = this.reg.waiting || this.reg.installing;
        if (w) { w.postMessage('SKIP_WAITING'); setTimeout(() => location.reload(), 4000); return; }
      }
    } catch (e) { /* weiter mit Neuladen */ }
    location.reload();
  }
};
