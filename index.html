        put(x); put(`trailer\n<< /Size ${nextId} /Root 1 0 R /Info ${infoId} 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`);
        return new Blob(parts, { type: 'application/pdf' });
      }
    };
  },

  /** PDF-Protokoll eines Durchgangs der Vorstellungs-Checkliste */
  buildRun(showId, runId, depts) {
    const show = Repo.show(showId), run = Repo.runs.get(runId);
    if (!show || !run) throw new Error('Durchgang nicht gefunden');
    const { W, H, M } = this;
    const items = RunList.items(showId, depts);
    const pr = RunList.progress(run, items);
    const wr = this._writer(`${show.f.titel} – ${run.f.titel || 'Vorstellung'}`);
    const dateStr = Utils.fmtDate(Date.now());
    // Zeilen vorbereiten (Kopf je Abteilung, Gruppenzeile, Punkt)
    const rows = [];
    DEPT_ORDER.filter(d => depts.includes(d)).forEach(d => {
      const its = items.filter(i => i.abt === d); if (!its.length) return;
      const p = RunList.progress(run, its);
      rows.push({ t: 'dept', d, label: `${DEPT[d].name}  ·  ${p.done} von ${p.all} erledigt`, h: 26 });
      let lastG = '';
      its.forEach(i => {
        if (i.group !== lastG) { rows.push({ t: 'group', label: i.group, h: 18 }); lastG = i.group; }
        const hk = run.f['h:' + i.key], bold = !(hk && hk.ok);                      // offene Punkte fett → mit fetter Schrift umbrechen
        const lines = this.wrap(i.text, bold ? 'F2' : 'F1', 10.5, W - 2 * M - 170).slice(0, 8);
        rows.push({ t: 'item', d, i, h: Math.max(18, lines.length * 13 + 6), lines });
      });
    });
    const open = items.filter(i => { const h = run.f['h:' + i.key]; return !(h && h.ok); });
    const pages = []; let cur = [], room = 0;
    const AV1 = H - 170 - 60, AV = H - 100 - 60;
    rows.forEach(r => { if (!cur.length && !pages.length) room = AV1; if (r.h > room) { pages.push(cur); cur = []; room = AV; } cur.push(r); room -= r.h; });
    pages.push(cur);
    const sumH = 60 + Math.min(open.length, 25) * 14;
    const total = pages.length + (room < sumH ? 1 : 0);
    pages.forEach((rs, pi) => {
      const c = wr.C();
      c.rgb(0.1, 0.12, 0.15).rect(0, H - 14, W, 14);
      let y = H - 52;
      if (pi === 0) {
        c.rgb(0.45, 0.48, 0.53).text(M, y + 8, 'VORSTELLUNGS-CHECKLISTE · PROTOKOLL', 'F2', 9); y -= 22;
        c.rgb(0.07, 0.08, 0.1).text(M, y, this.fit(show.f.titel, 'F2', 24, W - 2 * M), 'F2', 24); y -= 22;
        c.rgb(0.25, 0.28, 0.33).text(M, y, [show.f.spielstaette, run.f.titel, run.f.datum && !String(run.f.titel || '').includes(Utils.fmtDate(new Date(run.f.datum + 'T12:00').getTime(), false)) ? Utils.fmtDate(new Date(run.f.datum + 'T12:00').getTime(), false) : ''].filter(Boolean).join('  ·  '), 'F1', 12); y -= 20;
        c.rgb(0.07, 0.08, 0.1).text(M, y, `${pr.done} von ${pr.all} Punkten erledigt`, 'F2', 12);
        c.rgb(0.88, 0.89, 0.91).rect(M + 200, y - 2, W - 2 * M - 200, 10); c.rgb(0.25, 0.65, 0.42).rect(M + 200, y - 2, (W - 2 * M - 200) * (pr.all ? pr.done / pr.all : 0), 10);
        y -= 26;
        c.rgb(0.45, 0.48, 0.53).text(M + 22, y, 'PUNKT', 'F2', 7).text(W - M - 132, y, 'UHRZEIT', 'F2', 7).text(W - M - 84, y, 'GERÄT', 'F2', 7); y -= 12;
      } else { c.rgb(0.07, 0.08, 0.1).text(M, y, this.fit(`${show.f.titel} – ${run.f.titel} (Fortsetzung)`, 'F2', 14, W - 2 * M), 'F2', 14); y -= 30; }
      rs.forEach(r => {
        if (r.t === 'dept') {
          c.rgb(...katRgb(r.d, 'A')).rect(M, y - 18, W - 2 * M, 20); c.rgb(1, 1, 1).text(M + 8, y - 12, r.label, 'F2', 11);
        } else if (r.t === 'group') {
          c.rgb(0.45, 0.48, 0.53).text(M + 4, y - 12, r.label.toUpperCase(), 'F2', 8);
        } else {
          const h = run.f['h:' + r.i.key], ok = h && h.ok;
          if (!ok) c.rgb(1, 0.92, 0.95).rect(M, y - r.h + 2, W - 2 * M, r.h - 2);          // offene Punkte hervorheben
          c.rgb(0.35, 0.37, 0.42, true).rect(M + 4, y - 14, 11, 11, 'S');
          if (ok) { c.rgb(0.13, 0.55, 0.33, true).line(M + 6, y - 9, M + 9, y - 12.5, 1.6); c.line(M + 9, y - 12.5, M + 14, y - 5, 1.6); }
          r.lines.forEach((ln, k) => c.rgb(0.1, 0.11, 0.13).text(M + 22, y - 12 - k * 13, ln, ok ? 'F1' : 'F2', 10.5));
          if (h) c.rgb(0.25, 0.28, 0.33).text(W - M - 132, y - 12, (ok ? '' : 'zurück ') + RunList.fmtTime(h.at), 'F1', 9.5)
            .text(W - M - 84, y - 12, this.fit(h.dev || '', 'F1', 9.5, 84), 'F1', 9.5);
          else c.rgb(0.75, 0.2, 0.4).text(W - M - 132, y - 12, 'offen', 'F2', 9.5);
          c.rgb(0.88, 0.89, 0.91, true).line(M, y - r.h + 1, W - M, y - r.h + 1, 0.4);
        }
        y -= r.h;
      });
      const last = pi === pages.length - 1;
      if (last && total === pages.length) y = this._runSummary(c, y - 16, open, pr);
      c.rgb(0.45, 0.48, 0.53).text(M, 24, this.fit(`Doku VT ${APP_VERSION}  ·  ${show.f.titel}  ·  Stand ${dateStr}`, 'F1', 8, W - 2 * M - 70), 'F1', 8).textR(W - M, 24, `Seite ${pi + 1} / ${total}`, 'F1', 8);
      wr.page(c.get());
    });
    if (total > pages.length) {
      const c = wr.C(); c.rgb(0.1, 0.12, 0.15).rect(0, H - 14, W, 14);
      this._runSummary(c, H - 60, open, pr);
      c.rgb(0.45, 0.48, 0.53).text(M, 24, `Doku VT ${APP_VERSION}  ·  ${show.f.titel}`, 'F1', 8).textR(W - M, 24, `Seite ${total} / ${total}`, 'F1', 8);
      wr.page(c.get());
    }
    return wr.finish();
  },
  _runSummary(c, y, open, pr) {
    const { W, M } = this;
    c.rgb(0.07, 0.08, 0.1).text(M, y, `Zusammenfassung: ${pr.done} von ${pr.all} erledigt`, 'F2', 13); y -= 20;
    if (!open.length) { c.rgb(0.13, 0.55, 0.33).text(M, y, 'Alle Punkte erledigt.', 'F2', 11); return y - 16; }
    c.rgb(0.75, 0.2, 0.4).text(M, y, `Offen (${open.length}):`, 'F2', 11); y -= 16;
    open.slice(0, 25).forEach(i => { c.rgb(0.1, 0.11, 0.13).text(M + 10, y, this.fit(`${DEPT[i.abt].short}: ${i.text.split('\n')[0]}`, 'F1', 10.5, W - 2 * M - 10), 'F1', 10.5); y -= 14; });
    if (open.length > 25) { c.rgb(0.45, 0.48, 0.53).text(M + 10, y, `… und ${open.length - 25} weitere`, 'F1', 10); y -= 14; }
    return y;
  }
};

/* =====================================================================
   Sync – Kern: Pakete bauen/einspielen, Status, Protokoll.
   Adapter-Schnittstelle (austauschbar):
     { id, name, available():bool, push(opts):Promise, pull(input):Promise<stat> }
   Alle Wege landen in Repo.applyRemote() → feldweises Zusammenführen.
   ===================================================================== */
const Sync = {
  deviceId: '', state: { lastSyncAt: 0, lastPackageAt: 0, lastError: '', log: [] },
  adapters: new Map(), peer: null, listeners: new Set(),
  async init() {
    this.deviceId = await Store.metaGet('deviceId', '');
    if (!this.deviceId) { this.deviceId = Utils.uuid(); await Store.metaSet('deviceId', this.deviceId); }
    Object.assign(this.state, await Store.metaGet('syncState', {}));
    [FileAdapter, PeerAdapter, ServerAdapter].forEach(a => this.adapters.set(a.id, a));
  },
  deviceName() {
    if (Settings.v.deviceName) return Settings.v.deviceName;
    const ua = navigator.userAgent;
    return /iPad/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ? 'iPad' : /iPhone/.test(ua) ? 'iPhone' : /Pixel/.test(ua) ? 'Pixel' : /Android/.test(ua) ? 'Android' : 'Computer';
  },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  changed: Utils.debounce(function () { Sync.listeners.forEach(f => { try { f(); } catch (e) { console.error(e); } }); }, 120),
  noteLocalChange() { this.changed(); },
  async save() { await Store.metaSet('syncState', this.state); this.changed(); },
  async log(msg, kind = 'info') {
    this.state.log.unshift({ t: Date.now(), msg, kind }); this.state.log = this.state.log.slice(0, 60);
    if (kind === 'error') this.state.lastError = msg;
    await this.save();
  },
  async markSynced(msg) { this.state.lastSyncAt = Date.now(); this.state.lastError = ''; await this.log(msg, 'ok'); },
  pending() {
    const since = this.state.lastSyncAt; let n = 0;
    for (const m of [Repo.shows, Repo.entries, Repo.photos, Repo.runs, Repo.house]) for (const r of m.values()) if (r.mod > since) n++;
    return n;
  },
  status() {
    if (this.peer && this.peer.open) return { state: 'live', label: 'Live', text: `Live verbunden mit ${this.peer.peerName || 'Gerät'}` };
    if (this.state.lastError) return { state: 'error', label: 'Fehler', text: this.state.lastError };
    const n = this.pending();
    if (!this.state.lastSyncAt) return { state: 'pending', label: n ? `${n} offen` : 'Nie', text: 'Noch nie mit einem anderen Gerät abgeglichen' };
    if (n) return { state: 'pending', label: `${n} offen`, text: `${n} Änderungen seit dem letzten Abgleich (${Utils.fmtAgo(this.state.lastSyncAt)})` };
    return { state: 'ok', label: 'Synchron', text: `Abgeglichen ${Utils.fmtAgo(this.state.lastSyncAt)}` };
  },
  /** Datensätze sammeln: seit Zeitpunkt, optional nur bestimmte Shows (inkl. Tombstones!).
      depts: nur Einträge/Fotos dieser Abteilungen (null = alle). Veranstaltungen (inkl. Einrichtung
      und Zugliste) gehen IMMER mit – sie sind gemeinsam. */
  collect({ since = 0, showIds = null, depts = null } = {}) {
    const inShow = r => !showIds || showIds.includes(r.showId || r.id);
    // ab 2.4.3 nach der lokalen Eingangszeit rx: auch von anderen Geräten Übernommenes geht weiter
    // (Datensätze aus 2.4.2 ohne rx wie bisher nach mod)
    const pick = m => [...m.values()].filter(r => (r.rx || r.mod) > since && inShow(r));
    // Haus-Datensätze (Requisite) gehören zu keiner Veranstaltung – nur ohne Auswahl einzelner Veranstaltungen
    // oder wenn die Requisite dabei ist; inkrementell nach rx wie alle anderen
    const house = [...Repo.house.values()].filter(r => (r.rx || r.mod) > since);
    return this.filterRecs({ shows: pick(Repo.shows), entries: pick(Repo.entries), photos: pick(Repo.photos), runs: pick(Repo.runs), house }, depts);
  },
  /** Einträge und Fotos auf Abteilungen beschränken. Ein Foto gehört zur Abteilung seines Eintrags. */
  filterRecs(recs, depts) {
    if (!depts) return recs;
    const okE = e => depts.includes(abtOf(e));
    const okP = p => { const e = Repo.entries.get(p.f.entryId) || (recs.entries || []).find(x => x.id === p.f.entryId); return !e || okE(e); };
    // Durchgänge: nur die Haken der erlaubten Abteilungen mitschicken (Feld für Feld – der Merge ergänzt den Rest)
    const runs = (recs.runs || []).map(r => {
      const f = {}, t = {};
      for (const k of Object.keys(r.f)) {
        if (k.startsWith('h:') && !depts.includes(RunList.abtOfItem(r.showId, k.slice(2)))) continue;
        f[k] = r.f[k]; if (r.t[k] != null) t[k] = r.t[k];
      }
      return Object.assign({}, r, { f, t });
    });
    // Haus-Datensätze der Requisite nur an/aus Geräten mit Requisite (ältere Gegenstellen kennen „R“ nicht)
    return { shows: recs.shows || [], entries: (recs.entries || []).filter(okE), photos: (recs.photos || []).filter(okP), runs, house: depts.includes('R') ? (recs.house || []) : [] };
  },
  /** Requisite-Inhalt aus einem eingehenden Paket entfernen (Gerät ohne Requisite) */
  dropReq(data) {
    const ents = Array.isArray(data.entries) ? data.entries : [];
    const rIds = new Set(ents.filter(e => e && e.f && e.f.abt === 'R').map(e => e.id));
    for (const e of Repo.entries.values()) if (abtOf(e) === 'R') rIds.add(e.id);
    data.entries = ents.filter(e => !rIds.has(e && e.id));
    const ph = Array.isArray(data.photos) ? data.photos : [];
    const keepB = new Set(ph.filter(p => p && p.f && !rIds.has(p.f.entryId)).map(p => p.b));
    data.photos = ph.filter(p => p && p.f && !rIds.has(p.f.entryId));
    data.house = [];
    if (Array.isArray(data.blobs)) data.blobs = data.blobs.filter(b => b && keepB.has(b.id));
    return data;
  },
  /** Enthält das Paket Requisite-Inhalt (Gegenstände, deren Fotos, Haus-Daten)? → Paketformat 3 */
  hasReq(recs) {
    const isR = e => e && abtOf(e) === 'R';
    return (recs.house || []).length > 0 || (recs.entries || []).some(isR)
      || (recs.photos || []).some(p => isR(Repo.entries.get(p.f.entryId) || (recs.entries || []).find(x => x.id === p.f.entryId)));
  },
  /** Abteilungen dieses Geräts als Text, z. B. „Licht, Ton“ */
  deptLabel(depts = Settings.v.depts) { return depts.map(d => DEPT[d].short).join(', '); },
  /** Paket als Blob – stückweise zusammengesetzt (kein Riesen-String im Speicher) */
  async buildPackage({ type = 'sync', since = 0, showIds = null, withBlobs = true, depts = null } = {}, onProgress) {
    const recs = this.collect({ since, showIds, depts });
    // Backup einzelner Veranstaltungen: Haus-Daten nur, wenn eine davon Requisite führt (sonst bliebe ein reines
    // Licht-Backup nicht für 2.4.4 lesbar)
    if (showIds && !showIds.some(id => Repo.showDepts(id).includes('R'))) recs.house = [];
    // Format 3 nur bei Requisite-Inhalt: 2.4.4 lehnt solche Pakete mit „bitte zuerst aktualisieren“ ab,
    // alle anderen Pakete bleiben für ältere Geräte lesbar (Format 2)
    const fv = this.hasReq(recs) ? FORMAT_VERSION : FORMAT_BASE;
    const head = { format: 'lichtdoku', type, formatVersion: fv, appVersion: APP_VERSION, deviceId: this.deviceId, deviceName: this.deviceName(), createdAt: Date.now(), since, showIds, depts, ...recs, blobs: [] };
    const json = JSON.stringify(head);
    const parts = [json.slice(0, -2)];
    let n = 0;
    if (withBlobs) {
      const withR = !depts || depts.includes('R');
      const ids = [...new Set(recs.photos.filter(p => !p.f.del).map(p => p.b).concat(withR ? Req.blobRefs(recs.shows.filter(s => !s.f.del), recs.house) : []))];
      for (const id of ids) {
        const full = await Repo.full(id), thumb = await Repo.thumb(id);
        if (!full) continue;
        parts.push((n ? ',' : '') + JSON.stringify({ id, full: Utils.bufToB64(full), thumb: thumb ? Utils.bufToB64(thumb) : null }));
        n++; onProgress && onProgress(n, ids.length);
        if (n % 10 === 0) await Utils.frame();
      }
    }
    parts.push(']}');
    return { blob: new Blob(parts, { type: 'application/json' }), counts: { shows: recs.shows.length, entries: recs.entries.length, photos: recs.photos.length, runs: recs.runs.length, house: recs.house.length, blobs: n }, formatVersion: fv };
  },
  async importPackage(file, onProgress) {
    let data;
    try { data = JSON.parse(await file.text()); } catch (e) { throw new Error('Die Datei ist kein gültiges Doku VT-Paket (JSON nicht lesbar).'); }
    if (Legacy.detect(data)) return Legacy.importData(data, onProgress);
    if (!data || data.format !== 'lichtdoku') throw new Error('Unbekanntes Dateiformat – erwartet wird ein Doku VT-Backup oder Sync-Paket.');
    if ((data.formatVersion || 1) > FORMAT_VERSION) throw new Error('Das Paket stammt aus einer neueren Doku VT-Version. Bitte zuerst die App aktualisieren.');
    // Sync-Paket auf einem Gerät ohne Requisite: Requisite-Gegenstände, ihre Fotos und Haus-Daten werden nicht übernommen
    // (Requisite nur an/aus Geräten mit Requisite). Ein Backup übernimmt immer alles.
    if (data.type === 'sync' && !Settings.v.depts.includes('R')) Sync.dropReq(data);
    const blobs = (data.blobs || []).map(b => ({ id: b.id, full: Utils.b64ToBuf(b.full), thumb: b.thumb ? Utils.b64ToBuf(b.thumb) : null }));
    const stat = await Repo.applyRemote(data, blobs);
    const missing = (await Repo.missingBlobs()).length;
    // Veranstaltungen, die im Backup vorhanden, hier aber gelöscht sind (Löschen gewinnt beim Zusammenführen) → Wiederherstellen anbieten
    stat.restorable = data.type === 'sync' ? [] : (data.shows || []).filter(x => x && x.f && !x.f.del && Repo.shows.has(x.id) && Repo.shows.get(x.id).f.del).map(x => x.id);
    const from = data.deviceName ? ` von ${data.deviceName}` : '';
    if (data.type === 'sync') await this.markSynced(`Sync-Paket${from} eingespielt: ${stat.neu} neu, ${stat.geaendert} zusammengeführt, ${stat.bilder} Bilder`);
    else await this.log(`Backup${from} importiert: ${stat.neu} neu, ${stat.geaendert} zusammengeführt, ${stat.bilder} Bilder`, 'ok');
    return { ...stat, missing, type: data.type };
  }
};

/* ---------- Import aus der früheren „Lichtdoku“-App (bis 1.8.x) ----------
   Format: { show: {id, name, date, createdAt, deletedIds}, entries: [{id, kreis, filter, adresse,
   gruppe, bemerkung, bilderAufbau: [dataURL], bilderEinleuchten: [dataURL], createdAt, updatedAt}] }
   (ältere Fassung: kategorie + bild1/bild2). Auch eine Liste solcher Objekte wird angenommen.
   Verlustfrei: Fotos werden NICHT neu komprimiert, die Original-JPEGs werden übernommen.
   IDs werden aus den alten IDs bzw. dem Bildinhalt abgeleitet → erneuter Import erzeugt nichts doppelt. */
const Legacy = {
  detect(d) {
    const one = x => x && typeof x === 'object' && !x.format && x.show && typeof x.show === 'object' && Array.isArray(x.entries);
    return one(d) || (Array.isArray(d) && d.length > 0 && d.every(one));
  },
  /** schneller, deterministischer Inhalts-Hash (FNV-1a, 2× 32 Bit) für Bild-IDs */
  hash(str) {
    let h1 = 0x811c9dc5, h2 = 0x01000193 ^ str.length;
    for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619); h2 = Math.imul(h2 ^ c, 2246822519) ^ (h2 >>> 13); }
    return (h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0') + str.length.toString(16);
  },
  normFilter(v) { return String(v ?? '').trim().replace(/\s*\+\s*/g, '+'); },
  ts(v, fb) { const n = Number(v); return Number.isFinite(n) && n > 0 ? n : fb; },
  /** Altes Format → Doku-VT-Datensätze. Bilddaten bleiben vorerst als Base64. */
  convert(src) {
    const list = Array.isArray(src) ? src : [src];
    const shows = [], entries = [], photos = [], imgs = new Map();
    const now = Date.now();
    const mk = (id, base, fields, t, c) => { const r = Object.assign({ id, c, mod: t, f: {}, t: {} }, base); for (const [k, v] of Object.entries(fields)) { r.f[k] = v; r.t[k] = t; } return r; };
    for (const d of list) {
      const so = d.show, sid = 'lgs-' + String(so.id || this.hash(String(so.name || '') + (so.createdAt || ''))).replace(/[^\w-]/g, '');
      const sc = this.ts(so.createdAt, now);
      shows.push(mk(sid, {}, { titel: String(so.name || 'Importierte Lichtdoku'), spielstaette: '', notiz: so.date ? 'Datum: ' + so.date : '', del: false }, sc, sc));
      const gone = new Set(so.deletedIds || []);
      for (const e of d.entries) {
        if (!e || gone.has(e.id)) continue;
        const ec = this.ts(e.createdAt, sc), et = this.ts(e.updatedAt, ec);
        const eid = 'lge-' + String(e.id || this.hash(JSON.stringify([e.kreis, e.createdAt]))).replace(/[^\w-]/g, '');
        let A = e.bilderAufbau, E = e.bilderEinleuchten;
        if (!A && !E) { const b = [e.bild1, e.bild2].filter(Boolean); if (e.kategorie === 'Aufbau') { A = b; E = []; } else { A = []; E = b; } }
        const f = { kreis: String(e.kreis ?? '').trim(), gruppe: String(e.gruppe ?? '').trim(), filter: this.normFilter(e.filter), adresse: String(e.adresse ?? '').trim(),
          bemerkung: String(e.bemerkung ?? ''), geraet: '', dmx: '', position: '', farbe: '', abt: 'L', chkA: false, chkE: false, del: false };
        entries.push(mk(eid, { showId: sid }, f, et, ec));
        for (const [kat, arr] of [['A', A || []], ['E', E || []]]) {
          arr.forEach((url, i) => {
            if (typeof url !== 'string') return;
            const m = /^data:image\/[\w.+-]+;base64,(.*)$/s.exec(url); if (!m) return;
            const b = 'lgb-' + this.hash(m[1]);
            if (!imgs.has(b)) imgs.set(b, { b64: m[1], type: (/^data:(image\/[\w.+-]+)/.exec(url) || [])[1] || 'image/jpeg' });
            photos.push(mk(`lgp-${eid.slice(4)}-${kat}-${b.slice(4, 20)}-${i}`, { showId: sid, b, w: 0, h: 0 }, { entryId: eid, kat, ord: i, label: '', del: false }, et, ec));
          });
        }
      }
    }
    return { shows, entries, photos, imgs };
  },
  /** Bild dekodieren: Größe + Vorschaubild (360 px). Originaldaten bleiben unverändert. */
  async prep(buf, type) {
    const url = URL.createObjectURL(new Blob([buf], { type }));
    try {
      const img = new Image(); img.src = url; await img.decode();
      const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
      const t = document.createElement('canvas'); t.width = t.height = Photo.THUMB_PX;
      const ctx = t.getContext('2d'); ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, Photo.THUMB_PX, Photo.THUMB_PX);
      const thumb = await Photo._jpeg(t, 0.72); t.width = t.height = 0;
      let full = buf;
      const u8 = new Uint8Array(buf, 0, Math.min(2, buf.byteLength)), jpeg = u8[0] === 0xFF && u8[1] === 0xD8;   // Inhalt prüfen, nicht nur die Angabe
      if (type !== 'image/jpeg' || !jpeg || w !== h) {          // Nicht-JPEG oder nicht quadratisch: wie jedes andere Foto aufbereiten
        const c = document.createElement('canvas'); c.width = c.height = s;
        c.getContext('2d').drawImage(img, (w - s) / 2, (h - s) / 2, s, s, 0, 0, s, s);
        full = await Photo._jpeg(c, 0.92); c.width = c.height = 0;
      }
      return { w: s, h: s, full, thumb };
    } finally { URL.revokeObjectURL(url); }
  },
  async importData(data, onProgress) {
    const { shows, entries, photos, imgs } = this.convert(data);
    const have = await Repo.blobIds(), dims = new Map(), blobs = [];
    let i = 0, bad = 0;
    for (const [b, im] of imgs) {
      i++; onProgress && onProgress(i, imgs.size);
      const buf = Utils.b64ToBuf(im.b64); im.b64 = null;
      try {
        if (have.has(b)) { dims.set(b, null); continue; }
        const r = await this.prep(buf, im.type); dims.set(b, r); blobs.push({ id: b, full: r.full, thumb: r.thumb });
      } catch (e) { bad++; dims.set(b, false); }
      if (i % 4 === 0) await Utils.frame();
    }
    const okPhotos = photos.filter(p => dims.get(p.b) !== false);
    okPhotos.forEach(p => { const r = dims.get(p.b); if (r) { p.w = r.w; p.h = r.h; } else { const old = Repo.photos.get(p.id); p.w = old ? old.w : 1300; p.h = old ? old.h : 1300; } });
    const stat = await Repo.applyRemote({ shows, entries, photos: okPhotos }, blobs);
    await Sync.log(`Lichtdoku-Datei importiert („${shows.map(s => s.f.titel).join('“, „')}“): ${entries.length} Kreise, ${imgs.size} Bilder`, 'ok');
    return { ...stat, missing: 0, type: 'legacy', legacy: { titles: shows.map(s => s.f.titel), showIds: shows.map(s => s.id), entries: entries.length, photos: okPhotos.length, bad } };
  }
};

/* ---------- Adapter 1: Sync-Paket-Datei (AirDrop, Nearby Share, Dateien-App, USB-Stick, NAS) ---------- */
const FileAdapter = {
  id: 'file', name: 'Sync-Paket (Datei)',
  available: () => true,
  /** allDepts: auch Einträge der Abteilungen, die dieses Gerät nicht dokumentiert */
  async push({ full = false, showIds = null, onReady = null, allDepts = false } = {}, onProgress) {
    const since = full ? 0 : Sync.state.lastPackageAt || 0;
    // Stand des Pakets = Zeitpunkt des Einsammelns (nicht des Teilens): was danach ankommt, geht ins nächste Paket.
    // −1 ms: ein Schreibvorgang in derselben Millisekunde wird lieber doppelt als gar nicht übertragen.
    const t0 = Date.now() - 1;
    const { blob, counts } = await Sync.buildPackage({ type: 'sync', since, showIds, depts: allDepts ? null : Settings.v.depts.slice() }, onProgress);
    const name = `DokuVT_Sync_${Utils.safeName(Sync.deviceName())}_${Utils.stamp()}.ldsync.json`;
    if (onReady) onReady();                       // Fortschrittsanzeige schließen, bevor der Dialog erscheint
    const res = await Utils.offerFile(blob, name, 'Sync-Paket ist fertig', `${counts.entries} Einträge, ${counts.blobs} Bilder`);
    if (res !== 'abort') {
      Sync.state.lastPackageAt = t0;
      await Sync.markSynced(`Sync-Paket erstellt (${full ? 'komplett' : 'Änderungen'}, ${allDepts ? 'alle Abteilungen' : Sync.deptLabel()}): ${counts.entries} Einträge, ${counts.blobs} Bilder`);
    }
    return { res, counts, size: blob.size };
  },
  pull: file => Sync.importPackage(file)
};

/* ---------- Adapter 2: Gerät-zu-Gerät per WebRTC, Signalisierung über QR-Codes ----------
   Kein Server, kein Internet: beide Geräte im selben WLAN (Fritzbox). ICE nutzt nur
   lokale Host-Kandidaten. Danach bleibt der Datenkanal offen und überträgt jede
   Änderung sofort („Live“). Nachrichten werden in 16-KB-Stücke zerlegt.          */
const PeerAdapter = {
  id: 'peer', name: 'Live-Abgleich im WLAN',
  available: () => 'RTCPeerConnection' in window,
  async encodeSignal(obj) {
    const { z, buf } = await Utils.deflate(JSON.stringify(obj));
    return `LD1${z ? 'z' : 'p'}:${Utils.b64url(Utils.bufToB64(buf))}`;
  },
  async decodeSignal(text) {
    const m = /^LD1([zp]):([A-Za-z0-9_-]+)$/.exec(String(text).trim());
    if (!m) throw new Error('Das ist kein Doku VT-Verbindungscode.');
    return JSON.parse(await Utils.inflate(Utils.b64ToBuf(Utils.unb64url(m[2])), m[1] === 'z'));
  },
  push() { throw new Error('Der Live-Abgleich wird über „Abgleich → Geräte verbinden“ gestartet.'); },
  pull() { throw new Error('Der Live-Abgleich wird über „Abgleich → Geräte verbinden“ gestartet.'); }
};

class PeerSession {
  constructor() {
    this.pc = new RTCPeerConnection({ iceServers: [] });
    this.dc = null; this.open = false; this.peerName = ''; this.peerId = '';
    this.frag = new Map(); this.need = new Set(); this.gotMeta = false; this.unsub = null; this.onstate = () => {};
    this.stats = { recv: 0, sent: 0 };
    // Diagnose: Ablauf, eigene und fremde Verbindungsangebote, Verbindungsversuche
    this.t0 = Date.now(); this.events = []; this.localSdp = ''; this.remoteSdp = ''; this.pairs = null; this.role = '';
    this.pc.onconnectionstatechange = () => {
      const s = this.pc.connectionState; this._ev('Verbindung: ' + s);
      if (s === 'failed') this._failIce();
      if (s === 'disconnected' || s === 'closed') this._closed();
    };
    this.pc.oniceconnectionstatechange = () => {
      const s = this.pc.iceConnectionState; this._ev('ICE: ' + s);
      if (s === 'failed') this._failIce();
    };
    this.pc.onicegatheringstatechange = () => this._ev('Adressen sammeln: ' + this.pc.iceGatheringState);
  }
  _ev(m) { this.events.push(`${((Date.now() - this.t0) / 1000).toFixed(1).padStart(5)} s  ${m}`); }
  /** ICE gescheitert: erst die Verbindungsversuche auslesen, dann melden */
  async _failIce() {
    if (this.failing) return; this.failing = true;
    await this.collectStats();
    this._fail('Die direkte Verbindung kam nicht zustande.');
  }
  async collectStats() {
    if (this.pairs || this.closedOnce) return;
    try {
      const st = await this.pc.getStats(), all = new Map(); st.forEach(r => all.set(r.id, r));
      const adr = c => c ? `${c.address || c.ip || '?'}:${c.port || '?'} (${c.candidateType || '?'})` : '?';
      this.pairs = [];
      all.forEach(r => {
        if (r.type !== 'candidate-pair') return;
        this.pairs.push(`${adr(all.get(r.localCandidateId))} → ${adr(all.get(r.remoteCandidateId))}: ${r.state || '?'}, Anfragen ${r.requestsSent ?? '?'}, Antworten ${r.responsesReceived ?? '?'}`);
      });
    } catch (e) { this.pairs = ['getStats nicht verfügbar: ' + e.message]; }
  }
  static parseCands(sdp) {
    return String(sdp || '').split(/\r?\n/).filter(l => l.startsWith('a=candidate:')).map(l => {
      const p = l.slice(12).split(' ');
      return { proto: (p[2] || '').toLowerCase(), addr: p[4] || '', port: p[5] || '', type: p[7] || '' };
    });
  }
  /** Verständliche Hinweise aus den ausgetauschten Adressen ableiten */
  analyse() {
    const L = PeerSession.parseCands(this.localSdp), R = PeerSession.parseCands(this.remoteSdp);
    const me = Sync.deviceName(), other = this.peerName || 'Das andere Gerät';
    const v4 = c => /^\d+\.\d+\.\d+\.\d+$/.test(c.addr), mdns = c => /\.local$/i.test(c.addr);
    const priv = a => /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(a), net = a => a.split('.').slice(0, 3).join('.');
    const hints = [];
    if (!this.remoteSdp) { hints.push('Der Code des anderen Geräts ist auf diesem Gerät nicht angekommen. Auf dem anbietenden Gerät muss zum Schluss der Antwort-Code gescannt werden.'); return hints; }
    if (!L.length) hints.push(`${me} hat keine eigene Netzwerkadresse gefunden. WLAN eingeschaltet? VPN oder Werbeblocker-App aus?`);
    if (!R.length) hints.push(`${other} hat keine Netzwerkadresse gemeldet. WLAN eingeschaltet? VPN aus?`);
    if (L.length && L.every(mdns)) hints.push(`${me} hat seine Adresse nur verschlüsselt (…local) gemeldet. Das klappt nicht in jedem Netz. Ursache: Die Kamera lief beim Erstellen des Codes nicht – Kamerazugriff erlauben.`);
    if (R.length && R.every(mdns)) hints.push(`${other} hat seine Adresse nur verschlüsselt (…local) gemeldet. Ursache: Die Kamera lief dort beim Erstellen des Codes nicht – Kamerazugriff erlauben.`);
    const lv = [...new Set(L.filter(v4).map(c => c.addr))], rv = [...new Set(R.filter(v4).map(c => c.addr))];
    const odd = [...lv.map(a => [me, a]), ...rv.map(a => [other, a])].filter(([, a]) => !priv(a));
    odd.forEach(([d, a]) => hints.push(`${d} nutzt die Adresse ${a} – das sieht nach Mobilfunk oder VPN aus, nicht nach dem Theater-WLAN.`));
    const lp = lv.filter(priv), rp = rv.filter(priv);
    if (lp.length && rp.length) {
      if (!lp.some(a => rp.some(b => net(a) === net(b)))) hints.push(`Die Geräte sind in verschiedenen Netzen: ${me} ${lp.join(', ')} · ${other} ${rp.join(', ')}. Eines hängt in einem anderen WLAN, im Gastnetz oder hinter einem Repeater mit eigenem Netz.`);
      else hints.push(`Beide Geräte sind im selben Netz (${me} ${lp.join(', ')} · ${other} ${rp.join(', ')}), die Verbindung zwischen ihnen wird aber blockiert. Typische Ursache: Die Fritzbox lässt WLAN-Geräte nicht untereinander sprechen. In der Fritzbox unter „WLAN“ (je nach FRITZ!OS bei „Funknetz“ oder „Sicherheit“) einschalten, dass WLAN-Geräte untereinander kommunizieren dürfen. Im Gastnetz geht das meist gar nicht.`);
    }
    return hints;
  }
  /** Vollständiger Bericht zum Teilen */
  report(msg) {
    const fmt = sdp => { const c = PeerSession.parseCands(sdp); return c.length ? c.map(x => `  ${x.addr}:${x.port} ${x.proto} ${x.type}`).join('\n') : '  (keine)'; };
    return [`Doku VT ${APP_VERSION} – Live-Diagnose`, `Gerät: ${Sync.deviceName()} · Rolle: ${this.role || '?'} · ${Utils.fmtDate(Date.now())}`,
      `Browser: ${navigator.userAgent}`, `Meldung: ${msg || '-'}`, '',
      'Eigene Adressen:', fmt(this.localSdp), `Adressen von ${this.peerName || 'Gegenstelle'}:`, this.remoteSdp ? fmt(this.remoteSdp) : '  (Code nicht angekommen)', '',
      'Verbindungsversuche:', ...(this.pairs && this.pairs.length ? this.pairs.map(p => '  ' + p) : ['  (keine)']), '',
      'Ablauf:', ...this.events.map(e => '  ' + e), '', 'Hinweise:', ...this.analyse().map(h => '  - ' + h)].join('\n');
  }
  _fail(msg) { Sync.log(msg, 'error'); this.onstate('error', msg); this.close(); }
  _closed() {
    if (this.closedOnce) return; this.closedOnce = true;
    this.open = false; if (this.unsub) this.unsub(); if (Sync.peer === this) Sync.peer = null;
    Sync.changed(); this.onstate('closed');
  }
  async _gather() {
    if (this.pc.iceGatheringState === 'complete') return;
    await new Promise(res => {
      const t = setTimeout(res, 3000);
      this.pc.addEventListener('icegatheringstatechange', () => { if (this.pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
    });
  }
  _bind(dc) {
    this.dc = dc; dc.bufferedAmountLowThreshold = 1 << 20;
    dc.onopen = () => {
      this.open = true; Sync.peer = this; Sync.changed(); this.onstate('open');
      this.send({ t: 'hello', id: Sync.deviceId, n: Sync.deviceName(), v: APP_VERSION, d: Settings.v.depts });
    };
    dc.onclose = () => this._closed();
    dc.onmessage = ev => this._recv(ev.data);
  }
  async createOffer() {
    this._bind(this.pc.createDataChannel('lichtdoku', { ordered: true }));
    this.role = 'anbieten';
    await this.pc.setLocalDescription(await this.pc.createOffer());
    await this._gather();
    this.localSdp = this.pc.localDescription.sdp;
    return PeerAdapter.encodeSignal({ r: 'o', id: Sync.deviceId, n: Sync.deviceName(), sdp: this.pc.localDescription.sdp });
  }
  async acceptOffer(sig) {
    if (sig.r !== 'o') throw new Error('Das ist ein Antwort-Code – bitte den Code des anderen Geräts nach „Verbindung anbieten“ scannen.');
    this.pc.ondatachannel = ev => this._bind(ev.channel);
    this.role = 'antworten'; this.remoteSdp = sig.sdp; this.peerName = sig.n;
    await this.pc.setRemoteDescription({ type: 'offer', sdp: sig.sdp });
    await this.pc.setLocalDescription(await this.pc.createAnswer());
    await this._gather();
    this.localSdp = this.pc.localDescription.sdp;
    this.peerName = sig.n;
    return PeerAdapter.encodeSignal({ r: 'a', id: Sync.deviceId, n: Sync.deviceName(), sdp: this.pc.localDescription.sdp });
  }
  async acceptAnswer(sig) {
    if (sig.r !== 'a') throw new Error('Das ist ein Angebots-Code – bitte den ANTWORT-Code des anderen Geräts scannen.');
    this.peerName = sig.n; this.remoteSdp = sig.sdp; this._ev('Antwort-Code übernommen');
    await this.pc.setRemoteDescription({ type: 'answer', sdp: sig.sdp });
  }
  /* ---- Nachrichten (gestückelt, mit Gegendruck) ---- */
  async send(obj) {
    if (!this.dc || this.dc.readyState !== 'open') return;
    const s = JSON.stringify(obj), CH = 16000;
    const raw = async str => {
      // Gegendruck: mehrere Sendungen dürfen gleichzeitig warten (bis 2.4.2 überschrieb die zweite den Handler
      // der ersten, die dann ewig hing); schließt der Kanal, geht es ebenfalls weiter
      if (this.dc.bufferedAmount > 4 << 20) await new Promise(r => {
        const dc = this.dc, done = () => { dc.removeEventListener('bufferedamountlow', done); dc.removeEventListener('close', done); r(); };
        dc.addEventListener('bufferedamountlow', done); dc.addEventListener('close', done);
      });
      if (this.dc.readyState === 'open') this.dc.send(str);
    };
    if (s.length <= CH) { await raw('M' + s); return; }
    const id = Math.random().toString(36).slice(2, 8), n = Math.ceil(s.length / CH);
    for (let i = 0; i < n; i++) await raw(`C${id}:${i}:${n}:` + s.slice(i * CH, (i + 1) * CH));
    this.stats.sent++;
  }
  _recv(data) {
    if (typeof data !== 'string') return;
    if (data[0] === 'M') { this._handle(JSON.parse(data.slice(1))); return; }
    const m = /^C([a-z0-9]+):(\d+):(\d+):/.exec(data); if (!m) return;
    const [, id, i, n] = m; let f = this.frag.get(id);
    if (!f) { f = { parts: new Array(+n), got: 0 }; this.frag.set(id, f); }
    f.parts[+i] = data.slice(m[0].length); f.got++;
    if (f.got === +n) { this.frag.delete(id); this._handle(JSON.parse(f.parts.join(''))); }
  }
  async _handle(msg) {
    this.stats.recv++;
    try {
      switch (msg.t) {
        case 'hello':
          this.peerName = msg.n; this.peerId = msg.id; Sync.changed(); this.onstate('hello', msg.n);
          // Abteilungen: Schnittmenge beider Geräte (ältere Versionen ohne Angabe = nur Licht)
          this.peerDepts = Array.isArray(msg.d) ? msg.d : ['L'];
          this.depts = Settings.v.depts.filter(d => this.peerDepts.includes(d));
          await Sync.log(`Live-Verbindung mit ${msg.n} hergestellt (Einträge: ${this.depts.length ? Sync.deptLabel(this.depts) : 'keine gemeinsame Abteilung – nur Veranstaltungen'})`, 'ok');
          await this.send({ t: 'meta', ...Sync.collect({ since: 0, depts: this.depts }) });
          this.unsub = Repo.on(ev => this._local(ev));
          break;
        case 'meta': {
          const st = await Repo.applyRemote(msg);
          this.gotMeta = true; this.onstate('progress', `Daten zusammengeführt: ${st.neu} neu, ${st.geaendert} geändert`);
          const miss = await Repo.missingBlobs(); miss.forEach(b => this.need.add(b));
          this.needTotal = miss.length;
          if (miss.length) await this.send({ t: 'need', ids: miss }); else await this._maybeDone();
          break;
        }
        case 'need':
          for (const id of msg.ids) {
            const full = await Repo.full(id), thumb = await Repo.thumb(id);
            await this.send({ t: 'blob', id, full: full ? Utils.bufToB64(full) : null, thumb: thumb ? Utils.bufToB64(thumb) : null });
          }
          break;
        case 'blob':
          if (msg.full) await Repo.applyRemote({}, [{ id: msg.id, full: Utils.b64ToBuf(msg.full), thumb: msg.thumb ? Utils.b64ToBuf(msg.thumb) : null }]);
          this.need.delete(msg.id);
          if (this.needTotal) this.onstate('progress', `Bilder: ${this.needTotal - this.need.size} / ${this.needTotal}`, (this.needTotal - this.need.size) / this.needTotal);
          await this._maybeDone();
          break;
        case 'delta': {
          await Repo.applyRemote(msg);
          const ids = (msg.photos || []).filter(p => !p.f.del).map(p => p.b)
            .concat(Settings.v.depts.includes('R') ? Req.blobRefs((msg.shows || []).filter(s => s && s.f && !s.f.del), msg.house || []) : []);
          const have = await Repo.blobIds(); const miss = ids.filter(b => !have.has(b) && !this.need.has(b));
          miss.forEach(b => this.need.add(b));
          if (miss.length) await this.send({ t: 'need', ids: miss }); else await Sync.markSynced(`Live-Änderung von ${this.peerName} übernommen`);
          break;
        }
        case 'done': this.onstate('peerdone'); break;
      }
    } catch (e) {
      console.error(e); await Sync.log('Abgleichfehler: ' + e.message, 'error'); this.onstate('error', e.message);
    }
  }
  async _maybeDone() {
    if (this.gotMeta && this.need.size === 0 && !this.initialDone) {
      this.initialDone = true;
      await Sync.markSynced(`Abgleich mit ${this.peerName} abgeschlossen`);
      await this.send({ t: 'done' });
      this.onstate('done');
    } else if (this.initialDone && this.need.size === 0) await Sync.markSynced(`Live-Änderung von ${this.peerName} übernommen`);
  }
  /** Lokale Änderung sofort an das andere Gerät schicken */
  async _local(ev) {
    if (!ev.local || !this.open) return;
    const recs = Sync.filterRecs(ev.records, this.depts || Settings.v.depts);
    if (!recs.shows.length && !recs.entries.length && !recs.photos.length && !(recs.runs || []).length && !(recs.house || []).length) return;
    await this.send({ t: 'delta', ...recs });
    const okBlobs = new Set(recs.photos.map(p => p.b));
    if ((this.depts || Settings.v.depts).includes('R')) Req.blobRefs(recs.shows, recs.house || []).forEach(b => okBlobs.add(b));
    for (const id of (ev.blobIds || []).filter(b => okBlobs.has(b))) {
      const full = await Repo.full(id), thumb = await Repo.thumb(id);
      await this.send({ t: 'blob', id, full: Utils.bufToB64(full), thumb: thumb ? Utils.bufToB64(thumb) : null });
    }
    Sync.state.lastSyncAt = Date.now(); await Sync.save();
  }
  close() { try { this.dc && this.dc.close(); } catch (e) { /* egal */ } try { this.pc.close(); } catch (e) { /* egal */ } this._closed(); }
}

/* ---------- Adapter 3: lokaler Sync-Server (vorbereitet für eine spätere Version) ----------
   Gedacht für einen kleinen Server im Fritzbox-Netz (Raspberry Pi/NAS), der
   dieselben Pakete per HTTP annimmt (POST /api/sync) und die Änderungen anderer
   Geräte zurückgibt. Das Paketformat ist identisch mit dem Datei-Adapter.       */
const ServerAdapter = {
  id: 'server', name: 'Sync-Server im Theaternetz (geplant)',
  available: () => false,
  async push() { throw new Error('Der Server-Abgleich ist für eine spätere Version geplant.'); },
  async pull() { throw new Error('Der Server-Abgleich ist für eine spätere Version geplant.'); }
};

/* =====================================================================
   Ui – Ebenen (Overlays) mit Zurück-Geste, Dialoge, Toasts, Busy-Anzeige.
   Jede Ebene legt einen History-Eintrag an → Android-Zurück / Wischgeste
   und Esc schließen die oberste Ebene. Keine nativen alert()/confirm().
   ===================================================================== */
const Ui = {
  stack: [], seq: 0, ignorePop: 0,
  init() {
    window.addEventListener('popstate', () => {
      if (this.ignorePop > 0) { this.ignorePop--; return; }
      const top = this.stack[this.stack.length - 1];
      if (!top) return;
      const r = top.opts.onBack ? top.opts.onBack() : true;
      if (r === false) { history.pushState({ ld: top.id }, ''); return; }
      if (r && typeof r.then === 'function') {
        history.pushState({ ld: top.id }, '');
        r.then(ok => { if (ok) this._close(top); });
        return;
      }
      top.closed = true; top.el.remove(); this.stack.pop(); this._restoreFocus(top);
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && this.stack.length) { e.preventDefault(); history.back(); }
    });
  },
  layer(el, opts = {}) {
    const L = { id: ++this.seq, el, opts, closed: false, focus: document.activeElement };
    document.body.appendChild(el); this.stack.push(L);
    history.pushState({ ld: L.id }, '');
    return { el, close: () => this._close(L), get closed() { return L.closed; } };
  },
  _close(L) {
    if (L.closed) return; L.closed = true; L.el.remove();
    const i = this.stack.indexOf(L);
    if (i === this.stack.length - 1) { this.stack.pop(); this.ignorePop++; history.back(); }
    else if (i >= 0) this.stack.splice(i, 1);
    this._restoreFocus(L);
  },
  _restoreFocus(L) { if (L.focus && L.focus.isConnected && L.focus.focus) { try { L.focus.focus({ preventScroll: true }); } catch (e) { /* egal */ } } },
  get topOpen() { return this.stack.length > 0; },
  /** wartet, bis das history.back() einer gerade geschlossenen Ebene verarbeitet ist */
  afterBack() {
    return new Promise(r => { let done = false; const f = () => { if (done) return; done = true; removeEventListener('popstate', f); setTimeout(r, 0); };
      addEventListener('popstate', f); setTimeout(f, 400); });
  },

  /** Dialog → Promise(Wert). buttons: [{label, value, cls}] ; input: {value, placeholder, inputmode} */
  dialog({ title, message = '', buttons = [{ label: 'OK', value: true, cls: 'primary' }], input = null, cancelValue = null, html = '', row = false }) {
    return new Promise(resolve => {
      const scrim = document.createElement('div'); scrim.className = 'scrim dlg';
      scrim.innerHTML = `<div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgT">
        <h2 id="dlgT">${Utils.esc(title)}</h2>${message ? `<p>${Utils.esc(message)}</p>` : ''}${html}
        ${input ? `<input class="txt" type="text" value="${Utils.esc(input.value || '')}" placeholder="${Utils.esc(input.placeholder || '')}" ${input.inputmode ? `inputmode="${input.inputmode}"` : ''} enterkeyhint="done" autocomplete="off">` : ''}
        <div class="btns ${row || buttons.length === 2 ? 'row' : ''}">${buttons.map((b, i) => `<button class="btn big ${b.cls || ''}" data-i="${i}">${b.icon ? I(b.icon) : ''}${Utils.esc(b.label)}</button>`).join('')}</div></div>`;
      let done = false;
      const finish = v => { if (done) return; done = true; L.close(); resolve(v); };
      const inp = scrim.querySelector('input.txt');
      scrim.addEventListener('click', e => {
        const b = e.target.closest('button[data-i]');
        if (b) { const def = buttons[+b.dataset.i]; finish(input && def.value === true ? inp.value : def.value); }
        else if (e.target === scrim) finish(cancelValue);
      });
      if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); finish(inp.value); } });
      const L = this.layer(scrim, { onBack: () => { done = true; resolve(cancelValue); return true; } });
      setTimeout(() => { if (inp) { inp.focus(); inp.select(); } else { const p = scrim.querySelector('.btn.primary,.btn.danger.solid') || scrim.querySelector('.btn'); p && p.focus(); } }, 30);
    });
  },
  confirm(title, message, okLabel = 'OK', danger = false) {
    return this.dialog({ title, message, buttons: [{ label: 'Abbrechen', value: false }, { label: okLabel, value: true, cls: danger ? 'danger solid' : 'primary' }], cancelValue: false });
  },
  prompt(title, value, placeholder, message = '') {
    return this.dialog({ title, message, input: { value, placeholder }, buttons: [{ label: 'Abbrechen', value: null }, { label: 'Übernehmen', value: true, cls: 'primary' }] });
  },
  /** Aktionsmenü: items [{label, value, icon, danger, hint}] */
  menu(title, items) {
    return this.dialog({ title, buttons: items.filter(Boolean).map(it => ({ label: it.label, value: it.value, icon: it.icon, cls: it.danger ? 'danger' : '' })).concat([{ label: 'Abbrechen', value: null, cls: 'ghost' }]) });
  },
  toast(msg, kind = '', { action = null, ms = 3800 } = {}) {
    const box = document.getElementById('toasts');
    const t = document.createElement('div'); t.className = `toast ${kind}`;
    t.innerHTML = `<span class="t">${Utils.esc(msg)}</span>${action ? `<button>${Utils.esc(action.label)}</button>` : ''}`;
    if (action) t.querySelector('button').onclick = () => { t.remove(); action.fn(); };
    box.appendChild(t);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => t.remove(), action ? ms + 3000 : ms);
  },
  busy(text) {
    const el = document.createElement('div'); el.className = 'busyov'; el.setAttribute('role', 'status');
    el.innerHTML = `<div class="bx"><div class="spinner"></div><div class="tx">${Utils.esc(text)}</div></div>`;
    document.body.appendChild(el);
    return { set: t => { el.querySelector('.tx').textContent = t; }, close: () => el.remove() };
  },
  /** Bildschirmfüllendes Sheet (Editor, Einstellungen …). Gibt {el, body, foot, close} zurück. */
  sheet({ title, full = false, center = false, onBack, headRight = '', headLeft = null }) {
    const scrim = document.createElement('div'); scrim.className = `scrim ${center ? 'center' : ''} ${full ? 'fullwrap' : ''}`;
    scrim.innerHTML = `<div class="sheet ${full ? 'full' : ''}" role="dialog" aria-modal="true" aria-label="${Utils.esc(title)}">
      <div class="sheet-h">${headLeft ?? `<button class="btn icon ghost" data-close aria-label="Schließen">${I('close')}</button>`}<h2>${Utils.esc(title)}</h2>${headRight}</div>
      <div class="sheet-b"></div><div class="sheet-f hidden"></div></div>`;
    const sh = scrim.querySelector('.sheet');
    scrim.addEventListener('click', e => { if (e.target === scrim && !full) history.back(); if (e.target.closest('[data-close]')) history.back(); });
    const L = this.layer(scrim, { onBack });
    return { el: sh, scrim, body: sh.querySelector('.sheet-b'), foot: sh.querySelector('.sheet-f'), head: sh.querySelector('.sheet-h'), close: L.close, layer: L };
  }
};

/* =====================================================================
   Kb – Bildschirmtastatur. Ziel: Das Feld, in das getippt wird, ist immer
   vollständig sichtbar – man sieht und korrigiert, was man schreibt.
   • Android/Chrome: viewport „interactive-widget=resizes-content“ – die Seite
     wird bei offener Tastatur kleiner, das Blatt scrollt von selbst richtig.
   • iPad/iPhone: Die Tastatur verkleinert nur den sichtbaren Bereich
     (visualViewport). Lehre aus 1.8.0: Blatt-HÖHE nicht anpassen (Felder waren
     dann nicht mehr antippbar). Stattdessen:
       1. Inhalt bekommt unten Platz in Tastaturhöhe (--kb, Klasse kb-open),
       2. das aktive Feld wird innerhalb des Blatts über die Tastatur gescrollt,
       3. kleine Blätter/Dialoge, die ganz unter der Tastatur lägen, werden
          per transform angehoben (Größe und Trefferflächen bleiben gleich),
       4. mehrzeilige Felder wachsen mit dem Text mit.
   Nach dem Schließen der Tastatur ist alles wie vorher (plus realign in App).
   ===================================================================== */
const Kb = {
  inset: 0, lifted: new Set(),
  init() {
    const vv = window.visualViewport;
    const upd = () => {
      const el = document.activeElement, typing = Utils.isEditable(el) && el.type !== 'checkbox';
      let ins = 0;
      if (vv && typing) ins = Math.max(0, Math.round(Math.max(window.innerHeight, document.documentElement.clientHeight) - vv.height - vv.offsetTop));
      const on = ins > 60;                                   // kleine Abweichungen (Adressleiste) ignorieren
      if (on !== (this.inset > 0) || (on && Math.abs(ins - this.inset) > 4)) {
        this.inset = on ? ins : 0;
        document.documentElement.style.setProperty('--kb', this.inset + 'px');
        document.documentElement.classList.toggle('kb-open', on);
      }
      if (typing) this.reveal(el); else this.unlift();
    };
    this.update = Utils.debounce(upd, 50);
    if (vv) { vv.addEventListener('resize', this.update); vv.addEventListener('scroll', this.update); }
    window.addEventListener('resize', this.update);
    document.addEventListener('focusin', e => {
      if (!Utils.isEditable(e.target)) return;
      if (e.target.tagName === 'TEXTAREA') this.grow(e.target);
      // iOS fährt die Tastatur animiert aus: mehrfach nachmessen
      [80, 320, 650].forEach(ms => setTimeout(this.update, ms));
    });
    document.addEventListener('focusout', () => setTimeout(this.update, 150));
    document.addEventListener('input', e => {
      if (e.target.tagName === 'TEXTAREA') { this.grow(e.target); this.reveal(e.target); }
    });
  },
  /** mehrzeiliges Feld wächst mit dem Inhalt (höchstens ca. halbe Bildschirmhöhe, dann scrollt es intern) */
  grow(ta) {
    if (!ta.closest('.sheet,.dialog')) return;
    const max = Math.round(window.innerHeight * 0.45);
    ta.style.height = 'auto';
    const h = Math.min(max, ta.scrollHeight + 2);
    ta.style.height = Math.max(h, 96) + 'px';
    ta.style.overflowY = ta.scrollHeight + 2 > max ? 'auto' : 'hidden';
  },
  /** sichtbarer Bereich in Seitenkoordinaten (getBoundingClientRect) */
  visible() {
    const vv = window.visualViewport;
    return vv ? { top: vv.offsetTop, bottom: vv.offsetTop + vv.height } : { top: 0, bottom: window.innerHeight };
  },
  /** aktives Feld sichtbar machen */
  reveal(el) {
    if (!el || !el.isConnected) return;
    const box = el.closest('.sheet, .dialog'); if (!box) return;
    const vis = this.visible(), pad = 14;
    // 3. kleine Blätter / Dialoge anheben, wenn ihr unterer Rand unter der Tastatur liegt
    if (!box.classList.contains('full')) {
      const cur = this.lift(box), r = box.getBoundingClientRect();
      const baseBottom = r.bottom + cur, baseTop = r.top + cur;
      const want = Math.max(0, Math.min(baseBottom - (vis.bottom - 8), baseTop - (vis.top + 8)));
      if (Math.abs(want - cur) > 2) { box.style.transform = want ? `translateY(${-want}px)` : ''; box.dataset.lift = want; if (want) this.lifted.add(box); else this.lifted.delete(box); }
    }
    // 2. innerhalb des scrollbaren Inhalts so verschieben, dass das Feld ganz zu sehen ist
    const sc = el.closest('.sheet-b'); if (!sc) return;
    requestAnimationFrame(() => {
      const r = el.getBoundingClientRect(), sr = sc.getBoundingClientRect();
      const top = Math.max(sr.top, vis.top) + pad, bottom = Math.min(sr.bottom, vis.bottom) - pad;
      if (bottom - top < 60) return;
      const label = el.closest('.f'); const lr = label ? label.getBoundingClientRect() : r;   // Beschriftung mit anzeigen
      const need = Math.min(r.height, bottom - top);                                         // hohe Felder: wenigstens der sichtbare Teil
      if (r.top + need > bottom) sc.scrollTop += (r.top + need) - bottom;
      else if (lr.top < top) sc.scrollTop -= top - lr.top;
    });
  },
  lift(box) { return +(box.dataset.lift || 0); },
  unlift() {
    this.lifted.forEach(b => { b.style.transform = ''; b.dataset.lift = 0; });
    this.lifted.clear();
  }
};

/* =====================================================================
   Views – Startseite, Show-Liste, Detail
   ===================================================================== */
const Views = {
  /** Sortierte Kartenliste: je Eintrag eine Karte pro Kategorie mit Fotos.
      Sortierung: Abteilung (L, T, B) → Phase (A, E, ohne Foto) → Hauptfeld numerisch.
      depts = sichtbare Abteilungen, abt = 'all' oder eine Abteilung */
  sortedItems(showId, { kat = 'all', sort = 'kreis', q = '', depts = null, abt = 'all', rsort = 'ort' }) {
    const nq = q.trim().toLowerCase();
    const terms = nq ? nq.split(/\s+/) : [];
    const items = [];
    for (const e of Repo.entriesOf(showId)) {
      const a = abtOf(e);
      if (depts && !depts.includes(a)) continue;
      if (abt !== 'all' && a !== abt) continue;
      if (terms.length) {
        const hay = TEXT_FIELDS.map(k => e.f[k] || '').join(' \u0001 ').toLowerCase();
        if (!terms.every(t => hay.includes(t))) continue;
      }
      for (const k of Repo.catsOf(e.id)) {
        if (kat !== 'all' && k !== kat) continue;
        items.push({ entry: e, kat: k, abt: a, key: e.id + ':' + k });
      }
    }
    const ko = { A: 0, E: 1, N: 2 };
    const zs = Repo.zuegeOf(showId);
    const rcmp = items.some(i => i.abt === 'R') ? (rsort === 'person' ? Req.personCmp(showId) : Req.cmp(showId)) : null;
    items.sort((a, b) => {
      const da = DEPT_ORDER.indexOf(a.abt) - DEPT_ORDER.indexOf(b.abt); if (da) return da;
      if (a.abt === 'R') return rcmp(a.entry, b.entry);                                         // Requisite: Ort, dann Name
      if (a.abt === 'B') return Repo.bcmp(a.entry, b.entry, zs) || (ko[a.kat] - ko[b.kat]);   // Bühne: Einrichte-Reihenfolge
      if (sort === 'gruppe') {
        const ga = a.entry.f.gruppe || '', gb = b.entry.f.gruppe || '';
        if (!ga !== !gb) return ga ? -1 : 1;
        const c = Utils.cmpKreis(ga, gb); if (c) return c;
      }
      return (ko[a.kat] - ko[b.kat]) || mainCmp(mainVal(a.entry), mainVal(b.entry)) || (a.entry.c - b.entry.c);
    });
    return items;
  },
  /** Abschnitt einer Karte. multi = mehrere Abteilungen in der Liste → „Licht · Aufbau“ */
  sectionOf(item, sort, multi = false) {
    if (sort === 'gruppe') return item.entry.f.gruppe ? { key: 'g' + item.entry.f.gruppe, label: 'Gruppe ' + item.entry.f.gruppe, k: null } : { key: 'g-', label: 'Ohne Gruppe', k: null };
    if (item.abt === 'R') return { key: 'R', label: 'Requisite', k: 'A', abt: 'R' };
    if (item.abt === 'B') {                         // Bühne: Abschnitte nach Bereich (vorne → hinten)
      const r = BEREICH_RANK[Repo.bposOf(item.entry).bereich] ?? 2;
      return { key: 'B' + r, label: (multi ? 'Bühne · ' : '') + BEREICH_ABSCHNITT[r], k: 'A', abt: 'B' };
    }
    const label = multi ? `${DEPT[item.abt].short} · ${katName(item.abt, item.kat)}` : katName(item.abt, item.kat);
    return { key: item.abt + item.kat, label, k: item.kat, abt: item.abt };
  },
  thumbImg(b, alt = '') {
    const cached = Thumbs.map.get(b);
    if (cached && cached.url) return `<img src="${cached.url}" class="ok" alt="${Utils.esc(alt)}" data-b="${Utils.esc(b)}" data-l="1" decoding="async">`;
    return `<img alt="${Utils.esc(alt)}" data-b="${Utils.esc(b)}" decoding="async">`;
  },
  chips(e, keys = null) {
    const abt = abtOf(e);
    return (keys || DEPT[abt].chips).filter(k => entryVal(e, k))
      .map(k => `<span class="chip"><b>${Utils.esc(fieldLabel(abt, k))}</b><span>${Utils.esc(entryVal(e, k))}</span></span>`).join('');
  },
  /** Haken für die Eintrags-Checkliste. Bühne (nur Aufbau-Fotos): zwei Haken auf einer Karte. */
  chkHtml(e, kat) {
    const abt = abtOf(e), D = DEPT[abt];
    const one = k => { const on = !!e.f[k === 'E' ? 'chkE' : 'chkA'];
      return `<button class="chk" role="checkbox" aria-checked="${on}" data-act="chk" data-k="${k}" aria-label="${Utils.esc(D.done[k])}"><span class="box">${on ? I('check') : ''}</span>${D.photoKats.length === 1 && abt !== 'R' ? `<small>${Utils.esc(D.phases[k].slice(0, 5))}</small>` : ''}</button>`; };
    if (abt === 'R') return one('A');                // Requisite: ein Haken („Eingerichtet“)
    if (D.photoKats.length === 1) return `<span class="chks">${one('A')}${one('E')}</span>`;
    return one(kat === 'E' ? 'E' : 'A');
  },
  isDone(e, kat) {
    if (abtOf(e) === 'R') return !!e.f.chkA;
    if (DEPT[abtOf(e)].photoKats.length === 1) return !!(e.f.chkA && e.f.chkE);
    return !!e.f[kat === 'E' ? 'chkE' : 'chkA'];
  },
  cardHtml(it, { sel, checklist, dupKeys, big = false }) {
    if (it.abt === 'R' && !big) return this.cardHtmlR(it.entry, { sel, checklist });
    const e = it.entry, abt = it.abt, D = DEPT[abt], mv = mainVal(e);
    const ph = it.kat === 'N' ? [] : Repo.photosOf(e.id, it.kat);
    const thumbs = big
      ? ph.map((p, i) => `<span class="th" data-act="lb" data-i="${i}">${this.thumbImg(p.b).replace('<img ', '<img data-hq="1" ').replace(' data-l="1"', '')}<span class="plbl">${i + 1}</span></span>`).join('')
      : ph.slice(0, 2).map((p, i) => `<span class="th" data-act="lb" data-i="${i}">${this.thumbImg(p.b)}${i === 1 && ph.length > 2 ? `<span class="more">+${ph.length - 2}</span>` : ''}</span>`).join('');
    const dup = dupKeys.has(Repo.dupKey(e));
    const chips = this.chips(e);
    const name = `${D.mainLabel} ${mv || 'ohne Nummer'}`;
    return `<article class="card ${sel ? 'sel' : ''} ${checklist && this.isDone(e, it.kat) ? 'done' : ''}" data-k="${it.kat}" data-abt="${abt}" data-key="${Utils.esc(it.key)}">
      ${big ? `<button class="bighead" data-k="${it.kat}" data-act="open" aria-label="${Utils.esc(name)} öffnen">${tagHtml(abt, it.kat)}
        <span class="bk"><small>${Utils.esc(D.mainLabel)}</small>${mv ? Utils.esc(mv) : '<span class="muted">ohne</span>'}</span>
        <span class="bn">${ph.length} Foto${ph.length === 1 ? '' : 's'}</span></button>` : ''}
      <div class="strip"></div>
      <button class="hit" data-act="open" aria-label="${Utils.esc(`${name}, ${D.short}, ${katName(abt, it.kat)}`)}">
        ${thumbs ? `<span class="thumbs">${thumbs}</span>` : ''}
        <span class="info">
          <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${tagHtml(abt, it.kat)}</span>
          ${chips ? `<span class="chips">${chips}</span>` : ''}
          ${e.f.bemerkung ? `<span class="note">${Utils.esc(e.f.bemerkung)}</span>` : ''}
        </span>
        <span class="kcol"><small>${Utils.esc(D.mainLabel)}</small><span class="kreis ${mv ? '' : 'none'}">${mv ? Utils.esc(mv).replace(/\+/g, '+<wbr>') : 'ohne'}</span></span>
      </button>
      ${dup ? `<span class="dup" title="${Utils.esc(D.mainLabel)} doppelt">doppelt</span>` : ''}
      ${checklist ? this.chkHtml(e, it.kat) : ''}
    </article>`;
  },
  /** Karte eines Requisite-Gegenstands (in allen Ansichten gleich): Foto, Was groß, darunter Menge, Zu wem, Stelle,
      Zustand, Markierung; Sicherheit und Defekt immer mit Symbol und Text; rechts der Ort */
  cardHtmlR(e, { sel = false, checklist = false, indent = false, showOrt = true } = {}) {
    const ph = Repo.photosOf(e.id, 'A'), kat = ph.length ? 'A' : 'N', f = e.f, esc = Utils.esc;
    const menge = f.menge && String(f.menge).trim() && String(f.menge).trim() !== '1' ? `<span class="rmenge">${esc(String(f.menge).trim())}×</span> ` : '';
    const zw = Req.val(e, 'zuWem'), ort = showOrt ? Req.val(e, 'ort') : '';
    const art = Array.isArray(f.art) ? f.art : [], zu = f.zustaendig && f.zustaendig !== 'requisite' ? Req.zustLabel(f.zustaendig) : '';
    const c = Req.containerOf(e);
    const flags = [f.sicherheit ? Req.safeBadge(f.sicherheit) : '', art.includes('defekt') ? `<span class="rsafe def">${I('alert', 'sm')}<span>Defekt</span></span>` : '',
      art.includes('verbrauch') ? '<span class="chip rflag"><span>Verbrauch</span></span>' : '', art.includes('reserve') ? '<span class="chip rflag"><span>Reserve</span></span>' : '',
      zu ? `<span class="chip rflag">${I('wrench', 'sm')}<span>macht ${esc(zu)}</span></span>` : '', c && !indent ? `<span class="chip rflag">${I('box', 'sm')}<span>in: ${esc(c.f.was || 'Ohne Namen')}</span></span>` : ''].join('');
    const chips = (Array.isArray(f.zustand) ? f.zustand : []).map(z => `<span class="chip"><span>${esc(z)}</span></span>`).join('') + (f.markierung ? `<span class="chip"><b>Markierung</b><span>${esc(f.markierung)}</span></span>` : '');
    const meta = [zw ? `<span class="rm">${I('user', 'sm')} ${esc(zw)}</span>` : '', f.stelle ? `<span class="rm">${I('pin', 'sm')} ${esc(f.stelle)}</span>` : ''].filter(Boolean).join('<span class="rdot">·</span>');
    const name = f.was || 'Ohne Namen';
    return `<article class="card rcard ${indent ? 'rin' : ''} ${sel ? 'sel' : ''} ${checklist && f.chkA ? 'done' : ''}" data-k="${kat}" data-abt="R" data-key="${esc(e.id + ':' + kat)}">
      <div class="strip"></div>
      <button class="hit" data-act="open" aria-label="${esc(name + (ort ? ', ' + ort : ''))}">
        ${ph.length ? `<span class="thumbs"><span class="th" data-act="lb" data-i="0">${this.thumbImg(ph[0].b)}${ph.length > 1 ? `<span class="more">+${ph.length - 1}</span>` : ''}</span></span>` : ''}
        <span class="info"><span class="rwas">${menge}${f.was ? esc(f.was) : '<span class="muted">Ohne Namen</span>'}</span>
          ${meta ? `<span class="rmeta">${meta}</span>` : ''}
          ${flags || chips ? `<span class="chips">${flags}${chips}</span>` : ''}
          ${f.bemerkung ? `<span class="note">${esc(f.bemerkung)}</span>` : ''}</span>
        ${ort ? `<span class="kcol"><small>Ort</small><span class="rort">${esc(ort)}</span></span>` : ''}
      </button>
      ${checklist ? this.chkHtml(e, 'A') : ''}
    </article>`;
  },
  detailHtmlR(e, editMode, checklist) {
    const f = e.f, esc = Utils.esc, ph = Repo.photosOf(e.id, 'A');
    const box = (label, v, wide) => v ? `<div class="fieldbox ${wide ? 'wide' : ''}"><b>${esc(label)}</b><span>${esc(v)}</span></div>` : '';
    const inner = Req.contentsOf(e), steps = Req.steps(e.showId).filter(s => s.gegenstand === e.id);
    return `<div class="detail" data-abt="R">
      <div class="dh"><div style="flex:1;min-width:0"><div class="muted" style="font-size:12px;font-weight:700;letter-spacing:.1em">REQUISITE</div>
        <div class="kreis rdk ${f.was ? '' : 'none'}">${f.was ? esc(f.was) : 'Ohne Namen'}</div>
        <div class="chips" style="margin-top:8px">${f.sicherheit ? Req.safeBadge(f.sicherheit) : ''}${(f.art || []).includes('defekt') ? `<span class="rsafe def">${I('alert', 'sm')}<span>Defekt</span></span>` : ''}</div></div>
        <button class="btn ${editMode ? 'edit' : ''}" data-act="dedit">${I('edit')} Bearbeiten</button></div>
      <div class="fields">${box('Ort', Req.val(e, 'ort'))}${box('Stelle', f.stelle)}${box('Zu wem', Req.val(e, 'zuWem'))}${box('Menge', f.menge)}
        ${box('Zustand', Req.val(e, 'zustand'))}${box('Markierung', f.markierung)}${box('Liegt in', Req.val(e, 'inId'))}
        ${box('Darin', inner.map(x => x.f.was || 'Ohne Namen').join(', '))}${box('Zuständig', Req.val(e, 'zustaendig'))}${box('Art', Req.val(e, 'art'))}
        ${box('Pflege', f.pflege, true)}${box('Verbleib', f.verbleib, true)}${box('Bemerkung', f.bemerkung, true)}</div>
      <section class="kat" data-k="A"><div class="kh">${tagHtml('R', 'A')}<h3>${ph.length} Foto${ph.length === 1 ? '' : 's'}</h3>${checklist ? `<button class="btn ${f.chkA ? 'kfill' : 'kline'}" data-k="A" data-act="dchk" aria-pressed="${!!f.chkA}">${I('check')} Eingerichtet</button>` : ''}</div>
        ${ph.length ? `<div class="photos">${ph.map((p, i) => `<button data-act="dlb" data-k="A" data-i="${i}" aria-label="Foto ${i + 1} vergrößern">${this.thumbImg(p.b)}<span class="lbl">${i + 1}${p.f.cap ? ' · ' + esc(p.f.cap) : ''}</span></button>`).join('')}</div>` : '<div class="nophotos">Keine Fotos.</div>'}</section>
      ${steps.length ? `<div class="group" style="margin-top:16px"><h3>Schritte im Ablauf</h3>${steps.map(s => `<div class="item"><span class="lb">${esc(s.text)}<small>${esc([Req.whenShort(s), (Req.abschnitte(e.showId).find(a => a.key === s.abschnitt) || {}).label].filter(Boolean).join(' · '))}</small></span></div>`).join('')}</div>` : ''}
      <div class="actions">
        <button class="btn" data-act="ddup">${I('copy')} Als Vorlage duplizieren</button>
        ${editMode ? `<button class="btn danger" data-act="ddel">${I('trash')} Löschen</button>` : ''}
      </div>
      <p class="muted" style="font-size:12px;margin-top:16px">Zuletzt geändert ${Utils.fmtDate(e.mod)}</p></div>`;
  },
  detailHtml(e, editMode, checklist) {
    if (abtOf(e) === 'R') return this.detailHtmlR(e, editMode, checklist);
    const f = e.f, abt = abtOf(e), D = DEPT[abt], mv = mainVal(e);
    const fieldBox = (k, wide) => { const v = entryVal(e, k);
      return `<div class="fieldbox ${wide ? 'wide' : ''}"><b>${Utils.esc(fieldLabel(abt, k))}</b><span>${v ? Utils.esc(v) : '<span class="muted">—</span>'}</span></div>`; };
    const rest = infoKeys(abt, true).filter(k => !D.chips.includes(k) && entryVal(e, k));
    const chkBtn = k => { const on = !!f[k === 'E' ? 'chkE' : 'chkA'];
      return `<button class="btn ${on ? 'kfill' : 'kline'}" data-k="${k}" data-act="dchk" aria-pressed="${on}">${I('check')} ${Utils.esc(D.done[k])}</button>`; };
    const kat = k => {
      const ph = Repo.photosOf(e.id, k);
      const chks = checklist ? (D.photoKats.length === 1 ? chkBtn('A') + chkBtn('E') : chkBtn(k)) : '';
      return `<section class="kat" data-k="${k}"><div class="kh">${tagHtml(abt, k)}<h3>${ph.length} Foto${ph.length === 1 ? '' : 's'}</h3>${chks}</div>
        ${ph.length ? `<div class="photos">${ph.map((p, i) => `<button data-act="dlb" data-k="${k}" data-i="${i}" aria-label="Foto ${i + 1} vergrößern">${this.thumbImg(p.b)}<span class="lbl">${i + 1}</span></button>`).join('')}</div>`
          : `<div class="nophotos">Keine Fotos in dieser Phase.</div>`}</section>`;
    };
    return `<div class="detail" data-abt="${abt}">
      <div class="dh"><div style="flex:1;min-width:0"><div class="muted" style="font-size:12px;font-weight:700;letter-spacing:.1em">${Utils.esc(D.short.toUpperCase())} · ${Utils.esc(D.mainLabel.toUpperCase())}</div>
        <div class="kreis ${mv ? '' : 'none'}">${mv ? Utils.esc(mv) : 'ohne ' + Utils.esc(D.mainLabel)}</div></div>
        <button class="btn ${editMode ? 'edit' : ''}" data-act="dedit">${I('edit')} Bearbeiten</button></div>
      <div class="fields">${D.chips.map(k => fieldBox(k)).join('')}${rest.map(k => fieldBox(k)).join('')}${fieldBox('bemerkung', true)}</div>
      ${D.photoKats.map(kat).join('')}
      <div class="actions">
        <button class="btn" data-act="ddup">${I('copy')} Als Vorlage duplizieren</button>
        ${editMode ? `<button class="btn danger" data-act="ddel">${I('trash')} Löschen</button>` : ''}
      </div>
      <p class="muted" style="font-size:12px;margin-top:16px">Zuletzt geändert ${Utils.fmtDate(e.mod)}</p></div>`;
  }
};

/* =====================================================================
   Editor – Eintrag anlegen/bearbeiten. Wird EINMAL aufgebaut und danach nur
   gezielt verändert (keine Neuzeichnung → Tastatur bleibt, kein Flackern).
   Die Felder kommen aus DEPT[abt].fields; für Licht ergibt das genau das
   Layout aus 1.7.0: Kreis | Adresse · Gruppe | Filter · Schnelltasten ·
   Bemerkung · Fotos · „Weitere Angaben“.
   ===================================================================== */
const Editor = {
  /** Formular-HTML aus der Abteilungs-Konfiguration */
  formHtml(D, f0) {
    const fid = k => 'ed-' + k;
    const input = fd => {
      const v = f0[fd.k];
      if (fd.bool) return `<div class="f"><label for="${fid(fd.k)}">${Utils.esc(fd.label)}</label><div class="swrow"><span class="switch"><input type="checkbox" id="${fid(fd.k)}" name="${fd.k}" ${v ? 'checked' : ''}><span></span></span></div></div>`;
      if (fd.area) return `<div class="f"><label for="${fid(fd.k)}">${Utils.esc(fd.label)}</label><textarea id="${fid(fd.k)}" name="${fd.k}" rows="3" placeholder="${Utils.esc(fd.ph || '')}">${Utils.esc(v || '')}</textarea></div>`;
      const im = fd.mode === 'tel' ? 'inputmode="tel"' : fd.mode === 'num' ? 'inputmode="numeric"' : '';
      const attrs = `id="${fid(fd.k)}" name="${fd.k}" ${im} enterkeyhint="next" placeholder="${Utils.esc(fd.ph || '')}" value="${Utils.esc(v || '')}" ${fd.mono || fd.plus ? 'autocapitalize="off" spellcheck="false"' : ''}`;
      if (fd.picker) return `<div class="f kreisf zugf"><label for="ed-zugsel">${Utils.esc(fd.label)}</label>
          <select id="ed-zugsel" class="zugsel" aria-label="Zug oder Position wählen"></select>
          <div class="zuginfo muted"></div>
          <div class="freepos hidden"><input ${attrs}>
            <div class="f-row gf" style="margin-top:8px"><div class="f"><label for="ed-ebene">Ebene</label><select id="ed-ebene" name="ebene">${EBENEN.map(([k, n]) => `<option value="${k}" ${(f0.ebene || 'boden') === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
              <div class="f"><label for="ed-bereich">Bereich</label><select id="ed-bereich" name="bereich">${BEREICHE.map(([k, n]) => `<option value="${k}" ${(f0.bereich || 'haupt') === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div></div></div>
          <input type="hidden" name="zugId" value="${Utils.esc(f0.zugId || '')}">
          ${fd.req ? `<div class="req">${Utils.esc(fd.label)} fehlt – bitte wählen oder eintragen.</div>` : ''}</div>`;
      if (fd.main) return `<div class="f kreisf"><label for="${fid(fd.k)}">${Utils.esc(fd.label)}</label>
          <div class="inwrap"><input ${attrs}>${fd.plus ? `<button type="button" class="plusbtn" data-act="plus" aria-label="Plus-Zeichen einfügen">+</button>` : ''}</div>
          ${fd.req ? `<div class="req">${Utils.esc(fd.label)} fehlt – bitte eintragen.</div>` : ''}</div>`;
      return `<div class="f ${fd.mono ? 'mono' : ''}"><label for="${fid(fd.k)}">${Utils.esc(fd.label)}</label><input ${attrs}>${fd.hint ? `<div class="fh">${Utils.esc(fd.hint)}</div>` : ''}</div>`;
    };
    const base = D.fields.filter(x => !x.extra && !x.hidden && x.k !== 'bemerkung'), extra = D.fields.filter(x => x.extra);
    let html = '';
    if (base[0] && base[0].picker) { html += `<div class="f-row one">${input(base.shift())}</div>`; }
    for (let i = 0; i < base.length; i += 2) {
      const pair = base.slice(i, i + 2);
      html += `<div class="f-row ${i === 0 && !D.fields[0].picker ? 'ka' : 'gf'}">${pair.map(input).join('')}</div>`;
      pair.filter(x => x.qkeys).forEach(x => { html += `<div class="qkeys" data-qkeys="${x.k}" role="group" aria-label="${Utils.esc(x.label)}-Schnelltasten: antippen setzt, nochmal antippen entfernt"></div>`; });
    }
    const bem = D.fields.find(x => x.k === 'bemerkung');
    if (bem) html += input(bem);
    html += D.photoKats.map(k => `<section class="pk" data-k="${k}"><div class="ph">${tagHtml(D.key, k)}<h3></h3><span class="n"></span>
          <button type="button" class="btn kfill" data-k="${k}" data-act="cam">${I('camera')} Foto</button></div>
          <div class="pgrid" data-k="${k}"></div></section>`).join('');
    const extraOpen = extra.some(x => f0[x.k]);
    if (extra.length) html += `<details class="more" ${extraOpen ? 'open' : ''}><summary>${I('layers', 'sm')} Weitere Angaben <span class="muted" style="font-weight:400">${Utils.esc(D.extraHint || '')}</span>${I('arrowR', 'sm chev')}</summary>
        <div class="inner">${extra.map(input).join('')}</div></details>`;
    return html;
  },
  open({ showId, entryId = null, preset = null, quick = false, abt = null }) {
    const ex = entryId ? Repo.entry(entryId) : null;
    const A = ex ? abtOf(ex) : (preset && DEPT[preset.abt] ? preset.abt : (DEPT[abt] ? abt : 'L'));
    const D = DEPT[A], MAIN = D.main, mainFd = D.fields.find(x => x.k === MAIN);
    const f0 = {}; D.fields.forEach(fd => { const v = ex ? ex.f[fd.k] : preset && preset[fd.k]; f0[fd.k] = fd.arr ? (Array.isArray(v) ? v.slice() : []) : fd.bool ? !!v : (v || ''); });
    const slots = { A: [], E: [] };
    if (ex) Repo.photosOf(ex.id).forEach(p => slots[D.photoKats.includes(p.f.kat) ? p.f.kat : 'A'].push({ photoId: p.id, b: p.b, w: p.w, h: p.h, label: p.f.label, cap: p.f.cap || '' }));
    const isR = A === 'R';
    let rs = null;                           // Requisite: Zustand des Formulars (Ort, Personen, Chips)
    // Fotos, die beim Öffnen zu sehen sind – nur diese darf „Speichern“ entfernen (nicht live hinzugekommene)
    const initialPhotos = new Set(slots.A.concat(slots.E).map(s => s.photoId));
    let initForm = null;                     // Formularstand beim Öffnen (wird unten gesetzt)
    let dirty = false, pending = 0, saving = false;
    const markDirty = () => { dirty = true; };
    const sh = Ui.sheet({
      title: isR ? (ex ? (ex.f.was || 'Gegenstand') : 'Neuer Gegenstand') : ex ? `${D.mainLabel} ${ex.f[MAIN] || '(ohne Nummer)'}` : 'Neuer Eintrag', full: true,      // Abteilung steht im Tag davor
      headLeft: `<button class="btn ghost" data-act="cancel" aria-label="Abbrechen">${I('close')}<span class="cl">Abbrechen</span></button>`,
      headRight: `<button class="btn edit savebtn" data-act="save">${I('check')}<span class="sl">Speichern</span></button>`,
      onBack: () => this._confirmLeave(dirty || pending)
    });
    sh.el.dataset.editor = '1'; sh.el.dataset.abt = A;
    sh.head.querySelector('h2').insertAdjacentHTML('beforebegin', `<span class="tag E" data-abt="${A}">${Utils.esc(D.short)}</span>`);
    sh.body.innerHTML = `<form class="form" autocomplete="off" onsubmit="return false">
      ${isR ? Req.formHtml(f0, showId, ex) : this.formHtml(D, f0)}
      <button type="button" class="btn edit big block savebtn2" data-act="save">${I('check')} Speichern</button>
      ${isR && !ex ? `<button type="button" class="btn big block" data-act="savenext">${I('plus')} Speichern + nächster am selben Ort</button>` : ''}
      ${ex ? `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
        <button type="button" class="btn danger" data-act="del">${I('trash')} Eintrag löschen</button></div>` : ''}
    </form>`;
    const form = sh.body.querySelector('form'), saveBtn = sh.el.querySelector('.savebtn');
    const kreisIn = form.elements[MAIN];

    /* ---- Schnelltasten (Filter bei Licht, Mikrofon bei Ton): feste Liste aus den Einstellungen
           + in dieser Veranstaltung schon benutzte Werte (gestrichelt) ---- */
    const ftok = v => String(v || '').split(/\s*[+,;]\s*/).map(x => x.trim()).filter(Boolean);
    D.fields.filter(x => x.qkeys).forEach(fd => {
      const qIn = form.elements[fd.k], qbox = form.querySelector(`[data-qkeys="${fd.k}"]`);
      if (!qIn || !qbox) return;
      const fixed = (Settings.v[fd.qkeys] || []).filter(Boolean);
      const freq = new Map();
      Repo.entriesOf(showId).filter(e => abtOf(e) === A).forEach(e => ftok(e.f[fd.k]).forEach(t => { if (!fixed.some(k => k.toLowerCase() === t.toLowerCase())) freq.set(t, (freq.get(t) || 0) + 1); }));
      const used = [...freq.entries()].sort((a, b) => b[1] - a[1]).slice(0, 8).map(x => x[0]);
      const renderQ = () => {
        const cur = ftok(qIn.value).map(t => t.toLowerCase());
        qbox.innerHTML = fixed.concat(used).map((k, i) => `<button type="button" data-q="${Utils.esc(k)}" class="${i >= fixed.length ? 'used' : ''}" aria-pressed="${cur.includes(k.toLowerCase())}" ${i >= fixed.length ? 'title="in dieser Veranstaltung benutzt"' : ''}>${Utils.esc(k)}</button>`).join('')
          + (cur.length ? `<button type="button" class="qclr" data-qclr aria-label="${Utils.esc(fd.label)} leeren">${I('close', 'sm')}</button>` : '');
      };
      qbox.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-qclr')) qIn.value = '';
        else {
          const k = b.dataset.q, cur = ftok(qIn.value), i = cur.findIndex(t => t.toLowerCase() === k.toLowerCase());
          if (i >= 0) cur.splice(i, 1); else cur.push(k);
          qIn.value = cur.join('+');
        }
        markDirty(); renderQ();
      });
      qIn.addEventListener('input', renderQ);
      renderQ();
    });
    form.addEventListener('input', () => { markDirty(); const fm = kreisIn.closest('.f'); if (fm.classList.contains('invalid') && kreisIn.value.trim()) fm.classList.remove('invalid'); });
    /* ---- Bühne: Zug-Auswahl aus der gemeinsamen Zugliste, „Freie Position“, „+ Neuer Zug“ ---- */
    if (mainFd.picker) {
      const sel = form.querySelector('#ed-zugsel'), free = form.querySelector('.freepos'), info = form.querySelector('.zuginfo');
      const idIn = form.elements.zugId;
      const fill = () => {
        const zs = Repo.zuegeOf(showId), cur = idIn.value;
        const opt = z => `<option value="${Utils.esc(z.id)}" ${z.id === cur ? 'selected' : ''}>${Utils.esc(z.name)}${z.typ === 'licht' ? '  · Licht' : ''}</option>`;
        const gone = cur && !zs.some(z => z.id === cur);
        sel.innerHTML = `<option value="">– Zug oder Position wählen –</option>
          <optgroup label="Bühnenzüge und Positionen">${zs.filter(z => z.typ === 'buehne').map(opt).join('')}</optgroup>
          <optgroup label="Beleuchterzüge">${zs.filter(z => z.typ === 'licht').map(opt).join('')}</optgroup>
          ${gone ? `<option value="${Utils.esc(cur)}" selected>${Utils.esc(kreisIn.value || 'Zug')} (Zug entfernt)</option>` : ''}
          <option value="__free" ${!cur && kreisIn.value ? 'selected' : ''}>Freie Position …</option>
          <option value="__new">+ Neuer Zug …</option>`;
        show();
      };
      const show = () => {
        const v = sel.value, z = Repo.zuegeOf(showId).find(x => x.id === v);
        free.classList.toggle('hidden', v !== '__free');
        info.textContent = z ? [EBENE_NAME[z.ebene], BEREICH_NAME[z.bereich], z.hoehe, z.last].filter(Boolean).join(' · ') : (v && v !== '__free' && v !== '__new' ? 'Dieser Zug wurde aus der Zugliste entfernt.' : '');
      };
      sel.addEventListener('change', async () => {
        markDirty();
        const v = sel.value;
        if (v === '__new') {
          const n = await Ui.prompt('Neuer Bühnenzug', '', 'z. B. Zug 14, PZ 8, Podium 2', 'Wird in die gemeinsame Zugliste der Veranstaltung aufgenommen (Ebene „Oben / Züge“, änderbar unter „Züge & Positionen“).');
          if (n && n.trim()) {
            const id = Utils.uuid(), zs = Repo.zuegeOf(showId);
            const ord = Math.max(100, ...zs.map(z => z.ord || 0)) + 10;
            try { await Repo.patchShow(showId, { ['z:' + id]: { name: n.trim(), typ: 'buehne', ebene: 'oben', bereich: 'haupt', hoehe: '', last: '', bemerkung: '', ord, del: false } }); }
            catch (err) { App.error(err); return; }
            idIn.value = id; kreisIn.value = n.trim(); Ui.toast(`„${n.trim()}“ in die Zugliste aufgenommen`);
          } else { idIn.value = idIn.value || ''; }
          fill(); return;
        }
        if (v === '__free') { idIn.value = ''; if (Repo.zuegeOf(showId).some(z => z.name === kreisIn.value)) kreisIn.value = ''; show(); setTimeout(() => kreisIn.focus(), 30); return; }
        const z = Repo.zuegeOf(showId).find(x => x.id === v);
        idIn.value = v; kreisIn.value = z ? z.name : '';
        if (z) kreisIn.closest('.f').classList.remove('invalid');
        show();
      });
      fill();
    }
    form.addEventListener('change', markDirty);
    if (mainFd.plus) kreisIn.addEventListener('blur', () => { const n = Utils.normKreis(kreisIn.value); if (n !== kreisIn.value) kreisIn.value = n; fitKreis(); });
    // lange Hauptfelder (z. B. 12+17+103+113+628) kleiner schreiben, damit alles sichtbar bleibt
    const fitKreis = () => { if (isR) return; const n = kreisIn.value.length; kreisIn.style.fontSize = n > 14 ? '16px' : n > 10 ? '19px' : n > 7 ? '22px' : ''; };
    kreisIn.addEventListener('input', fitKreis); fitKreis();
    // Eingabe-Navigation: „Weiter“ springt ins nächste Feld
    form.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') {
        e.preventDefault();
